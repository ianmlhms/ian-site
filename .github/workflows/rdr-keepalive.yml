name: RDR Supabase keep-alive

# Supabase pauses free projects after 7 days without API traffic.
# Queries run inside the database (pg_cron) do not count, so this
# sends a real REST request from outside. The key is the public
# publishable key already shipped in pro/rdr/assets/js/rdr-config.js.
on:
  schedule:
    - cron: "23 7 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the public catalogue
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://ntgfxsqzgxajkegxllro.supabase.co/rest/v1/rdr_catalogue_view?select=id&limit=1" \
            -H "apikey: sb_publishable_zhlY4xkDxWlawKFVMRaVnQ_LSWOdZw2")
          echo "HTTP $status"
          test "$status" = "200"
