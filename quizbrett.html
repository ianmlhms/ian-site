<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<!-- Host-driven quiz board: an app shell with almost no crawlable text, and
     deliberately not linked from the homepage. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizbrett — Quiz-Show-Brett fir Gruppen | ian.lu</title>
<meta name="description" content="Quiz-Show-Brett fir Gruppen: 5 Kategorien, 5 Punktewäerter, Equipen a Punkten. Steier alles vum Handy.">
<link rel="canonical" href="https://ian.lu/quizbrett.html">
<meta name="theme-color" content="#0b1d3a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="theme.js?v=10"></script>
<style>
  :root{
    --navy:#0b1d3a; --navy2:#122b52; --cell:#15326b; --cell-hi:#1b3f85;
    --gold:#ffd66b; --gold2:#ffc23d; --text:#f2f5fb; --muted:#93a6c7;
    --good:#3fb950; --bad:#e5484d; --line:#23406f; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--navy);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  .bar{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--navy2)}
  .bar .home{color:var(--muted);font-weight:700;text-decoration:none;font-size:14px}
  .bar h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.4px}
  .bar .spacer{flex:1}
  .langs button{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:4px 5px}
  .langs button.on{color:var(--gold)}

  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 40px}
  .screen{display:none}
  .screen.on{display:block}

  h2{font-size:19px;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 16px}

  .card{background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px}

  .btn{display:block;width:100%;padding:14px;border-radius:11px;border:0;background:var(--gold);color:#1a1200;font-weight:800;font-size:16px;margin-top:10px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.small{padding:10px;font-size:14px}
  .btn:disabled{opacity:.42}
  .row{display:flex;gap:9px}
  .row .btn{margin-top:0}

  /* bank picker */
  .banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
  .bank{background:var(--navy2);border:2px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left}
  .bank[aria-pressed="true"]{border-color:var(--gold)}
  .bank b{display:block;font-size:16px;margin-bottom:3px}
  .bank span{color:var(--muted);font-size:12.5px}

  /* teams */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
  .chip{background:var(--cell);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
  .chip button{background:none;border:0;color:var(--muted);padding:0;font-size:15px;line-height:1}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--navy);color:var(--text);font-size:15px}
  .addrow input:focus{outline:2px solid var(--gold);outline-offset:-1px}

  /* the board */
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cat{
    background:var(--navy2);border:1px solid var(--line);border-radius:9px;
    padding:9px 5px;text-align:center;font-weight:800;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--gold);
    display:flex;align-items:center;justify-content:center;min-height:56px;line-height:1.25;
  }
  .cellbtn{
    background:var(--cell);border:1px solid var(--line);border-radius:9px;
    min-height:58px;font-weight:800;font-size:19px;color:var(--gold);
    display:flex;align-items:center;justify-content:center;
  }
  .cellbtn:hover:not(:disabled){background:var(--cell-hi)}
  .cellbtn:disabled{background:transparent;border-style:dashed;color:#2c4a80}

  /* scoreboard */
  .scores{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
  .sc{background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;min-width:96px}
  .sc b{display:block;font-size:19px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .sc.neg b{color:var(--bad)}

  /* clue */
  .clue{text-align:center}
  .clue .val{color:var(--gold);font-weight:800;letter-spacing:.6px;font-size:14px}
  .clue .dd{color:var(--gold2);font-weight:800;font-size:13px;margin-top:6px;letter-spacing:.8px}
  .clue .q{font-size:24px;font-weight:700;line-height:1.35;margin:16px 0}
  .clue .a{font-size:22px;font-weight:800;color:var(--gold);line-height:1.35;margin:14px 0}
  .who{display:grid;gap:8px;margin-top:6px}
  .who button{padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--cell);text-align:left;font-size:15.5px;font-weight:700}
  .who button.minus{background:transparent}
  .hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:12px}

  .final{text-align:center}
  .final .win{font-size:26px;font-weight:800;color:var(--gold);margin:10px 0}

  @media (max-width:520px){
    .cat{font-size:9.5px;min-height:48px;padding:6px 3px}
    .cellbtn{min-height:48px;font-size:16px}
    .clue .q{font-size:20px}
  }
</style>
</head>
<body>

<header class="bar">
  <a class="home" href="./">‹ Heem</a>
  <h1 id="barTitle">Quizbrett</h1>
  <span class="spacer"></span>
  <nav class="langs" id="langs" aria-label="Sprooch">
    <button type="button" data-l="lb" class="on">LB</button>
    <button type="button" data-l="de">DE</button>
    <button type="button" data-l="en">EN</button>
  </nav>
</header>

<main class="wrap">

  <!-- setup -->
  <section class="screen on" id="s-setup">
    <h2 id="tBank"></h2>
    <p class="sub" id="tBankSub"></p>
    <div class="banks" id="banks"></div>

    <h2 style="margin-top:22px" id="tTeams"></h2>
    <p class="sub" id="tTeamsSub"></p>
    <div class="chips" id="chips"></div>
    <div class="addrow">
      <input id="tInput" type="text" maxlength="16" autocomplete="off">
      <button class="btn" style="width:auto;padding:12px 18px;margin:0" id="tAdd">+</button>
    </div>
    <p class="hint" id="tWarn"></p>
    <button class="btn" id="start"></button>
  </section>

  <!-- board -->
  <section class="screen" id="s-board">
    <div class="board" id="board"></div>
    <div class="scores" id="scores"></div>
    <button class="btn ghost small" id="quit" style="margin-top:16px"></button>
  </section>

  <!-- clue -->
  <section class="screen" id="s-clue">
    <div class="card clue" id="clue"></div>
  </section>

  <!-- end -->
  <section class="screen" id="s-end">
    <div class="card final" id="final"></div>
  </section>

</main>

<script src="jeopardy-banks.js?v=1"></script>
<script src="quizbrett.js?v=1"></script>
</body>
</html>
