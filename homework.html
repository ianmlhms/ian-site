<style>
  .gt-page { padding-bottom: max(56px, calc(40px + env(safe-area-inset-bottom))); padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); }
  .gt-gate { align-items: flex-start; padding: 28px 20px !important; gap: 14px !important; justify-content: flex-start !important; }
  .hw-bar { flex-direction: row !important; flex-wrap: wrap; align-items: center; justify-content: flex-start !important; gap: 10px 16px !important; }
  .hw-bar .synced { flex: 1 1 12rem; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  /* one homework = one cell; two columns on iPad landscape / desktop */
  .hw { justify-content: flex-start !important; gap: 12px !important; padding: 20px 22px !important; }
  .hw-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .hw-subj { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .hw-due { font: 500 13px/1.4 "Geist Mono", ui-monospace, monospace; white-space: nowrap; color: var(--muted); }
  .hw.soon .hw-due { color: var(--green); font-weight: 500; }
  .hw.over .hw-due { color: var(--danger); }
  .hw-task { font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }
  .hw-sum { font-size: 15px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .hw-ask { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .hw-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 4px; }
  .hw-acts .gt-btn { flex: 1 1 140px; min-height: 52px; font-size: 16px; }
  .hw-acts .tick { flex: 1 1 100%; justify-content: flex-start; }
  .hw-acts .tick .box { width: 22px; height: 22px; border: 2px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
  .hw-acts .tick[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .hw.done { background: var(--tint); }
  .hw.done .hw-subj, .hw.done .hw-task, .hw.done .hw-sum { color: var(--muted); }
  .hw.done .hw-subj { text-decoration: line-through; text-decoration-thickness: 1px; }
  .gt-tag.warn { border-color: var(--danger); color: var(--danger); }
  .gt-tag.soft { border-color: var(--soft); color: var(--muted); }
  @media (max-width: 1000px) { .hw.half { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .gt-nav { padding-inline: 14px !important; } .hw { padding: 18px 16px !important; } }
</style>

<body class="gt">
<main class="gt-page">
  <div class="gt-grid">
    <header class="c full gt-nav">
      <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">Devoiren</h1></div>
      <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
    </header>
    <div id="wrap" class="gt-contents"><div class="c full gt-gate" role="status"><p>Lued …</p></div></div>
  </div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=40";
const $ = (id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gate=(msg,extra="")=>`<div class="c full gt-gate"><p class="gt-big">${msg}</p>${extra}</div>`;
const BUCKET="devoirs", SIGNED_URL_SECONDS=600, SCHOOL_TZ="Europe/Luxembourg";
const STATUS={
  solved:{label:"Geléist",cls:"green"},
  needs_scan:{label:"Foto néideg",cls:"ink"},
  nothing_to_do:{label:"Näischt ze maachen",cls:"soft"},
  failed:{label:"Feeler",cls:"warn"},
};
let sb=null, items=[];

function mountAcct(){
  const b=$("gtAcct"); if(!b) return;
  b.textContent=auth.session()?(auth.username()||"Kont"):"Umellen";
  b.onclick=auth.openAuthModal;
}
async function boot(){
  mountAcct();
  if(!auth.authConfigured){ $("wrap").innerHTML=gate("Net konfiguréiert."); return; }
  sb=await auth.client();
  if(!auth.session()){ $("wrap").innerHTML=gate("Mell dech un, fir deng Devoiren ze gesinn.",`<button type="button" class="gt-btn" id="signin">Umellen</button>`); $("signin").onclick=auth.openAuthModal; return; }
  let admin=false; try{ const { data }=await sb.rpc("is_admin"); admin=!!data; }catch{}
  if(!admin){ $("wrap").innerHTML=gate("Dës Säit ass privat."); return; }
  showApp();
}
function showApp(){
  $("wrap").innerHTML=`
    <div class="c full hw-bar">
      <button type="button" class="gt-btn ghost" id="syncBtn">Synchroniséieren</button>
      <span class="synced" id="synced" role="status"></span>
    </div>
    <div id="list" class="gt-contents"><div class="c full gt-gate" role="status"><p>Lued …</p></div></div>`;
  $("syncBtn").onclick=syncNow;
  loadList();
}
// Luxembourgish is missing from some Intl builds; German is the closest fallback.
const loc=()=>{ try{ return Intl.DateTimeFormat.supportedLocalesOf(["lb"]).length?"lb":"de"; }catch{ return "de"; } };
const DAY_MS=86400000;
const dayNumber=(iso)=>Math.round(new Date(iso+"T00:00:00Z").getTime()/DAY_MS);
const todayIso=()=>new Date().toLocaleDateString("sv-SE",{timeZone:SCHOOL_TZ});
function dueLabel(d,days){
  if(!d) return "";
  if(days===0) return "Haut";
  if(days===1) return "Muer";
  if(days===-1) return "Gëschter";
  return new Date(d+"T00:00:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});
}
function sortItems(list){
  const key=(h)=>h.due_date||"9999-12-31";
  return [...list].sort((a,b)=>(a.sol?.done?1:0)-(b.sol?.done?1:0) || key(a).localeCompare(key(b)));
}
async function loadList(){
  // a devoir stays listed through its due day (Luxembourg time), then drops off
  const from=todayIso();
  const [hw,sol]=await Promise.all([
    sb.from("homework").select("*").or(`due_date.gte.${from},due_date.is.null`),
    sb.from("homework_solutions").select("*"),
  ]);
  const list=$("list");
  if(hw.error){ list.innerHTML=gate("Konnt net lueden."); return; }
  const byId=new Map((sol.data||[]).map(s=>[String(s.homework_id),s]));
  items=sortItems((hw.data||[]).map(h=>({...h,sol:byId.get(String(h.id))||null})));
  if(hw.data?.[0]?.synced_at) $("synced").textContent="Lescht Synchronisatioun: "+new Date(hw.data[0].synced_at).toLocaleString(loc());
  render();
}
function render(){
  const list=$("list");
  if(!items.length){ list.innerHTML=gate("Keng Devoiren do.",`<p class="gt-hint">Dréck op „Synchroniséieren“.</p>`); return; }
  const today=dayNumber(todayIso());
  list.innerHTML=items.map(h=>cardHtml(h,today)).join("");
  list.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPdf(b));
  list.querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>toggleDone(b.dataset.tick));
}
function cardHtml(h,today){
  const s=h.sol, done=!!s?.done;
  const days=h.due_date?dayNumber(h.due_date)-today:99;
  const cls=done?"done":days<0?"over":days<=1?"soon":"";
  const st=s?STATUS[s.status]:null;
  const tag=st?`<span class="gt-tag ${st.cls}">${st.label}</span>`:`<span class="gt-tag soft">Nach keng Léisung</span>`;
  const body=s?.status==="needs_scan"&&s.ask?`<div class="hw-ask">${esc(s.ask)}</div>`:s?.summary?`<div class="hw-sum">${esc(s.summary)}</div>`:"";
  const solBtn=s?.solution_path?`<button type="button" class="gt-btn" data-open="${esc(s.solution_path)}">Léisung</button>`:"";
  const handBtn=s?.handin_path?`<button type="button" class="gt-btn ghost" data-open="${esc(s.handin_path)}">Ofzeginn</button>`:"";
  const filledBtn=s?.filled_path?`<button type="button" class="gt-btn ghost" data-open="${esc(s.filled_path)}">Säit ausgefëllt</button>`:"";
  const tick=`<button type="button" class="gt-btn ghost tick" data-tick="${esc(h.id)}" aria-pressed="${done}"><span class="box" aria-hidden="true">${done?"✓":""}</span> Gemaach</button>`;
  return `<article class="c half hw ${cls}">
    <div class="hw-top"><span class="hw-subj">${esc(h.subject||"—")}</span><span class="hw-due">${esc(dueLabel(h.due_date,days))}</span></div>
    <div class="gt-tags">${tag}</div>
    <div class="hw-task">${esc(h.text||h.remark||"(kee Text)")}</div>
    ${body}
    <div class="hw-acts">${solBtn}${handBtn}${filledBtn}${tick}</div>
  </article>`;
}
// iOS Safari blocks window.open after an await, so the tab is opened first and pointed at the signed URL afterwards.
async function openPdf(btn){
  const path=btn.dataset.open;
  const tab=window.open("","_blank");
  btn.disabled=true;
  try{
    const { data, error }=await sb.storage.from(BUCKET).createSignedUrl(path,SIGNED_URL_SECONDS);
    if(error||!data?.signedUrl) throw error||new Error("no url");
    if(tab) tab.location.href=data.signedUrl; else location.href=data.signedUrl;
  }catch{
    if(tab) tab.close();
    $("synced").textContent="PDF konnt net opgemaach ginn. Probéier nach eng Kéier.";
  }
  btn.disabled=false;
}
async function toggleDone(id){
  const idx=items.findIndex(h=>String(h.id)===String(id));
  if(idx<0||!items[idx].sol) { $("synced").textContent="Nach keng Léisung fir dësen Devoir."; return; }
  const was=!!items[idx].sol.done;
  const flip=(value)=>{ items=sortItems(items.map(h=>String(h.id)===String(id)?{...h,sol:{...h.sol,done:value}}:h)); render(); };
  flip(!was);
  const { error }=await sb.from("homework_solutions").update({done:!was}).eq("homework_id",id);
  if(error){ flip(was); $("synced").textContent="Konnt net späicheren. Probéier nach eng Kéier."; }
}
async function syncNow(){
  const b=$("syncBtn"); b.disabled=true; b.textContent="Synchroniséieren …";
  try{
    const { data, error }=await sb.functions.invoke("webuntis-sync");
    if(error) throw error;
    $("synced").textContent = data?.ok ? `${data.count} Devoir(en) synchroniséiert` : (data?.error||"Synchronisatioun feelgeschloen");
  }catch(e){ $("synced").textContent="Synchronisatioun feelgeschloen: "+(e.message||e); }
  b.disabled=false; b.textContent="Synchroniséieren";
  loadList();
}
auth.onAuth(boot);
boot();
</script>
  <script type="module" src="rtc-ring.js?v=36"></script>
  <script type="module" src="class-gate.js?v=37"></script>
