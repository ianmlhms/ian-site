<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow" />
  <!-- Admin-only WebUntis homework view. Kept out of the index, like admin.html and me.html. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausaufgaben — ian.lu</title>
<meta name="description" content="WebUntis homework, synced.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="theme.js?v=26"></script>
<script src="i18n-dict.js?v=42"></script>
<script src="i18n.js?v=3"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a{touch-action:manipulation}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  .header-right{flex-wrap:wrap;justify-content:flex-end}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:12px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- gate (loading / sign-in / private / empty) ---- */
  .gate{text-align:center;padding:clamp(30px,6vw,52px) 22px;margin-top:10px;color:var(--muted)}
  .gate .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .gate p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text)}
  .gate .gate-sub{margin-top:6px;font:500 14px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:0;color:var(--muted)}
  .gate .ui-btn{margin-top:18px}

  /* ---- sync bar ---- */
  .syncbar{--h:#4fc37a;display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:14px 18px}
  .syncbar .ui-btn{padding:10px 20px}
  .syncbar .ui-btn:disabled{opacity:.55;cursor:default;transform:none}
  .synced{flex:1 1 12rem;min-width:0;color:var(--muted);font-size:13px;line-height:1.35;overflow-wrap:anywhere}

  /* ---- homework cards ---- */
  .hw{--h:var(--accent);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico subj due" "ico txt txt" "ico rem rem";align-items:center;column-gap:14px;row-gap:3px;padding:14px 16px;border-radius:var(--r-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -18px rgb(var(--ink)/.35)}
  .hw.soon{--h:#f4a62a;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 14%,var(--card-opaque)),var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 38%,transparent),0 14px 30px -18px rgb(var(--ink)/.35)}
  .hw.over{--h:#ef5b6b;background:var(--card);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent)}
  .hw.over .txt,.hw.over .subj{opacity:.72}
  .hw .ico{grid-area:ico;align-self:start;display:grid;place-items:center;width:46px;height:46px;border-radius:var(--r-chip);font-size:24px;line-height:1;background:color-mix(in srgb,var(--h) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .hw .subj{grid-area:subj;min-width:0;font:750 16px/1.25 var(--font-display);letter-spacing:-.015em;color:var(--text);overflow-wrap:anywhere}
  .hw .due{grid-area:due;justify-self:end;align-self:start;padding:3px 10px;border-radius:999px;font:700 12px/1.5 var(--font-display);white-space:nowrap;color:var(--text);background:color-mix(in srgb,var(--h) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent)}
  .hw .due:empty{display:none}
  .hw .txt{grid-area:txt;margin-top:3px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
  .hw .rem{grid-area:rem;font-size:12.5px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
  .empty{color:var(--muted);text-align:center;padding:34px 10px}

  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.ui .ui-header h1.ui-brand{font-size:18px}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
    .hw{column-gap:12px;padding:13px 14px}
    .hw .ico{width:40px;height:40px;font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
  <meta name="theme-color" content="#0d0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <a class="home" href="index.html" data-i18n="nav.home">‹ Home</a>
    <h1 class="ui-brand"><span aria-hidden="true">📚</span> Hausaufgaben</h1>
  </div>
  <div class="header-right">
    <span id="acctHost"></span>
  </div>
</header>
<main class="ui-page" id="wrap"><div class="gate ui-card" role="status">Loading…</div></main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=24";
const $ = (id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gate=(ico,msg,extra="")=>`<div class="gate ui-card"><div class="gate-ico" aria-hidden="true">${ico}</div><p>${msg}</p>${extra}</div>`;
const SUBJECT_ICONS=[[/math|maths/i,"🧮"],[/deutsch|german|allemand/i,"🇩🇪"],[/fran[cç]|french/i,"🇫🇷"],[/engl|anglais/i,"🇬🇧"],[/lux|l[eë]tz/i,"🇱🇺"],[/bio|natur|science/i,"🧬"],[/phys/i,"⚛️"],[/chem|chim/i,"🧪"],[/geo|erdkunde/i,"🌍"],[/gesch|hist/i,"🏛️"],[/info|comput|it\b/i,"💻"],[/sport|eps|gym/i,"⚽"],[/kunst|art|musik|music/i,"🎨"],[/relig|ethik|moral|vie/i,"🕊️"],[/wirtschaft|econ|eco/i,"📈"]];
const subjectIcon=(name)=>(SUBJECT_ICONS.find(([re])=>re.test(name||""))||[0,"📚"])[1];
let sb=null;

async function boot(){
  if(!auth.authConfigured){ $("wrap").innerHTML=gate("⚙️","Not configured."); return; }
  auth.mountAccountButton($("acctHost"));
  sb=await auth.client();
  auth.onAuth(()=>render());
  render();
}
async function render(){
  if(!auth.session()){ $("wrap").innerHTML=gate("📚","Sign in to see your homework.",`<button type="button" class="ui-btn ui-btn--primary" id="signin">Sign in</button>`); $("signin").onclick=auth.openAuthModal; return; }
  let admin=false; try{ const { data }=await sb.rpc("is_admin"); admin=!!data; }catch{}
  if(!admin){ $("wrap").innerHTML=gate("🔒","This page is private."); return; }
  showApp();
}
async function showApp(){
  $("wrap").innerHTML=`
    <div class="syncbar ui-card">
      <button type="button" class="ui-btn ui-btn--primary" id="syncBtn"><span aria-hidden="true">🔄</span>&nbsp;Sync now</button>
      <span class="synced" id="synced" role="status"></span>
    </div>
    <div id="list" style="display:flex;flex-direction:column;gap:12px"><div class="gate ui-card" role="status">Loading…</div></div>`;
  $("syncBtn").onclick=syncNow;
  loadList();
}
// Luxembourgish is missing from some Intl builds; German is the closest fallback.
const uiLang=()=>{ const l=window.I18N?.lang; if(!l) return undefined; try{ return Intl.DateTimeFormat.supportedLocalesOf([l]).length&&Intl.RelativeTimeFormat.supportedLocalesOf([l]).length?l:(l==="lb"?"de":l); }catch{ return undefined; } };
function fmtDate(d){ if(!d) return ""; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString(uiLang(),{weekday:"short",day:"numeric",month:"short"}); }
// Today / tomorrow / yesterday come from Intl in the active language, so no new i18n keys are needed.
function dueLabel(d,days){
  if(!d) return "";
  if(days>=-1 && days<=1){ try{ const w=new Intl.RelativeTimeFormat(uiLang(),{numeric:"auto"}).format(days,"day"); return w.charAt(0).toUpperCase()+w.slice(1); }catch{} }
  return fmtDate(d);
}
// Recently-overdue homework is the most useful thing on this page, and the
// query used to exclude it — which also made the "over" style below dead code.
// Bounded so an old backlog cannot flood the list.
const OVERDUE_DAYS_SHOWN=14;
async function loadList(){
  const today=new Date().toISOString().slice(0,10);
  const from=new Date(Date.now()-OVERDUE_DAYS_SHOWN*86400000).toISOString().slice(0,10);
  const { data, error }=await sb.from("homework").select("*").or(`due_date.gte.${from},due_date.is.null`).order("due_date",{ascending:true,nullsFirst:false});
  const list=$("list");
  if(error){ list.innerHTML=gate("😕","Couldn't load."); return; }
  if(!data || !data.length){ list.innerHTML=gate("🎉","No upcoming homework.",`<p class="gate-sub">Hit “Sync now”.</p>`); return; }
  if(data[0]?.synced_at) $("synced").textContent="Last synced "+new Date(data[0].synced_at).toLocaleString(uiLang());
  list.innerHTML=data.map(h=>{
    const due=h.due_date; const days=due?Math.round((new Date(due)-new Date(today))/86400000):99;
    const cls=days<0?"over":days<=1?"soon":"";
    const state=cls==="over"?"Overdue. ":cls==="soon"?"Due soon. ":"";
    return `<article class="hw ${cls}">
      <span class="ico" aria-hidden="true">${subjectIcon(h.subject)}</span>
      <span class="subj">${state?`<span class="sr-only">${state}</span>`:""}${esc(h.subject||"—")}</span>
      <span class="due">${esc(dueLabel(due,days))}</span>
      <div class="txt">${esc(h.text||h.remark||"(no text)")}</div>
      ${h.text&&h.remark?`<div class="rem">${esc(h.remark)}</div>`:""}
    </article>`;
  }).join("");
}
async function syncNow(){
  const b=$("syncBtn"); b.disabled=true; b.innerHTML='<span aria-hidden="true">🔄</span>&nbsp;Syncing…';
  try{
    const { data, error }=await sb.functions.invoke("webuntis-sync");
    if(error) throw error;
    $("synced").textContent = data?.ok ? `Synced ${data.count} item(s)` : (data?.error||"Sync failed");
  }catch(e){ $("synced").textContent="Sync failed: "+(e.message||e); }
  b.disabled=false; b.innerHTML='<span aria-hidden="true">🔄</span>&nbsp;Sync now';
  loadList();
}
boot();
</script>
  <script type="module" src="rtc-ring.js?v=21"></script>
  <script type="module" src="class-gate.js?v=22"></script>
</body>
</html>
