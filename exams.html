<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tester — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=26"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a,[role=button]{touch-action:manipulation}
  a:focus-visible,button:focus-visible,[role=button]:focus-visible,.ui-input:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  .header-right{flex-wrap:wrap;justify-content:flex-end}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .classtag{display:inline-flex;align-items:center;min-height:32px;padding:4px 14px;border-radius:999px;font:750 13px var(--font-display);color:var(--text);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
  .ui .ui-page{display:flex;flex-direction:column;gap:12px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- gate (loading / sign-in / class / empty) ---- */
  .gate{text-align:center;padding:clamp(30px,6vw,52px) 22px;margin-top:10px;color:var(--muted)}
  .gate .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .gate p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text)}
  .gate .ui-btn{margin-top:18px}

  .syncnote{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:13.5px;line-height:1.4;color:var(--muted)}
  .syncnote .ico{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:12px;font-size:18px;background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque))}
  #list{display:flex;flex-direction:column;gap:12px}

  /* ---- exam cards ---- */
  .exc{--h:var(--accent);padding:0;overflow:hidden;border-radius:var(--r-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -18px rgb(var(--ink)/.35)}
  .exc.soon{--h:#f4a62a;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 14%,var(--card-opaque)),var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 38%,transparent),0 14px 30px -18px rgb(var(--ink)/.35)}
  .exc.past{--h:#8e92a8}
  .exam{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;column-gap:14px;padding:14px 16px;min-height:76px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .exam.past{opacity:.55}
  .exam:focus-visible{outline-color:var(--accent);outline-offset:-4px;border-radius:var(--r-tile)}
  .exam .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:var(--r-chip);font-size:24px;line-height:1;background:color-mix(in srgb,var(--h) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .exam .main{min-width:0}
  .exam .subj{font:750 16px/1.25 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
  .exam .when{color:var(--muted);font-size:13px;margin-top:2px}
  .exam .xnote{color:var(--muted);font-size:13px;font-style:italic;margin-top:2px;overflow-wrap:anywhere}
  .exam .cd{justify-self:end;padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;background:color-mix(in srgb,var(--h) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent)}
  .exam .cd b{font:800 17px/1.3 var(--font-display);letter-spacing:-.01em;color:var(--text)}
  .caret{color:var(--muted);font-size:12px}
  .exam > .caret{width:20px;text-align:center}
  .xchip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font:600 11.5px/1.6 system-ui,-apple-system,sans-serif;color:var(--muted);background:color-mix(in srgb,var(--text) 7%,transparent);vertical-align:1px}
  .detail{display:none;margin:0 16px;padding:16px 0 18px;border-top:1px solid var(--border)}
  .detail.open{display:block}
  .detail h3{font:750 12px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .n{background:var(--card-opaque);border-radius:var(--r-chip);padding:11px 14px;margin-bottom:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:inset 0 0 0 1px var(--tile-edge)}
  .n.nonote{color:var(--muted)}
  .n .meta{color:var(--muted);font-size:12px;margin-top:5px;display:flex;gap:8px;align-items:center}
  .n .meta:empty{display:none}
  .n a.file{color:var(--accent-text);font-weight:700}
  .del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px;min-width:44px;min-height:44px;border-radius:var(--r-chip);margin:-12px -10px -12px auto}
  .del:hover{color:#ef5b6b}
  .deck{display:inline-flex;align-items:center;gap:6px;min-height:36px;background:var(--card-opaque);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;margin:0 6px 6px 0;box-shadow:inset 0 0 0 1px var(--border);color:var(--text)}
  a.deck:hover{box-shadow:inset 0 0 0 1px var(--accent-border)}
  .deckwrap{display:flex;flex-wrap:wrap;align-items:center}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .row2 .ui-btn{min-height:44px;padding:10px 18px;font-size:15px}
  .detail .ui-input{min-height:84px}
  .msg{min-height:16px;color:var(--accent-text);font-weight:700;font-size:13px}
  .msg.err{color:#ef5b6b}
  html[data-theme="light"] .msg.err,html[data-theme="light"] .del:hover{color:#c0283c}

  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.ui .ui-header h1.ui-brand{font-size:18px}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
    .exam{grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;padding:13px 14px}
    .exam > .caret{display:none}
    .exam .ico{width:40px;height:40px;font-size:21px}
    .exam .cd b{font-size:15px}
    .detail{margin:0 14px}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <a class="home" href="index.html">‹ Heem</a>
    <h1 class="ui-brand"><span aria-hidden="true">⏳</span> Tester</h1>
  </div>
  <div class="header-right">
    <span id="classTag"></span>
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page" id="wrap"><div class="gate ui-card" role="status">Lueden…</div></main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=22";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gate=(ico,msg,extra="")=>`<div class="gate ui-card"><div class="gate-ico" aria-hidden="true">${ico}</div><p>${msg}</p>${extra}</div>`;
const SUBJECT_ICONS=[[/math|maths/i,"🧮"],[/deutsch|german|allemand/i,"🇩🇪"],[/fran[cç]|french/i,"🇫🇷"],[/engl|anglais/i,"🇬🇧"],[/lux|l[eë]tz/i,"🇱🇺"],[/bio|natur|science/i,"🧬"],[/phys/i,"⚛️"],[/chem|chim/i,"🧪"],[/geo|erdkunde/i,"🌍"],[/gesch|hist/i,"🏛️"],[/info|comput|it\b/i,"💻"],[/sport|eps|gym/i,"⚽"],[/kunst|art|musik|music/i,"🎨"],[/relig|ethik|moral|vie/i,"🕊️"],[/wirtschaft|econ|eco/i,"📈"]];
const subjectIcon=(name)=>(SUBJECT_ICONS.find(([re])=>re.test(name||""))||[0,"⏳"])[1];
let sb=null,myClass=null,me=null,exams=[],decksByExam={},openId=null,timer=null;
const DAY=86400000;

async function boot(){
  sb=await auth.client();
  auth.mountAccountButton($("acctHost"));
  if(!auth.session()){
    $("wrap").innerHTML=gate("⏳","Mell dech un, fir d'Tester vun denger Klass ze gesinn.",`<button type="button" class="ui-btn ui-btn--primary" id="si">Umellen</button>`);
    $("si").onclick=auth.openAuthModal;return;
  }
  me=auth.session().user.id;
  try{const {data}=await sb.from("profiles").select("class").eq("id",me).maybeSingle();myClass=data?.class||null;}catch{}
  if(!myClass){$("wrap").innerHTML=gate("🎓",`Setz zeréischt deng Klass (am <a href="profile.html">Profil</a>), da gesäis du d'Tester vun denger Klass.`);return;}
  $("classTag").innerHTML=`<span class="classtag">${esc(myClass)}</span>`;
  $("wrap").innerHTML=`
    <div class="syncnote ui-card"><span class="ico" aria-hidden="true">📡</span><span>D'Tester kommen automatesch vu WebUntis (all Moien).</span></div>
    <div id="list"><div class="gate ui-card" role="status">Lueden…</div></div>`;
  await refresh();
}

async function refresh(){
  const [{data:ex,error},{data:dk}]=await Promise.all([
    sb.from("exams").select("*").order("at"),
    sb.from("flashcard_decks").select("id,title,exam_id").not("exam_id","is",null),
  ]);
  if(error){$("list").innerHTML=gate("😕","Feeler beim Lueden.");return;}
  exams=(ex||[]).filter(e=>new Date(e.at).getTime()>Date.now()-DAY);
  decksByExam={};
  for(const d of dk||[]){(decksByExam[d.exam_id]=decksByExam[d.exam_id]||[]).push(d);}
  render();
  if(!timer)timer=setInterval(paintCountdowns,1000);
}

const pad=(n)=>String(n).padStart(2,"0");
function cdText(ms){
  if(ms<=0)return "elo!";
  const s=Math.floor(ms/1000),d=Math.floor(s/86400);
  if(d>0)return d+"d "+pad(Math.floor(s/3600)%24)+"h "+pad(Math.floor(s/60)%60)+"m";
  return pad(Math.floor(s/3600))+":"+pad(Math.floor(s/60)%60)+":"+pad(s%60);
}
function paintCountdowns(){
  for(const e of exams){
    const el=document.querySelector(`.cd[data-cd="${e.id}"] b`);
    if(!el)continue;
    const left=new Date(e.at).getTime()-Date.now();
    el.textContent=cdText(left);
    el.parentElement.classList.toggle("soon",left<3*DAY&&left>0);
    const card=el.closest(".exc");
    if(card){card.classList.toggle("soon",left<3*DAY&&left>0);card.classList.toggle("past",left<=0);}
  }
}
function render(){
  if(!exams.length){$("list").innerHTML=gate("😌","Keng Tester — genéiss d'Rou");return;}
  $("list").innerHTML=exams.map(e=>{
    const t=new Date(e.at),left=t.getTime()-Date.now();
    const when=t.toLocaleString("de-DE",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    const nDecks=(decksByExam[e.id]||[]).length;
    const soon=left<3*DAY&&left>0;
    return `<div class="exc${soon?" soon":""}${left<=0?" past":""}">
      <div class="exam${left<0?" past":""}" data-open="${e.id}" role="button" tabindex="0" aria-expanded="${openId===e.id}" aria-controls="det-${e.id}">
        <span class="ico" aria-hidden="true">${subjectIcon(e.subject)}</span>
        <div class="main"><div class="subj">${esc(e.subject)}${e.untis_id?` <span class="xchip" title="Automatesch vu WebUntis">WebUntis</span>`:""}${nDecks?` <span class="xchip"><span aria-hidden="true">🃏</span> ${nDecks}</span>`:""}</div>
          <div class="when">${when}</div>${e.note?`<div class="xnote">${esc(e.note)}</div>`:""}</div>
        <div class="cd${soon?" soon":""}" data-cd="${e.id}"><b>${cdText(left)}</b></div>
        <span class="caret" aria-hidden="true">${openId===e.id?"▲":"▼"}</span>
      </div>
      <div class="detail${openId===e.id?" open":""}" id="det-${e.id}"></div>
    </div>`;
  }).join("");
  $("list").querySelectorAll("[data-open]").forEach(el=>{
    el.onclick=()=>toggle(el.dataset.open);
    el.onkeydown=(ev)=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();toggle(el.dataset.open);}};
  });
  if(openId)loadDetail(openId);
}

function toggle(id){
  openId=(openId===id)?null:id; render();
  const head=document.querySelector(`[data-open="${id}"]`);if(head)head.focus({preventScroll:true});
}

async function loadDetail(id){
  const box=$("det-"+id);if(!box)return;
  const exam=exams.find(e=>e.id===id);
  const mine=exam&&exam.created_by===me;
  box.innerHTML="Lueden…";
  const [{data:notes},{data:decks}]=await Promise.all([
    sb.from("exam_notes").select("*").eq("exam_id",id).order("created_at"),
    sb.from("flashcard_decks").select("id,title").eq("exam_id",id),
  ]);
  const notesHtml=(notes||[]).map(n=>{
    const canDel=n.created_by===me;
    const file=n.file_url?`<a class="file" href="#" data-file="${esc(n.file_url)}">📎 ${esc(n.file_name||"Datei")}</a>`:"";
    return `<div class="n">${n.body?esc(n.body):""}<div class="meta">${file}${canDel?`<button class="del" data-dn="${n.id}" title="Läschen" aria-label="Notiz läschen"><span aria-hidden="true">✕</span></button>`:""}</div></div>`;
  }).join("")||`<div class="n nonote">Nach keng Notizen. Setz deng Resimee oder Fotoen bäi 👇</div>`;
  const deckHtml=(decks||[]).map(d=>`<a class="deck" href="flashcards.html?deck=${d.id}">🃏 ${esc(d.title)}</a>`).join("");
  box.innerHTML=`
    <h3>Notizen & Resimee</h3>
    ${notesHtml}
    <textarea class="ui-input" id="nb-${id}" placeholder="Schreif eng Notiz / Resimee…" aria-label="Notiz oder Resimee"></textarea>
    <div class="row2">
      <button type="button" class="ui-btn ui-btn--primary" id="an-${id}">Notiz späicheren</button>
      <button type="button" class="ui-btn ui-btn--ghost" id="af-${id}">📎 Datei / Foto</button>
      <input type="file" id="fi-${id}" accept="image/*,application/pdf" hidden>
      <span class="msg" id="nm-${id}" role="status" aria-live="polite"></span>
    </div>
    <h3 style="margin-top:16px">Kaartekëschten <span aria-hidden="true">🃏</span></h3>
    <div class="deckwrap">${deckHtml}
      <a class="deck" href="flashcards.html?exam=${id}&class=${encodeURIComponent(myClass)}">＋ Nei Këscht</a>
    </div>
    ${mine?`<div class="row2" style="margin-top:14px"><button type="button" class="ui-btn ui-btn--ghost" id="dx-${id}">Test läschen</button></div>`:""}`;
  box.querySelectorAll("[data-dn]").forEach(b=>b.onclick=async()=>{
    await sb.from("exam_notes").delete().eq("id",b.dataset.dn);loadDetail(id);
  });
  box.querySelectorAll("[data-file]").forEach(a=>a.onclick=(ev)=>{ev.preventDefault();openFile(id,a.dataset.file);});
  $("an-"+id).onclick=()=>addNote(id,null,null);
  $("af-"+id).onclick=()=>$("fi-"+id).click();
  $("fi-"+id).onchange=(e)=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)uploadFile(id,f);};
  if(mine)$("dx-"+id).onclick=async()=>{
    if(!confirm("Test läschen?"))return;
    await sb.from("exams").delete().eq("id",id);openId=null;refresh();
  };
}

async function addNote(id,fileUrl,fileName){
  const ta=$("nb-"+id),body=(ta?ta.value.trim():"")||null;
  if(!body&&!fileUrl){setMsg(id,"Schreif eppes oder häng eng Datei un.",true);return;}
  setMsg(id,"Späicheren…");
  try{
    const {error}=await sb.from("exam_notes").insert({exam_id:id,class:myClass,body,file_url:fileUrl,file_name:fileName});
    if(error)throw error;
    if(ta)ta.value="";
    loadDetail(id);
  }catch(e){console.warn(e);setMsg(id,"Feeler beim Späicheren.",true);}
}

async function uploadFile(id,file){
  if(file.size>8*1024*1024){setMsg(id,"Datei ze grouss (max 8 MB).",true);return;}
  setMsg(id,"Eroplueden…");
  try{
    const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=`${me}/${id}-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from("exam-files").upload(path,file,{contentType:file.type||"application/octet-stream"});
    if(error)throw error;
    // Store the storage PATH. The bucket is private, so a link is minted on
    // demand below — a public URL would be readable by anyone who saw it.
    await addNote(id,path,file.name);
  }catch(e){console.warn(e);setMsg(id,"Upload feelgeschloen (Migratioun gelaf?).",true);}
}

// The bucket is private, so a link only exists for as long as it is needed.
// The tab is opened synchronously — opening it after the await would be caught
// by the popup blocker.
const SIGNED_URL_TTL_S=60;
async function openFile(id,pathOrUrl){
  if(/^https?:\/\//i.test(pathOrUrl)){window.open(pathOrUrl,"_blank","noopener");return;}
  const tab=window.open("","_blank");
  try{
    const {data,error}=await sb.storage.from("exam-files")
      .createSignedUrl(pathOrUrl,SIGNED_URL_TTL_S);
    if(error||!data?.signedUrl)throw error||new Error("no url");
    if(tab)tab.location=data.signedUrl; else location.href=data.signedUrl;
  }catch(e){
    console.warn("[exams] signed url",e);
    if(tab)tab.close();
    setMsg(id,"Datei konnt net opgemaach ginn.",true);
  }
}

function setMsg(id,t,err){
  const m=$("nm-"+id);if(!m)return;
  m.textContent=t;m.classList.toggle("err",!!err);
  if(t&&!err&&/✓|gelueden|gespäichert/i.test(t))setTimeout(()=>{if(m)m.textContent="";},1500);
}

auth.onAuth(boot);
boot();
</script>
  <script type="module" src="rtc-ring.js?v=18"></script>
  <script type="module" src="class-gate.js?v=19"></script>
</body>
</html>
