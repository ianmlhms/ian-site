<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a,input{touch-action:manipulation}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}
  .ui{--warn:#ef5b6b}
  html[data-theme="light"] .ui{--warn:#c7283d}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- header + column ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- empty / loading / error + sign-in hint ---- */
  .pollempty{text-align:center;color:var(--muted);padding:clamp(28px,6vw,48px) 22px}
  .pollempty .pollempty-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .pollempty p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text)}
  .pollempty .pollempty-sub{margin-top:6px;font:500 14px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:0;color:var(--muted)}
  .pollgate{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;padding:12px 16px;border-radius:var(--r-chip);background:color-mix(in srgb,var(--text) 5%,transparent)}
  .pollgate a{text-decoration:underline;text-underline-offset:3px;padding:12px 2px}
  #pollMsg:empty,.msg:empty{display:none}
  #pollMsg{align-self:center;padding:8px 16px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
  .msg{color:var(--accent-text);font-weight:700;font-size:13px;min-height:18px}

  /* ---- new poll form ---- */
  .newpoll{display:flex;flex-direction:column;gap:12px}
  .newpoll h2{margin:0;font:800 17px var(--font-display);letter-spacing:-.02em}
  #npOpts{display:flex;flex-direction:column;gap:8px}
  .adminrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
  .adminrow .spacer{flex:1}
  .abtn{min-height:44px;padding:8px 16px;font-size:14px}
  .abtn.danger:hover{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}

  /* ---- poll cards ---- */
  #list{display:flex;flex-direction:column;gap:14px}
  .poll{display:flex;flex-direction:column;gap:10px}
  .phead{display:flex;align-items:flex-start;gap:12px}
  .pico{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--r-chip);font-size:23px;line-height:1;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .poll.closedp .pico{filter:grayscale(.6)}
  .q{flex:1;min-width:0;margin:0;padding-top:2px;font:800 clamp(17px,2.6vw,20px)/1.3 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{position:relative;display:block;width:100%;min-height:52px;padding:0;border:0;border-radius:var(--r-chip);background:var(--card-opaque);color:var(--text);font:inherit;text-align:left;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border);transition:box-shadow .2s,transform .3s var(--ease)}
  .opt:disabled{cursor:default;opacity:1;color:var(--text);-webkit-text-fill-color:currentcolor}
  .opt:not(:disabled):hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,var(--border))}
  .opt:not(:disabled):active{transform:scale(.99)}
  .opt .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 14%,transparent);transform-origin:left;z-index:0}
  .opt.lead .fill{background:color-mix(in srgb,var(--accent) 28%,transparent)}
  .opt.mine{box-shadow:inset 0 0 0 2px var(--accent)}
  .opt .lbl{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px}
  .opt .chk{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;line-height:1;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--text) 22%,transparent);color:transparent}
  .opt:not(:disabled) .chk{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--text) 32%,transparent)}
  .opt.mine .chk{background:var(--accent);color:var(--accent-foreground);box-shadow:none}
  .opt .txt{flex:1;min-width:0;font-size:15px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
  .opt .pct{flex:none;text-align:right;font:800 15px var(--font-display);font-variant-numeric:tabular-nums}
  .opt .cnt{display:block;font:500 11.5px system-ui,-apple-system,sans-serif;color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
  .pchip{display:inline-flex;align-items:center;min-height:26px;padding:2px 11px;border-radius:999px;font:750 12px var(--font-display);background:color-mix(in srgb,var(--text) 7%,transparent)}
  .pchip.closed{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .pchip.live{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,transparent)}

  @media(prefers-reduced-motion:no-preference){.opt .fill{transition:transform .5s var(--ease)}}
  @media(max-width:700px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.ui .ui-header h1.ui-brand{font-size:18px}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
    .pico{width:38px;height:38px;font-size:20px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <a class="home" href="index.html">‹ Heem</a>
    <h1 class="ui-brand"><span aria-hidden="true">🗳️</span> Ëmfroen</h1>
  </div>
  <div class="header-right">
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page">
  <section class="ui-card ui-card--accent newpoll" aria-labelledby="npTitle" id="newPoll" style="display:none">
    <h2 id="npTitle">Nei Ëmfro</h2>
    <input class="ui-input" id="npQ" maxlength="200" placeholder="Fro…" aria-label="Fro" autocomplete="off">
    <div id="npOpts"></div>
    <div class="adminrow">
      <button class="ui-btn ui-btn--ghost abtn" id="npAdd" type="button">+ Optioun</button>
      <span class="spacer"></span>
      <button class="ui-btn ui-btn--primary" id="npCreate" type="button">Erstellen</button>
    </div>
    <div class="msg" id="npMsg" role="status" aria-live="polite"></div>
  </section>
  <div class="pollgate" id="gate" style="display:none"><span aria-hidden="true">🔒</span> <a href="#" id="gateBtn" role="button">Mell dech un</a> fir matzestëmmen.</div>
  <div class="msg" id="pollMsg" role="status" aria-live="polite"></div>
  <div id="list"><div class="pollempty" role="status"><p>Lueden…</p></div></div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=23";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const emptyHtml=(ico,msg,sub)=>`<div class="pollempty" role="status"><div class="pollempty-ico" aria-hidden="true">${ico}</div><p>${esc(msg)}</p><div class="pollempty-sub">${esc(sub)}</div></div>`;
let sb=null,isAdmin=false,polls=[],results={},myVotes={};

async function refresh(){
  try{
    sb=sb||await auth.client();
    const [{data:ps,error:e1},{data:rs,error:e2}]=await Promise.all([
      sb.from("polls").select("*").order("created_at",{ascending:false}),
      sb.rpc("poll_results_all"),
    ]);
    if(e1)throw e1; if(e2)throw e2;
    polls=ps||[];
    results={};
    for(const r of rs||[]){(results[r.poll_id]||(results[r.poll_id]={}))[r.option_idx]=+r.votes;}
    myVotes={};
    if(auth.session()){
      const {data:mv}=await sb.from("poll_votes").select("poll_id,option_idx");
      for(const v of mv||[])myVotes[v.poll_id]=v.option_idx;
    }
    render();
  }catch(e){console.warn("[polls]",e);$("list").innerHTML=emptyHtml("⚠️","Feeler beim Lueden.","Probéier et gläich nach eng Kéier.");}
}

function render(){
  const signedIn=!!auth.session();
  const myUid=auth.session()?.user?.id;
  $("gate").style.display=signedIn?"none":"";
  if(!polls.length){$("list").innerHTML=emptyHtml("🗳️","Nach keng Ëmfroen.","Sobal een eng erstellt, kënns du hei mat stëmmen.");return;}
  $("list").innerHTML=polls.map(p=>{
    const res=results[p.id]||{};
    const total=Object.values(res).reduce((a,b)=>a+b,0);
    const mine=myVotes[p.id];
    const canVote=signedIn&&p.is_open;
    const top=Math.max(0,...p.options.map((_,i)=>res[i]||0));
    const opts=p.options.map((o,i)=>{
      const n=res[i]||0,pct=total?Math.round(100*n/total):0;
      return `<button type="button" class="opt${mine===i?" mine":""}${top&&n===top?" lead":""}" data-p="${p.id}" data-i="${i}" aria-pressed="${mine===i}" ${canVote?"":"disabled"}>
        <span class="fill" style="transform:scaleX(${total?n/total:0})"></span>
        <span class="lbl"><span class="chk" aria-hidden="true">✓</span><span class="txt">${esc(o)}</span><span class="pct">${pct}%<span class="cnt">${n}</span></span></span></button>`;
    }).join("");
    const canManage=isAdmin||(myUid&&p.created_by===myUid);
    const admin=canManage?`<div class="adminrow">
      <button type="button" class="ui-btn ui-btn--ghost abtn" data-close="${p.id}" data-open="${p.is_open?0:1}" aria-label="${p.is_open?"Zoumaachen":"Opmaachen"}: ${esc(p.question)}">${p.is_open?"Zoumaachen":"Opmaachen"}</button>
      <button type="button" class="ui-btn ui-btn--ghost abtn danger" data-del="${p.id}" aria-label="Läschen: ${esc(p.question)}">Läschen</button></div>`:"";
    return `<section class="ui-card poll${p.is_open?"":" closedp"}" aria-labelledby="q-${p.id}"><div class="phead"><span class="pico" aria-hidden="true">${p.is_open?"🗳️":"🔒"}</span><h2 class="q" id="q-${p.id}">${esc(p.question)}</h2></div><div class="opts">${opts}</div>
      <div class="meta"><span class="pchip">${total} Stëmmen</span>${p.is_open?"":'<span class="pchip closed">zou</span>'}</div>${admin}</section>`;
  }).join("");
  $("list").querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>vote(b.dataset.p,+b.dataset.i));
  $("list").querySelectorAll("[data-close]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.close;
    await sb.from("polls").update({is_open:b.dataset.open==="1"}).eq("id",id);
    await refresh();focusIn(`[data-close="${id}"]`);});
  $("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Ëmfro läschen?"))return;
    await sb.from("polls").delete().eq("id",b.dataset.del);refresh();});
}

// render() rebuilds the list, which drops keyboard focus; put it back on the same control.
function focusIn(selector){$("list").querySelector(selector)?.focus();}

async function vote(pollId,idx){
  try{
    const {error}=await sb.from("poll_votes").upsert(
      {poll_id:pollId,option_idx:idx,user_id:auth.session().user.id},{onConflict:"poll_id,user_id"});
    if(error)throw error;
    await refresh();
    focusIn(`.opt[data-p="${pollId}"][data-i="${idx}"]`);
    $("pollMsg").textContent="Stëmm gespäichert ✓";setTimeout(()=>$("pollMsg").textContent="",1800);
  }catch(e){console.warn("[polls] vote",e);$("pollMsg").textContent="Stëmm konnt net gespäichert ginn.";}
}

/* ---- creation (admin only) ---- */
function addOptInput(){
  const n=$("npOpts").children.length;
  if(n>=6)return;
  const inp=document.createElement("input");
  inp.maxLength=80;inp.placeholder="Optioun "+(n+1);inp.setAttribute("aria-label","Optioun "+(n+1));inp.autocomplete="off";inp.className="ui-input";
  $("npOpts").appendChild(inp);
}
$("npAdd").onclick=addOptInput;
$("npCreate").onclick=async()=>{
  const q=$("npQ").value.trim();
  const opts=[...$("npOpts").children].map(i=>i.value.trim()).filter(Boolean);
  if(q.length<3||opts.length<2){$("npMsg").textContent="Fro + mindestens 2 Optiounen.";return;}
  $("npMsg").textContent="…";
  try{
    const {error}=await sb.from("polls").insert({question:q,options:opts});
    if(error)throw error;
    $("npQ").value="";$("npOpts").innerHTML="";addOptInput();addOptInput();
    $("npMsg").textContent="Erstallt! ✓";setTimeout(()=>$("npMsg").textContent="",1500);
    refresh();
  }catch(e){console.warn(e);$("npMsg").textContent="Feeler beim Erstellen.";}
};
addOptInput();addOptInput();

(async()=>{
  auth.mountAccountButton($("acctHost"));
  $("gateBtn").onclick=(e)=>{e.preventDefault();auth.openAuthModal();};
  auth.onAuth(async()=>{
    isAdmin=false;
    try{sb=sb||await auth.client();if(auth.session()){const{data}=await sb.rpc("is_admin");isAdmin=!!data;}}catch{}
    $("newPoll").style.display=auth.session()?"":"none";
    refresh();
  });
  try{sb=await auth.client();if(auth.session()){const{data}=await sb.rpc("is_admin");isAdmin=!!data;}}catch{}
  $("newPoll").style.display=auth.session()?"":"none";
  refresh();
})();
</script>
  <script type="module" src="rtc-ring.js?v=19"></script>
  <script type="module" src="class-gate.js?v=20"></script>
</body>
</html>
