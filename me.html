<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Dashboard — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=28"></script>
<script src="i18n-dict.js?v=46"></script>
<script src="i18n.js?v=3"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a{touch-action:manipulation}
  a:focus-visible,.ui-btn:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:820px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  .header-right{flex-wrap:wrap;justify-content:flex-end}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:820px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- gate (loading / sign-in / private) ---- */
  .gate{text-align:center;padding:clamp(30px,6vw,52px) 22px;margin-top:10px;color:var(--muted)}
  .gate .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .gate p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text)}
  .gate .ui-btn{margin-top:18px}

  /* ---- panels ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15.5rem),1fr));gap:14px}
  .panel{--h:var(--accent);min-width:0}
  .panel .h{display:flex;align-items:center;gap:12px;margin:0 0 14px;font:800 17px/1.2 var(--font-display);letter-spacing:-.015em}
  .panel .h .ic{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--r-chip);font-size:23px;line-height:1;background:color-mix(in srgb,var(--h) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  #pGh{--h:#8b7cf6}#pGc{--h:#3aa9d8}#pSf{--h:#f4a62a}#pFit{--h:#4fc37a}#pEvents{--h:#8b7cf6}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;padding:8px 0;border-bottom:1px solid var(--tile-edge);font-size:14.5px}
  .stat:last-child{border-bottom:none;padding-bottom:0}
  .stat span{min-width:0;overflow-wrap:anywhere}
  .stat b{font-variant-numeric:tabular-nums;font-family:var(--font-display);white-space:nowrap}
  .stat b a{display:inline-flex;align-items:center;min-height:36px}
  .big{font:800 clamp(34px,6vw,44px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .sub{color:var(--muted);font-size:12.5px}
  .muted{color:var(--muted);font-size:13.5px}
  .panel .big+.sub{margin-top:4px}
  h2.sec{margin:10px 2px -4px;font:800 clamp(20px,3vw,24px)/1.2 var(--font-display);letter-spacing:-.025em;text-transform:none;color:var(--text)}
  #pEvents .big{color:var(--accent-text)}
  #pEvents .stat b.sub{font-family:inherit;font-weight:500}

  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.ui .ui-header h1.ui-brand{font-size:18px}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
  }
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <a class="home" href="index.html" data-i18n="nav.home">‹ Home</a>
    <h1 class="ui-brand"><span aria-hidden="true">📊</span> My Dashboard</h1>
  </div>
  <div class="header-right">
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page" id="wrap"><div class="gate ui-card" role="status">Loading…</div></main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=28";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H=(ic,t)=>`<div class="h" role="heading" aria-level="2"><span class="ic" aria-hidden="true">${ic}</span>${t}</div>`;
const GH_USER="ianmlhms", GC="https://ianm.goatcounter.com";
let sb=null;

async function boot(){
  sb=await auth.client();
  auth.mountAccountButton($("acctHost"));
  if(!auth.session()){
    $("wrap").innerHTML=`<div class="gate ui-card"><div class="gate-ico" aria-hidden="true">📊</div><p>Sign in.</p><button type="button" class="ui-btn ui-btn--primary" id="si">Sign in</button></div>`;
    $("si").onclick=auth.openAuthModal;return;
  }
  let admin=false; try{const {data}=await sb.rpc("is_admin");admin=!!data;}catch{}
  if(!admin){$("wrap").innerHTML=`<div class="gate ui-card"><div class="gate-ico" aria-hidden="true">🔒</div><p>This dashboard is private.</p></div>`;return;}
  $("wrap").innerHTML=`
    <div class="grid">
      <div class="panel ui-card" id="pGh">${H("🐙","GitHub")}<div class="muted">Loading…</div></div>
      <div class="panel ui-card" id="pGc">${H("📈","Site traffic")}<div class="muted">Loading…</div></div>
      <div class="panel ui-card" id="pSf">${H("🎬","ShortsFactory")}<div class="muted">Loading…</div></div>
      <div class="panel ui-card" id="pFit">${H("💪","This week")}<div class="muted">Loading…</div></div>
    </div>
    <h2 class="sec">Recent GitHub activity</h2>
    <div class="panel ui-card" id="pEvents"><div class="muted">Loading…</div></div>`;
  loadGithub(); loadGoat(); loadShorts(); loadFitness();
}

async function loadGithub(){
  try{
    const u=await (await fetch(`https://api.github.com/users/${GH_USER}`)).json();
    const repos=await (await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=pushed`)).json();
    const stars=Array.isArray(repos)?repos.reduce((a,r)=>a+(r.stargazers_count||0),0):0;
    $("pGh").innerHTML=`${H("🐙","GitHub")}
      <div class="stat"><span>Public repos</span><b>${u.public_repos??"–"}</b></div>
      <div class="stat"><span>Followers</span><b>${u.followers??"–"}</b></div>
      <div class="stat"><span>Total stars</span><b>${stars}</b></div>`;
    const evs=await (await fetch(`https://api.github.com/users/${GH_USER}/events/public?per_page=30`)).json();
    if(Array.isArray(evs)){
      const push=evs.filter(e=>e.type==="PushEvent");
      const commits=push.reduce((a,e)=>a+(e.payload?.commits?.length||0),0);
      $("pEvents").innerHTML=push.slice(0,8).map(e=>{
        const when=new Date(e.created_at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
        const n=e.payload?.commits?.length||0;
        return `<div class="stat"><span>${esc(e.repo?.name||"")} · ${n} commit${n!==1?"s":""}</span><b class="sub">${when}</b></div>`;
      }).join("")||'<div class="muted">No recent pushes.</div>';
      $("pEvents").insertAdjacentHTML("afterbegin",`<div class="big">${commits}</div><div class="sub" style="margin-bottom:8px">commits in the last ${push.length} pushes</div>`);
    }
  }catch(e){console.warn(e);$("pGh").innerHTML=`${H("🐙","GitHub")}<div class="muted">Couldn't load.</div>`;}
}

async function loadGoat(){
  try{
    const j=await (await fetch(`${GC}/counter/TOTAL.json`)).json();
    const count=(j.count||"").replace(/\s/g,"")||"–";
    $("pGc").innerHTML=`${H("📈","Site traffic")}
      <div class="big">${esc(count)}</div><div class="sub">total pageviews (GoatCounter)</div>
      <div class="stat" style="margin-top:8px"><span>Dashboard</span><b><a href="${GC}" target="_blank" rel="noopener">open →</a></b></div>`;
  }catch(e){
    $("pGc").innerHTML=`${H("📈","Site traffic")}
      <div class="muted">Public totals off — <a href="${GC}" target="_blank" rel="noopener">open dashboard →</a></div>`;
  }
}

async function loadShorts(){
  try{
    // Admin-only table, not the old public data/factory.json (which exposed every
    // ShortsFactory account handle to anyone who fetched it).
    const {data:row,error}=await sb.from("dashboard_state").select("data").eq("id",1).maybeSingle();
    if(error)throw error;
    const d=row?.data;
    if(!d)throw new Error("no dashboard data");
    const vids=d.videos||d.published||[];
    const n=Array.isArray(vids)?vids.length:(d.count??d.total??"–");
    const followers=d.followers??d.subscribers;
    $("pSf").innerHTML=`${H("🎬","ShortsFactory")}
      <div class="big">${n}</div><div class="sub">videos published</div>
      ${followers!=null?`<div class="stat" style="margin-top:8px"><span>Followers</span><b>${followers}</b></div>`:""}
      <div class="stat"><span>Full dashboard</span><b><a href="factory.html">open →</a></b></div>`;
  }catch(e){$("pSf").innerHTML=`${H("🎬","ShortsFactory")}<div class="muted">No data yet.</div>`;}
}

async function loadFitness(){
  try{
    const weekAgo=new Date(Date.now()-7*86400000).toISOString();
    const {data}=await sb.from("workouts").select("duration_min,distance_km,type").gte("at",weekAgo);
    const mins=(data||[]).reduce((a,w)=>a+(w.duration_min||0),0);
    const km=(data||[]).reduce((a,w)=>a+(+w.distance_km||0),0);
    $("pFit").innerHTML=`${H("💪","This week")}
      <div class="stat"><span>Workouts</span><b>${(data||[]).length}</b></div>
      <div class="stat"><span>Active time</span><b>${Math.floor(mins/60)}h ${mins%60}m</b></div>
      <div class="stat"><span>Distance</span><b>${km.toFixed(1)} km</b></div>
      <div class="stat"><span>Details</span><b><a href="health.html">open →</a></b></div>`;
  }catch(e){$("pFit").innerHTML=`${H("💪","This week")}<div class="muted"><a href="health.html">Set up →</a></div>`;}
}

auth.onAuth(boot);
boot();
</script>
</body>
</html>
