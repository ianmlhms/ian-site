<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mäin Dashboard — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f6f3">
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=7">
<script src="theme.js?v=32"></script>
<script src="i18n-dict.js?v=54"></script>
<script src="i18n.js?v=5"></script>
<style>
  .gt-page{padding-bottom:max(56px,calc(40px + env(safe-area-inset-bottom)))}
  .panel{justify-content:flex-start !important;gap:12px !important}
  .panel .h{display:flex;align-items:center;gap:8px;margin:0;font:600 15px/1.2 "Geist",system-ui,sans-serif;color:var(--muted)}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:15px}
  .stat:last-child{border-bottom:none;padding-bottom:0}
  .stat span{min-width:0;overflow-wrap:anywhere}
  .stat b{font:500 15px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b a{display:inline-flex;align-items:center;min-height:44px;color:var(--green);font-family:"Geist",system-ui,sans-serif;font-weight:600}
  .big{font:500 clamp(34px,5vw,44px)/1 "Geist Mono",ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .sub{color:var(--muted);font-size:13.5px}
  .muted{color:var(--muted);font-size:14px}
  .muted a{color:var(--green);font-weight:600}
  #pEvents .big{color:var(--green)}
  #pEvents .stat b.sub{font-family:inherit;font-weight:400}
  @media(max-width:640px){.gt-nav{padding-inline:14px !important}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="gt">
<main class="gt-page">
<div class="gt-grid">
  <header class="c full gt-nav">
    <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">Mäin Dashboard</h1></div>
    <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
  </header>
  <div id="wrap" class="gt-contents"><div class="c full gt-gate" role="status"><p class="gt-sub">Lued …</p></div></div>
</div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=40";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H=(ic,t)=>`<div class="h" role="heading" aria-level="2">${t}</div>`;
const GH_USER="ianmlhms", GC="https://ianm.goatcounter.com";
let sb=null;

async function boot(){
  sb=await auth.client();
  if(!auth.session()){
    $("wrap").innerHTML=`<div class="c full gt-gate"><p class="gt-big">Mell dech un.</p><button type="button" class="gt-btn" id="si">Umellen</button></div>`;
    $("si").onclick=auth.openAuthModal;return;
  }
  let admin=false; try{const {data}=await sb.rpc("is_admin");admin=!!data;}catch{}
  if(!admin){$("wrap").innerHTML=`<div class="c full gt-gate"><p class="gt-big">Dësen Dashboard ass privat.</p></div>`;return;}
  $("wrap").innerHTML=`
    <div class="c half panel" id="pGh">${H("","GitHub")}<div class="muted">Lued …</div></div>
      <div class="c half panel" id="pGc">${H("","Seitentraffic")}<div class="muted">Lued …</div></div>
      <div class="c half panel" id="pSf">${H("","ShortsFactory")}<div class="muted">Lued …</div></div>
      <div class="c half panel" id="pFit">${H("","Dës Woch")}<div class="muted">Lued …</div></div>
    <div class="c full gt-lbl">Rezent GitHub-Aktivitéit</div>
    <div class="c full panel" id="pEvents"><div class="muted">Lued …</div></div>`;
  loadGithub(); loadGoat(); loadShorts(); loadFitness();
}

async function loadGithub(){
  try{
    const u=await (await fetch(`https://api.github.com/users/${GH_USER}`)).json();
    const repos=await (await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=pushed`)).json();
    const stars=Array.isArray(repos)?repos.reduce((a,r)=>a+(r.stargazers_count||0),0):0;
    $("pGh").innerHTML=`${H("","GitHub")}
      <div class="stat"><span>Ëffentlech Repos</span><b>${u.public_repos??"–"}</b></div>
      <div class="stat"><span>Follower</span><b>${u.followers??"–"}</b></div>
      <div class="stat"><span>Stären insgesamt</span><b>${stars}</b></div>`;
    const evs=await (await fetch(`https://api.github.com/users/${GH_USER}/events/public?per_page=30`)).json();
    if(Array.isArray(evs)){
      const push=evs.filter(e=>e.type==="PushEvent");
      const commits=push.reduce((a,e)=>a+(e.payload?.commits?.length||0),0);
      $("pEvents").innerHTML=push.slice(0,8).map(e=>{
        const when=new Date(e.created_at).toLocaleString("lb-LU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
        const n=e.payload?.commits?.length||0;
        return `<div class="stat"><span>${esc(e.repo?.name||"")} · ${n} Commit${n!==1?"s":""}</span><b class="sub">${when}</b></div>`;
      }).join("")||'<div class="muted">Keng rezent Pushen.</div>';
      $("pEvents").insertAdjacentHTML("afterbegin",`<div class="big">${commits}</div><div class="sub" style="margin-bottom:8px">Commits an de leschte ${push.length} Pushen</div>`);
    }
  }catch(e){console.warn(e);$("pGh").innerHTML=`${H("","GitHub")}<div class="muted">Konnt net gelueden ginn.</div>`;}
}

async function loadGoat(){
  try{
    const j=await (await fetch(`${GC}/counter/TOTAL.json`)).json();
    const count=(j.count||"").replace(/\s/g,"")||"–";
    $("pGc").innerHTML=`${H("","Seitentraffic")}
      <div class="big">${esc(count)}</div><div class="sub">Säitenopruffer insgesamt (GoatCounter)</div>
      <div class="stat" style="margin-top:8px"><span>Dashboard</span><b><a href="${GC}" target="_blank" rel="noopener">opmaachen →</a></b></div>
      <div class="stat"><span>Statistiken (pro Dag)</span><b><a href="traffic.html">opmaachen →</a></b></div>`;
  }catch(e){
    $("pGc").innerHTML=`${H("","Seitentraffic")}
      <div class="muted">Ëffentlech Totaler aus — <a href="${GC}" target="_blank" rel="noopener">Dashboard opmaachen →</a></div>
      <div class="stat" style="margin-top:8px"><span>Statistiken (pro Dag)</span><b><a href="traffic.html">opmaachen →</a></b></div>`;
  }
}

async function loadShorts(){
  try{
    // Admin-only table, not the old public data/factory.json (which exposed every
    // ShortsFactory account handle to anyone who fetched it).
    const {data:row,error}=await sb.from("dashboard_state").select("data").eq("id",1).maybeSingle();
    if(error)throw error;
    const d=row?.data;
    if(!d)throw new Error("no dashboard data");
    const vids=d.videos||d.published||[];
    const n=Array.isArray(vids)?vids.length:(d.count??d.total??"–");
    const followers=d.followers??d.subscribers;
    $("pSf").innerHTML=`${H("","ShortsFactory")}
      <div class="big">${n}</div><div class="sub">Videoe verëffentlecht</div>
      ${followers!=null?`<div class="stat" style="margin-top:8px"><span>Follower</span><b>${followers}</b></div>`:""}
      <div class="stat"><span>Ganzen Dashboard</span><b><a href="factory.html">opmaachen →</a></b></div>`;
  }catch(e){$("pSf").innerHTML=`${H("","ShortsFactory")}<div class="muted">Nach keng Daten.</div>`;}
}

async function loadFitness(){
  try{
    const weekAgo=new Date(Date.now()-7*86400000).toISOString();
    const {data}=await sb.from("workouts").select("duration_min,distance_km,type").gte("at",weekAgo);
    const mins=(data||[]).reduce((a,w)=>a+(w.duration_min||0),0);
    const km=(data||[]).reduce((a,w)=>a+(+w.distance_km||0),0);
    $("pFit").innerHTML=`${H("","Dës Woch")}
      <div class="stat"><span>Training</span><b>${(data||[]).length}</b></div>
      <div class="stat"><span>Aktiv Zäit</span><b>${Math.floor(mins/60)}h ${mins%60}m</b></div>
      <div class="stat"><span>Distanz</span><b>${km.toFixed(1)} km</b></div>
      <div class="stat"><span>Detailer</span><b><a href="health.html">opmaachen →</a></b></div>`;
  }catch(e){$("pFit").innerHTML=`${H("","Dës Woch")}<div class="muted"><a href="health.html">Astellen →</a></div>`;}
}

auth.onAuth(boot);
boot();
</script>
<script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
