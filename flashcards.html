<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaarten — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=26"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a,input,textarea,label{touch-action:manipulation}
  button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .ui{--warn:#ef5b6b}
  html[data-theme="light"] .ui{--warn:#c7283d}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  .header-right{flex-wrap:wrap;justify-content:flex-end}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;cursor:pointer;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- gate (loading / sign-in / empty / error) ---- */
  .gate{text-align:center;padding:clamp(30px,6vw,52px) 22px;color:var(--muted)}
  .gate .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .gate p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text)}
  .gate .gate-sub{margin-top:6px;font:500 14px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:0;color:var(--muted)}
  .gate .ui-btn{margin-top:18px}
  .gate.mini{padding:22px}

  .sect{margin:10px 2px 0;font:750 13px var(--font-display);letter-spacing:.04em;color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .row .grow{flex:1 1 12rem;min-width:0}
  .settings .msg{margin:0 0 0 auto}
  #lm:empty{min-height:0;margin:0}
  .msg{min-height:18px;margin-top:8px;color:var(--accent-text);font-weight:700;font-size:13px}
  .ui-btn.sm{min-height:44px;padding:9px 18px;font-size:15px}
  .ui-btn.warn{color:var(--warn)}
  .ui-btn.warn:hover{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

  /* ---- deck list ---- */
  .ui-tiles{margin-top:2px}
  .ui-tile.deck{width:100%;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation}
  .ui-tile.deck .ui-tile__name{overflow-wrap:anywhere}
  .ui-tile.deck .ui-tile__sub{-webkit-line-clamp:1}

  /* ---- study ---- */
  .studyhead{display:flex;align-items:center;gap:12px;padding:14px 18px}
  .studyhead .t{flex:1;min-width:0;font:800 clamp(17px,2.4vw,20px)/1.25 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
  .meter{height:6px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--text) 10%,transparent)}
  .meter i{display:block;height:100%;width:100%;border-radius:99px;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .35s var(--ease)}
  .flip{position:relative;isolation:isolate;perspective:1400px;height:clamp(260px,40vh,380px);margin:6px 0 22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flip::before,.flip::after{content:"";position:absolute;z-index:-1;height:100%;border-radius:var(--r-panel);background:var(--card-opaque);box-shadow:inset 0 0 0 1px var(--tile-edge)}
  .flip::before{left:14px;right:14px;top:10px;opacity:.8}
  .flip::after{left:28px;right:28px;top:20px;opacity:.5}
  .flip.single::before,.flip.single::after{display:none}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s var(--ease);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
  .inner.back{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;padding:clamp(40px,7vw,52px) clamp(20px,5vw,40px) clamp(34px,6vw,44px);text-align:center;overflow-y:auto;border-radius:var(--r-panel);background:color-mix(in srgb,var(--accent) 4%,var(--card-opaque));color:var(--text);font:750 clamp(21px,3.6vw,30px)/1.3 var(--font-display);letter-spacing:-.02em;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 13%,transparent),0 1px 2px rgb(var(--ink)/.05),0 24px 44px -26px rgb(var(--ink)/.5)}
  .face>span:not(.side){margin:auto;overflow-wrap:anywhere;white-space:pre-line}
  .face.b{transform:rotateY(180deg);font-weight:600;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--card-opaque)),color-mix(in srgb,var(--accent) 7%,var(--card-opaque)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 32%,transparent),0 24px 44px -26px rgb(var(--ink)/.5)}
  .face .side{position:absolute;top:14px;left:16px;padding:3px 11px;border-radius:99px;font:700 12px/1.5 var(--font-display);letter-spacing:.02em;color:var(--muted);background:color-mix(in srgb,var(--text) 8%,transparent)}
  .face.b .side{color:var(--text);background:color-mix(in srgb,var(--accent) 22%,transparent)}
  .nav{display:flex;align-items:center;gap:14px;justify-content:center}
  .nav .ui-btn{min-width:72px;min-height:52px;padding:8px 18px;font-size:22px;line-height:1}
  .prog{min-width:76px;text-align:center;font:750 15px var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .kbd{text-align:center;font-size:12px;color:var(--muted)}
  .kbd .k-key{display:none}
  @media (hover:hover){.kbd .k-key{display:inline}.kbd .k-touch{display:none}}

  /* ---- edit ---- */
  .switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--text);font-size:14.5px;cursor:pointer}
  .switch input{width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}
  .settings{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:8px;color:var(--muted);font-size:13.5px}
  #rows{display:flex;flex-direction:column;gap:10px}
  .crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-radius:var(--r-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge)}
  .crow textarea.ui-input{min-height:76px;border-radius:12px;padding:10px 14px}
  .crow.new{grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card-opaque)),color-mix(in srgb,var(--accent) 5%,var(--card-opaque)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent)}
  .crow.new .ui-btn{grid-column:1/-1}
  .del{display:grid;place-items:center;min-width:44px;min-height:44px;border:0;border-radius:var(--r-chip);background:transparent;color:var(--muted);font-size:17px;cursor:pointer;transition:background-color .2s,color .2s,transform .3s var(--ease)}
  .del:hover{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .del:active{transform:scale(.94)}

  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.ui .ui-header h1.ui-brand{font-size:18px}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
    .crow{grid-template-columns:minmax(0,1fr) auto;grid-auto-flow:row}
    .crow .cf{grid-column:1;grid-row:1}
    .crow .cb{grid-column:1;grid-row:2}
    .crow .del{grid-column:2;grid-row:1/3;align-self:center}
    .crow.new{grid-template-columns:minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){.inner,.meter i,.del{transition:none}*{scroll-behavior:auto!important}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <button type="button" class="home" id="back">‹ Zeréck</button>
    <h1 class="ui-brand"><span aria-hidden="true">🃏</span> Kaarten</h1>
  </div>
  <div class="header-right">
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page" id="wrap"><div class="gate ui-card" role="status">Lueden…</div></main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=22";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qs=new URLSearchParams(location.search);
let sb=null,me=null,myClass=null,deck=null,cards=[],idx=0,flipped=false,focusSel=null;
const HUES=["#6ea8fe","#ff6b9d","#3fb950","#a371f7","#ffb347","#4de8ff"];
const hueOf=(id)=>{let h=0;for(const ch of ""+id)h=(h*31+ch.charCodeAt(0))>>>0;return HUES[h%HUES.length];};
const gate=(ico,title,sub,extra)=>`<div class="gate ui-card"><div class="gate-ico" aria-hidden="true">${ico}</div><p>${title}</p>${sub?`<div class="gate-sub">${sub}</div>`:""}${extra||""}</div>`;

async function boot(){
  sb=await auth.client();
  auth.mountAccountButton($("acctHost"));
  $("back").onclick=()=>{ if(deck){deck=null;location.search="";} else history.length>1?history.back():location.href="index.html"; };
  if(!auth.session()){
    $("wrap").innerHTML=gate("🃏","Mell dech un, fir Kaarten ze léieren.","Deng Këschten sinn un däi Konto gebonnen.",`<button type="button" class="ui-btn ui-btn--primary" id="si">Umellen</button>`);
    $("si").onclick=auth.openAuthModal;return;
  }
  me=auth.session().user.id;
  try{const {data}=await sb.from("profiles").select("class").eq("id",me).maybeSingle();myClass=data?.class||null;}catch{}
  const deckId=qs.get("deck"), examId=qs.get("exam");
  if(deckId){ return openDeck(deckId); }
  if(examId){ return newDeckForExam(examId, qs.get("class")||myClass); }
  listView();
}

async function listView(){
  $("wrap").innerHTML=`<div class="gate ui-card mini" role="status">Lueden…</div>`;
  const {data:decks}=await sb.from("flashcard_decks").select("id,title,owner,shared,class,exam_id,created_at").order("created_at",{ascending:false});
  const counts={};
  const {data:cc}=await sb.from("flashcards").select("deck_id");
  for(const c of cc||[])counts[c.deck_id]=(counts[c.deck_id]||0)+1;
  const mine=(decks||[]).filter(d=>d.owner===me);
  const shared=(decks||[]).filter(d=>d.owner!==me);
  const row=(d)=>{const n=counts[d.id]||0;
    return `<button type="button" class="ui-tile deck" data-open="${d.id}" style="--h:${hueOf(d.id)}">
      <span class="ui-tile__ico" aria-hidden="true">🃏</span>
      <span class="ui-tile__name">${esc(d.title)}</span>
      <span class="ui-tile__sub">${n===1?"1 Kaart":n+" Kaarten"}${d.shared?" · 👥 gedeelt":""}${d.class?" · "+esc(d.class):""}</span></button>`;};
  $("wrap").innerHTML=`
    <div class="ui-card ui-card--accent">
      <div class="row">
        <input class="ui-input grow" id="newTitle" placeholder="Nei Këscht (z.B. Vokabelen Englesch)" aria-label="Numm vun der neier Këscht" maxlength="80">
        <button type="button" class="ui-btn ui-btn--primary" id="newBtn">Uleeën</button>
      </div>
      <div class="msg" id="lm" role="status" aria-live="polite"></div>
    </div>
    <h2 class="sect">Meng Këschten</h2>
    ${mine.length?`<div class="ui-tiles">${mine.map(row).join("")}</div>`:gate("✨","Nach keng Këscht","Gëff uewen en Numm an a leet deng éischt un.")}
    ${shared.length?`<h2 class="sect">Klass-Këschten</h2><div class="ui-tiles">${shared.map(row).join("")}</div>`:""}`;
  $("newBtn").onclick=async()=>{
    const t=$("newTitle").value.trim();
    if(!t){return;}
    const {data,error}=await sb.from("flashcard_decks").insert({title:t,class:myClass}).select("id").single();
    if(error){$("lm").textContent="Feeler (Migratioun gelaf?).";return;}
    openDeck(data.id);
  };
  $("newTitle").onkeydown=(e)=>{if(e.key==="Enter"){e.preventDefault();$("newBtn").click();}};
  $("wrap").querySelectorAll("[data-open]").forEach(el=>{el.onclick=()=>openDeck(el.dataset.open);});
}

async function newDeckForExam(examId,cls){
  const {data,error}=await sb.from("flashcard_decks").insert({title:"Nei Këscht",class:cls||myClass,exam_id:examId,shared:true}).select("id").single();
  if(error){$("wrap").innerHTML=gate("⚠️","Feeler beim Uleeën","Migratioun gelaf?");return;}
  history.replaceState(null,"","flashcards.html?deck="+data.id);
  openDeck(data.id,true);
}

async function openDeck(id,edit){
  const {data:d}=await sb.from("flashcard_decks").select("*").eq("id",id).maybeSingle();
  if(!d){$("wrap").innerHTML=gate("🔍","Këscht net fonnt.","","");return;}
  deck=d;
  const {data:cs}=await sb.from("flashcards").select("*").eq("deck_id",id).order("pos").order("id");
  cards=cs||[];idx=0;flipped=false;
  (edit||!cards.length)?editView():studyView();
}

/* ---------- study ---------- */
function studyView(){
  const mine=deck.owner===me;
  $("wrap").innerHTML=`
    <div class="ui-card studyhead">
      <div class="t">${esc(deck.title)}</div>
      ${mine?`<button type="button" class="ui-btn ui-btn--ghost sm" id="editBtn"><span aria-hidden="true">✏️</span>&nbsp;Änneren</button>`:""}
    </div>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="flip" id="flip" role="button" tabindex="0"><div class="inner" id="inner" aria-hidden="true">
      <div class="face"><span class="side">Fro</span><span id="front"></span></div>
      <div class="face b"><span class="side">Äntwert</span><span id="back2"></span></div>
    </div></div>
    <div class="sr" id="fcLive" role="status" aria-live="polite"></div>
    <div class="nav">
      <button type="button" class="ui-btn ui-btn--ghost" id="prev" aria-label="Viregt Kaart">‹</button>
      <div class="prog" id="prog"></div>
      <button type="button" class="ui-btn ui-btn--ghost" id="next" aria-label="Nächst Kaart">›</button>
    </div>
    <div class="tools">
      <button type="button" class="ui-btn ui-btn--ghost sm" id="shuf"><span aria-hidden="true">🔀</span>&nbsp;Mëschen</button>
      ${deck.owner===me?`<button type="button" class="ui-btn ui-btn--ghost sm" id="shareBtn"></button>`:""}
    </div>
    <div class="kbd"><span class="k-touch">Tipp op d'Kaart fir ëmzedréinen</span><span class="k-key">← → blädderen · Espace ëmdréinen</span></div>`;
  $("flip").onclick=()=>{flipped=!flipped;$("inner").classList.toggle("back",flipped);labelFlip();announce(flipped?"Äntwert: "+cards[idx].back:"Fro: "+cards[idx].front);};
  $("flip").onkeydown=(e)=>{if(e.key==="Enter"){e.preventDefault();$("flip").click();}};
  $("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
  $("shuf").onclick=()=>{for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;flipped=false;paint();};
  if($("editBtn"))$("editBtn").onclick=editView;
  if($("shareBtn")){const upd=()=>$("shareBtn").textContent=deck.shared?"👥 Gedeelt mat der Klass":"🔒 Just fir mech";upd();
    $("shareBtn").onclick=async()=>{deck.shared=!deck.shared;await sb.from("flashcard_decks").update({shared:deck.shared}).eq("id",deck.id);upd();};}
  document.onkeydown=(e)=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);else if(e.key===" "){if(e.target.closest&&e.target.closest("button,a,input,textarea,select"))return;e.preventDefault();$("flip").click();}};
  paint();
}
function go(d){ if(!cards.length)return; idx=(idx+d+cards.length)%cards.length; flipped=false; $("inner").classList.remove("back"); paint(); announce((idx+1)+" / "+cards.length+". Fro: "+cards[idx].front); }
function announce(t){const l=$("fcLive");if(l)l.textContent=t;}
function labelFlip(){const f=$("flip");if(!f||!cards.length)return;const c=cards[idx];f.setAttribute("aria-label",flipped?"Äntwert: "+c.back+". Ëmdréinen fir d'Fro ze gesinn":"Fro: "+c.front+". Ëmdréinen fir d'Äntwert ze gesinn");}
function paint(){
  if(!cards.length)return;
  const c=cards[idx];
  $("front").textContent=c.front;$("back2").textContent=c.back;
  $("prog").textContent=(idx+1)+" / "+cards.length;
  $("bar").style.transform="scaleX("+(idx+1)/cards.length+")";
  $("flip").classList.toggle("single",cards.length<2);
  $("inner").classList.toggle("back",flipped);
  labelFlip();
}

/* ---------- edit ---------- */
function editView(){
  document.onkeydown=null;
  const rows=cards.map(c=>`<div class="crow" data-id="${c.id}">
      <textarea class="cf ui-input" rows="2" placeholder="Fro" aria-label="Fro">${esc(c.front)}</textarea>
      <textarea class="cb ui-input" rows="2" placeholder="Äntwert" aria-label="Äntwert">${esc(c.back)}</textarea>
      <button type="button" class="del" data-del="${c.id}" title="Läschen" aria-label="Kaart läschen"><span aria-hidden="true">✕</span></button>
    </div>`).join("");
  $("wrap").innerHTML=`
    <div class="ui-card">
      <input class="ui-input" id="dTitle" value="${esc(deck.title)}" maxlength="80" aria-label="Titel vun der Këscht">
      <div class="settings">
        <label class="switch"><input type="checkbox" id="dShare" ${deck.shared?"checked":""}> Mat der Klass deelen</label>
        ${deck.exam_id?`<span>· un en Test gebonnen</span>`:""}
        <div class="msg" id="em" role="status" aria-live="polite"></div>
      </div>
    </div>
    <h2 class="sect">Kaarten</h2>
    <div id="rows">${rows||""}</div>
    <div class="crow new">
      <textarea class="nf ui-input" rows="2" placeholder="Nei Fro" aria-label="Nei Fro"></textarea>
      <textarea class="nb ui-input" rows="2" placeholder="Nei Äntwert" aria-label="Nei Äntwert"></textarea>
      <button type="button" class="ui-btn ui-btn--primary" id="addCard"><span aria-hidden="true">＋</span>&nbsp;Kaart bäisetzen</button>
    </div>
    <div class="tools" style="justify-content:flex-start">
      ${cards.length?`<button type="button" class="ui-btn ui-btn--primary sm" id="study"><span aria-hidden="true">▶︎</span>&nbsp;Léieren</button>`:""}
      <button type="button" class="ui-btn ui-btn--ghost warn sm" id="delDeck">Këscht läschen</button>
    </div>`;
  $("dTitle").onchange=()=>saveDeck();
  $("dShare").onchange=()=>saveDeck();
  $("rows").querySelectorAll(".crow").forEach(r=>{
    const id=r.dataset.id;
    r.querySelector(".cf").onchange=()=>saveCard(id,r);
    r.querySelector(".cb").onchange=()=>saveCard(id,r);
    r.querySelector("[data-del]").onclick=async()=>{
      const {error}=await sb.from("flashcards").delete().eq("id",id);
      if(error){console.warn("[cards] card delete",error);setEm("Net geläscht.",true);return;}
      focusSel="#dTitle";openDeck(deck.id,true);};
  });
  const grow=(t)=>{t.style.height="auto";t.style.height=Math.max(t.scrollHeight+2,76)+"px";};
  $("wrap").querySelectorAll(".crow textarea").forEach(t=>{grow(t);t.addEventListener("input",()=>grow(t));});
  $("addCard").onclick=addCard;
  if($("study"))$("study").onclick=()=>{idx=0;flipped=false;studyView();};
  $("delDeck").onclick=async()=>{
    if(!confirm("Ganz Këscht läschen?"))return;
    const {error}=await sb.from("flashcard_decks").delete().eq("id",deck.id);
    if(error){console.warn("[cards] deck delete",error);setEm("Net geläscht.",true);return;}
    deck=null;location.href="flashcards.html";};
  if(focusSel){const el=$("wrap").querySelector(focusSel);focusSel=null;if(el)el.focus({preventScroll:true});}
}
// Supabase reports failure in {error}; it does not throw. Acknowledging a save
// without reading that told the user their work was safe when it was not.
async function saveDeck(){
  const title=$("dTitle").value.trim()||deck.title,shared=$("dShare").checked;
  const {error}=await sb.from("flashcard_decks").update({title,shared}).eq("id",deck.id);
  if(error){console.warn("[cards] deck save",error);setEm("Net gespäichert — nach eng Kéier probéieren.",true);return;}
  deck.title=title;deck.shared=shared;
  setEm("Gespäichert ✓");
}
async function saveCard(id,r){
  const front=r.querySelector(".cf").value.trim(),back=r.querySelector(".cb").value.trim();
  const {error}=await sb.from("flashcards").update({front,back}).eq("id",id);
  // Only mirror into memory once the write actually landed, or a failed save
  // stays convincing until the next reload.
  if(error){console.warn("[cards] card save",error);setEm("Net gespäichert — nach eng Kéier probéieren.",true);return;}
  const c=cards.find(x=>x.id===id);if(c){c.front=front;c.back=back;}
  setEm("Gespäichert ✓");
}
async function addCard(){
  const nf=$("wrap").querySelector(".nf"),nb=$("wrap").querySelector(".nb");
  const front=nf.value.trim(),back=nb.value.trim();
  if(!front&&!back)return;
  const pos=(cards.reduce((m,c)=>Math.max(m,c.pos||0),0))+1;
  const {error}=await sb.from("flashcards").insert({deck_id:deck.id,front,back,pos});
  if(error){setEm("Feeler.",true);return;}
  focusSel=".nf";openDeck(deck.id,true);
}
function setEm(t,err){const m=$("em");if(!m)return;m.textContent=t;m.style.color=err?"var(--warn)":"";if(!err)setTimeout(()=>{if(m)m.textContent="";},1200);}

auth.onAuth(boot);
boot();
</script>
