<script type="module">
import * as auth from "./auth.js?v=40";
import { loadTags, eventBadgesHtml } from "./leaderboard-tags.js?v=13";
import { scoreHtml, scoreKeyHtml, arcadeText } from "./score-format.js?v=11";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AVATARS=["😀","😎","🤖","👾","🐱","🐶","🦊","🐸","🐼","🦁","🐯","🐵",
               "🦄","🐙","🐢","🦖","🐬","🦅","⚡","🔥","🌟","🍕","🎮","🏎️"];
const BUCKET="avatars", AV_PX=256;
const isUrl=(v)=>/^https?:\/\//.test(v||"");
const avInner=(v)=>v?(isUrl(v)?`<img src="${esc(v)}" alt="" width="64" height="64">`:`<span aria-hidden="true">${esc(v)}</span>`):'<span aria-hidden="true">–</span>';
let sb=null,myAvatar=null,myClass=null;
// same specific-class rule as class-gate.js
const normClass=(r)=>(""+(r??"")).trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
const YEAR_ONLY=/^\d{1,2}(E|È|EME|ÈME|IEME|IÈME)?$/;
const CLASS_SHAPE=/^\d{1,2}[A-Z]{1,4}\d{0,2}$/;
const validClass=(r)=>{const v=normClass(r);return CLASS_SHAPE.test(v)&&!YEAR_ONLY.test(v);};
const validName=(n)=>/^[A-Za-z0-9_]{3,20}$/.test((n||"").trim());
const qs=new URLSearchParams(location.search);

// Header button: "Umellen" for visitors, the username once signed in (opens the same account dialog as the homepage).
function mountAcct(){
  const b=$("gtAcct");if(!b)return;
  b.textContent=auth.session()?(auth.username()||"Kont"):"Umellen";
  b.onclick=auth.openAuthModal;
}

// Cosmetic badges derived from stats (server wins/losses + local wordle best).
function achievements(s){
  const A=[];
  const add=(cond,html)=>{if(cond)A.push(`<span class="ach">${html}</span>`);};
  add(s.wins>=1,"Éischte Gewënn");
  add(s.wins>=10,"10 Gewënn");
  add(s.wins>=50,"50 Gewënn");
  add((s.total||0)>=100,"100 Spiller");
  add(s.pct!=null&&s.pct>=60&&(s.total||0)>=10,"60%+ Gewënnrate");
  add((s.wordleMax||0)>=5,`Wordle-Serie ${s.wordleMax}`);
  return A.length?A.join(""):'<span class="ach-none">Nach keng Badgen. Spill e puer Spiller!</span>';
}

const gateHtml=(msg,extra="")=>`<div class="c full gt-gate"><p class="gt-big">${msg}</p>${extra}</div>`;

// Read-only view of another player: profile.html?u=<username>.
async function renderPublic(username){
  // Signed-out visitors may only read id/username/avatar (school class is for signed-in accounts).
  const cols=auth.session()?"id,avatar,class,username":"id,avatar,username";
  const {data:p}=await sb.from("profiles").select(cols).ilike("username",username).maybeSingle();
  if(!p){$("wrap").innerHTML=gateHtml(`Kee Spiller mam Numm „${esc(username)}“.`,`<a class="gt-btn ghost" href="profile.html">‹ Däi Profil</a>`);return;}
  let isAdmin=false;
  try{const {data}=await sb.rpc("admin_user_ids");isAdmin=(data||[]).some(r=>r.user_id===p.id);}catch{}
  const tags=(p.class?`<span class="gt-tag">${esc(p.class)}</span>`:"")+(isAdmin?`<span class="gt-tag ink">Admin</span>`:"");
  let stats={wins:0,losses:0,total:0,pct:null};
  try{const {data}=await sb.rpc("game_leaderboard",{p_game:null});const m=(data||[]).find(r=>r.username===p.username);if(m)stats={wins:m.wins,losses:m.losses,total:m.total,pct:m.winpct};}catch{}
  $("wrap").innerHTML=`
    <div class="c full gt-me">
      <div class="big">${avInner(p.avatar)}</div>
      <div class="who"><div class="name">${esc(p.username)}</div><div class="gt-sub">ian.lu Spiller</div><div class="gt-tags">${tags}</div></div>
    </div>
    <div class="c full gt-lbl">Statistiken</div>
    <div class="gt-stats three">
      <div class="c"><b>${scoreHtml(stats.wins)}</b><span>Gewonne Matcher</span></div>
      <div class="c"><b>${scoreHtml(stats.losses)}</b><span>Néierlagen</span></div>
      <div class="c"><b>${stats.pct==null?"—":stats.pct+"%"}</b><span>Gewënnrate</span></div>
    </div>
    <div class="c full top">${scoreKeyHtml([stats.wins,stats.losses])}<p class="gt-hint" id="arcadeStreak" role="status"></p></div>
    <div class="c full gt-lbl">Badgen</div>
    <div class="c full ach-card">${achievements(stats)}<span id="eventBadges"></span></div>
    <div class="c full top"><a class="gt-btn ghost" href="profile.html" style="align-self:flex-start">‹ Däi Profil</a></div>`;
  await loadProfileStreak(p.id);
}

// Fit the WHOLE image into a small square JPEG (any aspect ratio, nothing cropped).
// The square is filled with a soft blurred copy of the photo so there are no
// solid letterbox bars, then the full image is drawn on top, centred.
function squareResize(file,size){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=size;c.height=size;
      const ctx=c.getContext("2d");
      // blurred cover background (fills the whole square, may crop — that's fine)
      const cov=Math.max(size/img.width,size/img.height);
      const cw=img.width*cov,ch=img.height*cov;
      ctx.filter="blur(14px)";
      ctx.drawImage(img,(size-cw)/2,(size-ch)/2,cw,ch);
      ctx.filter="none";
      // full image, contained (whole photo visible, nothing cut off)
      const con=Math.min(size/img.width,size/img.height);
      const iw=img.width*con,ih=img.height*con;
      ctx.drawImage(img,(size-iw)/2,(size-ih)/2,iw,ih);
      c.toBlob(b=>b?res(b):rej(new Error("D'Bild konnt net veraarbecht ginn")),"image/jpeg",0.85);
    };
    img.onerror=()=>rej(new Error("Dat ass keng liesbar Bilddatei"));
    img.src=URL.createObjectURL(file);
  });
}

async function boot(){
  sb=await auth.client();
  mountAcct();
  const viewU=qs.get("u");
  if(viewU && viewU.toLowerCase()!==(auth.username()||"").toLowerCase()){ return renderPublic(viewU); }
  if(!auth.session()){
    $("wrap").innerHTML=gateHtml("Mell dech un, fir däi Profil ze gesinn.",`<button type="button" class="gt-btn" id="signin">Umellen</button>`);
    $("signin").onclick=auth.openAuthModal;
    return;
  }
  const uname=auth.username();
  const uid=auth.session().user.id;
  try{const {data}=await sb.from("profiles").select("avatar, class").eq("id",uid).single();myAvatar=data?.avatar||null;myClass=data?.class||null;}catch{}
  let isAdmin=false;
  try{const {data}=await sb.rpc("admin_user_ids");isAdmin=(data||[]).some(r=>r.user_id===uid);}catch{}
  const tagsHtml=
    (myClass?`<span class="gt-tag cls">${esc(myClass)}</span>`:"")+
    (isAdmin?`<span class="gt-tag ink">Admin</span>`:"");
  $("wrap").innerHTML=`
    <div class="c full gt-me">
      <div class="big" id="bigAv">${avInner(myAvatar)}</div>
      <div class="who"><div class="name" id="dispName">${esc(uname)}</div><div class="gt-sub">ian.lu Spiller</div>
        <div class="gt-tags" id="tags">${tagsHtml}</div></div>
    </div>
    <div class="c half gt-form">
      <h2 class="gt-h">Benotzernumm</h2>
      <div class="gt-field">
        <input class="gt-input" id="nameInp" maxlength="20" value="${esc(uname)}" placeholder="däin Numm" aria-label="Benotzernumm" aria-describedby="nameHint" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" class="gt-btn" id="nameSave">Späicheren</button>
      </div>
      <div class="gt-hint" id="nameHint">3–20 Zeechen: Buchstaben, Zuelen an Underscore. Muss eenzegaarteg sinn.</div>
      <div class="gt-msg" id="nameMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="c half gt-form">
      <h2 class="gt-h">Klass</h2>
      <div class="gt-field">
        <input class="gt-input" id="classInp" maxlength="12" value="${esc(myClass||"")}" placeholder="z.B. 5C6" aria-label="Klass" aria-describedby="classHint" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="gt-btn" id="classSave">Späicheren</button>
      </div>
      <div class="gt-hint" id="classHint">Eng genau Klass mat Joer (5C6, 7C1, 2CG), net just d'Joer. Esou fanne Frënn dech méi einfach.</div>
      <div class="gt-msg" id="classMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="c half gt-form">
      <h2 class="gt-h">Profilbild</h2>
      <div class="upl">
        <button type="button" class="gt-btn" id="uplBtn">Foto eroplueden</button>
        <button type="button" class="gt-btn ghost" id="rmBtn"${isUrl(myAvatar)?"":" hidden"}>Foto ewechhuelen</button>
        <input type="file" id="uplFile" accept="image/*" hidden aria-label="Wiel e Foto">
      </div>
      <div class="gt-hint">All Bild geet. Dat ganzt Foto gëtt behalen a kleng gespäichert (256 px). Oder wiel en Emoji.</div>
      <div class="gt-msg" id="uplMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="c half gt-form">
      <h2 class="gt-h">Kont</h2>
      <div class="upl">
        <button type="button" class="gt-btn ghost" id="pinChange">PIN änneren</button>
        <button type="button" class="gt-btn ghost" id="acctMerge">Konten zesummeleeën</button>
      </div>
      <div class="gt-hint">Benotz 4 oder 6 Zifferen fir de PIN. Sechs si recommandéiert.</div>
      <div class="gt-msg" id="acctMergeMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="c full gt-form">
      <h2 class="gt-h">Oder wiel en Emoji</h2>
      <div class="grid" id="avGrid" role="group" aria-label="Emoji-Avatarer"></div>
      <div class="gt-msg" id="avMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="c full gt-lbl">Deng Statistiken</div>
    <div class="gt-stats" id="stats"><div class="c gt-loading" role="status"><span>Lued …</span></div></div>
    <div class="c full top"><p class="gt-hint" id="arcadeStreak" role="status"></p></div>
    <div class="c full gt-lbl">Badgen</div>
    <div class="c full ach-card" id="ach"><span class="gt-sub" role="status">Lued …</span></div>
    <div class="c full share"><div class="gt-hint">Däi ëffentleche Profil: <a id="shareLink" href="profile.html?u=${encodeURIComponent(uname)}">ian.lu/profile.html?u=${esc(uname)}</a></div></div>`;
  wireUpload();
  wireName();
  wireClass();
  $("pinChange").onclick=auth.openPinSetup;
  $("acctMerge").onclick=openMerge;
  const grid=$("avGrid");
  for(const a of AVATARS){
    const b=document.createElement("button");
    b.type="button";b.className="avb"+(a===myAvatar?" on":"");b.textContent=a;b.setAttribute("aria-pressed",String(a===myAvatar));
    b.onclick=async()=>{
      try{
        const {error}=await sb.rpc("set_avatar",{p_avatar:a});
        if(error)throw error;
        myAvatar=a;$("bigAv").innerHTML=avInner(a);$("rmBtn").hidden=true;
        grid.querySelectorAll(".avb").forEach(x=>{const on=x.textContent===a;x.classList.toggle("on",on);x.setAttribute("aria-pressed",String(on));});
        $("avMsg").classList.remove("err");$("avMsg").textContent="Gespäichert ✓";setTimeout(()=>$("avMsg").textContent="",1200);
      }catch(e){console.warn(e);$("avMsg").textContent="Konnt net späicheren.";$("avMsg").classList.add("err");}
    };
    grid.appendChild(b);
  }
  loadStats(uname);
  loadProfileStreak(uid);
}

// Lazy: the account-check card (and its people search) only loads when asked for.
async function openMerge(){
  try{
    const m=await import("./account-check.js?v=16");
    await m.openAccountCheck({startWithMerge:true});
  }catch(e){
    console.error("account merge dialog failed to open",e);
    setMsg("acctMergeMsg","Konnt dat net opmaachen. Probéier nach eng Kéier.",true);
  }
}

function setMsg(id,t,err){
  const m=$(id);if(!m)return;
  m.textContent=t;m.classList.toggle("err",!!err);
  if(t&&!err&&/✓/.test(t))setTimeout(()=>{if($(id))$(id).textContent="";},1600);
}

function wireName(){
  const inp=$("nameInp"),btn=$("nameSave");
  const run=async()=>{
    const v=inp.value.trim();
    if(!validName(v)){setMsg("nameMsg","3–20 Buchstaben, Zuelen oder Underscore.",true);return;}
    if(v===auth.username()){setMsg("nameMsg","Dat ass schonn däin Numm.");return;}
    btn.disabled=true;setMsg("nameMsg","Gëtt gespäichert …");
    try{
      const {data,error}=await sb.rpc("set_username",{p_name:v});
      if(error)throw error;
      if(!data){setMsg("nameMsg","Dësen Numm ass besat. Probéier en aneren.",true);btn.disabled=false;return;}
      // keep the JWT metadata in sync so auth.username() (account button, etc.) matches
      try{await sb.auth.updateUser({data:{username:data}});}catch(e){console.warn("meta sync",e);}
      $("dispName").textContent=data;inp.value=data;
      mountAcct();
      setMsg("nameMsg","Gespäichert ✓");
    }catch(e){console.warn(e);setMsg("nameMsg","Konnt net späicheren.",true);}
    btn.disabled=false;
  };
  btn.onclick=run;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();run();}});
}

function wireClass(){
  const inp=$("classInp"),btn=$("classSave");
  const run=async()=>{
    const raw=inp.value.trim();
    if(!raw){setMsg("classMsg","Gëff eng Klass an, z.B. 5C6.",true);return;}
    if(!validClass(raw)){setMsg("classMsg","Eng genau Klass, z.B. 5C6, net just d'Joer.",true);return;}
    const v=normClass(raw);
    btn.disabled=true;setMsg("classMsg","Gëtt gespäichert …");
    try{
      const {error}=await sb.rpc("set_class",{p_class:v});
      if(error)throw error;
      myClass=v;inp.value=v;
      // reflect the class tag next to the name without a reload
      const tags=$("tags"),ex=tags.querySelector(".cls");
      if(ex)ex.textContent=v;
      else tags.insertAdjacentHTML("afterbegin",`<span class="gt-tag cls">${esc(v)}</span>`);
      setMsg("classMsg","Gespäichert ✓");
    }catch(e){console.warn(e);setMsg("classMsg","Konnt deng Klass net späicheren.",true);}
    btn.disabled=false;
  };
  btn.onclick=run;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();run();}});
}

function setUpl(t,err){
  const m=$("uplMsg");if(!m)return;
  m.textContent=t;m.classList.toggle("err",!!err);
  if(t&&!err&&/✓/.test(t))setTimeout(()=>{if($("uplMsg"))$("uplMsg").textContent="";},1600);
}

function wireUpload(){
  $("uplBtn").onclick=()=>$("uplFile").click();
  $("uplFile").onchange=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";                 // allow re-picking the same file later
    if(!file)return;
    if(!/^image\//.test(file.type)){setUpl("Wiel w.e.g. eng Bilddatei.",true);return;}
    setUpl("Gëtt veraarbecht …");
    try{
      const blob=await squareResize(file,AV_PX);
      const uid=auth.session().user.id;
      const path=`${uid}/avatar.jpg`;
      const {error:upErr}=await sb.storage.from(BUCKET)
        .upload(path,blob,{upsert:true,contentType:"image/jpeg",cacheControl:"3600"});
      if(upErr)throw upErr;
      const url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl+"?v="+Date.now();
      const {error}=await sb.rpc("set_avatar",{p_avatar:url});
      if(error)throw error;
      myAvatar=url;
      $("bigAv").innerHTML=avInner(url);
      $("avGrid").querySelectorAll(".avb").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-pressed","false");});
      $("rmBtn").hidden=false;
      setUpl("Gespäichert ✓");
    }catch(err){console.warn(err);setUpl(err.message||"Eroplueden huet net geklappt.",true);}
  };
  $("rmBtn").onclick=async()=>{
    setUpl("Gëtt ewechgeholl …");
    try{
      const {error}=await sb.rpc("set_avatar",{p_avatar:""});
      if(error)throw error;
      try{await sb.storage.from(BUCKET).remove([`${auth.session().user.id}/avatar.jpg`]);}catch{}
      myAvatar=null;
      $("bigAv").innerHTML=avInner(null);
      $("rmBtn").hidden=true;
      setUpl("Ewechgeholl ✓");
    }catch(err){console.warn(err);setUpl("Konnt d'Foto net ewechhuelen.",true);}
  };
}

async function loadStats(uname){
  let wins=0,losses=0,pct=null,total=0;
  try{
    const {data}=await sb.rpc("game_leaderboard",{p_game:null});
    const me=(data||[]).find(r=>r.username===uname);
    if(me){wins=me.wins;losses=me.losses;pct=me.winpct;total=me.total;}
  }catch(e){console.warn(e);}
  const w=(l)=>JSON.parse(localStorage.getItem("wordleStats_"+l)||"null")||{played:0,wins:0,streak:0,max:0};
  const lb=w("lb"),de=w("de");
  const wordleMax=Math.max(lb.max,de.max);
  $("stats").innerHTML=`
    <div class="c"><b>${scoreHtml(wins)}</b><span>Gewonne Matcher</span></div>
    <div class="c"><b>${scoreHtml(losses)}</b><span>Néierlagen</span></div>
    <div class="c"><b>${pct==null?"—":pct+"%"}</b><span>Gewënnrate</span></div>
    <div class="c"><b>${scoreHtml(lb.wins+de.wins)}/${scoreHtml(lb.played+de.played)}</b><span>Wordle gewonnen</span></div>
    <div class="c"><b>${scoreHtml(wordleMax)}</b><span>Längste Serie</span></div>`;
  $("stats").insertAdjacentHTML("afterend", scoreKeyHtml([wins,losses,lb.wins+de.wins,lb.played+de.played,wordleMax]));
  if($("ach"))$("ach").innerHTML=achievements({wins,losses,pct,total,wordleMax})+'<span id="eventBadges"></span>';
  paintProfileBadges();
}

let viewedStreak = null;
let viewedBadges = [];
function paintProfileBadges(){
  const node=$("eventBadges");
  if(!node)return;
  node.innerHTML=eventBadgesHtml(viewedBadges,"ach",true);
  if(viewedBadges.length)node.parentElement.querySelector(".ach-none")?.remove();
}
function paintProfileStreak(){
  const node=$("arcadeStreak");
  if(node && viewedStreak) node.textContent=arcadeText("arc.streakProfile",{n:viewedStreak.streak});
}
async function loadProfileStreak(uid){
  viewedStreak=null;
  viewedBadges=[];
  if(!auth.session() || auth.isKartAccount()) return;
  try{
    const tags=await loadTags(sb);
    const row=tags.byUserId[uid];
    if(!row){
      if($("arcadeStreak"))$("arcadeStreak").textContent=arcadeText("arc.streakError");
      return;
    }
    viewedStreak={streak:row.streak};
    viewedBadges=row.badges;
    paintProfileBadges();
    paintProfileStreak();
  }catch(error){
    console.warn("[profile] arcade streak unavailable",error);
    if($("arcadeStreak"))$("arcadeStreak").textContent=arcadeText("arc.streakError");
  }
}
document.addEventListener("i18n:change",paintProfileStreak);
auth.onAuth(boot);
boot();
</script>
