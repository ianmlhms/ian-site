<style>
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .gt-page{padding-bottom:max(56px,calc(40px + env(safe-area-inset-bottom)))}

  /* ---- filters ---- */
  .filters{display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
  .lbchips{display:flex;flex-wrap:wrap;gap:8px}
  .lbchip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 14px "Geist",system-ui,sans-serif;cursor:pointer}
  .lbchip:hover{border-color:var(--green);color:var(--green);background:var(--white)}
  .lbchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .periods{display:inline-flex;align-self:flex-start;gap:8px;flex-wrap:wrap}

  /* ---- board ---- */
  .board-c{padding:0 !important;justify-content:flex-start}
  .board{background:none}
  .board-sum{display:flex;align-items:center;gap:8px;margin:0;padding:14px 20px;color:var(--muted);font:600 14px "Geist",system-ui,sans-serif;border-bottom:1px solid var(--soft)}
  .board-sum .dot{width:8px;height:8px;background:var(--green)}
  table.lb{width:100%;border-collapse:collapse;font-size:15px}
  table.lb.tagged{table-layout:fixed}
  .lb th{padding:10px 14px;color:var(--muted);font:600 13px "Geist",system-ui,sans-serif;text-align:left;border-bottom:1px solid var(--ink)}
  .lb td{padding:12px 14px;vertical-align:middle;border-bottom:1px solid var(--soft)}
  .lb tr:last-child td{border-bottom:0}
  .lb .n{text-align:right;font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .lb th.n{font-family:"Geist",system-ui,sans-serif}
  .lb.tagged .n{width:56px}
  .lb td.n{font-weight:500}
  .lb .rank{width:56px;text-align:center;font:500 15px "Geist Mono",ui-monospace,monospace;color:var(--muted)}
  .lb .rank .medal{font:500 15px "Geist Mono",ui-monospace,monospace;color:var(--ink)}
  .lb .who{min-width:0;overflow-wrap:anywhere;font-weight:600}
  .lb .who .name{display:block;line-height:1.25}
  .lb .who .meter{display:block;height:4px;margin-top:6px;background:var(--soft);overflow:hidden}
  .lb .who .meter i{display:block;height:100%;background:var(--green)}
  .lb .pct{color:var(--green);font-weight:500;white-space:nowrap}
  .lb tr.top1 td{background:var(--tint)}
  .lb tr.top1 .rank .medal{color:var(--green)}
  .lb tr.top1 .who .name{font-weight:800;font-size:16px}

  /* ---- empty / loading / error ---- */
  .lbempty{text-align:center;color:var(--muted);padding:clamp(28px,6vw,48px) 22px}
  .lbempty .lbempty-ico{display:none}
  .lbempty p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink)}
  .lbempty .lbempty-sub{margin-top:6px;font:400 14px/1.4 "Geist",system-ui,sans-serif;color:var(--muted)}
  .lbnote{padding:12px 20px !important;color:var(--muted);font-size:13.5px;line-height:1.5}

  @media(max-width:700px){
    .lbchip{padding:8px 13px;font-size:13.5px}
    .lb{font-size:14px}
    .lb th,.lb td{padding-left:7px;padding-right:7px}
    .lb .rank{width:40px}
    .lb.tagged .n{width:44px}
    .gt-nav{padding-inline:14px !important}
  }
</style>

<script type="module">
import * as auth from "./auth.js?v=40";
import { loadTags, tagsHtml } from "./leaderboard-tags.js?v=13";
import { scoreHtml, scoreKeyHtml, arcadeText } from "./score-format.js?v=11";
import { loadWeekly, installWeeklyUi, weeklyHeadingHtml, weeklyRowsHtml } from "./arcade-weekly.js?v=11";
installWeeklyUi();
const $ = (id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T={
  title:{lb:"Ranglëscht",de:"Bestenliste",en:"Leaderboard"},
  all:{lb:"All Spiller",de:"Alle Spiele",en:"All games"},
  game:{lb:"Spill",de:"Spiel",en:"Game"},
  period:{lb:"Zäitraum",de:"Zeitraum",en:"Period"},
  pAll:{lb:"All Zäit",de:"Gesamt",en:"All-time"},
  pWeek:{lb:"Dës Woch",de:"Diese Woche",en:"This week"},
  note:{lb:"Nëmmen Partien, déi du ugemellt gespillt hues, zielen. Sieg an Néierlag mellt de Spiller selwer.",de:"Nur Partien zählen, die du angemeldet gespielt hast. Sieg und Niederlage meldet jeder Spieler selbst.",en:"Only games played while signed in count. Win/loss is self-reported per player."},
  "g.color":{lb:"Faarf roden",de:"Farbe raten",en:"Colour Guess"},
  "g.maumau":{lb:"Mau-Mau",de:"Mau-Mau",en:"Mau-Mau Cards"},
  "g.dots":{lb:"Punkten a Këschten",de:"Käsekästchen",en:"Dots & Boxes"},
  "g.connect4":{lb:"Véier gewënnt",de:"Vier gewinnt",en:"Connect 4"},
  "g.battleship":{lb:"Schëffer versenken",de:"Schiffe versenken",en:"Battleship"},
  "g.tictactoe":{lb:"Dräi an enger Rei",de:"Drei gewinnt",en:"Tic-Tac-Toe"},
  "g.checkers":{lb:"Dammspill",de:"Dame",en:"Checkers"},
  loading:{lb:"Lueden…",de:"Lädt…",en:"Loading…"},
  emptyT:{lb:"Nach keng Partien.",de:"Noch keine Partien.",en:"No games yet."},
  emptyS:{lb:"Spill eng Partie, während du ugemellt bass, a du stees hei.",de:"Spiel eine Partie, während du angemeldet bist, und du stehst hier.",en:"Play a match while signed in and you'll show up here."},
  errT:{lb:"Feeler beim Lueden.",de:"Fehler beim Laden.",en:"Couldn't load the leaderboard."},
  errS:{lb:"Probéier et gläich nach eng Kéier.",de:"Versuch es gleich noch einmal.",en:"Try again in a moment."},
  player:{lb:"Spiller",de:"Spieler",en:"Player"},
  w:{lb:"G",de:"S",en:"W"}, wf:{lb:"Gewonnen",de:"Siege",en:"Wins"},
  l:{lb:"V",de:"N",en:"L"}, lf:{lb:"Verluer",de:"Niederlagen",en:"Losses"},
  pct:{lb:"%",de:"%",en:"Win%"}, pctf:{lb:"Gewënnquote",de:"Siegquote",en:"Win rate"},
  rank:{lb:"Plaz",de:"Platz",en:"Rank"},
  sum1:{lb:"1 Spiller",de:"1 Spieler",en:"1 player"},
  sumN:{lb:"{n} Spiller",de:"{n} Spieler",en:"{n} players"},
};
const MEDALS=["1","2","3"];
const readLang=()=>{ try{ const v=localStorage.getItem("site_lang"); if(v==="lb"||v==="de"||v==="en") return v; }catch{} return "lb"; };
let lang=readLang();
const t=(k)=>{ const e=T[k]; return e?(e[lang]||e.en):k; };
let sb=null, game="", period="all", last=null, tagData=null, weekly=null;

function applyStatic(){
  document.documentElement.lang=lang;
  document.title=t("title")+" — ian.lu";
  document.querySelectorAll("[data-t]").forEach(el=>{ if(T[el.dataset.t]) el.textContent=t(el.dataset.t); });
  document.querySelectorAll("[data-t-aria]").forEach(el=>{ el.setAttribute("aria-label",t(el.dataset.tAria)); });
}
const emptyHtml=(ico,msg,sub)=>`<div class="lbempty"><div class="lbempty-ico" aria-hidden="true">${ico}</div><p>${esc(msg)}</p><div class="lbempty-sub">${esc(sub)}</div></div>`;
const label=()=>{ const b=document.querySelector("[data-g].on"); const n=b&&(b.matches("[data-t]")?b:b.querySelector("[data-t]")); return n?n.textContent.trim():t("all"); };
const lower=(value)=>String(value??"").toLowerCase();
const playerTags=(username)=>{
  const row=tagData?.byUsername[lower(username)];
  return row?tagsHtml(row):"";
};

function rowHtml(row,index){
  const pct=row.winpct==null?null:+row.winpct;
  const rank=index<3
    ? `<span class="medal">${MEDALS[index]}</span>`
    : index+1;
  return `<tr class="top${index+1}"><td class="rank">${rank}</td><td class="who"><span class="name">${esc(row.username)}${playerTags(row.username)}</span><span class="meter" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,pct||0))}%"></i></span></td><td class="n">${scoreHtml(row.wins)}</td><td class="n">${scoreHtml(row.losses)}</td><td class="n pct">${pct==null?"—":pct+"%"}</td></tr>`;
}


async function visibleTags(){
  if(!auth.session()) return null;
  try{
    const result=await loadTags(sb);
    return auth.session()?result:null;
  }catch(error){
    console.warn("[leaderboard] tags",error);
    return null;
  }
}

function paint(){
  const body=$("body"), data=last;
  if(data==="loading"){ body.innerHTML=emptyHtml("",t("loading"),""); return; }
  if(data==="error"){ body.innerHTML=emptyHtml("",t("errT"),t("errS")); return; }
  if(game==="weekly" && weekly){
    body.innerHTML=weeklyHeadingHtml(weekly)+(auth.session()?weeklyRowsHtml(weekly):`<p>${esc(arcadeText("arc.weeklySignin"))}</p>`);
    return;
  }
  if(!data||!data.length){ body.innerHTML=emptyHtml("",t("emptyT"),t("emptyS")); return; }
  const rows=data.map((row,index)=>rowHtml(row,index)).join("");
  const sum=data.length===1?t("sum1"):t("sumN").replace("{n}",data.length);
  body.innerHTML=`<p class="board-sum"><span class="dot" aria-hidden="true"></span>${esc([sum,...(game?[label()]:[]),period==="all"?t("pAll"):t("pWeek")].join(" · "))}</p>`+
    `<table class="lb${tagData?" tagged":""}"><caption class="sr-only">${esc(label())} · ${esc(period==="all"?t("pAll"):t("pWeek"))}</caption><thead><tr><th scope="col" class="rank"><span aria-hidden="true">#</span><span class="sr-only">${esc(t("rank"))}</span></th><th scope="col">${esc(t("player"))}</th><th scope="col" class="n"><span aria-hidden="true">${esc(t("w"))}</span><span class="sr-only">${esc(t("wf"))}</span></th><th scope="col" class="n"><span aria-hidden="true">${esc(t("l"))}</span><span class="sr-only">${esc(t("lf"))}</span></th><th scope="col" class="n"><span aria-hidden="true">${esc(t("pct"))}</span><span class="sr-only">${esc(t("pctf"))}</span></th></tr></thead><tbody>${rows}</tbody></table>` + scoreKeyHtml(data.flatMap(row=>[row.wins,row.losses]));
}

async function draw(){
  const board=$("board");
  board.setAttribute("aria-busy","true"); last="loading"; paint();
  try{
    if(!sb) sb=await auth.client();
    if(game==="weekly"){
      weekly=await loadWeekly(sb,auth.session());
      if(!weekly) throw new Error("Weekly board unavailable for this account");
      last=weekly.rows;
      board.setAttribute("aria-busy","false"); paint(); return;
    }
    const boardRequest=period==="all"
      ? sb.rpc("game_leaderboard",{ p_game: game||null })
      : sb.rpc("game_leaderboard_window",{ p_game: game||null, p_days: +period });
    const [{ data, error },nextTags]=await Promise.all([boardRequest,visibleTags()]);
    if(error) throw error;
    last=data||[];
    tagData=nextTags;
  }catch(e){ last="error"; console.warn(e); }
  board.setAttribute("aria-busy","false"); paint();
}
function mark(sel, active){ document.querySelectorAll(sel).forEach(x=>{ x.classList.toggle("on",x===active); x.setAttribute("aria-pressed",String(x===active)); }); }
document.querySelectorAll("[data-g]").forEach(b=> b.onclick=()=>{ game=b.dataset.g; $("periods").hidden=game==="weekly"; mark("[data-g]",b); draw(); });
document.querySelectorAll("[data-p]").forEach(b=> b.onclick=()=>{ period=b.dataset.p; mark("[data-p]",b); draw(); });
document.addEventListener("i18n:change",()=>{lang=window.I18N.lang;applyStatic();paint();});
window.addEventListener("storage",e=>{ if(e.key==="site_lang"){ lang=readLang(); applyStatic(); paint(); } });
auth.onAuth(()=>{ tagData=null; draw(); });

applyStatic();
(async()=>{ if(auth.authConfigured){ sb=await auth.client(); } draw(); })();
</script>
  <script type="module" src="rtc-ring.js?v=36"></script>
  <script type="module" src="class-gate.js?v=37"></script>
</body>
