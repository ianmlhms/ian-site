<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<!-- Pass-the-phone party app: almost no crawlable text, so it stays out of the
     index like the other app shells. -->
<title>Partyspill — 15 Partyspiller fir Frënn | ian.lu</title>
<meta name="description" content="15 Partyspiller op engem Handy: Impostor, Bomm, Wuertsprint, Tabu, Quiz a méi. Fir 3 bis 12 Spiller, ouni Installatioun.">
<link rel="canonical" href="https://ian.lu/partyspill.html">
<meta name="theme-color" content="#0d0d1a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js?v=18"></script>
<style>
  :root{
    --bg:#0d0d1a; --card:#161625; --card2:#1e1e35; --border:#2a2a4a;
    --text:#e8e8f0; --muted:#8888aa; --accent:#ff6b9d; --accent2:#4de8ff;
    --good:#3fb950; --bad:#e5484d; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---- chrome ---- */
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .bar>*{min-width:0}
  .bar .home{color:var(--muted);font-weight:700;text-decoration:none;font-size:14px}
  .bar h1{font-size:16px;margin:0;font-weight:800}
  .bar .spacer{flex:1}
  .langs button{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:4px 15px}
  .langs button.on{color:var(--accent2-text)}

  .wrap{max-width:620px;margin:0 auto;padding:18px 16px 48px}

  /* ---- home grid ---- */
  .lede{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;
    transition:transform .15s,border-color .15s;
  }
  .tile:hover{transform:translateY(-3px)}
  .tile .em{font-size:26px}
  .tile .nm{font-weight:800;font-size:15px}
  .tile .tg{color:var(--muted);font-size:12.5px;line-height:1.45}

  /* ---- generic screen ---- */
  .screen{display:none}
  .screen.on{display:block}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .head .em{font-size:24px}
  .head h2{margin:0;font-size:19px;font-weight:800}
  .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 16px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
  .big{font-size:30px;font-weight:800;text-align:center;line-height:1.25;margin:10px 0}
  .mid{font-size:20px;font-weight:700;text-align:center;line-height:1.35}
  .tiny{color:var(--muted);font-size:12.5px;text-align:center}

  .btn{
    display:block;width:100%;padding:15px;border-radius:14px;border:0;
    background:var(--accent);color:var(--accent-foreground);font-weight:800;font-size:16px;margin-top:10px;
  }
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.big{padding:26px;font-size:20px}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0}

  /* ---- players ---- */
  .plist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{
    background:var(--card2);border:1px solid var(--border);border-radius:20px;
    padding:7px 12px;font-size:14px;display:flex;align-items:center;gap:8px;
  }
  .chip button{background:none;border:0;color:var(--muted);padding:0;font-size:15px;line-height:1}
  .addrow{display:flex;gap:8px}
  .addrow input{
    flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:15px;min-width:0;
  }
  .addrow input:focus{outline:2px solid var(--accent2);outline-offset:-1px}

  /* ---- vote / choice buttons ---- */
  .choices{display:grid;gap:9px}
  .choice{
    padding:15px;border-radius:13px;border:1px solid var(--border);
    background:var(--card);text-align:left;font-size:16px;font-weight:600;
  }
  .choice.right{border-color:var(--good);background:rgba(63,185,80,.14)}
  .choice.wrong{border-color:var(--bad);background:rgba(229,72,77,.14)}

  /* ---- timer ---- */
  .timer{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--bad)}

  /* ---- misc ---- */
  .banned{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
  .banned span{background:rgba(229,72,77,.15);color:#ff9b9b;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
  .poles{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700;margin-top:6px}
  input[type=range]{width:100%;accent-color:var(--accent2-text)}
  input[type=number]{
    width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:22px;text-align:center;font-weight:700;
  }
  .score{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:15px}
  .score:last-child{border-bottom:0}
  .score b{font-variant-numeric:tabular-nums}
  .warn{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<header class="bar">
  <a class="home" href="./">‹ Heem</a>
  <h1 id="barTitle">Partyspill</h1>
  <span class="spacer"></span>
  <nav class="langs" id="langs" aria-label="Sprooch">
    <button type="button" data-l="lb" class="on">LB</button>
    <button type="button" data-l="de">DE</button>
    <button type="button" data-l="en">EN</button>
  </nav>
</header>

<main class="wrap">

  <!-- home -->
  <section class="screen on" id="s-home">
    <p class="lede" id="lede"></p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- players -->
  <section class="screen" id="s-players">
    <div class="head"><span class="em" id="pEm"></span><h2 id="pName"></h2></div>
    <p class="sub" id="pTag"></p>
    <div class="plist" id="plist"></div>
    <div class="addrow">
      <input id="pInput" type="text" maxlength="14" autocomplete="off" placeholder="Numm">
      <button class="btn" style="width:auto;padding:12px 18px;margin:0" id="pAdd">+</button>
    </div>
    <p class="warn" id="pWarn"></p>
    <button class="btn" id="pStart"></button>
    <button class="btn ghost" id="pBack"></button>
  </section>

  <!-- generic play screen, filled by the engine -->
  <section class="screen" id="s-play">
    <div class="head"><span class="em" id="gEm"></span><h2 id="gName"></h2></div>
    <div id="stage"></div>
  </section>

</main>

<script src="partyspill-content.js?v=3"></script>
<script src="partyspill-games.js?v=2"></script>
<script src="partyspill.js?v=2"></script>
</body>
</html>
