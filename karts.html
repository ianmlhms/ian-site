<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow" />
  <!-- Admin-only kart session list. Kept out of the index, like admin.html and me.html. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KartTracker — All sessions</title>
<script src="theme.js?v=25"></script>
<script src="i18n-dict.js?v=42"></script>
<script src="i18n.js?v=3"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .ui{--best:#5ad88a}
  html[data-theme="light"] .ui{--best:#157a42}
  a{color:var(--accent-text);text-decoration:none}
  button,a{touch-action:manipulation}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  .ui .ui-page{display:flex;flex-direction:column;gap:12px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}
  .ui-page h1.ui-title{display:flex;align-items:center;gap:12px;margin:0 2px;text-wrap:balance}
  .sumline{min-height:20px;margin:0 2px 2px;color:var(--muted);font-size:13.5px}
  .sumline:empty{display:none}

  /* ---- states (loading / sign-in / private / empty / error) ---- */
  .state{padding:clamp(26px,5vw,44px) 22px;text-align:center;color:var(--muted)}
  .state:empty{display:none}
  .state .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .state p{margin:0;font:800 clamp(18px,2.6vw,22px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
  .state .ui-btn{margin-top:18px}
  .state.is-err .gate-ico{background:color-mix(in srgb,#ef5b6b 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,#ef5b6b 30%,transparent)}

  /* ---- session cards ---- */
  #list{display:flex;flex-direction:column;gap:12px}
  #list:empty{display:none}
  .sess{--h:var(--accent);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico info best" "act act act";align-items:center;gap:12px 14px;padding:14px 16px;border-radius:var(--r-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -18px rgb(var(--ink)/.35)}
  .sess .ico{grid-area:ico;display:grid;place-items:center;width:52px;height:52px;border-radius:var(--r-chip);font-size:27px;line-height:1;background:color-mix(in srgb,var(--h) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .sess .info{grid-area:info;min-width:0}
  .sess .name{font:750 16px/1.25 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
  .sess .sub{margin-top:2px;color:var(--muted);font-size:12.5px;line-height:1.35}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font:700 12px/1.6 var(--font-display);background:color-mix(in srgb,var(--h) 15%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 28%,transparent)}
  .sess .best{grid-area:best;align-self:start;text-align:right;color:var(--best);font:800 clamp(20px,3.4vw,26px)/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sess .best.none{color:var(--muted)}
  .sess .best small{display:block;margin-top:3px;color:var(--muted);font:600 11px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:0}
  .act{grid-area:act;display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--tile-edge)}
  .act .ui-btn{flex:1 1 0;min-height:44px;padding:8px 14px;font-size:14px}
  .act .ui-btn.x{color:var(--muted)}
  .act .ui-btn.x:hover{background:color-mix(in srgb,#ef5b6b 12%,transparent);border-color:#ef5b6b;color:#ef5b6b}
  .ui-btn:disabled{opacity:.55;cursor:default;transform:none}
  @media(min-width:700px){
    .sess{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"ico info best act";gap:14px 18px}
    .act{padding-top:0;border-top:0}
    .act .ui-btn{flex:none}
  }
  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    .ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:16px}
    .ui .ui-page{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    .sess{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ico best" "info info" "act act"}
    .sess .best{align-self:center}
    body .ui-page h1.ui-title{flex:none;overflow:visible;font-size:clamp(22px,6.4vw,26px);text-overflow:clip;white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}body.ui .ui-header .home,.ui-btn{transition:none}}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script data-goatcounter="https://ianm.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <meta name="theme-color" content="#0d0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <a class="home" href="index.html" data-i18n="nav.home">‹ Home</a>
  <div class="header-right">
    <span id="langSw"></span>
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page">
  <h1 class="ui-title" data-i18n="karts.h1">🏎️ KartTracker — All sessions</h1>
  <div id="sum" class="sumline"></div>
  <div id="state" class="state ui-card" role="status"><div class="gate-ico" aria-hidden="true">🏎️</div><p data-i18n="common.loading">Loading…</p></div>
  <div id="list"></div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import { client, session, onAuth, mountAccountButton, openAuthModal } from "./auth.js?v=22";

const T = (k) => (window.I18N ? window.I18N.t(k) : k);
const $ = (id) => document.getElementById(id);
const esc = (s) => (""+(s??"")).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb = null;

function fmtLap(s){ if(s==null||isNaN(s)) return "—"; const m=Math.floor(s/60), r=s-m*60; const ss=r.toFixed(3); return m>0?`${m}:${r<10?"0":""}${ss}`:ss; }
function fmtDate(iso){ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function bestOf(laps){ const v=(laps||[]).filter(x=>typeof x==="number"&&x>0); return v.length?Math.min(...v):null; }
const TINTS=["#4aa8ff","#4fc37a","#ef7b4a","#9b8cff","#f4a62a","#ef5b6b"];
const tintOf=(name)=>{ let h=0; for(const c of String(name||"")) h=(h*31+c.charCodeAt(0))>>>0; return TINTS[h%TINTS.length]; };
function setState(ico, html, err){
  const st = $("state");
  st.className = "state ui-card"+(err?" is-err":"");
  st.innerHTML = ico ? `<div class="gate-ico" aria-hidden="true">${ico}</div>${html}` : "";
}
function topKmh(track){ return Math.max(0, ...(track||[]).map(p=>(p.speed||0)*3.6)); }

async function load(){
  const { data, error } = await sb.rpc("kart_list");   // admin-gated (kart_sessions has no public SELECT)
  if(error){ $("sum").textContent = ""; $("list").innerHTML = ""; setState("⚠️", `<p>${esc(T("karts.loadErr")+": "+error.message)}</p>`, true); return; }
  const rows = data || [];
  if(!rows.length){ $("sum").textContent = ""; $("list").innerHTML = ""; setState("🏁", `<p>${esc(T("karts.none"))}</p>`); return; }
  setState("");
  $("sum").textContent = `${rows.length} ${rows.length>1?T("karts.sessions"):T("karts.session")} · ${T("karts.newest")}`;
  $("list").innerHTML = rows.map(r=>{
    const p = r.payload || {};
    const best = bestOf(p.lapTimes);
    const laps = (p.lapTimes||[]).filter(x=>typeof x==="number"&&x>0).length;
    const tk = topKmh(p.track);
    return `<div class="sess" data-id="${esc(r.id)}" style="--h:${tintOf(p.trackName)}">
      <div class="ico" aria-hidden="true">🏎️</div>
      <div class="info">
        <div class="name">${esc(p.trackName || T("karts.session.title"))}</div>
        <div class="sub">${esc(fmtDate(p.date || r.created_at))}</div>
        <div class="chips"><span class="chip">${laps} ${laps===1?T("karts.lap"):T("karts.laps")}</span>${tk>0?`<span class="chip">${T("karts.top")} ${tk.toFixed(0)} km/h</span>`:""}</div>
      </div>
      <div class="best${best==null?" none":""}">${fmtLap(best)}<small>${T("karts.bestLap")}</small></div>
      <div class="act">
        <a class="ui-btn ui-btn--ghost" href="kart.html?s=${encodeURIComponent(r.id)}" target="_blank" rel="noopener" aria-label="${esc(T("karts.view")+": "+(p.trackName || T("karts.session.title")))}">${T("karts.view")}</a>
        <button class="ui-btn ui-btn--ghost x" type="button" data-del="${esc(r.id)}" aria-label="${esc(T("karts.delete")+": "+(p.trackName || T("karts.session.title")))}">${T("karts.delete")}</button>
      </div>
    </div>`;
  }).join("");
  $("list").querySelectorAll("[data-del]").forEach(b=> b.onclick = async () => {
    if(!confirm(T("karts.delConfirm"))) return;
    b.disabled = true; b.textContent = "…";
    const { error } = await sb.rpc("kart_delete", { p_id: b.dataset.del });
    if(error){ alert(T("karts.delFailed")+": "+error.message); b.disabled=false; b.textContent=T("karts.delete"); return; }
    load();
  });
}

async function render(){
  const s = session();
  if(!s){
    $("list").innerHTML = ""; $("sum").textContent = "";
    setState("🔐", `<p>${esc(T("karts.gate"))}</p><button class="ui-btn ui-btn--primary" id="gateBtn" type="button">${esc(T("auth.signinShort"))}</button>`);
    $("gateBtn").onclick = openAuthModal;
    return;
  }
  let admin = false;
  try { const { data } = await sb.rpc("is_admin"); admin = !!data; } catch {}
  if(!admin){ $("list").innerHTML=""; $("sum").textContent = ""; setState("🔒", `<p>${esc(T("karts.private"))}</p>`); return; }
  load();
}

(async function boot(){
  mountAccountButton($("acctHost"));
  sb = await client();
  onAuth(() => render());
  render();
  document.addEventListener("i18n:change", () => { if (sb) render(); });
})();
</script>
  <script type="module" src="rtc-ring.js?v=18"></script>
  <script type="module" src="class-gate.js?v=19"></script>
</body>
</html>
