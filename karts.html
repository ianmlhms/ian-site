<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KartTracker — All sessions</title>
<script src="theme.js?v=32"></script>
<script src="i18n-dict.js?v=54"></script>
<script src="i18n.js?v=5"></script>
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=9">
<style>
  .gt-page{max-width:860px}
  body.gt{--best:#1f7a4d;--hr:#a32121;--map-slow:#cfcfc8;--map-fast:#1f7a4d;--map-edge:#d8d8d2}
  .gt .kp{padding:20px;gap:14px;justify-content:flex-start}
  .gt-nav{padding:2px 20px!important}
  .gt .ui-card{border:1px solid var(--ink);padding:18px 20px}
  .gate-ico,.hero-ico,.empty-ico{display:grid;place-items:center;flex:none;width:56px;height:56px;border:1px solid var(--ink);background:var(--tint);font-size:28px}
  .state,.loading{padding:clamp(26px,5vw,44px) 22px;text-align:center;color:var(--muted)}
  .state .gate-ico{margin:0 auto 16px}
  .state p{font:800 clamp(18px,2.6vw,22px)/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink)}
  .state .ui-btn{margin-top:18px}
  .state.is-err .gate-ico{border-color:var(--danger)}
  .msg{min-height:20px;color:var(--muted);font-size:13.5px;line-height:1.45}.msg.ok{color:var(--green);font-weight:600}.msg.err{color:var(--danger);font-weight:600}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font:500 12px/1.2 "Geist Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
  .ui-btn:disabled{opacity:.5;cursor:default}
  a{color:var(--green)}
  @media(max-width:700px){.gt .kp{padding:14px}.gt-page{padding-top:12px}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  .ui-title{display:flex;align-items:center;gap:12px;font:800 clamp(22px,4vw,28px)/1.15 "Geist",system-ui,sans-serif;letter-spacing:-.03em;text-wrap:balance}
  .sumline{min-height:20px;color:var(--muted);font:500 13px "Geist Mono",ui-monospace,monospace}.sumline:empty{display:none}
  .state:empty{display:none}
  #list{display:flex;flex-direction:column;gap:12px}#list:empty{display:none}
  .sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico info best" "act act act";align-items:center;gap:12px 14px;padding:14px 16px;background:var(--white);border:1px solid var(--ink)}
  .sess .ico{grid-area:ico;display:grid;place-items:center;width:48px;height:48px;font-size:24px;line-height:1;background:var(--tint);border:1px solid var(--soft)}
  .sess .info{grid-area:info;min-width:0}
  .sess .name{font:700 16px/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.015em;overflow-wrap:anywhere}
  .sess .sub{margin-top:2px;color:var(--muted);font-size:12.5px;line-height:1.35}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-block;padding:2px 8px;border:1px solid var(--ink);font:500 12px/1.5 "Geist Mono",ui-monospace,monospace;color:var(--ink)}
  .sess .best{grid-area:best;align-self:start;text-align:right;color:var(--green);font:500 clamp(18px,3.4vw,24px)/1.1 "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sess .best.none{color:var(--muted)}
  .sess .best small{display:block;margin-top:3px;color:var(--muted);font:500 11px/1.2 "Geist",system-ui,sans-serif}
  .act{grid-area:act;display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--soft)}
  .act .ui-btn{flex:1 1 0;min-height:44px;padding:8px 14px;font-size:14px}
  .act .ui-btn.x{color:var(--muted)}.act .ui-btn.x:hover{border-color:var(--danger);color:var(--danger);background:var(--white)}
  @media(min-width:700px){.sess{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"ico info best act";gap:14px 18px}.act{padding-top:0;border-top:0}.act .ui-btn{flex:none}}
  @media(max-width:640px){.sess{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ico best" "info info" "act act"}.sess .best{align-self:center}}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script data-goatcounter="https://ianm.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<body class="gt">
<main class="gt-page">
<div class="gt-grid">
  <header class="c full gt-nav">
    <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">KartTracker</h1></div>
    <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
  </header>
  <div class="c full kp">
    <h1 class="ui-title" data-i18n="karts.h1">🏎️ KartTracker — All sessions</h1>
    <div id="sum" class="sumline"></div>
    <div id="state" class="state ui-card" role="status"><div class="gate-ico" aria-hidden="true">🏎️</div><p data-i18n="common.loading">Lued …</p></div>
    <div id="list"></div>
  </div>
</div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import { client, session, onAuth, mountAccountButton, openAuthModal } from "./auth.js?v=40";

const T = (k) => (window.I18N ? window.I18N.t(k) : k);
const $ = (id) => document.getElementById(id);
const esc = (s) => (""+(s??"")).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb = null;

function fmtLap(s){ if(s==null||isNaN(s)) return "—"; const m=Math.floor(s/60), r=s-m*60; const ss=r.toFixed(3); return m>0?`${m}:${r<10?"0":""}${ss}`:ss; }
function fmtDate(iso){ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function bestOf(laps){ const v=(laps||[]).filter(x=>typeof x==="number"&&x>0); return v.length?Math.min(...v):null; }
const TINTS=["#4aa8ff","#4fc37a","#ef7b4a","#9b8cff","#f4a62a","#ef5b6b"];
const tintOf=(name)=>{ let h=0; for(const c of String(name||"")) h=(h*31+c.charCodeAt(0))>>>0; return TINTS[h%TINTS.length]; };
function setState(ico, html, err){
  const st = $("state");
  st.className = "state ui-card"+(err?" is-err":"");
  st.innerHTML = ico ? `<div class="gate-ico" aria-hidden="true">${ico}</div>${html}` : "";
}
function topKmh(track){ return Math.max(0, ...(track||[]).map(p=>(p.speed||0)*3.6)); }

async function load(){
  const { data, error } = await sb.rpc("kart_list");   // admin-gated (kart_sessions has no public SELECT)
  if(error){ $("sum").textContent = ""; $("list").innerHTML = ""; setState("⚠️", `<p>${esc(T("karts.loadErr")+": "+error.message)}</p>`, true); return; }
  const rows = data || [];
  if(!rows.length){ $("sum").textContent = ""; $("list").innerHTML = ""; setState("🏁", `<p>${esc(T("karts.none"))}</p>`); return; }
  setState("");
  $("sum").textContent = `${rows.length} ${rows.length>1?T("karts.sessions"):T("karts.session")} · ${T("karts.newest")}`;
  $("list").innerHTML = rows.map(r=>{
    const p = r.payload || {};
    const best = bestOf(p.lapTimes);
    const laps = (p.lapTimes||[]).filter(x=>typeof x==="number"&&x>0).length;
    const tk = topKmh(p.track);
    return `<div class="sess" data-id="${esc(r.id)}" style="--h:${tintOf(p.trackName)}">
      <div class="ico" aria-hidden="true">🏎️</div>
      <div class="info">
        <div class="name">${esc(p.trackName || T("karts.session.title"))}</div>
        <div class="sub">${esc(fmtDate(p.date || r.created_at))}</div>
        <div class="chips"><span class="chip">${laps} ${laps===1?T("karts.lap"):T("karts.laps")}</span>${tk>0?`<span class="chip">${T("karts.top")} ${tk.toFixed(0)} km/h</span>`:""}</div>
      </div>
      <div class="best${best==null?" none":""}">${fmtLap(best)}<small>${T("karts.bestLap")}</small></div>
      <div class="act">
        <a class="ui-btn ui-btn--ghost" href="kart.html?s=${encodeURIComponent(r.id)}" target="_blank" rel="noopener" aria-label="${esc(T("karts.view")+": "+(p.trackName || T("karts.session.title")))}">${T("karts.view")}</a>
        <button class="ui-btn ui-btn--ghost x" type="button" data-del="${esc(r.id)}" aria-label="${esc(T("karts.delete")+": "+(p.trackName || T("karts.session.title")))}">${T("karts.delete")}</button>
      </div>
    </div>`;
  }).join("");
  $("list").querySelectorAll("[data-del]").forEach(b=> b.onclick = async () => {
    if(!confirm(T("karts.delConfirm"))) return;
    b.disabled = true; b.textContent = "…";
    const { error } = await sb.rpc("kart_delete", { p_id: b.dataset.del });
    if(error){ alert(T("karts.delFailed")+": "+error.message); b.disabled=false; b.textContent=T("karts.delete"); return; }
    load();
  });
}

async function render(){
  const s = session();
  if(!s){
    $("list").innerHTML = ""; $("sum").textContent = "";
    setState("🔐", `<p>${esc(T("karts.gate"))}</p><button class="ui-btn ui-btn--primary" id="gateBtn" type="button">${esc(T("auth.signinShort"))}</button>`);
    $("gateBtn").onclick = openAuthModal;
    return;
  }
  let admin = false;
  try { const { data } = await sb.rpc("is_admin"); admin = !!data; } catch {}
  if(!admin){ $("list").innerHTML=""; $("sum").textContent = ""; setState("🔒", `<p>${esc(T("karts.private"))}</p>`); return; }
  load();
}

(async function boot(){
  sb = await client();
  onAuth(() => render());
  render();
  document.addEventListener("i18n:change", () => { if (sb) render(); });
})();
</script>
  <script type="module" src="rtc-ring.js?v=36"></script>
  <script type="module" src="class-gate.js?v=37"></script>
<script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
