  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  a{color:var(--accent2-text);text-decoration:none}

  .lb-tabs button.on{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent-border)}
  .lb-box table{width:100%;border-collapse:collapse;font-size:14px}
  .lb-box th,.lb-box td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}

<script>
// ==== Word lists (5 letters, UPPERCASE) ====
// APPEND ONLY, never insert/reorder/delete: the daily word is picked by
// position, so any change before the end of a list shifts every day's answer
// (and appending shifts future days once — fine, mid-list edits are not).
const WORDS = {
  lb: ["MOIEN","MERCI","KLENG","ÄPPEL","KAFFI","FRËNN","DËSCH","ËMMER","HÄERZ","VÉIER",
       "WÄISS","GRÉNG","PÄERD","FËSCH","SPILL","DAACH","BAACH","MOUND","LAANG","KUERZ",
       "WUERT","BLUMM","OWEND","STUFF","GAART","BRÉIF","BROUT","FEIER","BËSCH","STEEN",
       "FAARF","MUSEK","GLÉCK","FOUSS","MOUNT","BAUCH","KLEED","HAART","WEECH","KRÄIZ",
       "BUERG","ENGEL","DUERF","SCHOF","MAUER",
       "GEESS","IESEL","KUERF","GAASS","BRONG","SIWEN","AACHT","FUUSS","BLËTZ","HÉICH",
       "KRANK","INSEL"],
  de: ["BLUME","TISCH","STUHL","APFEL","BIRNE","TIGER","MUSIK","SCHUH","JACKE","MAUER",
       "GABEL","TASSE","KANNE","SALAT","PIZZA","NUDEL","KARTE","LAMPE","BLATT","WOLKE",
       "REGEN","SONNE","STERN","NACHT","MONDE","HONIG","VOGEL","FISCH","PFERD","KATZE",
       "AMPEL","ANKER","BESEN","BIENE","BODEN","BRETT","EIMER","ENGEL","FEDER","FEUER",
       "FLUSS","GEIGE","HOTEL","INSEL","KABEL","KERZE","KETTE","KRONE","LICHT","MOTOR",
       "MÜNZE","NADEL","NEBEL","OZEAN","PALME","PILOT","PLATZ","RADIO","RIESE","SEIFE",
       "SPIEL","STADT","STEIN","STIFT","TAFEL","TEICH","WIESE","WURST","ZEBRA","ZIEGE",
       "ZWERG"],
};
const LABEL = { lb:"Lëtzebuergesch", de:"Deutsch" };
const ROWS = 6, COLS = 5;
const STATE_LABEL = { correct:"richteg Plaz", present:"am Wuert, aner Plaz", absent:"net am Wuert" };
let lang = localStorage.getItem("wordleLang") || "lb";
let answer = "", guesses = [], current = "", done = false;
let practice = false;   // free rounds after the daily word — no stats, no leaderboard

const $ = (id)=>document.getElementById(id);
// Luxembourg-local day number (plain UTC would roll the word at 1/2 am local).
const dayIndex = ()=>{
  const [y,m,d] = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Luxembourg"}).format(new Date()).split("-").map(Number);
  return Math.floor(Date.UTC(y, m-1, d)/86400000);
};
// Saved state/stats are parsed on load; a corrupted or non-object value must
// fall back to a fresh state instead of breaking the whole game.
function readStored(key){
  try{ const v=JSON.parse(localStorage.getItem(key)||"null"); return v&&typeof v==="object"?v:null; }
  catch(error){ console.warn("[wordle] ignoring unreadable",key,error); return null; }
}
const stateKey = ()=> `wordle_${lang}_${dayIndex()}`;
const statsKey = ()=> `wordleStats_${lang}`;

function pickAnswer(){
  const list = WORDS[lang];
  const off = lang==="de"?7:0;                       // different word than the other language
  return list[(dayIndex()+off) % list.length];
}
function pickPractice(){
  const list = WORDS[lang], daily = pickAnswer();
  let w; do { w = list[Math.floor(Math.random()*list.length)]; } while(w===daily || w===answer);
  return w;
}
function load(){
  practice = false;
  answer = pickAnswer();
  const s = readStored(stateKey());
  guesses = s?.guesses || []; current = ""; done = s?.done || false;
  render(); drawKeyboard(); renderStats();
  $("share").style.display = done ? "" : "none";
  $("again").style.display = done ? "" : "none";
  if(done){ $("msg").textContent = guesses.includes(answer) ? "Gewonnen! 🎉" : "Léisung: "+answer; }
}
function startPractice(){
  practice = true;
  answer = pickPractice();
  guesses = []; current = ""; done = false;
  $("share").style.display = "none"; $("again").style.display = "none";
  $("msg").textContent = "🎲 Fräi Partie — zielt net fir d'Serie";
  render(); drawKeyboard();
}
function save(){ if(practice) return; localStorage.setItem(stateKey(), JSON.stringify({ guesses, done })); }

function scoreGuess(g){
  const res = Array(COLS).fill("absent"), a = answer.split(""), used = Array(COLS).fill(false);
  for(let i=0;i<COLS;i++){ if(g[i]===a[i]){ res[i]="correct"; used[i]=true; a[i]=null; } }
  for(let i=0;i<COLS;i++){ if(res[i]==="correct") continue;
    const j=a.indexOf(g[i]); if(j>-1){ res[i]="present"; a[j]=null; } }
  return res;
}
function render(){
  const b=$("board"); b.innerHTML="";
  for(let r=0;r<ROWS;r++){
    const row=document.createElement("div"); row.className="row"; row.setAttribute("role","group"); row.setAttribute("aria-label","Versuch "+(r+1));
    const g=guesses[r];
    const score=g?scoreGuess(g):null;
    for(let c=0;c<COLS;c++){
      const t=document.createElement("div"); t.className="tile"; t.setAttribute("role","img");
      let lbl="eidel";
      if(g){ t.textContent=g[c]; t.classList.add(score[c]); lbl=g[c]+", "+STATE_LABEL[score[c]]; }
      else if(r===guesses.length && current[c]){ t.textContent=current[c]; t.classList.add("filled"); lbl=current[c]; }
      t.setAttribute("aria-label",lbl);
      row.appendChild(t);
    }
    b.appendChild(row);
  }
}
const KB=[["Q","W","E","R","T","Z","U","I","O","P"],
          ["A","S","D","F","G","H","J","K","L"],
          ["Ä","Ö","Ü","Ë","É"],
          ["ENT","Y","X","C","V","B","N","M","DEL"]];
function letterStates(){
  const order={absent:0,present:1,correct:2}, st={};
  for(const g of guesses){ const sc=scoreGuess(g);
    for(let i=0;i<COLS;i++){ const L=g[i], s=sc[i];
      if(st[L]===undefined || order[s]>order[st[L]]) st[L]=s; } }
  return st;
}
function drawKeyboard(){
  const st=letterStates(); const kb=$("kb"); kb.innerHTML="";
  for(const row of KB){
    const r=document.createElement("div"); r.className="krow";
    for(const k of row){
      const b=document.createElement("button"); b.type="button"; b.className="key"+(k==="ENT"||k==="DEL"?" wide":"");
      b.textContent = k==="ENT"?"Enter":k==="DEL"?"⌫":k;
      if(k==="DEL") b.setAttribute("aria-label","Läschen");
      if(st[k]){ b.classList.add(st[k]); b.setAttribute("aria-label",k+", "+STATE_LABEL[st[k]]); }
      b.onmousedown=(e)=>e.preventDefault();   // keep focus off the keys so a hardware Enter/Space never re-presses the last tapped key
      b.onclick=()=> key(k==="ENT"?"Enter":k==="DEL"?"Backspace":k);
      r.appendChild(b);
    }
    kb.appendChild(r);
  }
}
function flash(t){ $("msg").textContent=t; }
function key(k){
  if(done) return;
  if(k==="Enter"){
    if(current.length<COLS) return flash("Net genuch Buschtawen");
    guesses.push(current);
    const won = current===answer;
    current="";
    if(won||guesses.length===ROWS){ done=true; finish(won); }
    save(); render(); drawKeyboard();
    return;
  }
  if(k==="Backspace"){ current=current.slice(0,-1); render(); return; }
  if(/^[A-ZÄÖÜËÉ]$/.test(k) && current.length<COLS){ current+=k; render(); }
}
function finish(won){
  $("msg").textContent = won ? ["Genial!","Super!","Gutt!","Net schlecht","Knapp!","Puh! 😅"][guesses.length-1] : "Léisung: "+answer;
  $("again").style.display="";
  if(practice) return;                                // free rounds: no stats, no share, no leaderboard
  $("share").style.display="";
  const s=readStored(statsKey())||{played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0]};
  const day=dayIndex();
  // a daily streak only survives if yesterday was played too
  s.played++; if(won){ s.streak=(s.lastDay===day-1?s.streak:0)+1; s.wins++; s.max=Math.max(s.max,s.streak); s.dist[guesses.length-1]++; } else s.streak=0;
  s.lastDay=day;
  localStorage.setItem(statsKey(), JSON.stringify(s));
  renderStats();
  window.recordWordle?.(lang, dayIndex(), won?guesses.length:0);   // public leaderboard (if signed in)
}
// streak shown as 0 once a day was skipped (finish() resets it on the next game)
function liveStreak(s){ return s.lastDay===undefined||s.lastDay>=dayIndex()-1 ? s.streak : 0; }
function renderStats(){
  const s=readStored(statsKey())||{played:0,wins:0,streak:0,max:0};
  $("stats").innerHTML=`<div><b>${s.played}</b>Gespillt</div><div><b>${s.played?Math.round(100*s.wins/s.played):0}%</b>Gewonn</div><div><b><span aria-hidden="true">🔥 </span>${liveStreak(s)}</b>Serie</div><div><b>${s.max}</b>Max</div>`;
}
function shareResult(){
  const emo={correct:"🟩",present:"🟨",absent:"⬛"};
  const grid=guesses.map(g=>scoreGuess(g).map(s=>emo[s]).join("")).join("\n");
  const won=guesses.includes(answer);
  const s=readStored(statsKey());
  const streak=s?liveStreak(s):0;
  const txt=`ian.lu Wuertspill (${lang.toUpperCase()}) ${won?guesses.length:"X"}/6${streak>1?` · 🔥${streak}`:""}\n${grid}\nian.lu/wordle.html`;
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>flash("Kopéiert! 📋")).catch(()=>flash(txt)); }
  else flash("Konnt net kopéieren");
}

document.addEventListener("keydown",(e)=>{
  if(e.metaKey||e.ctrlKey) return;
  if($("lbModal").classList.contains("open")){ if(e.key==="Escape") window.closeWordleBoard?.(); return; }
  if(e.key==="Enter" && e.target.closest?.("button,a")) return;   // let a focused button/link handle its own Enter
  if(e.key==="Enter") key("Enter");
  else if(e.key==="Backspace") key("Backspace");
  else { const k=e.key.toUpperCase(); if(/^[A-ZÄÖÜËÉ]$/.test(k)) key(k); }
});
document.querySelectorAll(".langs button").forEach(b=> b.onclick=()=>{
  lang=b.dataset.l; localStorage.setItem("wordleLang",lang);
  document.querySelectorAll(".langs button").forEach(x=>{x.classList.toggle("on",x.dataset.l===lang);x.setAttribute("aria-pressed",x.dataset.l===lang);});
  flash(""); load();
});
$("share").onclick=shareResult;
$("again").onclick=startPractice;
$("lbBtn").onclick=()=>window.openWordleBoard?.(lang);
document.querySelectorAll(".langs button").forEach(x=>{x.classList.toggle("on",x.dataset.l===lang);x.setAttribute("aria-pressed",x.dataset.l===lang);});
load();
</script>

<script type="module">
  import * as auth from "./auth.js?v=23";
  import { loadTags, tagsHtml } from "./leaderboard-tags.js?v=2";
  let sb = null;
  const $ = (id) => document.getElementById(id);
  (async () => { if (!auth.authConfigured) return; auth.mountAccountButton($("acctHost")); sb = await auth.client(); })();

  window.recordWordle = async (lang, day, guesses) => {
    try { if (!sb) sb = await auth.client(); if (!auth.session()) return; await sb.rpc("record_wordle", { p_username: auth.username(), p_lang: lang, p_day: day, p_guesses: guesses }); }
    catch (e) { console.warn("[wordle] record", e); }
  };

  let boardLang = "lb";
  const PINNED_TEXT = Object.freeze({
    lb: Object.freeze({ label: "📌 Ugepinnt", title: "Ugepinnt: dem Admin säi beschte Resultat" }),
    de: Object.freeze({ label: "📌 Angeheftet", title: "Angeheftet: das beste Ergebnis des Admins" }),
    en: Object.freeze({ label: "📌 Pinned", title: "Pinned: the admin's best result" }),
  });
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;",
  })[character]);
  const tody = (today) => today == null ? "—" : today === 0 ? "✗" : today + "/6";

  function pinnedText() {
    let current = window.I18N?.lang;
    if (!current) {
      try { current = localStorage.getItem("site_lang"); }
      catch (error) { console.warn("[wordle] site language", error); }
    }
    return Object.hasOwn(PINNED_TEXT, current) ? PINNED_TEXT[current] : PINNED_TEXT.lb;
  }

  function tagsFor(tagData, username) {
    return tagData?.byUsername[String(username ?? "").toLowerCase()] || null;
  }

  function resultCells(row) {
    return `<td class="n">${row.wins}/${row.played}</td><td class="n">${row.avg_guesses ?? "—"}</td><td class="n">${tody(row.today)}</td>`;
  }

  function rankedRow(row, index, tagData) {
    const tag = tagsFor(tagData, row.username);
    const tagMarkup = tag ? tagsHtml(tag) : "";
    const playerClass = tagData ? ` class="lb-player"` : "";
    return `<tr><td>${index + 1}</td><td${playerClass}>${esc(row.username)}${tagMarkup}</td>${resultCells(row)}</tr>`;
  }

  function pinnedRow(data, tagData) {
    const owner = tagData?.owner;
    if (!owner) return "";
    const ownerName = String(owner.username ?? "").toLowerCase();
    const row = data.find((entry) => String(entry.username ?? "").toLowerCase() === ownerName);
    if (!row) return "";
    const copy = pinnedText();
    return `<tr class="pinned-row"><td><span class="pin-label" title="${esc(copy.title)}" aria-label="${esc(copy.title)}">${esc(copy.label)}</span></td><td class="lb-player">${esc(row.username)}${tagsHtml(owner)}</td>${resultCells(row)}</tr><tr class="pin-gap" aria-hidden="true"><td colspan="5"></td></tr>`;
  }

  async function boardTags() {
    if (!auth.session()) return null;
    try {
      const result = await loadTags(sb);
      return auth.session() ? result : null;
    } catch (error) { console.warn("[wordle] leaderboard tags", error); return null; }
  }

  async function drawBoard() {
    const body = $("lbBody"); body.innerHTML = "Lueden…";
    try {
      if (!sb) sb = await auth.client();
      const [{ data, error }, tagData] = await Promise.all([
        sb.rpc("wordle_leaderboard", { p_lang: boardLang }),
        boardTags(),
      ]);
      if (error) throw error;
      if (!data || !data.length) { body.innerHTML = `<p style="color:var(--muted)">Nach keng Resultater — spill a kommzréck!</p>`; return; }
      const tableClass = tagData ? ` class="tagged-board"` : "";
      body.innerHTML = `<table${tableClass}><tr><th scope="col">#</th><th scope="col">Spiller</th><th scope="col" class="n">Gewonn</th><th scope="col" class="n">⌀</th><th scope="col" class="n">Haut</th></tr>` +
        pinnedRow(data, tagData) +
        data.map((row, index) => rankedRow(row, index, tagData)).join("") +
        `</table>`;
    } catch (error) { body.innerHTML = "Feeler beim Lueden."; console.warn("[wordle] leaderboard", error); }
  }
  const setLbTabs = () => document.querySelectorAll("[data-lb]").forEach(b => { b.classList.toggle("on", b.dataset.lb === boardLang); b.setAttribute("aria-pressed", b.dataset.lb === boardLang); });
  let lbOpener = null;
  auth.onAuth(() => { if ($("lbModal").classList.contains("open")) drawBoard(); });
  window.openWordleBoard = (lang) => { boardLang = lang || "lb"; lbOpener = document.activeElement; $("lbModal").classList.add("open"); setLbTabs(); drawBoard(); $("lbClose").focus({ preventScroll: true }); };
  window.closeWordleBoard = () => { $("lbModal").classList.remove("open"); if (lbOpener && lbOpener.focus) lbOpener.focus({ preventScroll: true }); lbOpener = null; };
  $("lbClose").onclick = () => window.closeWordleBoard();
  $("lbModal").onclick = (e) => { if (e.target.id === "lbModal") window.closeWordleBoard(); };
  document.querySelectorAll("[data-lb]").forEach(b => b.onclick = () => { boardLang = b.dataset.lb; setLbTabs(); drawBoard(); });
</script>
  <script type="module" src="rtc-ring.js?v=19"></script>
  <script type="module" src="class-gate.js?v=20"></script>
</body>
</html>
