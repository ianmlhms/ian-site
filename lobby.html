<script type="module">
import { mountLobby } from "./mp-lobby.js?v=10";
import { gameInfo } from "./mp-games.js?v=4";
const g = gameInfo(new URLSearchParams(location.search).get("g") || "");
if (g) document.getElementById("lobbyH1").textContent = g.emoji + " " + g.name;
mountLobby(document.getElementById("mpl")).catch((error) => {
  console.error("[lobby] failed to start", error);
  document.getElementById("mpl").textContent = "Lobby konnt net starten. / Lobby could not start.";
});
</script>
