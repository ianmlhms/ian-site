<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IanNet — ian.lu</title>
<meta name="robots" content="noindex">
<script src="theme.js?v=25"></script>
<style>
  :root{--bg:#0d0d1a;--card:#161625;--card2:#1e1e35;--border:#2a2a4a;--text:#e8e8f0;--muted:#8888aa;--accent:#6ea8fe}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
  header .home{color:var(--muted);font-weight:700}
  header h1{font-size:18px;margin:0}
  header .spacer{flex:1}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  #msg{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);text-align:center}
  .auth-go{background:var(--accent);color:#000;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;margin-top:14px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
  .tab.active{color:var(--text);border-color:var(--accent);background:var(--card2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .ph{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--border);aspect-ratio:1}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;background:linear-gradient(transparent,#000c)}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px}
  .row .grow{flex:1;min-width:0}
  .row .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .row p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
  .del:hover{color:#ff6b6b}
  .ph .del{position:absolute;top:6px;right:6px;background:#000a;border-radius:8px;padding:2px 6px}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
  .send{display:flex;gap:8px;margin-bottom:14px}
  .send input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px}
  .btn{background:var(--accent);color:#000;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn:disabled{opacity:.5;cursor:default}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:8px 0 12px}
  .kv span:nth-child(odd){color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{color:var(--muted);font-size:13px;margin-top:8px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .tab,.btn,.auth-go,.del{min-height:44px}
  .del{min-width:44px}
  .ph .del{display:flex;align-items:center;justify-content:center}
  .btn:has(.sr-only:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
  <meta name="theme-color" content="#0d0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
<header>
  <a class="home" href="index.html">‹ ian.lu</a>
  <h1><span aria-hidden="true">📡</span> IanNet</h1>
  <span class="spacer"></span>
  <span id="acctHost"></span>
</header>
<main>
  <div id="msg" role="status">…</div>
  <div id="panel" hidden>
    <div class="tabs" role="group" aria-label="IanNet">
      <button class="tab active" data-kind="photo" aria-pressed="true"><span aria-hidden="true">📸</span> Fotoen</button>
      <button class="tab" data-kind="file" aria-pressed="false"><span aria-hidden="true">📁</span> Dateien</button>
      <button class="tab" data-kind="guestbook" aria-pressed="false"><span aria-hidden="true">✍️</span> Gäschtebuch</button>
      <button class="tab" data-kind="chat" aria-pressed="false"><span aria-hidden="true">💬</span> Chat</button>
      <button class="tab" data-kind="board" aria-pressed="false"><span aria-hidden="true">📡</span> Board</button>
    </div>
    <div id="list"></div>
  </div>
</main>
<script type="module" src="ianet.js?v=5"></script>
</body>
</html>
