<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .ui{--bad:#ef5b6b;--ok:#5ad88a}
  html[data-theme="light"] .ui{--bad:#c42b3d;--ok:#157a42}
  a{color:var(--accent-text);text-decoration:none}
  a,button{touch-action:manipulation}
  button{font:inherit;color:inherit}
  a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  [hidden]{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:1040px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}
  @media (max-width:620px){.ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}html body.ui .ui-header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}

  /* ---- states (loading / sign-in / denied / empty) ---- */
  .state{padding:clamp(26px,5vw,44px) 22px;text-align:center;color:var(--muted)}
  .state .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .state p{margin:0;font:800 clamp(20px,2.8vw,24px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
  .state .ui-btn{margin-top:18px}
  .state.slim{padding:26px 18px}
  .state.slim .gate-ico{width:56px;height:56px;margin-bottom:12px;border-radius:18px;font-size:28px}
  .state.slim p{font-size:16px;font-weight:700;color:var(--muted)}

  /* ---- hero ---- */
  .hero .kicker{margin:0 0 6px;font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
  .hero .ui-title{margin:0 0 4px}
  .hero p.sub{margin:0;color:var(--muted);font-size:15px;line-height:1.45}

  /* ---- tabs ---- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border:0;border-radius:var(--r-chip);background:var(--card);color:var(--muted);font:750 15px var(--font-display);letter-spacing:-.01em;cursor:pointer;box-shadow:inset 0 0 0 1px var(--tile-edge);transition:transform .3s var(--ease),background-color .2s,box-shadow .2s,color .2s}
  .tab:hover{color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
  .tab:active{transform:scale(.97)}
  .tab.active{color:var(--accent-foreground);background:var(--accent);box-shadow:0 10px 24px -12px color-mix(in srgb,var(--accent) 75%,transparent)}
  .tab span{font-size:18px;line-height:1}
  .tab b{font:inherit}
  #panel{display:flex;flex-direction:column;gap:14px;min-width:0}
  #list{min-width:0}

  /* ---- photos ---- */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
  .ph{position:relative;aspect-ratio:1;overflow:hidden;border-radius:var(--r-tile);background:color-mix(in srgb,var(--text) 7%,var(--card-opaque));box-shadow:inset 0 0 0 1px var(--tile-edge),0 14px 30px -20px rgb(var(--ink)/.45);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
  .ph:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 48%,transparent),0 18px 34px -18px rgb(var(--ink)/.5)}
  .ph a{position:absolute;inset:0;display:block;border-radius:inherit}
  .ph a:focus-visible{outline-offset:-3px}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgb(0 0 0/.72));pointer-events:none;overflow-wrap:anywhere}
  .ph .del{position:absolute;top:6px;right:6px;background:rgb(0 0 0/.55);color:#fff;border-radius:var(--r-chip);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .ph .del:hover{background:var(--bad);color:#fff}

  /* ---- item cards (files, guestbook, chat) ---- */
  .items{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:flex-start;gap:14px;padding:14px 8px 14px 16px;border-radius:var(--r-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -20px rgb(var(--ink)/.35)}
  .item .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:var(--r-chip);font:800 19px/1 var(--font-display);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 18%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .item .ic.emoji{font-size:23px}
  .item .grow{flex:1;min-width:0;padding-top:1px}
  .item .t{font:750 16px/1.25 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
  .item a.t{display:inline-block;color:var(--text)}
  .item a.t:hover{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
  .item .sub{margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .item p{margin:6px 0 0;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .del{flex:none;display:grid;place-items:center;min-width:44px;min-height:44px;border:0;border-radius:var(--r-chip);background:none;font-size:16px;color:var(--muted);cursor:pointer;transition:color .2s,background-color .2s,transform .3s var(--ease)}
  .item .del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
  .del:active{transform:scale(.92)}

  /* ---- chat send box ---- */
  .send{display:flex;gap:8px;align-items:stretch}
  .send select.ui-input{width:auto;flex:none;padding-right:34px;font-weight:700;cursor:pointer}
  .send input.ui-input{flex:1;min-width:0}
  .send .ui-btn{flex:none;padding:12px 22px}
  .send .ui-btn:disabled,.ui-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .chat-note{margin:10px 2px 12px;color:var(--muted);font-size:13px;line-height:1.45}
  @media (max-width:520px){.tabs{gap:6px}.tab{padding:8px 12px;font-size:14px;gap:6px}.send{flex-wrap:wrap}.send select.ui-input{flex:1 1 100%}.send .ui-btn{flex:none}}

  /* ---- boards ---- */
  .boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:14px;align-items:start}
  .board{display:flex;flex-direction:column;gap:14px;padding:clamp(16px,2.6vw,22px);border-radius:var(--r-panel);background:var(--card);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -20px rgb(var(--ink)/.35)}
  .board .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .board h2{margin:0;font:800 20px var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
  .status{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font:700 13px var(--font-display);color:var(--muted);background:color-mix(in srgb,var(--text) 8%,var(--card-opaque));box-shadow:inset 0 0 0 1px var(--tile-edge);white-space:nowrap}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.6}
  .status.on{color:var(--text);background:color-mix(in srgb,var(--ok) 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 38%,transparent)}
  .status.on::before{background:var(--ok);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
  .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
  .kv div{padding:10px 12px;border-radius:var(--r-chip);background:color-mix(in srgb,var(--text) 5%,var(--card-opaque));box-shadow:inset 0 0 0 1px var(--tile-edge);min-width:0}
  .kv dt{margin:0;color:var(--muted);font-size:12px}
  .kv dd{margin:2px 0 0;font:750 15px var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .kv .wide{grid-column:1/-1}
  .kv .err{background:color-mix(in srgb,var(--bad) 14%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 38%,transparent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions .ui-btn{min-height:46px;padding:10px 18px;font-size:15px;gap:8px}
  .actions label.ui-btn:has(.sr-only:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
  .actions label.ui-btn.busy{opacity:.5;cursor:not-allowed}
  .cmdlog{padding:16px 20px}
  .cmdlog h2{margin:0 0 8px;font:800 14px var(--font-display);letter-spacing:.02em;color:var(--muted)}
  .cmdlog ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
  .cmdlog li{overflow-wrap:anywhere}
  .cmdlog b{color:var(--text);font-weight:700}

  @media (prefers-reduced-motion:reduce){.tab,.ph,.del,body.ui .ui-header .home{transition:none}.ph:hover{transform:none}}
</style>
