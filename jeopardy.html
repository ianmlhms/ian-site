<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<!-- App shell with almost no crawlable text, and deliberately not linked from
     the homepage or the tiles. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeopardy — Quizbrett fir Gruppen | ian.lu</title>
<meta name="description" content="Jeopardy-Brett fir Gruppen: wiel 5 aus 20 Kategorien, schreif eege Froen, wiel en Theme — an exportéier alles als Word-Dokument fir op Pabeier ze spillen.">
<link rel="canonical" href="https://ian.lu/jeopardy.html">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" data-gt="light">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" data-gt="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="gitter-theme.js?v=1"></script>
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=12">
<script src="theme.js?v=33"></script>
<style>
  /* Gitter: one light look; the old colour themes are retired (picker hidden), all four map to the same tokens */
  body.gt[data-jq]{--cell:var(--tint);--cellhi:#ecece7;--accent:var(--ink);--accent2:var(--green);--jq-text:var(--ink);--jq-muted:var(--muted);
    --line:var(--ink);--on-accent:var(--paper);--jq-accent-text:var(--green);--jq-accent2-text:var(--green);--jq-accent-foreground:var(--paper);--jq-neg:var(--danger)}
  #tTheme,#themes{display:none}
  .gt .sub,.gt .hint{text-align:left}
  *{box-sizing:border-box}
  
  body{margin:0;background:var(--bg);color:var(--jq-text);
    font-family:"Geist",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea{font:inherit}

  .bar-unused{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .bar>*{min-width:0}
  .bar .home{color:var(--jq-muted);font-weight:700;text-decoration:none;font-size:14px}
  .bar h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.5px;color:var(--jq-accent-text)}
  .bar .spacer{flex:1}
  .langs button{background:none;border:0;color:var(--jq-muted);font-weight:700;font-size:12px;padding:4px 15px;min-width:44px;min-height:44px}
  .langs button.on{color:var(--jq-accent-text)}

  .wrap{max-width:none;margin:0;padding:0}
  .gt .wrap{border:1px solid var(--ink);border-top:0;padding:20px 20px 28px;margin-top:0}
  .screen{display:none}.screen.on{display:block}

  h2{font-size:18px;margin:0 0 5px;font-weight:800}
  .sub{color:var(--jq-muted);font-size:13.5px;line-height:1.55;margin:0 0 14px}
  .card{background:var(--white);border:1px solid var(--ink);padding:15px;margin-bottom:12px}

  .btn{display:block;width:100%;padding:14px;min-height:44px;border-radius:0;border:0;background:var(--accent);
    color:var(--jq-accent-foreground);font-weight:800;font-size:16px;margin-top:9px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--jq-text)}
  .btn.small{padding:10px;font-size:14px}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:8px}.row .btn{margin-top:0}

  /* themes + categories */
  .themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  /* A round colour swatch has no content, so width:auto collapses it to its
     padding. Circles need an explicit box. */
  .th{width:44px;height:44px;border-radius:0;border:2px solid var(--line);padding:0}
  .th[aria-pressed="true"]{border-color:var(--jq-accent-text);transform:scale(1.1)}
  .grp{color:var(--jq-muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .cats>*{min-width:0}
  .catbtn{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:11px;text-align:left;font-size:14px;font-weight:700}
  .catbtn[aria-pressed="true"]{border-color:var(--jq-accent-text);color:var(--jq-accent-text)}
  .catbtn small{display:block;color:var(--jq-muted);font-weight:500;font-size:11.5px;margin-top:2px}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .chip{background:var(--cell);border:1px solid var(--line);border-radius:0;padding:6px 11px;font-size:14px;display:flex;align-items:center;gap:7px}
  .chip button{background:none;border:0;color:var(--jq-muted);padding:0;font-size:15px;line-height:1;min-width:44px;min-height:44px;margin:-12px -12px -12px -7px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;padding:11px;border-radius:0;border:1px solid var(--line);background:var(--bg);color:var(--jq-text);font-size:15px}
  .addrow input:focus{outline:2px solid var(--accent);outline-offset:-1px}

  /* board */
  .board{display:grid;gap:5px}
  .cat{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:8px 4px;text-align:center;
    font-weight:800;font-size:11px;text-transform:uppercase;color:var(--jq-accent-text);
    display:flex;align-items:center;justify-content:center;min-height:52px;line-height:1.25}
  .cellbtn{background:var(--cell);border:1px solid var(--line);border-radius:0;min-height:56px;
    font-weight:800;font-size:18px;color:var(--jq-accent-text);display:flex;align-items:center;justify-content:center}
  .cellbtn:hover:not(:disabled){background:var(--cellhi)}
  .cellbtn:disabled{background:transparent;border-style:dashed;opacity:.35}

  .scores{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:7px 11px;font-size:13.5px;min-width:90px}
  .sc b{display:block;font-size:18px;font-variant-numeric:tabular-nums;color:var(--jq-accent-text)}
  .sc.neg b{color:var(--jq-neg)}

  .clue{text-align:center}
  .clue .val{color:var(--jq-accent-text);font-weight:800;font-size:13.5px;letter-spacing:.5px}
  .clue .dd{color:var(--jq-accent2-text);font-weight:800;font-size:13px;margin-top:5px}
  .clue .q{font-size:23px;font-weight:700;line-height:1.35;margin:15px 0}
  .clue .a{font-size:21px;font-weight:800;color:var(--jq-accent-text);margin:13px 0}
  .who{display:grid;gap:7px;margin-top:5px}
  .who button{padding:12px;border-radius:0;border:1px solid var(--line);background:var(--cell);text-align:left;font-size:15px;font-weight:700}
  .who button.minus{background:transparent}
  .hint{color:var(--jq-muted);font-size:12.5px;text-align:center;margin-top:11px}
  .final{text-align:center}.final .win{font-size:25px;font-weight:800;color:var(--jq-accent-text);margin:9px 0}

  /* editor */
  .field{margin-bottom:10px}
  .field label{display:block;color:var(--jq-muted);font-size:12px;font-weight:700;margin-bottom:4px}
  .field input,.field textarea{width:100%;padding:11px;border-radius:0;border:1px solid var(--line);
    background:var(--bg);color:var(--jq-text);font-size:15px}
  .field textarea{min-height:56px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .qrow{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .qrow b{color:var(--jq-accent-text);font-size:13px}
  .mine{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .mine:last-child{border-bottom:0}
  .mine span button{background:none;border:0;color:var(--jq-muted);font-size:14px;padding:0 6px;min-width:44px;min-height:44px}

  /* site-glass.css frosts .field/.hint/.chip as if they were cards; here they are plain helper text and pills */
  .field,.hint,.chip{background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .chip{background:var(--cell)}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--jq-accent-text);outline-offset:2px}

  @media (max-width:520px){
    .cat{font-size:9px;min-height:44px;padding:5px 2px}
    .cellbtn{min-height:44px;font-size:15px}
    .clue .q{font-size:19px}
  }
</style>
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="gt" data-jq="classic">

<main class="gt-page"><div class="gt-grid"><header class="c full gt-nav">
  <div class="gt-nav-l"><a class="gt-back" href="./">‹ Heem</a><h1 class="gt-page-title">Jeopardy</h1></div>
  <nav class="langs" id="langs" aria-label="Sprooch" style="display:none">
    <button type="button" data-l="lb" class="on" lang="lb" aria-label="Lëtzebuergesch" aria-pressed="true">LB</button>
    <button type="button" data-l="de" lang="de" aria-label="Deutsch" aria-pressed="false">DE</button>
    <button type="button" data-l="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </nav>
</header></div>

<div class="wrap">

  <section class="screen on" id="s-setup">
    <h2 id="tTheme"></h2>
    <div class="themes" id="themes" role="group" aria-labelledby="tTheme"></div>

    <h2 style="margin-top:18px" id="tPick"></h2>
    <p class="sub" id="tPickSub"></p>
    <div id="catgroups"></div>

    <h2 style="margin-top:20px" id="tTeams"></h2>
    <div class="chips" id="chips"></div>
    <div class="addrow">
      <input id="tInput" type="text" maxlength="16" autocomplete="off">
      <button class="btn" style="width:auto;padding:11px 17px;margin:0" id="tAdd"><span aria-hidden="true">+</span></button>
    </div>
    <p class="hint" id="tWarn" role="status"></p>
    <button class="btn" id="start"></button>
    <div class="row" style="margin-top:9px">
      <button class="btn ghost small" id="toEdit"></button>
      <button class="btn ghost small" id="toWord"></button>
    </div>
  </section>

  <section class="screen" id="s-board">
    <div class="board" id="board"></div>
    <div class="scores" id="scores"></div>
    <button class="btn ghost small" id="quit" style="margin-top:15px"></button>
  </section>

  <section class="screen" id="s-clue"><div class="card clue" id="clue"></div></section>
  <section class="screen" id="s-end"><div class="card final" id="final"></div></section>

  <section class="screen" id="s-edit">
    <h2 id="tEdit"></h2>
    <p class="sub" id="tEditSub"></p>
    <div class="card" id="mine"></div>
    <div class="card" id="form"></div>
    <div class="row">
      <button class="btn ghost small" id="expJson"></button>
      <button class="btn ghost small" id="impJson"></button>
    </div>
    <button class="btn ghost" id="backSetup" style="margin-top:9px"></button>
    <input type="file" id="fileIn" accept="application/json" hidden>
  </section>

</div></main>

<script src="jeopardy-categories.js?v=3"></script>
<script src="jeopardy-docx.js?v=1"></script>
<script src="jeopardy-edit.js?v=2"></script>
<script src="jeopardy.js?v=5"></script>
</body>
</html>
