<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  a,button{touch-action:manipulation}
  button{font:inherit;color:inherit;cursor:pointer}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:3px}
  .ui{--bad:#e5484d}
  html[data-theme="light"] .ui{--bad:#c4262b}

  /* ---- room code row (the arcade bar moves it here) ---- */
  .ui .arcade-context{width:100%;max-width:700px;margin:0 auto;min-height:0;padding:14px max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left));border:0;background:none}
  .code{display:inline-flex;align-items:center;min-height:32px;padding:4px 14px;border-radius:var(--r-chip);background:var(--card-opaque);
    box-shadow:inset 0 0 0 1px var(--border);color:var(--text);font:700 13px var(--font-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .code:empty{display:none}

  /* ---- column + screens ---- */
  .ui .ui-page{max-width:700px;padding-top:18px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}
  @media (max-width:620px){.ui .ui-page,.ui .arcade-context{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
  .screen{display:none}
  .screen.on{display:flex;flex-direction:column;gap:14px;animation:rise .45s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .ui-card.card{margin:0}

  /* ---- lobby ---- */
  .hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px clamp(14px,3vw,22px)}
  .hero .ava{grid-row:span 2;display:grid;place-items:center;width:clamp(64px,10vw,84px);height:clamp(64px,10vw,84px);border-radius:clamp(20px,3vw,26px);font-size:clamp(34px,5vw,44px);line-height:1;
    background:color-mix(in srgb,var(--accent) 24%,var(--card-opaque));
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 34%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 24%,transparent),0 16px 30px -18px rgb(var(--ink)/.5);transform:rotate(-4deg)}
  .hero h2.ui-title{margin:0;align-self:end;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.04em}
  .hero .sub{margin:0;align-self:start}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0;text-wrap:pretty}
  .sub b{color:var(--text)}
  .lbl{margin:0 0 10px;font:800 12px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .lbl.gap{margin-top:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .row .pick{flex:1 1 0;min-width:64px}
  .pick{min-height:52px;padding:11px 14px;border:0;border-radius:var(--r-chip);background:var(--card-opaque);color:var(--text);
    font:700 15px/1.3 var(--font-display);letter-spacing:-.01em;text-align:center;box-shadow:inset 0 0 0 1px var(--border);
    transition:transform .3s var(--ease),background-color .2s,box-shadow .2s}
  .grid .pick{text-align:left}
  .pick small{font:500 12.5px var(--font-display);letter-spacing:0}
  .pick:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,var(--border))}
  .pick:active{transform:scale(.98)}
  .pick.on{background:var(--accent);color:var(--accent-foreground);box-shadow:0 10px 24px -12px color-mix(in srgb,var(--accent) 75%,transparent)}
  .pick.on small{opacity:.85!important}
  .note{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--muted);
    background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;padding:0}
  .note:empty{display:none}
  .note.warn,.warn{color:var(--bad)}
  #joinHint b{display:block;margin-top:8px;padding:10px 12px;border-radius:var(--r-chip);background:var(--card-opaque);box-shadow:inset 0 0 0 1px var(--border);
    color:var(--text);font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
  .tag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:11px;background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque));
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text);font:700 11px var(--font-display)}

  /* ---- buttons ---- */
  .btn{width:100%}
  .btn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
  .btn.ui-btn--primary:disabled{box-shadow:none}
  a.btn{text-align:center}

  /* ---- play ---- */
  .stage{text-align:center;padding:clamp(22px,4vw,34px) 18px}
  .disc{position:relative;display:grid;place-items:center;width:clamp(120px,22vw,150px);height:clamp(120px,22vw,150px);margin:0 auto 18px;border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%,#1b1426 0 2px,#0f0a18 2px 4px);
    box-shadow:0 0 0 1px rgb(255 255 255/.08),0 22px 36px -18px rgb(var(--ink)/.7),inset 0 0 0 6px #0d0814}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 20deg,transparent 0 18%,rgb(255 255 255/.12) 25%,transparent 32% 68%,rgb(255 255 255/.1) 75%,transparent 82%)}
  .disc span{position:relative;display:grid;place-items:center;width:46%;height:46%;border-radius:50%;font-size:clamp(22px,4.4vw,30px);line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 3px #0d0814}
  .disc.spin{animation:sp 3s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .secs{font:900 clamp(40px,8vw,56px)/1 var(--font-display);letter-spacing:-.04em;color:var(--accent-text);font-variant-numeric:tabular-nums}
  .stepbar{display:flex;gap:6px;justify-content:center;margin:16px 0 6px}
  .stepbar i{width:34px;height:6px;border-radius:3px;background:var(--border);transition:background-color .3s}
  .stepbar i.done{background:var(--accent);box-shadow:0 0 12px -2px color-mix(in srgb,var(--accent) 70%,transparent)}
  #playSub{margin:10px 0 0}
  #revWho{margin-top:10px}
  .answers{display:grid;gap:10px}
  .ans{display:block;width:100%;min-height:60px;padding:14px 18px;border:0;border-radius:var(--r-tile);background:var(--card);color:var(--text);
    text-align:left;font-size:14px;line-height:1.35;
    box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 14px 30px -18px rgb(var(--ink)/.35);
    transition:transform .3s var(--ease),background-color .2s,box-shadow .3s var(--ease)}
  .ans b{display:block;font:750 16.5px/1.25 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
  .ans small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
  .ans:hover:not(:disabled){transform:translateY(-3px);background:var(--card-opaque);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 48%,transparent),0 18px 34px -18px rgb(var(--ink)/.5)}
  .ans:active:not(:disabled){transform:scale(.985);transition-duration:.08s}
  .ans.sel,.ans.sel:disabled{background:color-mix(in srgb,var(--accent) 22%,var(--card-opaque));opacity:1;box-shadow:inset 0 0 0 2px var(--accent)}
  .ans:disabled{opacity:.6;cursor:default}

  /* ---- scores ---- */
  .sc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-chip);font-size:15px}
  .sc + .sc{margin-top:2px}
  .sc b{font:800 16px var(--font-display);font-variant-numeric:tabular-nums}
  .sc span{overflow-wrap:anywhere}
  .sc.me{background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent);font-weight:700}

  /* ---- reveal + final ---- */
  .big{margin:6px 0;font:800 clamp(22px,4vw,28px)/1.15 var(--font-display);letter-spacing:-.025em;overflow-wrap:anywhere}
  .art{display:block;width:140px;height:140px;margin:0 auto 14px;border-radius:24px;background:var(--card-opaque);
    box-shadow:inset 0 0 0 1px var(--tile-edge),0 22px 34px -18px rgb(var(--ink)/.6);object-fit:cover}
  .art[src=""],.art:not([src]){display:none}
  #revArtist{font-size:16px}
  .trophy{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 12px;border-radius:26px;font-size:46px;line-height:1;
    background:color-mix(in srgb,var(--accent) 22%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 32%,transparent);transform:rotate(-4deg)}

  @media (prefers-reduced-motion:reduce){
    .disc.spin{animation:none}
    .screen.on{animation:none}
    .pick,.ans,.stepbar i{transition:none}
    .hero .ava,.trophy{transform:none}
  }
  @media (prefers-contrast:more){.pick,.ans,.code,.sc.me{box-shadow:0 0 0 2px var(--text)}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body class="ui">

<header class="bar">
  <a class="home-link" href="pixelbreak.html">‹ Arcade</a>
  <h1>GUESS THE SONG</h1>
  <span class="code" id="roomCode"></span>
</header>

<main class="ui-page">

  <!-- ---------- lobby ---------- -->
  <section class="screen on" id="s-lobby">
    <div class="card ui-card ui-card--accent hero">
      <div class="ava" aria-hidden="true">🎵</div>
      <h2 class="ui-title">Rot d'Lidd</h2>
      <p class="sub">Éischt <b>1 Sekonn</b>, dann 3, dann 5 … wie fréi erkennt, kritt méi Punkten.</p>
    </div>

    <div class="card ui-card" id="hostCfg">
      <div class="lbl" id="lblCats">Kategorie</div>
      <div class="grid" id="cats" role="group" aria-labelledby="lblCats"></div>

      <div class="lbl gap" id="lblCounts">Wéi vill Lidder</div>
      <div class="row" id="counts" role="group" aria-labelledby="lblCounts"></div>

      <div class="lbl gap" id="lblModes">Toun</div>
      <div class="row" id="modes" role="group" aria-labelledby="lblModes"></div>
      <p class="note" id="modeNote" role="status"></p>
    </div>

    <div class="card ui-card">
      <div class="lbl">Spiller</div>
      <div id="lobbyPlayers"></div>
      <p class="note" id="joinHint"></p>
    </div>

    <button class="btn ui-btn ui-btn--primary" id="startBtn">Starten</button>
    <p class="note" id="lobbyNote" role="status"></p>
  </section>

  <!-- ---------- play ---------- -->
  <section class="screen" id="s-play">
    <div class="card ui-card stage">
      <div class="disc" id="disc" aria-hidden="true"><span>🎵</span></div>
      <div class="secs" id="secs">1s</div>
      <div class="stepbar" id="stepbar" aria-hidden="true"></div>
      <div class="sub" id="playSub" role="status"></div>
    </div>
    <div class="answers" id="answers"></div>
    <button class="btn ui-btn ui-btn--ghost" id="moreBtn">Méi héieren ▸</button>
    <div class="card ui-card">
      <div class="lbl">Punkten</div>
      <div id="playScores"></div>
    </div>
  </section>

  <!-- ---------- reveal ---------- -->
  <section class="screen" id="s-reveal">
    <div class="card ui-card stage">
      <img class="art" id="revArt" alt="">
      <div class="big" id="revTitle" role="status"></div>
      <div class="sub" id="revArtist"></div>
      <div class="sub" id="revWho" role="status"></div>
    </div>
    <div class="card ui-card">
      <div class="lbl">Punkten</div>
      <div id="revScores"></div>
    </div>
    <button class="btn ui-btn ui-btn--primary" id="nextBtn">Weider ▸</button>
  </section>

  <!-- ---------- final ---------- -->
  <section class="screen" id="s-final">
    <div class="card ui-card stage">
      <div class="trophy" aria-hidden="true">🏆</div>
      <div class="big" id="winner" role="status"></div>
    </div>
    <div class="card ui-card">
      <div class="lbl">Schlussstand</div>
      <div id="finalScores"></div>
    </div>
    <button class="btn ui-btn ui-btn--primary" id="againBtn">Nach eng Kéier</button>
    <a class="btn ui-btn ui-btn--ghost" href="pixelbreak.html">Zréck bei d'Spiller</a>
  </section>

</main>

<audio id="player" preload="auto" playsinline></audio>
