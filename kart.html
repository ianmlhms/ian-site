<script src="pixelbreak-config.js"></script>
<script>
const cfg = window.PB_CONFIG || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => (""+(s??"")).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = (k) => (window.I18N ? window.I18N.t(k) : k);
const LOCALES = { lb:"lb-LU", de:"de-DE", en:"en-GB" };
const locale = () => {
  const l = LOCALES[window.I18N && window.I18N.lang];
  if (!l) return undefined;
  return Intl.DateTimeFormat.supportedLocalesOf(l).length ? l : "de-LU";
};

// ---- formatting ----
function fmtLap(s){
  if(s==null||isNaN(s)) return "—";
  const m=Math.floor(s/60), rest=s-m*60;
  const ss=rest.toFixed(3);
  return m>0 ? `${m}:${rest<10?"0":""}${ss}` : ss;
}
function fmtDelta(d){ if(d==null) return ""; if(d===0) return T("kart.best"); return "+"+d.toFixed(3); }
function fmtDate(iso){ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(locale(), {weekday:"short",day:"numeric",month:"short",year:"numeric"}) + " · " + d.toLocaleTimeString(locale(), {hour:"2-digit",minute:"2-digit"}); }

function stats(lapTimes){
  const laps = (lapTimes||[]).filter(x=>typeof x==="number"&&x>0);
  if(!laps.length) return {laps:[], best:null, avg:null, sd:null};
  const best = Math.min(...laps);
  const avg = laps.reduce((a,b)=>a+b,0)/laps.length;
  const sd = laps.length>=2 ? Math.sqrt(laps.reduce((a,b)=>a+(b-avg)*(b-avg),0)/laps.length) : null;
  return {laps, best, avg, sd};
}

// ---- track map (equirectangular, speed-coloured) ----
const hexRgb = (h) => { const m=/^#?([0-9a-f]{6})$/i.exec((h||"").trim()); if(!m) return null; const n=parseInt(m[1],16); return [n>>16&255, n>>8&255, n&255]; };
function drawMap(canvas, track){
  const pts = (track||[]).filter(p=>typeof p.lat==="number"&&typeof p.lon==="number");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const css = getComputedStyle(canvas);
  if(pts.length<2){ ctx.fillStyle=css.getPropertyValue("--muted").trim()||"#8888aa"; ctx.font="14px system-ui"; ctx.textAlign="center"; ctx.fillText(T("kart.noGps"), W/2, H/2); return false; }

  const lat0 = pts.reduce((a,p)=>a+p.lat,0)/pts.length;
  const k = Math.cos(lat0*Math.PI/180);
  const xs = pts.map(p=>p.lon*k), ys = pts.map(p=>p.lat);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad=26, spanX=(maxX-minX)||1e-6, spanY=(maxY-minY)||1e-6;
  const scale = Math.min((W-2*pad)/spanX, (H-2*pad)/spanY);
  const ox = (W-spanX*scale)/2, oy=(H-spanY*scale)/2;
  const X = x => ox + (x-minX)*scale;
  const Y = y => H - (oy + (y-minY)*scale);   // flip so north is up
  const maxSpd = Math.max(0.001, ...pts.map(p=>p.speed||0));
  const slow = hexRgb(css.getPropertyValue("--map-slow")) || [58,74,106];
  const fast = hexRgb(css.getPropertyValue("--map-fast")) || [77,232,255];
  const edge = css.getPropertyValue("--map-edge").trim() || "#2a2a4a";

  ctx.lineJoin="round"; ctx.lineCap="round";
  // soft road edge under the speed-coloured line
  ctx.lineWidth = 10; ctx.strokeStyle = edge;
  ctx.beginPath(); ctx.moveTo(X(xs[0]),Y(ys[0])); for(let i=1;i<pts.length;i++) ctx.lineTo(X(xs[i]),Y(ys[i])); ctx.stroke();
  ctx.lineWidth = 4;
  for(let i=1;i<pts.length;i++){
    const f = Math.min(1,(pts[i].speed||0)/maxSpd);
    const c = slow.map((v,j)=>Math.round(v+f*(fast[j]-v)));
    ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.moveTo(X(xs[i-1]),Y(ys[i-1])); ctx.lineTo(X(xs[i]),Y(ys[i])); ctx.stroke();
  }
  // start marker
  ctx.fillStyle=css.getPropertyValue("--best").trim()||"#3fb950"; ctx.strokeStyle=css.getPropertyValue("--card-opaque").trim()||"#fff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(X(xs[0]),Y(ys[0]),6,0,7); ctx.fill(); ctx.stroke();
  return true;
}

function setState(ico, html, err){
  $("content").innerHTML = `<div class="state ui-card${err?" is-err":""}" id="state" role="status"><div class="gate-ico" aria-hidden="true">${ico}</div>${html}</div>`;
}

let row = null, redrawMap = null;
function renderSession(){
  const s = stats(row.lapTimes);
  const topKmh = Math.max(0, ...(row.track||[]).map(p=>(p.speed||0)*3.6));
  const name = row.trackName || T("karts.session.title");
  document.title = T("kart.title") + (row.trackName ? " · " + row.trackName : "");
  const kpis = [
    {v:fmtLap(s.best), l:T("karts.bestLap"), best:true},
    {v:fmtLap(s.avg), l:T("kart.avgLap")},
    {v:s.laps.length, l:T("karts.laps")},
    {v:s.sd!=null?"±"+s.sd.toFixed(2)+"s":"—", l:T("kart.consistency")},
    {v:topKmh>0?topKmh.toFixed(0)+" km/h":"—", l:T("kart.topSpeed")},
    {v:row.maxHeartRate>0?Math.round(row.maxHeartRate)+" bpm":"—", l:T("kart.maxHr"), c:"var(--hr)"},
  ];
  const slowest = s.laps.length ? Math.max(...s.laps) : 0;
  const lapHtml = s.laps.map((t,i)=>{
    const best = t===s.best;
    const w = slowest>s.best ? 100-(t-s.best)/(slowest-s.best)*60 : 100;
    return `<div class="lap${best?" best":""}" role="listitem"><span class="n"><span aria-hidden="true">${esc(T("kart.lapShort"))}${i+1}</span><span class="sr-only">${esc(T("kart.lapWord"))} ${i+1}</span></span><span class="t">${fmtLap(t)}</span><span class="d">${fmtDelta(best?0:t-s.best)}</span><i class="pace" aria-hidden="true" style="--w:${w.toFixed(1)}%"></i></div>`;
  }).join("");
  const hr = row.avgHeartRate>0 ? `<span class="pill">${esc(T("kart.avgHr"))} ${Math.round(row.avgHeartRate)} bpm</span>` : "";
  const date = fmtDate(row.date);

  $("content").innerHTML = `
    <section class="ui-card ui-card--accent hero rise" style="--i:0">
      <div class="gate-ico" aria-hidden="true">🏎️</div>
      <div class="hero-txt"><h1 class="ui-title">${esc(name)}</h1>
      <div class="date">${date?`<span>${esc(date)}</span>`:""}${hr}</div></div>
    </section>
    <div class="kpis">${kpis.map((k,i)=>`<div class="kpi rise${k.best?" is-best":""}" style="--i:${i+1}"><div class="l">${esc(k.l)}</div><div class="v" style="${k.best?"--c:var(--best)":k.c?"--c:"+k.c:""}">${k.v}</div></div>`).join("")}</div>
    <div class="claim-host rise" id="claimHost" style="--i:7"></div>
    <section class="ui-card rise" style="--i:7">
      <h2 class="sec">${esc(T("kart.racingLine"))}</h2>
      <canvas id="map" role="img" aria-label="${esc(T("kart.mapAria"))}"></canvas>
      <div class="maplegend" aria-hidden="true"><span>${esc(T("kart.slow"))}</span><span class="grad"></span><span>${esc(T("kart.fast"))}</span></div>
    </section>
    <section class="ui-card rise" style="--i:8">
      <h2 class="sec">${esc(T("kart.lapTimes"))}</h2>
      ${lapHtml ? `<div class="laps" role="list">${lapHtml}</div>` : `<p class="no-laps">${esc(T("kart.noLaps"))}</p>`}
    </section>
    <footer>${esc(T("kart.recorded"))} <b>KartTracker</b> · <a href="index.html">ian.lu</a></footer>`;

  const canvas = $("map");
  redrawMap = () => drawMap(canvas, row.track);
  redrawMap();
  document.dispatchEvent(new CustomEvent("kart:rendered"));
}

async function boot(){
  const id = new URLSearchParams(location.search).get("s");
  if(!id){ setState("🔗", `<p>${esc(T("kart.noId"))}</p>`, true); return; }
  if(!cfg.url||!cfg.anonKey){ setState("☁️", `<p>${esc(T("kart.noCloud"))}</p>`, true); return; }
  let data;
  try{
    // kart_get() is the only read path — sessions are unlisted, the UUID is the key.
    const r = await fetch(`${cfg.url}/rest/v1/rpc/kart_get`, {
      method:"POST", cache:"no-store",
      headers:{ apikey:cfg.anonKey, Authorization:"Bearer "+cfg.anonKey, "Content-Type":"application/json" },
      body: JSON.stringify({ p_id: id }),
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    data = await r.json();
    if(!data){ setState("🔍", `<p>${esc(T("kart.notFound"))}</p>`); return; }
  }catch(e){
    setState("⚠️", `<p>${esc(T("kart.loadErr"))} (${esc(e && e.message || String(e))})</p><button class="ui-btn ui-btn--ghost" type="button" id="retry">${esc(T("kart.retry"))}</button>`, true);
    $("retry").onclick = () => { setState("🏎️", `<p>${esc(T("common.loading"))}</p>`); boot(); };
    return;
  }
  row = data;
  renderSession();
}
window.addEventListener("resize", () => { if(redrawMap) redrawMap(); });
document.addEventListener("i18n:change", () => { if(row) renderSession(); });
new MutationObserver(() => { if(redrawMap) redrawMap(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
boot();
</script>
