<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="$meta_desc" />
  <meta property="og:title" content="$og_title" />
  <meta property="og:description" content="$meta_desc" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://ian.lu/apple-touch-icon.png" />
  <link rel="canonical" href="$canonical" />
$alternates
  <title>$title</title>
  <link rel="stylesheet" href="../trails.css?v=5" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <!-- Google AdSense (public pages only) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6402871182747814" crossorigin="anonymous"></script>
  <script data-goatcounter="https://ianm.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="./">$site_name</a>
    <nav class="langs" aria-label="$lang_switch_label">$lang_links</nav>
  </header>

  <main class="wrap">
    <h1>$index_h1</h1>
    <div class="intro">
$intro_html
    </div>

    <div class="toolbar">
      <input class="search" id="q" type="search" autocomplete="off"
             placeholder="$search_placeholder" aria-label="$search_label" />
      <a class="map-btn" href="https://ian.lu/kaart/">$map_button</a>
    </div>

    <nav class="filters" aria-label="Filter">
      <button class="filter on" data-region="all">$filter_all</button>
$filter_buttons
    </nav>

    <div class="cards">
$cards_html
    </div>
    <p class="no-results" id="none" hidden>$no_results</p>

    <p class="sister">$sister_html</p>
    <p class="sister">$map_link</p>
  </main>

  <footer class="site-foot">$footer_note · <a href="https://ian.lu/" rel="noopener">ian.lu</a> · $privacy</footer>

  <script>
    document.querySelectorAll('.langs [data-lang]').forEach(function (a) {
      a.addEventListener('click', function () {
        try { localStorage.setItem('trails_lang', a.dataset.lang); } catch (e) { /* private mode */ }
      });
    });
    // Region buttons and the search box are two filters over one list, so
    // neither may set display on its own — they'd undo each other.
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));

    // Accent-blind, so "pedestre" finds "Pédestre" and "eislek" finds "Éislek".
    function fold(text) {
      var lower = text.toLowerCase();
      return lower.normalize ? lower.normalize('NFD').replace(/[\u0300-\u036f]/g, '') : lower;
    }

    // Name + region + teaser only. The whole card would also carry the CTA
    // text, which every card shares — every query would match everything.
    var haystacks = cards.map(function (card) {
      return fold(['h3', '.region', '.teaser'].map(function (sel) {
        var el = card.querySelector(sel);
        return el ? el.textContent : '';
      }).join(' '));
    });
    var empty = document.getElementById('none');
    var search = document.getElementById('q');
    var region = 'all';

    function apply() {
      var needle = fold(search.value.trim());
      var shown = 0;
      cards.forEach(function (card, i) {
        var hit = (region === 'all' || card.dataset.region === region) &&
                  (needle === '' || haystacks[i].indexOf(needle) !== -1);
        card.style.display = hit ? '' : 'none';
        if (hit) { shown += 1; }
      });
      empty.hidden = shown > 0;
    }

    document.querySelectorAll('.filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter').forEach(function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        region = btn.dataset.region;
        apply();
      });
    });
    search.addEventListener('input', apply);
  </script>
</body>
</html>
