<section class="section rating" aria-labelledby="$id">
  <div class="section-heading"><p class="kicker">$kicker</p><h2 id="$id">$label</h2></div>
  <a class="rating-badge" href="$source" target="_blank" rel="noopener">
    <span class="rating-score">$score</span>
    <span class="rating-details"><span>$count $reviews</span><span>$source_label</span></span>
  </a>
</section>
