<section class="section booking" aria-labelledby="$id">
  <div class="section-heading"><p class="kicker">$kicker</p><h2 id="$id">$title</h2>$intro</div>
  <div data-booking-panel>
    <form class="booking-form" data-booking-form$confirmation>
      <div class="booking-fields">$fields</div>
      <button class="booking-submit" type="submit">$submit</button>
    </form>
    <p class="booking-demo">$demo</p>
  </div>
</section>
