<section class="hero" aria-labelledby="hero-title">
  <img src="$image" alt="$image_alt"$dimensions
       loading="eager" fetchpriority="high" decoding="async">
  <div class="hero-shade"></div>
  <div class="hero-copy">
    <p class="eyebrow">$name</p>
    <h1 id="hero-title">$title</h1>
$subtitle
    <div class="hero-actions"><a class="button button-light" href="$phone_href">$call_label</a><a class="button button-outline" href="$map_href" target="_blank" rel="noopener">$directions_label</a></div>
  </div>
</section>
