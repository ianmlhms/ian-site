<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex,follow" />
  <!-- Auth-gated app shell: almost no crawlable text, so it is kept out of the
       index rather than offered to Google as a near-empty page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📷 Fotobuch — ian.lu</title>
<meta name="description" content="Privat Fotoauswiel fir d'Fotobuch.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=25"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a{touch-action:manipulation}
  button{font:inherit;color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  [hidden]{display:none!important}
  .muted{color:var(--muted)}

  /* ---- header + column (site-ui look) ---- */
  html body.ui .ui-header{max-width:680px;gap:10px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .ui-header .lead{display:flex;align-items:center;gap:12px;min-width:0}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:transform .3s var(--ease),background-color .2s,border-color .2s}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  .ui-header h1.ui-brand{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 14px;border-radius:999px;font:700 13px var(--font-display);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent)}
  .who:empty{display:none}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:680px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(96px,calc(72px + env(safe-area-inset-bottom)))}
  .ui .ui-page.is-photo{max-width:760px}
  .ui .ui-page.is-wide{max-width:1040px}
  html body.ui[data-width=photo] .ui-header{max-width:760px}
  html body.ui[data-width=wide] .ui-header{max-width:1040px}
  #gateWrap{padding-top:max(56px,calc(24px + env(safe-area-inset-top)))}
  #screen{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* ---- messages + states ---- */
  .msg{margin:0;font-size:14px;font-weight:700;color:var(--text)}
  .msg:empty{display:none}
  .msg:not(:empty){padding:12px 16px;border-radius:var(--r-chip);background:color-mix(in srgb,#ef5b6b 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,#ef5b6b 40%,transparent)}
  .state{padding:clamp(26px,5vw,44px) 22px;text-align:center;color:var(--muted)}
  .state .gate-ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
  .state h2,.state p.big{margin:0;font:800 clamp(20px,2.8vw,24px)/1.25 var(--font-display);letter-spacing:-.02em;color:var(--text);text-wrap:balance}
  .state p{margin:8px 0 0}
  .state p.big{margin:0}
  .state .ui-btn{margin-top:18px}
  .state .undo{display:block;margin:10px auto 0}

  /* ---- home ---- */
  .hero .kicker{margin:0 0 6px;font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
  .hero .ui-title{margin:0 0 4px}
  .hero p.sub{margin:0;color:var(--muted);font-size:15px}
  .prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:20px;font-size:14px}
  .prog-row span{color:var(--muted);font-variant-numeric:tabular-nums}
  .progress{height:12px;margin:8px 0 0;overflow:hidden;border-radius:999px;background:color-mix(in srgb,var(--text) 10%,transparent)}
  .progress span{display:block;height:100%;min-width:12px;border-radius:999px;background:var(--accent);transition:width .5s var(--ease)}
  .progress.slim{height:6px;margin:0}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .stat{padding:16px 10px;border-radius:var(--r-tile);background:var(--card);text-align:center;box-shadow:inset 0 0 0 1px var(--tile-edge)}
  .stat strong{display:block;font:800 clamp(24px,4vw,32px)/1.1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .stat span{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .menu{display:flex;flex-direction:column;gap:12px}
  button.ui-tile{width:100%;font:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
  button.ui-tile:disabled{cursor:not-allowed;opacity:.5;transform:none;box-shadow:inset 0 0 0 1px var(--tile-edge)}
  button.ui-tile:disabled:hover .ui-tile__ico{transform:none}
  .ui-tile .ui-tile__badge{font-size:20px;opacity:.5}
  .fv-hint{margin:0 2px;font-size:13px;line-height:1.45;color:var(--muted)}

  /* ---- swipe + duel ---- */
  .stage-head{display:flex;align-items:center;gap:12px}
  .stage-head h2{margin:0;font:800 20px var(--font-display);letter-spacing:-.02em}
  .stage-head .spacer{flex:1}
  .stage-head .ui-btn{min-height:44px;padding:8px 16px;font-size:14px}
  .pill{padding:6px 14px;border-radius:999px;font:700 13px var(--font-display);font-variant-numeric:tabular-nums;color:var(--text);background:color-mix(in srgb,var(--accent) 14%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent);white-space:nowrap}
  .photo-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px;color:var(--muted);font-size:13.5px}
  .photo-meta strong{color:var(--text);font-variant-numeric:tabular-nums}
  .photo-stage,.duel-pick{background:color-mix(in srgb,var(--text) 7%,var(--card-opaque));box-shadow:inset 0 0 0 1px var(--tile-edge),0 14px 34px -20px rgb(var(--ink)/.45)}
  .photo-stage{height:clamp(280px,calc(100svh - 460px),980px);display:flex;align-items:center;justify-content:center;border-radius:var(--r-panel);overflow:hidden}
  .photo-stage img{width:100%;height:100%;object-fit:contain;-webkit-user-select:none;user-select:none}
  .swipe-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .swipe-actions .ui-btn{min-height:58px;font-size:18px;gap:8px;border-radius:var(--r-tile)}
  .skip{background:var(--card)}
  .skip:hover{border-color:color-mix(in srgb,#ef5b6b 60%,var(--border));background:color-mix(in srgb,#ef5b6b 10%,transparent)}
  .undo{align-self:center;min-height:44px;padding:8px 18px;border:0;border-radius:var(--r-chip);background:none;color:var(--accent-text);font:800 15px var(--font-display);cursor:pointer}
  .undo:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .undo:disabled{color:var(--muted);opacity:.7;cursor:not-allowed}
  .ui-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .duel-grid{height:clamp(320px,calc(100svh - 380px),980px);display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .duel-pick{position:relative;padding:0;border:0;border-radius:var(--r-panel);overflow:hidden;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
  .duel-pick:hover:not(:disabled){transform:translateY(-3px);box-shadow:inset 0 0 0 3px var(--accent),0 18px 34px -18px rgb(var(--ink)/.5)}
  .duel-pick:active:not(:disabled){transform:scale(.99)}
  .duel-pick:focus-visible{outline-offset:-3px}
  .duel-pick:disabled{cursor:progress;opacity:.7}
  .duel-pick img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-select:none;user-select:none}
  .duel-pick .key{position:absolute;left:12px;bottom:12px;display:grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;font:800 16px var(--font-display);color:var(--accent-foreground);background:var(--accent);box-shadow:0 6px 16px -6px rgb(var(--ink)/.6)}

  /* ---- standings ---- */
  .standings{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
  .standing{padding:8px 8px 12px;border-radius:var(--r-tile)}
  .standing img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:color-mix(in srgb,var(--text) 7%,var(--card-opaque))}
  .standing p{margin:9px 6px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
  .standing .rank{display:inline-block;margin-bottom:2px;padding:1px 10px;border-radius:999px;font:800 13px var(--font-display);color:var(--accent-foreground);background:var(--accent)}
  .standings .fv-empty{grid-column:1/-1}

  @media(max-width:680px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    .ui .ui-page{padding-top:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .stats{gap:8px}
    .stat{padding:14px 6px}
    .duel-grid{height:auto;grid-template-columns:1fr}
    .duel-pick{height:calc(50svh - 175px);min-height:190px}
    .photo-stage{height:clamp(260px,calc(100svh - 485px),700px)}
    .ui .ui-page{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
    .fv-hint{display:none}
    .swipe-actions .ui-btn{min-height:54px;font-size:17px}
  }
  @media(max-width:380px){.ui-header h1.ui-brand{font-size:17px}.who{max-width:36%}}
  @media (prefers-reduced-motion:reduce){body.ui .ui-header .home,.ui-btn,.duel-pick,.progress span{transition:none}.duel-pick:hover:not(:disabled){transform:none}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header" id="bar" hidden>
  <div class="lead">
    <a class="home" href="index.html">‹ Heem</a>
    <h1 class="ui-brand"><span aria-hidden="true">📷</span> Fotobuch</h1>
  </div>
  <span class="who" id="who"></span>
</header>

<div class="ui-page" id="gateWrap">
  <!-- Starts neutral: the lock text is only swapped in once the token has
       actually been checked, so a valid voter never sees it flash by. -->
  <div class="ui-card state" id="gateMsg" role="status"><div class="gate-ico" aria-hidden="true">📷</div><p class="big">Lueden…</p></div>
</div>

<main class="ui-page" id="app" hidden>
  <section id="screen"></section>
  <div class="msg" id="msg" role="status"></div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module" src="./fotovote.js?v=3"></script>
</body>
</html>
