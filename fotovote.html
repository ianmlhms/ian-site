<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex,follow" />
  <!-- Auth-gated app shell: almost no crawlable text, so it is kept out of the
       index rather than offered to Google as a near-empty page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📷 Fotobuch — ian.lu</title>
<meta name="description" content="Privat Fotoauswiel fir d'Fotobuch.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=18"></script>
<style>
  :root{--bg:#0d0d1a;--card:#161625;--card2:#1e1e35;--border:#2a2a4a;--text:#e8e8f0;--muted:#8888aa;--accent:#6ea8fe;--accent2:#4de8ff;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  a{color:var(--accent2-text);text-decoration:none}
  .bar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border)}
  .bar .home{color:var(--muted);font-weight:700}.bar h1{font-size:18px;margin:0}.bar .spacer{flex:1}
  .wrap{flex:1;width:100%;max-width:640px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;gap:14px}
  .wrap.wide{max-width:1200px;padding-bottom:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
  .btn{background:var(--accent);color:var(--accent-foreground);border:1px solid var(--accent-border);border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:15px}
  .btn.secondary{background:var(--card2);color:var(--accent-text)}
  .btn:disabled{cursor:not-allowed;opacity:.45}
  .gate{text-align:center;color:var(--muted);padding:22px}
  .msg{min-height:18px;color:var(--accent2-text);font-weight:700;font-size:13px}
  .title{font-size:22px;margin:0 0 6px}.muted{color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .stat{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
  .stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
  .progress{height:12px;background:var(--card2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .progress span{display:block;height:100%;background:var(--accent);border-right:1px solid var(--accent-border)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:130px}
  .hint{font-size:12px;color:var(--muted);margin:7px 0 0}
  .stage-head{display:flex;align-items:center;gap:12px}.stage-head h2{margin:0;font-size:18px}.stage-head .spacer{flex:1}
  .photo-stage{height:calc(100svh - 230px);min-height:300px;display:flex;align-items:center;justify-content:center;background:#050509;border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .photo-stage img{width:100%;height:100%;object-fit:contain}
  .photo-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}
  .swipe-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .swipe-actions .btn{font-size:18px;padding:14px}.skip{background:var(--card2);color:var(--text);border-color:var(--border)}
  .keep{background:var(--accent);color:var(--accent-foreground)}
  .undo{align-self:center;background:none;border:0;color:var(--accent-text);font-weight:800;cursor:pointer;padding:8px}
  .undo:disabled{color:var(--muted);cursor:not-allowed}
  .duel-grid{height:calc(100svh - 180px);min-height:420px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .duel-pick{padding:0;background:#050509;border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer}
  .duel-pick:hover,.duel-pick:focus-visible{border-color:var(--accent-border)}
  .duel-pick img{display:block;width:100%;height:100%;object-fit:contain}
  .standings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .standing{padding:8px}.standing img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#050509}
  .standing p{margin:7px 0 0;font-size:12px}.rank{font-weight:900;color:var(--accent-text)}
  [hidden]{display:none!important}
  @media(max-width:680px){.duel-grid{height:auto;min-height:0;grid-template-columns:1fr}.duel-pick{height:calc(50svh - 105px);min-height:220px}.photo-stage{height:calc(100svh - 250px)}.stats{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:18px}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
<header class="bar" id="bar" hidden>
  <a class="home" href="index.html">‹ Heem</a>
  <h1>📷 Fotobuch</h1>
  <div class="spacer"></div>
  <span id="who"></span>
</header>

<div class="wrap" id="gateWrap">
  <!-- Starts neutral: the lock text is only swapped in once the token has
       actually been checked, so a valid voter never sees it flash by. -->
  <div class="card gate" id="gateMsg">Lueden…</div>
</div>

<main class="wrap" id="app" hidden>
  <section id="screen"></section>
  <div class="msg" id="msg" role="status"></div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="./fotovote.js?v=1"></script>
</body>
</html>
