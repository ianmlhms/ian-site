<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Karting-Kont — ian.lu</title>
<meta name="description" content="Manage your KartTracker sessions and linked Garmin watches.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f6f6f3">
<script src="theme.js?v=32"></script>
<script src="i18n-dict.js?v=54"></script>
<script src="i18n.js?v=5"></script>
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=9">
<style>
  .gt-page{max-width:860px}
  .gt .kp{padding:20px;gap:14px;justify-content:flex-start}
  #app{display:flex;flex-direction:column;gap:14px;min-width:0}
  .gt .ui-card{border:1px solid var(--ink);padding:18px 20px}
  .hero{display:flex;align-items:center;gap:16px}
  .hero-ico,.empty-ico{display:grid;place-items:center;flex:none;width:56px;height:56px;border:1px solid var(--ink);background:var(--tint);font-size:28px}
  .hero h1{font:800 clamp(22px,4vw,28px)/1.15 "Geist",system-ui,sans-serif;letter-spacing:-.03em}
  .hero p{margin:4px 0 0;color:var(--muted);line-height:1.45}
  .auth-card{width:100%;max-width:520px;margin:0 auto}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:20px;border:1px solid var(--ink)}
  .tab{min-height:44px;border:0;background:var(--white);color:var(--ink);font:600 14px "Geist",system-ui,sans-serif;cursor:pointer}
  .tab+.tab{border-left:1px solid var(--ink)}
  .tab.on{background:var(--ink);color:var(--paper)}
  .form{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font:500 12px/1.2 "Geist Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .link-button{min-height:44px;padding:8px 2px;border:0;background:none;color:var(--green);font:600 13px inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .small-link{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--soft);color:var(--muted);font-size:13px;line-height:1.45}
  .small-link button{display:inline;border:0;background:none;padding:8px 2px;color:var(--green);font:600 inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .msg{min-height:20px;margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
  .msg.ok{color:var(--green);font-weight:600}.msg.err{color:var(--danger);font-weight:600}
  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .dash-head p{margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .section-head h2{font:800 18px "Geist",system-ui,sans-serif;letter-spacing:-.02em}
  .count{color:var(--muted);font:500 13px "Geist Mono",ui-monospace,monospace}
  .stack{display:flex;flex-direction:column;gap:10px}
  .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:14px 16px;background:var(--white);border:1px solid var(--soft);min-width:0}
  .item-main{min-width:0}
  .item-title{font:700 16px/1.3 "Geist",system-ui,sans-serif;overflow-wrap:anywhere}
  .item-sub{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .item-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
  .item-actions .ui-btn,.rename-form .ui-btn{min-height:44px;padding:8px 12px;font-size:13px}
  .danger{color:var(--danger)}
  .rename-form{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
  .empty{text-align:center;padding:22px 14px;color:var(--muted);line-height:1.5}
  .empty-ico{width:52px;height:52px;margin:0 auto 12px;font-size:26px}
  .empty p{max-width:520px;margin:0 auto}
  .loading{text-align:center;padding:32px;color:var(--muted)}
  .section-error{padding:16px;border:1px solid var(--danger);color:var(--danger)}
  .ui-btn:disabled{opacity:.5;cursor:default}
  @media(max-width:700px){.gt .kp{padding:14px}.hero{align-items:flex-start}.hero-ico{width:48px;height:48px;font-size:24px}.item{grid-template-columns:minmax(0,1fr)}.item-actions{justify-content:flex-start}.rename-form{grid-template-columns:minmax(0,1fr) auto}.rename-form .cancel{grid-column:1/-1}.dash-head .ui-btn{width:100%}}
</style>
</head>
<body class="gt">
<main class="gt-page">
<div class="gt-grid">
  <header class="c full gt-nav">
    <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">Karting-Kont</h1></div>
    <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
  </header>
  <div class="c full kp">
    <div id="app"><div class="ui-card loading" role="status">Lued …</div></div>
  </div>
</div>
</main>
<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module" src="kart-account.js?v=18"></script>
<script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
