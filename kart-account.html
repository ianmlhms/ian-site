<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Karting-Kont — ian.lu</title>
<meta name="description" content="Manage your KartTracker sessions and linked Garmin watches.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=27"></script>
<script src="i18n-dict.js?v=44"></script>
<script src="i18n.js?v=3"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text,var(--accent));text-decoration:none}
  button,a,input{touch-action:manipulation}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}
  html body.ui .ui-header{max-width:820px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1px solid var(--border);border-radius:var(--r-chip);color:var(--text);font:700 14px var(--font-display);white-space:nowrap}
  .langsw button{min-width:44px;min-height:44px}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:820px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}
  .hero{display:flex;align-items:center;gap:16px}
  .hero-ico,.empty-ico{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:20px;font-size:32px;background:color-mix(in srgb,var(--accent) 20%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
  .hero p{margin:4px 0 0;color:var(--muted);line-height:1.45}
  .auth-card{width:100%;max-width:520px;margin:0 auto}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin-bottom:20px;border-radius:var(--r-chip);background:color-mix(in srgb,var(--text) 5%,transparent)}
  .tab{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:750 14px var(--font-display);cursor:pointer}
  .tab.on{background:var(--card-opaque);color:var(--text);box-shadow:0 2px 12px rgb(var(--ink)/.12)}
  .form{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font:700 13px var(--font-display);color:var(--muted)}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .link-button{min-height:44px;padding:8px 2px;border:0;background:none;color:var(--accent-text,var(--accent));font:700 13px inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .small-link{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--tile-edge);color:var(--muted);font-size:13px;line-height:1.45}
  .small-link button{display:inline;border:0;background:none;padding:8px 2px;color:var(--accent-text,var(--accent));font:700 inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .msg{min-height:20px;margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
  .msg.ok{color:#3fb950}.msg.err{color:#ef5b6b}
  html[data-theme="light"] .msg.ok{color:#157a42}html[data-theme="light"] .msg.err{color:#b42335}
  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .dash-head p{margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .section-head h2{margin:0;font:800 19px var(--font-display);letter-spacing:-.02em}
  .count{color:var(--muted);font-size:13px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:14px 16px;border-radius:var(--r-tile);background:var(--card-opaque);box-shadow:inset 0 0 0 1px var(--tile-edge);min-width:0}
  .item-main{min-width:0}
  .item-title{font:750 16px/1.3 var(--font-display);overflow-wrap:anywhere}
  .item-sub{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .item-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
  .item-actions .ui-btn{min-height:44px;padding:8px 12px;font-size:13px}
  .danger{color:#ef5b6b}
  .rename-form{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
  .rename-form .ui-btn{min-height:44px;padding:8px 12px;font-size:13px}
  .empty{text-align:center;padding:22px 14px;color:var(--muted);line-height:1.5}
  .empty-ico{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;font-size:29px}
  .empty p{max-width:520px;margin:0 auto}
  .loading{text-align:center;padding:32px;color:var(--muted)}
  .section-error{padding:16px;border-radius:var(--r-chip);color:#ef5b6b;background:color-mix(in srgb,#ef5b6b 9%,transparent)}
  .ui-btn:disabled{opacity:.55;cursor:default;transform:none}
  @media(max-width:640px){
    html body.ui .ui-header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    .ui .ui-page{padding:16px max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .hero{align-items:flex-start}.hero-ico{width:52px;height:52px;border-radius:16px;font-size:27px}
    .item{grid-template-columns:minmax(0,1fr)}
    .item-actions{justify-content:flex-start}
    .rename-form{grid-template-columns:minmax(0,1fr) auto}.rename-form .cancel{grid-column:1/-1}
    .dash-head .ui-btn{width:100%}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="ui">
<header class="ui-header">
  <a class="home" href="index.html">‹ ian.lu</a>
  <div class="header-right"><span id="langSw"></span></div>
</header>
<main class="ui-page" id="app">
  <div class="ui-card loading" role="status">Lueden…</div>
</main>
<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module" src="kart-account.js?v=4"></script>
</body>
</html>
