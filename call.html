<style>
  /* Gitter look: light page; only the live remote video keeps a dark field (the picture itself). */
  .call-page{padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .topbar{flex-wrap:wrap;gap:0 12px;justify-content:flex-end;text-align:right}
  .topbar .who{font-weight:800;font-size:15px}
  .topbar .st{color:var(--muted);font-size:13.5px}
  #stage{position:relative;padding:0 !important;height:clamp(340px,calc(100svh - 230px),760px);background:var(--paper);overflow:hidden;display:block}
  #remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink)}
  #remote.waiting{opacity:0}
  #local{position:absolute;right:12px;top:12px;width:112px;height:150px;object-fit:cover;border:1px solid var(--paper);background:var(--ink);transform:scaleX(-1);z-index:4}
  #local.off{display:none}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2;text-align:center;padding:24px}
  .avatar{width:72px;height:72px;border:1px solid var(--ink);background:var(--white);display:flex;align-items:center;justify-content:center;font:800 28px "Geist",system-ui,sans-serif}
  .center .nm{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .center .sub{color:var(--muted);font-size:14px}
  .controls-cell{flex-direction:row !important;flex-wrap:wrap;gap:10px !important;align-items:center;justify-content:center !important}
  .cbtn{min-width:120px;min-height:48px;padding:0 18px;border:1px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);font:600 15px/1 "Geist",system-ui,sans-serif;cursor:pointer}
  .cbtn:hover{border-color:var(--green);color:var(--green)}
  .cbtn.off{background:var(--ink);color:var(--paper)}
  .cbtn.hang{background:var(--danger);border-color:var(--danger);color:#fff}
  .cbtn.hang:hover{background:#7d1818;border-color:#7d1818;color:#fff}
  .cbtn.answer{background:var(--green);border-color:var(--green);color:#fff}
  .msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--ink);z-index:6;background:var(--paper);font-weight:600}
  .msg a{color:var(--green)}
  .hidden{display:none!important}
  @media(max-width:700px){#local{width:84px;height:112px}.cbtn{flex:1 1 40%;min-width:0}}
</style>

<body class="gt">
<main class="gt-page call-page"><div class="gt-grid">
  <header class="c full gt-nav">

    </div>
  </header>

  <div class="c full" id="stage">
    <video id="remote" class="waiting" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>

    <div class="center" id="center">
      <div class="avatar" aria-hidden="true" id="avatarLetter"></div>
      <div class="nm" id="peerName">…</div>
      <div class="sub" id="centerSub" role="status" aria-live="polite" data-i18n="call.calling">Rifft un…</div>
    </div>

  </div>

  <div class="c full controls-cell hidden" id="controls">
    <button type="button" class="cbtn" id="micBtn" title="Mikro" aria-label="Mikro" aria-pressed="true">Mikro</button>
    <button type="button" class="cbtn answer hidden" id="answerBtn" title="Ofhiewen" aria-label="Ofhiewen"><span>Ofhiewen</span></button>
    <button type="button" class="cbtn hang" id="hangBtn" title="Opleeën" aria-label="Opleeën"><span>Opleeën</span></button>
    <button type="button" class="cbtn" id="camBtn" title="Kamera" aria-label="Kamera" aria-pressed="true">Kamera</button>
  </div>
</div></main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=40";
const $=(id)=>document.getElementById(id);
const T=(k)=>(window.I18N?window.I18N.t(k):k);
const q=new URLSearchParams(location.search);

// Control labels are page-local (i18n-dict.js is shared by ~50 pages).
const CTRL_LABELS={
  micBtn:{lb:"Mikro",de:"Mikrofon",en:"Microphone"},
  answerBtn:{lb:"Ofhiewen",de:"Annehmen",en:"Answer"},
  hangBtn:{lb:"Opleeën",de:"Auflegen",en:"Hang up"},
  camBtn:{lb:"Kamera",de:"Kamera",en:"Camera"},
};
function labelControls(){
  const lang=(window.I18N&&window.I18N.lang)||"lb";
  for(const [id,l] of Object.entries(CTRL_LABELS)){
    const b=$(id), text=l[lang]||l.en;
    b.setAttribute("aria-label",text); b.title=text;
  }
}
labelControls();
document.addEventListener("i18n:change",labelControls);

// caller: ?peer=<uid>&name=<name>   |   callee: ?call=<id>&peer=<uid>&name=<name>&answer=1
const isCallee=q.get("answer")==="1";
const peerId=q.get("peer")||"";
const peerName=q.get("name")||"…";
$("peerName").textContent=peerName; $("avatarLetter").textContent=(peerName.trim()[0]||"?").toUpperCase();

const MAX_NAME=80, MAX_SDP=65536, MAX_CANDIDATE=4096, MAX_ICE=256, MAX_ICE_FIELD=256;
const isObject=(v)=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const isText=(v,max)=>typeof v==="string"&&v.length<=max;
const isUserId=(v)=>typeof v==="string"&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(v);
const isCallId=(v)=>typeof v==="string"&&/^[a-z0-9.-]{1,80}$/i.test(v);
function isSignal(event,p){
  if(!isObject(p)||ended||p.from!==peerId||p.to!==me||p.callId!==callId) return false;
  const fields=["from","to","callId"];
  if(event==="offer"||event==="answer"){
    if(!isObject(p.sdp)||p.sdp.type!==event||!isText(p.sdp.sdp,MAX_SDP)||!p.sdp.sdp.startsWith("v=0")) return false;
    return Object.keys(p).every(k=>[...fields,"sdp"].includes(k))&&Object.keys(p.sdp).every(k=>["type","sdp"].includes(k));
  }
  if(event==="ice"){
    const c=p.c;
    if(!isObject(c)||!isText(c.candidate,MAX_CANDIDATE)) return false;
    if(c.sdpMid!=null&&!isText(c.sdpMid,MAX_ICE_FIELD)) return false;
    if(c.sdpMLineIndex!=null&&(!Number.isInteger(c.sdpMLineIndex)||c.sdpMLineIndex<0||c.sdpMLineIndex>=MAX_ICE)) return false;
    if(c.usernameFragment!=null&&!isText(c.usernameFragment,MAX_ICE_FIELD)) return false;
    return Object.keys(p).every(k=>[...fields,"c"].includes(k))&&Object.keys(c).every(k=>["candidate","sdpMid","sdpMLineIndex","usernameFragment"].includes(k));
  }
  return ["ready","ping","bye"].includes(event)&&Object.keys(p).every(k=>fields.includes(k));
}
function onSignal(event,apply){ return async ({payload})=>{
  if(!isSignal(event,payload)) return;
  try{ await apply(payload); }catch(e){ console.warn("[call] signal rejected",event,e); }
}; }
function signal(event,extra={}){ return room.send({type:"broadcast",event,payload:{...extra,from:me,to:peerId,callId}}); }

// STUN finds a direct path; TURN relays when the peers can't reach each other
// directly (different NATs / mobile data). TURN creds are minted server-side by
// the `turn` Edge Function (Metered secret stays off the client); fetched at
// call start. Falls back to STUN-only if the function is unreachable.
let ICE={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
]};
async function loadIce(){
  try{
    const token=auth.session()?.access_token;
    if(!token) throw new Error("signed-in session missing");
    const r=await fetch(`${PB_CONFIG.url}/functions/v1/turn`,{headers:{apikey:PB_CONFIG.anonKey,Authorization:`Bearer ${token}`}});
    const d=await r.json();
    if(d&&Array.isArray(d.iceServers)&&d.iceServers.length){ ICE={iceServers:d.iceServers}; console.log("[call] ICE servers loaded, TURN:",d.turn); }
  }catch(e){ console.warn("[call] TURN fetch failed, STUN only",e); }
}

let sb=null, me=null, myName=null, callId=null;
let room=null, inbox=null, pc=null, localStream=null;
let offered=false, remoteReady=false, pendingIce=[], pingTimer=null, ended=false, noAnswerTimer=null;

function fatal(html){ $("fatal").innerHTML=html; $("fatal").classList.remove("hidden"); $("center").classList.add("hidden"); }
function setStatus(s){ $("status").textContent=s; $("centerSub").textContent=s; }

async function boot(){
  if(!auth.authConfigured){ fatal(T("call.signin")); return; }
  sb=await auth.client();
  if(!auth.session()){ fatal(`${T("call.signin")} <a class="home-link" href="index.html">${T("nav.home")}</a>`); return; }
  if(!isUserId(peerId)||!isText(peerName,MAX_NAME)){ fatal(T("call.badLink")); return; }
  me=auth.session().user.id; myName=auth.username()||"?";
  callId=isCallee ? (q.get("call")||"") : (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
  if(!isCallId(callId)){ fatal(T("call.badLink")); return; }

  try{ localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); }
  catch(e){ fatal(T("call.noMedia")); return; }
  $("local").srcObject=localStream;
  $("who").textContent=peerName;
  $("topbar").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  wireControls();
  await loadIce();               // fetch TURN creds before creating the connection
  buildPeer();
  joinRoom();

  if(!isCallee){
    setStatus(T("call.calling"));
    ring("ring");                 // realtime inbox (rings if the callee has the site open)
    pushRing();                   // web push (system notification even if the site is closed)
    noAnswerTimer=setTimeout(()=>{ if(!remoteReady){ ring("cancel"); endCall(T("call.ended"),true); } },40000);
  }else{
    setStatus(T("call.connecting"));
  }
  window.addEventListener("pagehide",cleanup);
  window.addEventListener("beforeunload",cleanup);
}

function buildPeer(){
  pc=new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=(e)=>{
    if(e.candidate){ console.log("[call] local ICE", e.candidate.type, e.candidate.protocol); room && signal("ice",{c:e.candidate.toJSON()}); }
  };
  pc.ontrack=(e)=>{ if(noAnswerTimer){ clearTimeout(noAnswerTimer); noAnswerTimer=null; } const r=$("remote"); if(r.srcObject!==e.streams[0]){ r.srcObject=e.streams[0]; } r.classList.remove("waiting"); $("center").classList.add("hidden"); };
  pc.oniceconnectionstatechange=()=>console.log("[call] iceConnectionState", pc.iceConnectionState);
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState; console.log("[call] connectionState", s);
    if(s==="connected"){ setStatus(T("call.connected")); }
    else if(s==="failed"){ setStatus(T("call.lost")); }
    // "disconnected" is often transient — let ICE try to recover before giving up
  };
}

function joinRoom(){
  room=sb.channel("call:"+callId,{config:{broadcast:{self:false}}});
  room
    .on("broadcast",{event:"ready"},onSignal("ready",async ()=>{ if(!isCallee){ stopPing(); await makeOffer(); } }))
    .on("broadcast",{event:"ping"},onSignal("ping",()=>{ if(isCallee) return signal("ready"); }))
    .on("broadcast",{event:"offer"},onSignal("offer",async p=>{ if(isCallee&&pc.signalingState==="stable"&&!remoteReady) await onOffer(p.sdp); }))
    .on("broadcast",{event:"answer"},onSignal("answer",async p=>{ if(!isCallee&&pc.signalingState==="have-local-offer") await onAnswer(p.sdp); }))
    .on("broadcast",{event:"ice"},onSignal("ice",p=>addIce(p.c)))
    .on("broadcast",{event:"bye"},onSignal("bye",()=>endCall(T("call.ended"))))
    .subscribe((s)=>{
      if(s!=="SUBSCRIBED") return;
      if(isCallee){ signal("ready"); }
      else { startPing(); }   // ping until the callee is in the room, then offer
    });
}
function startPing(){ stopPing(); let n=0; pingTimer=setInterval(()=>{ if(++n>20){ stopPing(); return; } signal("ping"); },1000); signal("ping"); }
function stopPing(){ if(pingTimer){ clearInterval(pingTimer); pingTimer=null; } }

async function makeOffer(){
  if(offered||ended) return; offered=true;
  const o=await pc.createOffer(); await pc.setLocalDescription(o);
  signal("offer",{sdp:pc.localDescription.toJSON()});
}
async function onOffer(sdp){
  await pc.setRemoteDescription(sdp); remoteReady=true; flushIce();
  const a=await pc.createAnswer(); await pc.setLocalDescription(a);
  signal("answer",{sdp:pc.localDescription.toJSON()});
  setStatus(T("call.connecting"));
}
async function onAnswer(sdp){ await pc.setRemoteDescription(sdp); remoteReady=true; flushIce(); }
function addIce(c){ if(remoteReady) return pc.addIceCandidate(c); if(pendingIce.length<MAX_ICE) pendingIce=[...pendingIce,c]; }
function flushIce(){ pendingIce.forEach(c=>pc.addIceCandidate(c).catch(e=>console.warn("[call] ICE rejected",e))); pendingIce=[]; }

// send a message to the peer's personal ring inbox (subscribe, send once)
function ring(event){
  inbox=sb.channel("rtc:"+peerId,{config:{broadcast:{self:false}}});
  inbox.subscribe((s)=>{ if(s==="SUBSCRIBED"){ inbox.send({type:"broadcast",event,payload:{callId,from:me,to:peerId,fromName:myName}}); } });
}

// Fire a real Web Push so the callee gets a system notification even with the
// site closed (like a message). The notify function authenticates via our JWT
// and only pushes to accepted friends. Best-effort — never blocks the call.
async function pushRing(){
  try{
    const tok=auth.session()?.access_token; if(!tok) return;
    await fetch(`${PB_CONFIG.url}/functions/v1/notify`,{
      method:"POST",
      headers:{ "content-type":"application/json", apikey:PB_CONFIG.anonKey, Authorization:`Bearer ${tok}` },
      body:JSON.stringify({ type:"call", to:peerId, callId, fromName:myName }),
    });
  }catch(e){ console.warn("[call] push ring failed",e); }
}

function wireControls(){
  $("hangBtn").onclick=()=>{ if(!isCallee && !offered) ring("cancel"); endCall(T("call.ended"),true); };
  $("micBtn").onclick=()=>{
    const t=localStream.getAudioTracks()[0]; if(!t) return; t.enabled=!t.enabled;
    $("micBtn").classList.toggle("off",!t.enabled); $("micBtn").textContent=t.enabled?"Mikro":"Mikro aus"; $("micBtn").setAttribute("aria-pressed",String(t.enabled));
  };
  $("camBtn").onclick=()=>{
    const t=localStream.getVideoTracks()[0]; if(!t) return; t.enabled=!t.enabled;
    $("camBtn").textContent=t.enabled?"Kamera":"Kamera aus"; $("camBtn").classList.toggle("off",!t.enabled); $("local").classList.toggle("off",!t.enabled); $("camBtn").setAttribute("aria-pressed",String(t.enabled));
  };
}

function endCall(reason,sendBye){
  if(ended) return; ended=true;
  if(sendBye && room){ try{ signal("bye"); }catch{} }
  setStatus(reason); cleanup();
  setTimeout(()=>{ location.href="friends.html"; },900);
}
function cleanup(){
  stopPing(); if(noAnswerTimer){ clearTimeout(noAnswerTimer); noAnswerTimer=null; }
  try{ localStream&&localStream.getTracks().forEach(t=>t.stop()); }catch{}
  try{ pc&&pc.close(); }catch{}
  try{ room&&sb.removeChannel(room); }catch{}
  try{ inbox&&sb.removeChannel(inbox); }catch{}
}

boot();
</script>
</body>
</html>
