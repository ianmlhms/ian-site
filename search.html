<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sichen — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0d1a">
<script src="theme.js?v=25"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent-text);text-decoration:none}
  button,a{touch-action:manipulation}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}

  /* ---- header + column ---- */
  html body.ui .ui-header{max-width:720px;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ui .ui-page{display:flex;flex-direction:column;gap:14px;max-width:720px;padding-top:22px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(72px,calc(40px + env(safe-area-inset-bottom)))}
  @media (max-width:620px){.ui .ui-page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}html body.ui .ui-header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}

  /* ---- search field ---- */
  .field{position:relative}
  .field .mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:20px;line-height:1;pointer-events:none}
  #q.ui-input{min-height:56px;padding:14px 18px 14px 52px;border-radius:var(--r-tile);font:600 17px var(--font-display);letter-spacing:-.01em;-webkit-appearance:none;appearance:none}
  #q.ui-input::placeholder{font-weight:500}
  #q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;background:color-mix(in srgb,var(--muted) 35%,transparent)}

  /* ---- results ---- */
  #out{display:flex;flex-direction:column;gap:6px}
  .grp{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;color:var(--muted);font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
  .grp:first-child{margin-top:4px}
  .grp .n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:color-mix(in srgb,var(--h) 18%,var(--card-opaque));color:var(--text);font-size:11px;letter-spacing:0}
  .res{display:flex;flex-direction:column;gap:10px}
  .res .ui-tile{min-height:76px;padding:12px 16px}
  .res .ui-tile .ui-tile__ico{width:48px;height:48px;font-size:24px}
  .res .ui-tile .ui-tile__name{overflow-wrap:anywhere}
  .res .ui-tile .ui-tile__go{position:absolute;top:50%;right:16px;transform:translateY(-50%);color:var(--muted);font-size:22px;line-height:1;transition:transform .3s var(--ease),color .2s}
  .res .ui-tile:hover .ui-tile__go{color:var(--h);transform:translate(3px,-50%)}
  .res .ui-tile{padding-right:40px}

  /* ---- empty / loading / sign-in ---- */
  .gate{display:flex;margin:0;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:clamp(34px,8vw,64px) 22px}
  .gate .big{display:grid;place-items:center;width:72px;height:72px;margin-bottom:4px;border-radius:22px;font-size:36px;background:color-mix(in srgb,var(--accent) 18%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent)}
  .gate p{margin:0;max-width:30ch;line-height:1.4;overflow-wrap:anywhere}
  .gate .gt{color:var(--text);font:800 clamp(20px,3vw,24px) var(--font-display);letter-spacing:-.02em}
  .gate .ui-btn{margin-top:8px}

  @media (prefers-reduced-motion:reduce){body.ui .ui-header .home,.res .ui-tile .ui-tile__go{transition:none}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="ui">
<header class="ui-header">
  <div class="header-left">
    <a class="home" href="index.html">‹ Heem</a>
    <h1 class="ui-brand"><span aria-hidden="true">🔎</span> Sichen</h1>
  </div>
  <div class="header-right">
    <span id="acctHost"></span>
  </div>
</header>

<main class="ui-page">
  <div class="field">
    <span class="mag" aria-hidden="true">🔎</span>
    <input id="q" class="ui-input" type="search" enterkeyhint="search" spellcheck="false" aria-label="Sichen" aria-controls="out" placeholder="Sich no Leit, Hausaufgaben, Tester, Kaarten…" autocomplete="off">
  </div>
  <div id="out" role="status" aria-live="polite"><div class="gate ui-card"><div class="big" aria-hidden="true">🔎</div><p class="gt">Sichen</p><p>Fänk un ze tippen…</p></div></div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=22";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb=null,timer=null;

async function boot(){
  sb=await auth.client();
  auth.mountAccountButton($("acctHost"));
  if(!auth.session()){
    $("out").innerHTML=gate("🔒","Sichen","Mell dech un fir ze sichen.",`<button type="button" class="ui-btn ui-btn--primary" id="si">Umellen</button>`);
    $("si").onclick=auth.openAuthModal;return;
  }
  $("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,220);});
  $("q").focus();
}

function gate(big,title,text,extra=""){ return `<div class="gate ui-card"><div class="big" aria-hidden="true">${big}</div>${title?`<p class="gt">${title}</p>`:""}<p>${text}</p>${extra}</div>`; }
function grp(title,tint,rows){ return rows.length?`<div class="grp" style="--h:${tint}">${title}<span class="n">${rows.length}</span></div><div class="res">${rows.join("")}</div>`:""; }
function row(ic,tint,t,s,href){ return `<a class="ui-tile" style="--h:${tint}" href="${href}"><span class="ui-tile__ico" aria-hidden="true">${ic}</span><span class="ui-tile__name">${esc(t)}</span><span class="ui-tile__sub">${esc(s)}</span><span class="ui-tile__go" aria-hidden="true">›</span></a>`; }

async function run(){
  const q=$("q").value.trim();
  if(q.length<2){$("out").innerHTML=gate("🔎","Sichen","Fänk un ze tippen…");return;}
  $("out").innerHTML=gate("⏳","","Sichen…");
  const like="%"+q.replace(/[%_]/g,"")+"%";
  const [ppl,hw,ex,dk]=await Promise.all([
    sb.from("profiles").select("username,class").ilike("username",like).limit(8),
    sb.from("class_homework").select("id,title,subject").ilike("title",like).limit(8),
    sb.from("exams").select("id,subject,note").ilike("subject",like).limit(8),
    sb.from("flashcard_decks").select("id,title").ilike("title",like).limit(8),
  ]);
  const rPpl=(ppl.data||[]).map(p=>row("👤","#6ea8fe",p.username,p.class||"ian.lu-Spiller","profile.html?u="+encodeURIComponent(p.username)));
  const rHw=(hw.data||[]).map(h=>row("📋","#4fc37a",h.title,h.subject||"Hausaufgab","board.html"));
  const rEx=(ex.data||[]).map(e=>row("⏳","#f0a04b",e.subject,e.note||"Test","exams.html"));
  const rDk=(dk.data||[]).map(d=>row("🃏","#a78bfa",d.title,"Kaartekëscht","flashcards.html?deck="+d.id));
  const html=grp("Leit","#6ea8fe",rPpl)+grp("Hausaufgaben","#4fc37a",rHw)+grp("Tester","#f0a04b",rEx)+grp("Kaarten","#a78bfa",rDk);
  $("out").innerHTML=html||gate("🤷","Näischt fonnt",`Keng Resultater fir „${esc(q)}“.`);
}

auth.onAuth(boot);
boot();
</script>
  <script type="module" src="rtc-ring.js?v=18"></script>
  <script type="module" src="class-gate.js?v=19"></script>
</body>
</html>
