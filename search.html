<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" data-gt="light">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" data-gt="dark">

<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=12">

<style>
  button,a{touch-action:manipulation}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring,var(--accent));outline-offset:2px}

  /* ---- header + column ---- */

  /* ---- search field ---- */
  #q.ui-input,#q{min-height:56px;padding:14px 18px;font:600 18px "Geist",system-ui,sans-serif;letter-spacing:-.01em;border:1px solid var(--ink);border-radius:0;background:var(--white);width:100%;-webkit-appearance:none;appearance:none}
  #q:focus{outline:2px solid var(--green);outline-offset:-2px;border-color:var(--green)}
  .sfield{padding:0 !important}
  .sfield #q{border:0}
  #out{display:contents}
  .grp{flex-direction:row !important;justify-content:flex-start !important;align-items:center;gap:8px;background:var(--tint);padding:10px 20px !important;font:600 14px "Geist",system-ui,sans-serif;color:var(--muted)}
  .grp .n{margin-left:auto;font:500 13px "Geist Mono",ui-monospace,monospace}
  .res{padding:0 !important;gap:0 !important}
  .res a{display:flex;flex-direction:row;align-items:center;gap:12px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--soft);text-decoration:none}
  .res a:last-child{border-bottom:0}
  .res a:hover{background:var(--tint)}
  .res .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
  .res .sb{color:var(--muted);font-size:13.5px}
  .res .go{color:var(--muted);font-size:20px}
  .gate{align-items:flex-start;gap:6px !important;justify-content:flex-start !important;padding:24px 20px !important;color:var(--muted)}
  .gate .big{display:none}
  .gate p{margin:0;max-width:40ch;line-height:1.4;overflow-wrap:anywhere}
  .gate .gt{color:var(--ink);font:800 22px/1.2 "Geist",system-ui,sans-serif;letter-spacing:-.03em}
  .gate .gt-btn{margin-top:8px}
  .gt-page{padding-bottom:max(56px,calc(40px + env(safe-area-inset-bottom)))}
  @media(max-width:640px){.gt-nav{padding-inline:14px !important}}
</style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="gt">
<main class="gt-page">
<div class="gt-grid">
  <header class="c full gt-nav">
    <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">Siche</h1></div>
    <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
  </header>

  <div class="c full sfield">
    <input id="q" class="ui-input" type="search" enterkeyhint="search" spellcheck="false" aria-label="Sichen" aria-controls="out" placeholder="Sich no Leit, Hausaufgaben, Tester, Kaarten …" autocomplete="off">
  </div>
  <div id="out" role="status" aria-live="polite"><div class="c full gate"><div class="big" aria-hidden="true"></div><p class="gt">Sichen</p><p>Fänk un ze tippen…</p></div></div>
</div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=41";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb=null,timer=null;

async function boot(){
  sb=await auth.client();
  if(!auth.session()){
    $("out").innerHTML=gate("","Sichen","Mell dech un fir ze sichen.",`<button type="button" class="gt-btn" id="si">Umellen</button>`);
    $("si").onclick=auth.openAuthModal;return;
  }
  $("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,220);});
  $("q").focus();
}

function gate(big,title,text,extra=""){ return `<div class="c full gate"><div class="big" aria-hidden="true">${big}</div>${title?`<p class="gt">${title}</p>`:""}<p>${text}</p>${extra}</div>`; }
function grp(title,tint,rows){ return rows.length?`<div class="c full grp">${title}<span class="n">${rows.length}</span></div><div class="c full res">${rows.join("")}</div>`:""; }
function row(ic,tint,t,s,href){ return `<a href="${href}"><span class="nm">${esc(t)}</span><span class="sb">${esc(s)}</span><span class="go" aria-hidden="true">›</span></a>`; }

async function run(){
  const q=$("q").value.trim();
  if(q.length<2){$("out").innerHTML=gate("","Sichen","Fänk un ze tippen…");return;}
  $("out").innerHTML=gate("","","Sichen…");
  const like="%"+q.replace(/[%_]/g,"")+"%";
  const [ppl,hw,ex,dk]=await Promise.all([
    sb.from("profiles").select("username,class").ilike("username",like).limit(8),
    sb.from("class_homework").select("id,title,subject").ilike("title",like).limit(8),
    sb.from("exams").select("id,subject,note").ilike("subject",like).limit(8),
    sb.from("flashcard_decks").select("id,title").ilike("title",like).limit(8),
  ]);
  const rPpl=(ppl.data||[]).map(p=>row("👤","#6ea8fe",p.username,p.class||"ian.lu-Spiller","profile.html?u="+encodeURIComponent(p.username)));
  const rHw=(hw.data||[]).map(h=>row("📋","#4fc37a",h.title,h.subject||"Hausaufgab","board.html"));
  const rEx=(ex.data||[]).map(e=>row("⏳","#f0a04b",e.subject,e.note||"Test","exams.html"));
  const rDk=(dk.data||[]).map(d=>row("🃏","#a78bfa",d.title,"Kaartekëscht","flashcards.html?deck="+d.id));
  const html=grp("Leit","#6ea8fe",rPpl)+grp("Hausaufgaben","#4fc37a",rHw)+grp("Tester","#f0a04b",rEx)+grp("Kaarten","#a78bfa",rDk);
  $("out").innerHTML=html||gate("","Näischt fonnt",`Keng Resultater fir „${esc(q)}“.`);
}

auth.onAuth(boot);
boot();
</script>
  <script type="module" src="rtc-ring.js?v=36"></script>
  <script type="module" src="class-gate.js?v=37"></script>
<script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
