<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<!-- Private chat. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger — ian.lu</title>
  <link rel="canonical" href="https://ian.lu/messenger.html" />
<meta name="description" content="Real-time group messenger.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Messenger">
<meta name="theme-color" content="#0d0d1a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js?v=25"></script>
<script src="i18n-dict.js?v=42"></script>
<script src="i18n.js?v=3"></script>
<link rel="stylesheet" href="site-ui.css?v=2">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:var(--bg)}
  /* min-height:0 !important beats site-glass.css's `html, body {min-height:100%}`,
     which silently kept the shell full-height while the keyboard was up.
     The shell is pinned to the VISUAL viewport (see the fit script): iOS pans the
     page instead of resizing it when a keyboard opens, so follow that pan rather
     than fighting it with scrollTo -- the fight caused the jumping/black screen. */
  body{margin:0;position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;height:var(--vvh,100dvh);min-height:0 !important;transform:translateY(var(--vvt,0px));display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent2-text);text-decoration:none}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  button,[role=button],.grp-open,.react-chip{touch-action:manipulation}

  /* ---- header (site-ui look) ---- */
  html body.ui .ui-header{flex:none;flex-wrap:wrap;gap:8px 14px;padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left))}
  .header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
  .header-left{flex:1 1 auto}
  .header-right{flex-wrap:wrap;justify-content:flex-end}
  body.ui .ui-header .home{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  body.ui .ui-header .home:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  body.ui .ui-header .home:active{transform:scale(.97)}
  body.ui .ui-header h1.ui-brand{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap}
  .ntf-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:8px 14px;border-radius:var(--r-chip);border:1px solid var(--border);background:transparent;color:var(--text);font:700 14px var(--font-display);white-space:nowrap;cursor:pointer;transition:background-color .2s,border-color .2s}
  .ntf-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  .ntf-btn.on{border-color:var(--accent-border);color:var(--accent-text)}

  /* ---- sign-in gate ---- */
  #gate{flex:1;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
  .gate-box{width:min(380px,100%);padding:34px 28px 28px;border-radius:var(--r-panel);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--card-opaque)),color-mix(in srgb,var(--accent) 6%,var(--card-opaque)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent),0 24px 48px -28px rgb(var(--ink)/.5);backdrop-filter:none;-webkit-backdrop-filter:none}
  .gate-box h3{margin:0 0 10px;font:800 clamp(26px,5vw,32px)/1.1 var(--font-display);letter-spacing:-.03em}
  .gate-box p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 22px;text-wrap:balance}
  .auth-go{width:100%;min-height:46px;background:var(--accent);color:var(--accent-foreground);border:none;border-radius:var(--r-chip);padding:12px 20px;font:750 16px var(--font-display);letter-spacing:-.01em;cursor:pointer;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .3s var(--ease),filter .2s}
  .auth-go:hover{filter:brightness(1.06);transform:translateY(-2px)}
  .auth-go:active{transform:scale(.98)}

  /* ---- app shell: two soft panels (chat list, conversation) ---- */
  #app{flex:1;display:none;min-height:0;width:100%;max-width:1040px;margin:0 auto;gap:14px;padding:14px max(28px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left))}
  .sidebar,.chat{background:var(--card);border-radius:var(--r-panel);box-shadow:inset 0 0 0 1px var(--tile-edge),0 1px 2px rgb(var(--ink)/.05),0 18px 40px -26px rgb(var(--ink)/.4);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden;min-height:0}
  .sidebar{width:280px;display:flex;flex-direction:column;flex:none}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .side-head{display:flex;align-items:center;gap:8px;padding:16px 14px 8px 20px}
  .side-head .t{font:800 22px/1.1 var(--font-display);letter-spacing:-.03em;flex:1}
  .side-head button{display:grid;place-items:center;width:var(--hit-target,2.75rem);min-width:var(--hit-target,2.75rem);height:var(--hit-target,2.75rem);padding:0;border-radius:var(--r-chip);border:0;background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent);color:var(--text);font:700 18px var(--font-display);cursor:pointer;transition:transform .3s var(--ease),background-color .2s}
  .side-head button:hover{transform:translateY(-2px) rotate(-4deg);background:color-mix(in srgb,var(--accent) 26%,var(--card-opaque))}
  .side-head button:active{transform:scale(.95)}
  .search-box{padding:6px 14px 10px;border-radius:0;box-shadow:none;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .search-box input{display:block;width:100%;min-height:46px;padding:10px 16px;border:0;border-radius:var(--r-chip);background:var(--card-opaque);color:var(--text);font-size:16px;outline:none;box-shadow:inset 0 0 0 1px var(--border);transition:box-shadow .2s}
  .search-box input::placeholder{color:var(--muted);opacity:1}
  .search-box input:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,var(--border))}
  .search-box input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
  #groupList{list-style:none;margin:0;padding:4px 10px 12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .grp{padding:0;border-radius:var(--r-chip);display:block;transition:background-color .2s}
  .grp:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
  .grp.active{background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
  .grp-open{display:flex;flex-direction:column;gap:3px;width:100%;margin:0;padding:11px 12px;border:0;border-radius:inherit;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:var(--hit-target,2.75rem)}
  .grp-open:focus-visible{outline-offset:-2px}
  .grp .gname{font-weight:700;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp .gcode{font-size:12px;color:var(--muted)}
  .grp .gtop{display:flex;align-items:center;gap:6px}
  .grp .gprev{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp.unread .gname{font-weight:850}
  .grp.unread .gprev{color:var(--text)}
  .grp .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);flex:none;margin-left:auto}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:28px 14px;line-height:1.5;text-wrap:balance}

  /* ---- conversation ---- */
  .chat-head{padding:14px 16px 14px 20px;display:flex;align-items:center;gap:12px;flex:none;box-shadow:0 1px 0 var(--tile-edge);font-size:17px;position:relative;z-index:1}
  .chat-head>b{font:800 19px/1.15 var(--font-display);letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  /* nothing selected: turn the bare "Select a chat" line into a friendly empty state */
  .chat:not(:has(#chatHead .back-btn)) .chat-head{flex:1;flex-direction:column;justify-content:center;gap:10px;padding:32px;box-shadow:none;color:var(--muted);font:600 16px/1.4 var(--font-display);text-align:center}
  .chat:not(:has(#chatHead .back-btn)) .chat-head::before{content:"💬";display:grid;place-items:center;width:84px;height:84px;border-radius:26px;font-size:42px;background:color-mix(in srgb,var(--accent) 16%,var(--card-opaque));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent)}
  .chat:not(:has(#chatHead .back-btn)) .messages{display:none}
  .back-btn{display:none;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:var(--r-chip);width:var(--hit-target,2.75rem);min-width:var(--hit-target,2.75rem);height:var(--hit-target,2.75rem);padding:0;font-size:24px;line-height:1;cursor:pointer;flex:none}
  .back-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  .chat-head .invite{color:var(--muted);font-size:12px;white-space:nowrap}
  .chat-head code{background:var(--card2-opaque);padding:3px 8px;border-radius:8px;color:var(--text);font-weight:700;letter-spacing:.03em}
  .head-actions{margin-left:auto;display:flex;gap:6px;flex:none}
  .head-actions button{display:grid;place-items:center;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:var(--r-chip);width:var(--hit-target,2.75rem);min-width:var(--hit-target,2.75rem);height:var(--hit-target,2.75rem);padding:0;cursor:pointer;font-size:17px;transition:background-color .2s,border-color .2s,transform .3s var(--ease)}
  .head-actions button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent-border)}
  .head-actions button:active{transform:scale(.95)}
  .head-actions button.add-people{width:auto;padding:0 14px;font:750 14px var(--font-display);background:var(--accent);color:var(--accent-foreground);border-color:transparent;white-space:nowrap}
  .head-actions button.add-people:hover{filter:brightness(1.06);background:var(--accent)}
  .messages{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:20px 20px 12px;display:flex;flex-direction:column;gap:10px}
  .msg{display:flex;align-items:flex-end;gap:8px;touch-action:pan-y}
  .msg.mine{justify-content:flex-end}
  .av-chip{flex:none;width:30px;height:30px;border-radius:10px;background:var(--card2-opaque);box-shadow:inset 0 0 0 1px var(--tile-edge);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
  .mp-av{display:inline-flex;width:24px;height:24px;border-radius:8px;overflow:hidden;vertical-align:middle;align-items:center;justify-content:center}
  .av-img{width:100%;height:100%;object-fit:cover;display:block}
  .bubble{position:relative;max-width:72%;background:var(--card2-opaque);color:var(--text);padding:9px 14px 8px;border-radius:20px 20px 20px 6px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;transition:transform .12s ease-out}
  .msg.mine .bubble{background:var(--accent);color:var(--accent-foreground);border-radius:20px 20px 6px 20px;box-shadow:0 10px 22px -14px color-mix(in srgb,var(--accent) 80%,transparent)}
  .bubble.swiping{transition:none}
  .bubble .who{display:block;font:750 12px var(--font-display);color:var(--accent2-text);margin-bottom:2px}
  .msg.mine .bubble .who{color:inherit;opacity:.85}
  .admin-tag,.class-tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:0 6px;margin-left:5px;vertical-align:middle;letter-spacing:.3px}
  .admin-tag{color:#ffcf4d;background:rgba(255,207,77,.14);box-shadow:inset 0 0 0 1px rgba(255,207,77,.45)}
  .class-tag{color:#5cc8ff;background:rgba(92,200,255,.14);box-shadow:inset 0 0 0 1px rgba(92,200,255,.45)}
  .bubble .time{font-size:11px;color:var(--muted);margin-left:10px;float:right;margin-top:4px;font-variant-numeric:tabular-nums}
  .msg.mine .bubble .time{color:inherit;opacity:.72}
  .ticks{font-size:11px;margin-left:5px;opacity:.7;letter-spacing:-1px}
  .ticks.read{color:var(--accent2-text);opacity:1}
  .msg.mine .ticks.read{color:inherit;font-weight:800}
  .edited{font-size:11px;color:var(--muted);margin-left:6px}
  .msg.mine .edited{color:inherit;opacity:.7}
  .media{max-width:240px;max-height:240px;border-radius:14px;display:block;margin-top:6px;cursor:pointer}
  .filechip{display:flex;align-items:center;gap:10px;margin-top:6px;max-width:260px;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:14px;padding:10px 12px;text-decoration:none;color:inherit;transition:background-color .2s}
  .filechip:hover{background:color-mix(in srgb,var(--text) 12%,transparent)}
  .filechip .fc-ico{font-size:22px;flex:none}
  .filechip .fc-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip .fc-dl{font-size:15px;opacity:.65;flex:none}
  .admin-link{color:#ffcc00;font-weight:700;margin-right:14px;white-space:nowrap}
  .del-btn,.reply-btn,.react-btn{background:var(--card-opaque);border:0;box-shadow:inset 0 0 0 1px var(--tile-edge),0 2px 6px rgb(var(--ink)/.18);color:var(--text);border-radius:50%;cursor:pointer;line-height:1;min-height:0;padding:0}
  .del-btn{position:absolute;top:-10px;right:-8px;width:24px;height:24px;font-size:12px;opacity:.6}
  .del-btn:hover{opacity:1;box-shadow:inset 0 0 0 1px #ff6b6b,0 2px 6px rgb(var(--ink)/.18)}
  .del-btn::after,.reply-btn::after,.react-chip::after,.react-btn::after{content:"";position:absolute;inset:-10px}
  .reply-cue{position:absolute;top:50%;transform:translateY(-50%);left:-30px;font-size:16px;opacity:0;transition:opacity .1s}
  .msg.mine .reply-cue{left:auto;right:-30px}
  .reply-quote{display:block;border-left:3px solid var(--accent2);background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:8px 10px 10px 8px;padding:4px 9px;margin-bottom:5px;font-size:13px;cursor:pointer;max-width:100%;overflow:hidden}
  .reply-quote .rq-user{display:block;font-weight:800;color:var(--accent2-text);font-size:11.5px}
  .reply-quote .rq-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .reply-quote:focus-visible{outline:2px solid var(--focus-ring,var(--accent2-text));outline-offset:1px}
  .msg.mine .reply-quote{border-left-color:currentColor;background:color-mix(in srgb,currentColor 14%,transparent)}
  .msg.mine .reply-quote .rq-user{color:inherit}
  .msg.mine .reply-quote .rq-text{color:inherit;opacity:.8}
  .reply-btn{position:absolute;top:-10px;right:-8px;width:24px;height:24px;font-size:11px;opacity:0;transition:opacity .1s}
  .msg.mine .reply-btn{right:auto;left:-8px}
  .msg:hover .reply-btn{opacity:.7}
  .reply-btn:hover{opacity:1!important}
  .react-btn{position:absolute;bottom:-10px;width:22px;height:22px;font-size:11px;opacity:0;transition:opacity .1s}
  .msg:not(.mine) .react-btn{right:-8px}.msg.mine .react-btn{left:-8px}
  .msg:hover .react-btn{opacity:.75}.react-btn:hover{opacity:1!important}
  .msg:focus-within .reply-btn,.msg:focus-within .react-btn{opacity:.9}
  .reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .reacts:empty{display:none}
  .react-chip{position:relative;display:inline-flex;align-items:center;gap:3px;min-height:0;background:color-mix(in srgb,var(--text) 8%,var(--card-opaque));border:0;box-shadow:inset 0 0 0 1px var(--tile-edge);border-radius:12px;padding:1px 8px;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;line-height:1.5}
  .react-chip::after{inset:-12px -4px}
  .react-chip.mine-r{background:color-mix(in srgb,var(--accent) 22%,var(--card-opaque));box-shadow:inset 0 0 0 1px var(--accent-border)}
  .msg.mine .react-chip{background:var(--card-opaque)}
  .react-pop{position:absolute;bottom:18px;display:flex;gap:4px;background:var(--glass-solid);box-shadow:inset 0 0 0 1px var(--tile-edge),0 14px 30px -12px rgb(var(--ink)/.5);border:0;border-radius:20px;padding:5px 8px;z-index:20}
  .msg.mine .react-pop{left:-8px}.msg:not(.mine) .react-pop{right:-8px}
  .react-pop button{background:none;border:none;font-size:19px;cursor:pointer;line-height:1;padding:1px;border-radius:6px}
  .react-pop button:hover{transform:scale(1.25)}
  .voice{margin-top:6px;max-width:230px}
  audio.voice{height:38px;width:230px}
  .typing{display:none;padding:2px 22px 6px;color:var(--muted);font-size:13px;font-style:italic}
  .typing.show{display:block}
  .reply-bar{display:none;align-items:center;gap:10px;margin:0 14px 2px;padding:8px 8px 8px 14px;border-radius:var(--r-chip);background:color-mix(in srgb,var(--accent) 12%,var(--card-opaque));box-shadow:inset 3px 0 0 var(--accent);font-size:13px}
  .reply-bar.open{display:flex}
  .reply-bar .rb-body{flex:1;min-width:0}
  .reply-bar .rb-user{font-weight:800;color:var(--accent2-text);font-size:12px;display:block}
  .reply-bar .rb-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .reply-bar .rb-x{display:grid;place-items:center;min-width:var(--hit-target,2.75rem);background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}

  /* composer: one rounded bar with attach, voice, text and send */
  .composer{display:none;align-items:center;gap:6px;margin:6px 14px max(14px,env(safe-area-inset-bottom));padding:6px;border-radius:22px;background:var(--card-opaque);box-shadow:inset 0 0 0 1px var(--border);flex:none;transition:box-shadow .2s}
  .composer:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,var(--border))}
  .composer:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
  .composer input{flex:1;min-width:0;min-height:44px;background:transparent;border:0;color:var(--text);border-radius:14px;padding:10px 8px;font-size:16px;outline:none}
  .composer input::placeholder{color:var(--muted);opacity:1}
  .composer input:focus-visible{outline:none}
  .composer button[type=submit]{min-height:44px;background:var(--accent);color:var(--accent-foreground);border:none;border-radius:var(--r-chip);padding:0 20px;font:750 15px var(--font-display);cursor:pointer;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .3s var(--ease),filter .2s}
  .composer button[type=submit]:hover{filter:brightness(1.06)}
  .composer button[type=submit]:active{transform:scale(.97)}
  #attachBtn,#micBtn{display:grid;place-items:center;background:transparent;border:0;color:var(--text);border-radius:var(--r-chip);width:var(--hit-target,2.75rem);min-width:var(--hit-target,2.75rem);height:var(--hit-target,2.75rem);padding:0;font-size:19px;cursor:pointer;flex:none;transition:background-color .2s}
  #attachBtn:hover,#micBtn:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  #attachBtn:disabled{opacity:.6;cursor:default}
  #micBtn.rec{background:#ff5d6c;color:#000;animation:recpulse 1s infinite}
  @keyframes recpulse{0%,100%{opacity:1}50%{opacity:.6}}

  /* member panel, add-people modal bits */
  .member-panel{position:absolute;top:68px;right:0;width:250px;max-height:70%;overflow-y:auto;background:var(--glass-solid);box-shadow:inset 0 0 0 1px var(--tile-edge),0 22px 44px -18px rgb(var(--ink)/.55);border-radius:var(--r-tile);margin:8px 14px;display:none;z-index:10}
  .member-panel.open{display:block}
  .mp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px 16px;font:800 15px var(--font-display);letter-spacing:-.01em}
  .mp-head button{display:grid;place-items:center;min-width:var(--hit-target,2.75rem);background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .mp-list{padding:4px 16px 12px}
  .mp-row{padding:7px 0;font-size:14px}
  .mp-row .you{color:var(--muted);font-size:12px}
  .mp-invite{padding:4px 14px 12px}
  .mp-invite label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .mp-invite input{width:100%;min-height:44px;padding:8px 12px;border-radius:var(--r-chip);border:0;background:var(--card-opaque);box-shadow:inset 0 0 0 1px var(--border);color:var(--text);font-size:16px}
  .mp-invite input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}

<script>
/* Mobile keyboard fit: track the visual viewport so the composer stays above
   the on-screen keyboard instead of being covered by it (iOS/Android). */
(function(){
  var vv=window.visualViewport; if(!vv)return;
  var root=document.documentElement;
  // While zoomed (pinch or focus zoom) vv.height is measured in zoomed pixels, and
  // sizing the page to it squashes the app into the top of the screen with the
  // rest left empty -- so keep the last unzoomed height instead.
  // The fixed body is moved down by vv.offsetTop so it always covers exactly the
  // visible area. Never scrollTo(): iOS re-applies its own pan, and the two
  // fought on every keystroke (jumping, black area, composer under the keyboard).
  var ZOOM_EPSILON=0.01;
  function fit(){
    if(vv.scale>1+ZOOM_EPSILON)return;
    // Measured on Ian's iPad (30 Sep 2026, ?debug): with a keyboard up, Safari
    // reports the visible height correctly (610 with the bar, 270 with the full
    // keyboard) but scrolls the page by offsetTop (68 / 408), and the fixed shell
    // moves WITH that scroll. So: height = vv.height, shifted down by offsetTop,
    // then measured and corrected so the shell's top sits exactly at the top of
    // the visible area whatever this Safari version does with fixed elements.
    var shift=vv.offsetTop;
    // Keep the newest message in view when the keyboard shrinks the list.
    var msgs=document.getElementById("messages");
    var atBottom=msgs&&msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<40;
    root.style.setProperty("--vvh", vv.height+"px");
    root.style.setProperty("--vvt", shift+"px");
    var off=document.body?document.body.getBoundingClientRect().top:0;
    if(Math.abs(off)>1)root.style.setProperty("--vvt", (shift-off)+"px");
    if(atBottom)msgs.scrollTop=msgs.scrollHeight;
  }
  vv.addEventListener("resize",fit); vv.addEventListener("scroll",fit);
  window.addEventListener("scroll",fit,{passive:true}); fit();
  // messenger.html?kbdtest shows the real chat layout with dummy messages and no
  // sign-in, so the keyboard layout can be checked on an iPad/simulator.
  if(/[?&]kbdtest\b/.test(location.search)){
    var st=document.createElement("style");
    st.textContent="#gate{display:none!important}#app{display:flex!important}.chat{display:flex!important}.composer{display:flex!important}";
    document.head.appendChild(st);
    document.addEventListener("DOMContentLoaded",function(){
      var m=document.getElementById("messages"),html="";
      document.getElementById("chatHead").innerHTML='<button class="back-btn" type="button" aria-label="Back">\u2039</button><b>Test chat</b>';
      for(var i=1;i<=40;i++)html+='<div style="align-self:'+(i%3?'flex-start':'flex-end')+';background:var(--card2);padding:8px 12px;border-radius:12px">Test message '+i+'</div>';
      setTimeout(function(){m.innerHTML=html;m.scrollTop=m.scrollHeight;},800);
    });
  }
  // messenger.html?debug shows the live viewport numbers (for iPad keyboard issues).
  if(/[?&]debug\b/.test(location.search)){
    var box=document.createElement("div");
    box.style.cssText="position:fixed;top:0;left:0;z-index:99999;background:#ff0;color:#000;font:13px/1.35 monospace;padding:6px 8px;pointer-events:none;white-space:pre";
    document.body.appendChild(box);   // inside the pinned shell, so it stays on screen
    var r=function(sel){var e=document.querySelector(sel);if(!e)return "-";var b=e.getBoundingClientRect();return Math.round(b.top)+".."+Math.round(b.bottom)};
    setInterval(function(){
      box.textContent="shell "+root.style.getPropertyValue("--vvh")+" / "+root.style.getPropertyValue("--vvt")+"\nvv h "+Math.round(vv.height)+" top "+Math.round(vv.offsetTop)+" scale "+vv.scale.toFixed(2)+
        "\ninner "+innerHeight+" scrollY "+Math.round(scrollY)+" dvh? "+getComputedStyle(document.body).height+
        "\nbody "+r("body")+"  app "+r("#app")+"\nchat "+r(".chat")+"  msgs "+r(".messages")+"\ncomposer "+r(".composer")+
        "\nua "+navigator.userAgent.slice(0,60);
    },250);
  }
  // when the keyboard opens on focus, keep the latest messages in view
  document.addEventListener("focusin",function(e){
    if(!e.target.closest||!e.target.closest(".composer"))return;
    setTimeout(function(){ var m=document.getElementById("messages"); if(m)m.scrollTop=m.scrollHeight; },250);
  });
})();
</script>
