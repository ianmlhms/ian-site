<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdowns — ian.lu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f6f3">
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gitter.css?v=6">
<script src="theme.js?v=32"></script>
<style>
  button,a,input{touch-action:manipulation}
  body.gt{--warn:var(--danger)}
  .gt-page{padding-bottom:max(56px,calc(40px + env(safe-area-inset-bottom)))}
  .cdempty{text-align:left;color:var(--muted);padding:24px 20px !important;align-items:flex-start}
  .cdempty .cdempty-ico{display:none}
  .cdempty p{font:800 22px/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink)}
  .cdempty .cdempty-sub{margin-top:4px;font:400 14px/1.4 "Geist",system-ui,sans-serif;color:var(--muted)}
  .ttgate{color:var(--muted);font-size:14px;line-height:1.5;background:var(--tint)}
  .ttgate a{text-decoration:underline;text-underline-offset:3px;padding:12px 2px;color:var(--green);font-weight:600}
  .hero{justify-content:flex-start !important;gap:6px !important}
  .hero .lbl{align-self:flex-start;font:500 12px/1.5 "Geist Mono",ui-monospace,monospace;padding:0 8px;border:1px solid var(--green);color:var(--green)}
  .hero .hrow{display:flex;align-items:center;gap:16px;margin-top:6px}
  .hero .emoji{display:grid;place-items:center;flex:none;width:64px;height:64px;border:1px solid var(--ink);background:var(--white);font-size:34px;line-height:1}
  .hero .title{font:800 clamp(20px,3.4vw,26px)/1.2 "Geist",system-ui,sans-serif;letter-spacing:-.03em;overflow-wrap:anywhere}
  .hero .when{color:var(--muted);font-size:14px;margin-top:3px}
  .hero .big{margin-top:10px;font:500 clamp(34px,8vw,52px)/1.05 "Geist Mono",ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hero .big small,.cd .big small{font:500 .5em "Geist Mono",ui-monospace,monospace;letter-spacing:0;color:var(--muted);margin:0 .3em 0 .08em}
  .newx{justify-content:flex-start !important;gap:12px !important}
  .newx h2{font:600 15px "Geist",system-ui,sans-serif;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row .ui-input{flex:1 1 9rem;min-width:0;width:auto}
  .emopick{display:flex;flex-wrap:wrap;border-top:1px solid var(--soft);border-left:1px solid var(--soft);align-self:flex-start}
  .emopick button{display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);border-radius:0;background:var(--white);font-size:22px;cursor:pointer}
  .emopick button:hover{background:var(--tint)}
  .emopick button.on{background:var(--ink)}
  .newx .gt-btn{align-self:flex-start}
  .msg{min-height:18px;color:var(--green);font-weight:600;font-size:13.5px}
  .msg:empty{min-height:0}
  .sect{flex-direction:row !important;justify-content:flex-start !important;font:600 14px "Geist",system-ui,sans-serif;color:var(--muted);background:var(--tint);padding:10px 20px !important}
  .cd{flex-direction:row !important;align-items:center;justify-content:flex-start !important;gap:14px !important;padding:12px 8px 12px 20px !important}
  .cd .emoji{display:grid;place-items:center;flex:none;width:48px;height:48px;border:1px solid var(--soft);background:var(--white);font-size:24px;line-height:1}
  .cd .info{min-width:0;flex:1}
  .cd .title{font:600 16px/1.25 "Geist",system-ui,sans-serif;overflow-wrap:anywhere}
  .cd .when{color:var(--muted);font-size:13.5px;margin-top:2px}
  .cd .big{flex:none;text-align:right;font:500 19px/1.1 "Geist Mono",ui-monospace,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cd .big.soon,.hero .big.soon{color:var(--green)}
  .cd.past{opacity:.6}
  .del{display:grid;place-items:center;flex:none;min-width:44px;min-height:44px;padding:0;border:0;border-radius:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
  .del:hover{color:var(--danger)}
  @media(max-width:700px){
    .gt-nav{padding-inline:14px !important}
    .hero .emoji{width:52px;height:52px;font-size:28px}
    .cd{gap:10px !important;padding-left:14px !important}
    .cd .emoji{width:44px;height:44px;font-size:22px}
    .cd .big{font-size:16px}
  }
</style>
<script data-goatcounter="https://ianm.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body class="gt">
<main class="gt-page">
<div class="gt-grid">
  <header class="c full gt-nav">
    <div class="gt-nav-l"><a class="gt-back" href="index.html">‹ Heem</a><h1 class="gt-page-title">Countdowns</h1></div>
    <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
  </header>
  <div id="wrap" class="gt-contents"><div class="c full cdempty"><p>Lueden…</p></div></div>
</div>
</main>

<script src="pixelbreak-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script type="module">
import * as auth from "./auth.js?v=40";
const $=(id)=>document.getElementById(id);
const esc=(s)=>(""+(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EMOJIS=["🎉","🎂","✈️","🏝️","🎄","🎁","🏁","🎓","⚽","🎸","🎮","❤️","🍕","🎇"];
let sb=null,me=null,items=[],timer=null,pickEmoji=EMOJIS[0],local=false;

/* Signed-out visitors keep their countdowns on this device only; the rows
 * move to the cloud automatically the first time they sign in. */
const LS_KEY="countdowns-local";
function localList(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]");}catch{return[];}}
const localSave=(arr)=>localStorage.setItem(LS_KEY,JSON.stringify(arr));

async function migrateLocal(){
  const orphans=localList().filter(x=>x&&x.title&&x.at);
  if(!orphans.length)return;
  try{
    const {error}=await sb.from("countdowns").insert(orphans.map(({title,emoji,at})=>({title,emoji,at})));
    if(!error)localStorage.removeItem(LS_KEY);
  }catch(e){console.warn("[countdowns] migrate",e);}
}

async function boot(){
  sb=await auth.client();
  local=!auth.session();
  me=auth.session()?.user?.id||null;
  if(!local)await migrateLocal();
  $("wrap").innerHTML=`
    <div id="hero" class="gt-contents"></div>
    <div class="c full newx">
      <h2>Neie Countdown</h2>
      <input class="ui-input" id="nTitle" maxlength="80" aria-label="Titel vum Countdown" autocomplete="off" enterkeyhint="done" placeholder="Op wat waards du? (z.B. Vakanz)">
      <div class="emopick" id="emo" role="group" aria-label="Emoji"></div>
      <div class="row">
        <input class="ui-input" id="nDate" type="date" aria-label="Datum">
        <input class="ui-input" id="nTime" type="time" value="00:00" aria-label="Auerzäit">
      </div>
      <button type="button" class="gt-btn" id="add">Countdown bäisetzen</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
    ${local?`<div class="c full ttgate">Ouni Kont ginn deng Countdowns nëmmen op dësem Apparat gespäichert — <a href="#" id="si" role="button">mell dech un</a>, fir se iwwerall ze hunn.</div>`:""}
    <div id="list" class="gt-contents"><div class="c full cdempty">Lueden…</div></div>`;
  if(local)$("si").onclick=(e)=>{e.preventDefault();auth.openAuthModal();};
  const emo=$("emo");
  EMOJIS.forEach((e,i)=>{const b=document.createElement("button");b.type="button";b.textContent=e;b.setAttribute("aria-pressed",String(i===0));if(i===0)b.classList.add("on");
    b.onclick=()=>{pickEmoji=e;emo.querySelectorAll("button").forEach(x=>{const on=x.textContent===e;x.classList.toggle("on",on);x.setAttribute("aria-pressed",String(on));});};emo.appendChild(b);});
  $("add").onclick=add;
  $("nTitle").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
  await refresh();
}

async function refresh(){
  if(local){
    items=localList().slice().sort((a,b)=>new Date(a.at)-new Date(b.at));
  }else{
    const {data,error}=await sb.from("countdowns").select("*").order("at");
    if(error){$("list").innerHTML='<div class="c full cdempty" role="alert">Feeler beim Lueden.</div>';return;}
    items=data||[];
  }
  render();
  if(!timer)timer=setInterval(paint,1000);
}

const pad=(n)=>String(n).padStart(2,"0");
function parts(ms){
  const past=ms<0; ms=Math.abs(ms);
  const s=Math.floor(ms/1000),d=Math.floor(s/86400);
  return {past,d,h:Math.floor(s/3600)%24,m:Math.floor(s/60)%60,s:s%60};
}
function big(ms){
  const p=parts(ms);
  if(p.d>0)return `${p.d}<small>d</small> ${pad(p.h)}<small>h</small> ${pad(p.m)}<small>m</small>`;
  return `${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
}
function paint(){
  for(const it of items){
    const el=document.querySelector(`.big[data-cd="${it.id}"]`);
    if(!el)continue;
    const left=new Date(it.at).getTime()-Date.now();
    if(left<0&&el.closest(".hero")){render();continue;}
    el.querySelector("b").innerHTML=left<0?"do!":big(left);
    el.classList.toggle("soon",isSoon(left));
  }
}
const fmtWhen=(t)=>t.toLocaleString("de-DE",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const isSoon=(left)=>left<3*86400000&&left>0;
function delBtn(it){
  return `<button type="button" class="del" data-del="${it.id}" title="Läschen" aria-label="Countdown läschen: ${esc(it.title)}"><span aria-hidden="true">×</span></button>`;
}
function heroHtml(it){
  const t=new Date(it.at),left=t.getTime()-Date.now();
  return `<section class="c full hero" aria-label="Nächste Countdown">
    <span class="lbl">Als nächst</span>
    <div class="hrow">
      <span class="emoji" aria-hidden="true">${esc(it.emoji||"⏳")}</span>
      <div style="min-width:0;flex:1"><div class="title">${esc(it.title)}</div><div class="when">${fmtWhen(t)}</div></div>
      ${delBtn(it)}
    </div>
    <div class="big${isSoon(left)?" soon":""}" data-cd="${it.id}"><b>${big(left)}</b></div>
  </section>`;
}
function rowHtml(it){
  const t=new Date(it.at),left=t.getTime()-Date.now();
  return `<div class="c full cd${left<0?" past":""}">
    <span class="emoji" aria-hidden="true">${esc(it.emoji||"⏳")}</span>
    <div class="info"><div class="title">${esc(it.title)}</div><div class="when">${fmtWhen(t)}</div></div>
    <div class="big${isSoon(left)?" soon":""}" data-cd="${it.id}"><b>${left<0?"do!":big(left)}</b></div>
    ${delBtn(it)}
  </div>`;
}
function render(){
  const now=Date.now();
  const next=items.find(it=>new Date(it.at).getTime()>now);
  $("hero").innerHTML=next?heroHtml(next):"";
  const rest=items.filter(it=>it!==next);
  if(!items.length){$("list").innerHTML='<div class="c full cdempty"><div class="cdempty-ico" aria-hidden="true"></div><p>Nach keng Countdowns</p><div class="cdempty-sub">Setz deen éischten uewen bäi.</div></div>';return;}
  const upcoming=rest.filter(it=>new Date(it.at).getTime()>now),past=rest.filter(it=>new Date(it.at).getTime()<=now);
  $("list").innerHTML=(upcoming.length?upcoming.map(rowHtml).join(""):"")
    +(past.length?`<div class="c full sect">Scho virbei</div>`+past.map(rowHtml).join(""):"");
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Countdown läschen?"))return;
    if(local)localSave(localList().filter(x=>String(x.id)!==b.dataset.del));
    else await sb.from("countdowns").delete().eq("id",b.dataset.del);
    refresh();
  });
}

async function add(){
  const title=$("nTitle").value.trim(),date=$("nDate").value,time=$("nTime").value||"00:00";
  if(!title||!date){$("msg").textContent="Titel an Datum uginn.";return;}
  $("msg").textContent="…";
  try{
    const at=new Date(date+"T"+time).toISOString();
    if(local){
      localSave([...localList(),{id:Date.now().toString(36),title,emoji:pickEmoji,at}]);
    }else{
      const {error}=await sb.from("countdowns").insert({title,emoji:pickEmoji,at});
      if(error)throw error;
    }
    $("nTitle").value="";$("msg").textContent="Gespäichert ✓";
    setTimeout(()=>$("msg").textContent="",1400);
    refresh();
  }catch(e){console.warn(e);$("msg").textContent="Feeler beim Späicheren.";}
}

auth.onAuth(boot);
boot();
</script>
<script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
