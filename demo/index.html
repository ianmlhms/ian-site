<!doctype html>
<html lang="lb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0d0d1a">
  <title>ian.lu · Demoen</title>
  <meta name="description" content="Dräi Weeër, fir de Site ze weisen.">
  <link rel="canonical" href="https://ian.lu/demo/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/demo/demo.css?v=1">
</head>
<body>
  <main class="dpage">
    <header class="dhero">
      <h1 class="dtitle" id="title"></h1>
      <p class="dsub" id="sub"></p>
    </header>
    <div class="dchoose" id="choices"></div>
  </main>
  <script type="module">
    import { UI } from "/demo/copy.js?v=1";
    const { title, sub, items } = UI.chooser;
    document.getElementById("title").textContent = title;
    document.getElementById("sub").textContent = sub;
    const choices = document.getElementById("choices");
    items.forEach(({ href, icon, t, s }) => {
      const link = document.createElement("a");
      link.href = href;
      const ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = icon;
      const text = document.createElement("span");
      const strong = document.createElement("strong");
      strong.textContent = t;
      const detail = document.createElement("span");
      detail.className = "s";
      detail.textContent = s;
      text.append(strong, detail);
      link.append(ico, text);
      choices.append(link);
    });
  </script>
</body>
</html>
