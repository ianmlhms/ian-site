const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),scoreEl=document.querySelector('#score'),highEl=document.querySelector('#high'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives'),mazeCanvas=document.createElement('canvas'),mazeCtx=mazeCanvas.getContext('2d');let tw=18,ox=0,oy=0,W=28,H=31,WALL_INSET=.3,WALL_LINE=.13,stageW=0,stageH=0,p,dots,powers,ghosts=[],lives=3,level=1,playing=false,paused=false,last=0,raf=0,phase=0,phaseT=0,fright=0,chain=0,fruit=null,dotsEaten=0,startTouch=null,muted=false,audio=null,high=0,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;try{high=+(localStorage.getItem('g-pacman-high')||0)}catch(e){}highEl.textContent=high;

function updateHud(){scoreEl.textContent=score;levelEl.textContent=level;if(score>high){high=score;highEl.textContent=high;try{localStorage.setItem('g-pacman-high',high)}catch(e){}}[...livesEl.querySelectorAll('.life')].forEach(e=>e.remove());for(let i=1;i<lives;i++){let s=document.createElement('i');s.className='life';livesEl.insertBefore(s,livesEl.firstChild)}document.querySelector('#fruitLabel').textContent=fruit?'● BONUS':'';report(false)}
function target(g){if(phase%2===0)return scatter[g.id];if(g.id===0)return {x:p.x,y:p.y};if(g.id===1)return {x:p.x+p.d.x*4,y:p.y+p.d.y*4};if(g.id===2){let a={x:p.x+p.d.x*2,y:p.y+p.d.y*2},b=ghosts[0];return{x:a.x+(a.x-b.x),y:a.y+(a.y-b.y)}}let dist=Math.hypot(g.x-p.x,g.y-p.y);return dist>8?{x:p.x,y:p.y}:scatter[3]}

function mazeWall(x,y){return x>=0&&x<W&&y>=0&&y<H&&raw[y][x]==='#'}
function wallOutline(g){const m=tw*WALL_INSET,seg=(a,b,c,d)=>{g.moveTo(a,b);g.lineTo(c,d)};g.beginPath();for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!mazeWall(x,y))continue;const L=ox+x*tw,T=oy+y*tw,R=L+tw,B=T+tw,n=!mazeWall(x,y-1),e=!mazeWall(x+1,y),s=!mazeWall(x,y+1),w=!mazeWall(x-1,y);if(n)seg(w?L+m:L,T+m,e?R-m:R,T+m);if(s)seg(w?L+m:L,B-m,e?R-m:R,B-m);if(w)seg(L+m,n?T+m:T,L+m,s?B-m:B);if(e)seg(R-m,n?T+m:T,R-m,s?B-m:B);if(!n&&!w&&!mazeWall(x-1,y-1)){g.moveTo(L,T+m);g.lineTo(L+m,T+m);g.lineTo(L+m,T)}if(!n&&!e&&!mazeWall(x+1,y-1)){g.moveTo(R,T+m);g.lineTo(R-m,T+m);g.lineTo(R-m,T)}if(!s&&!w&&!mazeWall(x-1,y+1)){g.moveTo(L,B-m);g.lineTo(L+m,B-m);g.lineTo(L+m,B)}if(!s&&!e&&!mazeWall(x+1,y+1)){g.moveTo(R,B-m);g.lineTo(R-m,B-m);g.lineTo(R-m,B)}}g.stroke()}

function drawPac(){let x=ox+(p.x+.5)*tw,y=oy+(p.y+.5)*tw,a=Math.abs(Math.sin(p.mouth))*.55,ang=Math.atan2(p.d.y,p.d.x);ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,tw*.48,ang+a,ang+Math.PI*2-a);ctx.closePath();ctx.fill()}

function input(keyName){let d=dirs[keyName];if(d&&p){p.q=d;if(center(p)&&can(p,d))p.d=d}}document.addEventListener('keydown',e=>{let k=e.key;if(['w','W'].includes(k))k='ArrowUp';if(['s','S'].includes(k))k='ArrowDown';if(['a','A'].includes(k))k='ArrowLeft';if(['d','D'].includes(k))k='ArrowRight';if(dirs[k]){input(k);e.preventDefault()}if((e.key===' '||e.key==='Enter')&&!playing&&!(e.target.closest&&e.target.closest('button')))begin()});stage.addEventListener('pointerdown',e=>{startTouch={x:e.clientX,y:e.clientY}});stage.addEventListener('pointerup',e=>{if(!startTouch)return;let dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;if(Math.hypot(dx,dy)>15)input(Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp'));startTouch=null});document.querySelector('#play').onclick=begin;document.querySelector('#play').focus();document.querySelector('#again').onclick=begin;addEventListener('message',e=>{if(e.data&&typeof e.data.__pbSndMute==='boolean')muted=e.data.__pbSndMute});resize();})();
