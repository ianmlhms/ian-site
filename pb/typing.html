<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typing Speed - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<style>
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
.arcade-stage{display:block;overflow-y:auto;padding:64px 14px 20px}
.arcade-hud{inset:5px 14px auto;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.typing{width:min(680px,100%);margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%;justify-content:center}
#text-display{padding:20px;border:1px solid var(--border);border-radius:var(--radius-l);background:var(--card);
  font:600 clamp(18px,4.2vw,24px)/1.7 var(--font);text-align:center;letter-spacing:.005em}
.correct{color:var(--good)}.pending{color:var(--muted)}
.wrong{color:var(--danger);text-decoration:underline}
.current{background:rgba(255,255,255,.12);border-radius:4px;padding:0 1px;color:var(--text)}
#inp{width:100%;min-height:52px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card2);color:var(--text);
  font:650 20px/1 var(--font);text-align:center;outline:none}
#inp:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(77,232,255,.25)}
#progress{height:6px;border-radius:99px;background:var(--border);overflow:hidden}
#prog-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .3s var(--spring)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.arcade-btn:focus-visible{outline-offset:3px}
.arcade-seg button{min-height:44px}
.arcade-btn.play{min-width:min(220px,100%);min-height:52px;font-size:17px}
@media (prefers-reduced-motion:reduce){#prog-fill{transition:none}}
</style>
<script src="/pb/arcade-kit.js?v=9" data-arcade-id="typing" data-arcade-title="Typing Speed"></script>
</head>
<body>
<main class="arcade-stage" id="stage">
  <div class="arcade-hud" role="group" aria-label="Words per minute, accuracy and time">
    <span class="arcade-pill">WPM <b id="wpm">0</b></span>
    <span class="arcade-pill">Accuracy <b><span id="acc">100</span>%</b></span>
    <span class="arcade-pill">Time <b><span id="timer">0</span> s</b></span>
  </div>
  <div class="typing">
    <div id="text-display" aria-live="off"></div>
    <input id="inp" placeholder="Start typing..." aria-label="Type the text above" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
    <div id="progress" aria-hidden="true"><div id="prog-fill"></div></div>
    <div class="row">
      <div class="arcade-seg" role="group" aria-label="Language">
        <button type="button" id="langEn" aria-pressed="true">EN</button>
        <button type="button" id="langLb" aria-pressed="false">LB</button>
      </div>
      <button class="arcade-btn secondary" id="newBtn" type="button">New text</button>
    </div>
  </div>

  <div class="arcade-overlay show" id="startOv" role="dialog" aria-modal="true" aria-labelledby="startOvT"><div class="arcade-panel">
    <h2 id="startOvT">Typing Speed</h2>
    <p>Type the sentence exactly as shown. The timer starts with your first key. Use a keyboard; on touch the on-screen keyboard opens when you press Play.</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="playBtn" type="button">Play</button></div>
  </div></div>

  <div class="arcade-overlay" id="pauseOv" role="dialog" aria-modal="true" aria-labelledby="pauseOvT"><div class="arcade-panel">
    <h2 id="pauseOvT">Paused</h2><p>Your timer stopped while you were away.</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="resumeBtn" type="button">Resume</button></div>
  </div></div>

  <div class="arcade-overlay" id="overOv" role="dialog" aria-modal="true" aria-labelledby="overOvT"><div class="arcade-panel">
    <h2 id="overOvT">Done</h2>
    <span class="arcade-big"><span id="overBig">0</span> WPM</span>
    <p><strong id="overAcc">100</strong>% accuracy in <strong id="overSecs">0</strong> s · Best <strong id="overBest">0</strong> WPM</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="againBtn" type="button">Next text</button></div>
  </div></div>
</main>
<script>
const TEXTS_LB=[
  "Moien alleguer haut ass e flotten Dag fir eppes Neies ze léieren",
  "D'Vakanz kënnt ëmmer méi no an d'Schoul ass geschwënn eriwwer",
  "Lëtzebuerg ass e klengt Land mat ville schéine Plazen an Dierfer",
  "E gudde Kaffi um Moien mécht de ganzen Dag direkt vill besser",
  "D'Wieder haut ass schéin d'Sonn schéngt an et ass waarm dobaussen",
  "Meng Frënn a meng Famill si mir dat Wichtegst op der Welt",
  "Owes kucke mir gär e Film oder spillen e Spill zesummen",
  "De Fuuss leeft séier duerch de Bësch an d'Villercher fléien ewech",
  "Wien all Dag e bësse trainéiert gëtt ëmmer besser beim Tippen",
  "Mëttes iesse mir zesummen an duerno gi mir dobaussen spillen",
];
const TEXTS=[
  "The quick brown fox jumps over the lazy dog near the old wooden fence",
  "Programming is the art of telling a computer what to do step by step",
  "Every great journey begins with a single step forward into the unknown",
  "Stars shine brightest in the darkest night sky above the mountain peaks",
  "Music brings people together and creates memories that last a lifetime",
  "The ocean waves crash against the rocky shore under a golden sunset",
  "Knowledge is power but wisdom is knowing how to use it properly",
  "Adventure awaits those brave enough to leave their comfort zone behind",
  "The secret to success is to start before you feel completely ready",
  "Time flies when you are having fun with friends and good company",
  "A creative mind finds solutions where others only see problems ahead",
  "The best way to predict the future is to create it yourself today",
];
const TICK_MS=200,WRONG_FLASH_MS=300,BEST_KEY='pb_best_typing',MS_PER_MIN=60000;
const $=id=>document.getElementById(id);
function focusDialog(id){const p=$(id).firstElementChild;p.tabIndex=-1;p.style.outline='none';p.focus({preventScroll:true})}
let text,pos,errors,startTime,timerInt,done;
let state='idle',paused=false,pausedAt=0,best=loadBest();
let lang=storageGet('pb_typ_lang')||'en';

function storageGet(key){
  try{return localStorage.getItem(key)}
  catch(error){console.warn('[Typing Speed] could not read '+key,error);return null}
}
function storageSet(key,value){
  try{localStorage.setItem(key,value)}
  catch(error){console.warn('[Typing Speed] could not save '+key,error)}
}
function loadBest(){return Number(storageGet(BEST_KEY))||0}
function paintLang(){
  $('langEn').setAttribute('aria-pressed',String(lang!=='lb'));
  $('langLb').setAttribute('aria-pressed',String(lang==='lb'));
}
function setLang(next){lang=next;storageSet('pb_typ_lang',lang);paintLang();newTest()}
function focusInput(){try{$('inp').focus({preventScroll:true})}catch(error){console.warn('[Typing Speed] focus failed',error)}}
function closeOverlays(){['startOv','overOv','pauseOv'].forEach(id=>$(id).classList.remove('show'))}
function newTest(){
  const list=lang==='lb'?TEXTS_LB:TEXTS;
  text=list[Math.floor(Math.random()*list.length)];
  pos=0;errors=0;done=false;startTime=null;paused=false;
  if(timerInt)clearInterval(timerInt);
  $('inp').value='';
  $('wpm').textContent='0';
  $('acc').textContent='100';
  $('timer').textContent='0';
  $('prog-fill').style.width='0%';
  renderText();
  if(state==='playing')focusInput();
}
function begin(){state='playing';closeOverlays();newTest();focusInput()}
function renderText(){
  let h='';
  for(let i=0;i<text.length;i++){
    let cls=i<pos?'correct':i===pos?'current':'pending';
    h+=`<span class="${cls}">${text[i]}</span>`;
  }
  $('text-display').innerHTML=h;
}
function tick(){
  let s=Math.floor((Date.now()-startTime)/1000);
  $('timer').textContent=s;
  let mins=(Date.now()-startTime)/MS_PER_MIN;
  if(mins>0)$('wpm').textContent=Math.round((pos/5)/mins);
}
function finish(acc){
  done=true;clearInterval(timerInt);state='over';
  let secs=(Date.now()-startTime)/1000;
  let wpm=Math.round((text.split(' ').length)/(secs/60));
  window.score=Math.max(window.score||0,wpm);Arcade.gameOver(wpm);
  if(wpm>best){best=wpm;storageSet(BEST_KEY,String(best))}
  $('overBig').textContent=wpm;$('overAcc').textContent=acc;$('overSecs').textContent=secs.toFixed(1);$('overBest').textContent=best;
  $('overOv').classList.add('show');focusDialog('overOv');
}
function setPaused(v){
  if(v===paused||(v&&(state!=='playing'||!startTime||done)))return;
  paused=v;$('pauseOv').classList.toggle('show',v);
  if(v){focusDialog('pauseOv');clearInterval(timerInt);pausedAt=Date.now()}
  else{startTime+=Date.now()-pausedAt;timerInt=setInterval(tick,TICK_MS);focusInput()}
}
$('inp').addEventListener('input',e=>{
  if(done||paused||state!=='playing'){e.target.value='';return}
  let v=e.target.value;
  if(!startTime){startTime=Date.now();timerInt=setInterval(tick,TICK_MS)}
  /* Process every char in the field (iPad predictive text can insert several at
   * once) and match case-insensitively — iPadOS auto-capitalizes the first key
   * into an empty field even on hardware keyboards, which used to lock the game
   * after the first letter. */
  let hadError=false;
  for(const ch of v){
    if(pos<text.length&&ch.toLowerCase()===text[pos].toLowerCase())pos++;
    else{errors++;hadError=true}
  }
  e.target.value='';
  if(hadError){
    let spans=document.querySelectorAll('#text-display .current');
    spans.forEach(s=>{s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),WRONG_FLASH_MS)});
  }
  let acc=Math.round(((pos)/(pos+errors))*100)||100;
  $('acc').textContent=acc;
  $('prog-fill').style.width=(pos/text.length*100)+'%';
  renderText();
  if(pos>=text.length)finish(acc);
});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  if(e.key==='Enter'&&state!=='playing'){e.preventDefault();begin()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
$('playBtn').onclick=begin;$('againBtn').onclick=begin;$('newBtn').onclick=()=>{if(state==='playing')newTest();else begin()};
$('resumeBtn').onclick=()=>setPaused(false);
$('langEn').onclick=()=>setLang('en');$('langLb').onclick=()=>setLang('lb');
paintLang();newTest();focusDialog('startOv');
</script>
</body>
</html>
