<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tank Battles - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<style>
:root{--hud-h:54px;--pad:10px;--pad-b:36px;--p1:var(--cyan);--p2:var(--amber)}
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
.arcade-stage{padding:var(--hud-h) var(--pad) var(--pad-b)}
#c{border-radius:var(--radius);box-shadow:0 0 0 1px var(--border)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.p1{--c:var(--p1)}.p2{--c:var(--p2)}
.arcade-hud{inset:5px 14px auto;align-items:center}
.hud-btn{pointer-events:auto;min-height:44px}
.menu-actions{flex-direction:column;align-items:stretch;gap:9px}
.menu-actions .arcade-btn{width:100%}
.join{display:flex;gap:8px}
.menu-actions .join .arcade-btn{width:auto;flex:none}
.join input{flex:1;min-width:0;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);
  color:var(--text);font:700 16px/1 var(--font);text-transform:lowercase;text-align:center;outline:none}
.join input:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(77,232,255,.25)}
.status{min-height:22px;margin:12px 0 0!important;color:var(--cyan)!important;font-weight:650}
</style>
<script src="/pb/arcade-kit.js?v=2" data-arcade-id="tank-wars" data-arcade-title="Tank Battles"></script>
</head>
<body>
<main class="arcade-stage" id="stage">
  <canvas id="c" aria-label="Tank battlefield"></canvas>
  <div class="arcade-hud">
    <span class="arcade-pill p1"><i class="dot"></i><span id="n1">P1</span> <b id="s1">0</b></span>
    <button class="arcade-btn secondary hud-btn" id="hudMenu" type="button">Menu</button>
    <span class="arcade-pill p2"><span id="n2">P2</span> <b id="s2">0</b><i class="dot"></i></span>
  </div>
  <div class="arcade-hint" id="hint"></div>

  <div class="arcade-overlay show" id="menu"><div class="arcade-panel">
    <h2>Tank Battles</h2>
    <p>Bounce shots off the walls and empty the other tank's armour. Drive with WASD or the arrow keys, Space to fire; on touch use the on-screen D-pad and A button.</p>
    <div class="arcade-actions menu-actions">
      <button class="arcade-btn" id="mAI" type="button">Play vs Computer</button>
      <button class="arcade-btn secondary" id="mLocal" type="button">2 players, one device</button>
      <button class="arcade-btn secondary" id="mHost" type="button">Host online game</button>
      <div class="join"><input id="mCode" maxlength="5" placeholder="room code" aria-label="Room code" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"><button class="arcade-btn secondary" id="mJoin" type="button">Join</button></div>
    </div>
    <p class="status" id="mStatus" role="status"></p>
  </div></div>

  <div class="arcade-overlay" id="pauseOv"><div class="arcade-panel">
    <h2>Paused</h2><p>The battle waits for you.</p>
    <div class="arcade-actions"><button class="arcade-btn" id="resumeBtn" type="button">Resume</button></div>
  </div></div>
</main>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),stage=document.getElementById('stage');
const GW=900,GH=550,DPR_CAP=2,MAX_HP=5;
const ROOT=getComputedStyle(document.documentElement),tok=n=>ROOT.getPropertyValue(n).trim();
const FONT=tok('--font');
const PAL={bg:tok('--bg2'),line:tok('--border'),wall:tok('--card2'),text:tok('--text'),p1:tok('--cyan'),p2:tok('--amber'),good:tok('--good'),hit:tok('--danger')};
function fit(){ // size the canvas to the stage, backing store at device resolution
  const cs=getComputedStyle(stage);
  const aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const k=Math.max(0.1,Math.min(aw/GW,ah/GH));
  const dpr=Math.min(window.devicePixelRatio||1,DPR_CAP);
  C.style.width=Math.floor(GW*k)+'px';C.style.height=Math.floor(GH*k)+'px';
  C.width=Math.round(GW*k*dpr);C.height=Math.round(GH*k*dpr);
}
new ResizeObserver(fit).observe(stage);fit();
let keys={},bullets=[],walls=[],particles=[];
let p1={x:100,y:275,angle:0,color:PAL.p1,hp:5,score:0,cooldown:0,name:'P1'};
let p2={x:800,y:275,angle:Math.PI,color:PAL.p2,hp:5,score:0,cooldown:0,name:'P2'};

function genWalls(){
  walls=[];
  for(let i=0;i<12;i++){
    let w=20+Math.random()*60,h=20+Math.random()*60;
    let x=150+Math.random()*(GW-300),y=50+Math.random()*(GH-100);
    walls.push({x,y,w,h});
  }
}
genWalls();

/* ---------- modes + online ---------- */
let mode=null,running=false,netFrame=0,lastT=0,resetPending=false;
const remoteKeys={u:0,d:0,l:0,r:0,f:0};
let guestState=null;
const NET={open(code,role){parent.postMessage({__pbNet:{op:'open',code,role}},'*')},
 send(d){parent.postMessage({__pbNet:{op:'send',d}},'*')},
 onMsg:null,onPeers:null,onErr:null};
window.addEventListener('message',e=>{const d=e.data;if(!d)return;
 if(d.__pbNetMsg&&NET.onMsg)NET.onMsg(d.__pbNetMsg.r,d.__pbNetMsg.d);
 if(d.__pbNetPeers&&NET.onPeers)NET.onPeers(d.__pbNetPeers);
 if(d.__pbNetErr&&NET.onErr)NET.onErr(d.__pbNetErr)});
const menu=document.getElementById('menu'),mStatus=document.getElementById('mStatus');
const status=(t)=>mStatus.textContent=t;
const randCode=()=>Math.random().toString(36).replace(/[^a-z0-9]/g,'').slice(0,5).padEnd(5,'x');
const $=id=>document.getElementById(id);
const pauseOv=$('pauseOv');
let paused=false;
function names(){ // [left label, right label] for the current mode
  if(mode==='ai')return['You','CPU'];
  if(mode==='host')return['You','Them'];
  if(mode==='guest')return['Them','You'];
  return['P1','P2'];
}
function setPaused(v){ // pause offline games when the tab is hidden; online rooms keep running
  if(v===paused||(v&&(!running||mode==='host'||mode==='guest')))return;
  paused=v;pauseOv.classList.toggle('show',v);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
$('resumeBtn').onclick=()=>{lastT=0;setPaused(false)};
$('hudMenu').onclick=()=>backToMenu();
function begin(){
  p1.score=0;p2.score=0;resetRoundNow();running=true;paused=false;menu.classList.remove('show');
  if(mode==='host')NET.send({t:'w',w:walls});
  const[n1,n2]=names();$('n1').textContent=n1;$('n2').textContent=n2;
  $('hint').textContent=
    mode==='local'?'P1: WASD + Space  ·  P2: arrows + Enter':
    mode==='ai'?'WASD or arrows to drive  ·  Space to fire':
    'You are '+(mode==='host'?'left (cyan)':'right (amber)')+'  ·  WASD or arrows  ·  Space to fire';}
function backToMenu(msg){running=false;paused=false;mode=null;parent.postMessage({__pbNet:{op:'close'}},'*');
  pauseOv.classList.remove('show');menu.classList.add('show');status(msg||'')}
document.getElementById('mLocal').onclick=()=>{mode='local';begin()};
document.getElementById('mAI').onclick=()=>{mode='ai';begin()};
document.getElementById('mHost').onclick=()=>{mode='host';const c=randCode();NET.open(c,'host');
  status('Room code: '+c.toUpperCase()+' — waiting for the other player…')};
document.getElementById('mJoin').onclick=()=>{const c=(document.getElementById('mCode').value||'').trim().toLowerCase();
  if(!/^[a-z0-9]{4,6}$/.test(c)){status('Enter the 4-6 letter code from the host');return}
  mode='guest';NET.open(c,'guest');status('Joining '+c.toUpperCase()+'…')};
NET.onPeers=(p)=>{
  if(!running&&(mode==='host'||mode==='guest')&&p.n>=2)begin();
  if(running&&(mode==='host'||mode==='guest')&&p.n<2)backToMenu('Opponent left the game.')};
NET.onErr=(e)=>{if(mode==='host'||mode==='guest')backToMenu(e==='offline'?'Online play needs the internet.':'Connection problem — try again.')};
NET.onMsg=(r,d)=>{
  if(mode==='host'&&d&&d.t==='k')Object.assign(remoteKeys,d.k);
  if(mode==='guest'&&d&&d.t==='s')guestState=d;
  if(mode==='guest'&&d&&d.t==='w')walls=d.w;
};
const meU=()=>keys['w']||keys['W']||keys['ArrowUp'],meD=()=>keys['s']||keys['S']||keys['ArrowDown'],
      meL=()=>keys['a']||keys['A']||keys['ArrowLeft'],meR=()=>keys['d']||keys['D']||keys['ArrowRight'],
      meF=()=>keys[' ']||keys['Enter'];
function sendKeys(){NET.send({t:'k',k:{u:+!!meU(),d:+!!meD(),l:+!!meL(),r:+!!meR(),f:+!!meF()}})}

/* ---------- AI tank: respects walls (line of sight + detours) ---------- */
let aiWander=0,aiDir=null,aiDirT=0;
function losClear(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),steps=Math.ceil(d/10);
  for(let i=1;i<steps;i++){
    const x=x1+(x2-x1)*i/steps,y=y1+(y2-y1)*i/steps;
    for(const w of walls)if(x>w.x-6&&x<w.x+w.w+6&&y>w.y-6&&y<w.y+w.h+6)return false;
  }
  return true;
}
function pathClear(x,y,ang,len){
  const steps=Math.ceil(len/10);
  for(let i=1;i<=steps;i++){
    const px=x+Math.cos(ang)*i*10,py=y+Math.sin(ang)*i*10;
    if(px<25||px>GW-25||py<25||py>GH-25)return false;
    for(const w of walls)if(px>w.x-20&&px<w.x+w.w+20&&py>w.y-16&&py<w.y+w.h+16)return false;
  }
  return true;
}
function aiKeys(){
  const dx=p1.x-p2.x,dy=p1.y-p2.y,dist=Math.hypot(dx,dy);
  const direct=Math.atan2(dy,dx);
  const los=losClear(p2.x,p2.y,p1.x,p1.y);
  let want;
  if(los){
    aiDir=null;
    if(Math.random()<0.01)aiWander=(Math.random()-0.5)*1.2;
    want=direct+(dist>220?aiWander*0.4:0);
  }else{
    // no line of sight: drive along a committed detour heading around the wall
    aiDirT--;
    if(aiDir===null||aiDirT<=0||!pathClear(p2.x,p2.y,aiDir,60)){
      aiDir=direct+Math.PI;
      for(const off of [0.5,-0.5,1,-1,1.6,-1.6,2.2,-2.2]){
        if(pathClear(p2.x,p2.y,direct+off,110)){aiDir=direct+off;break;}
      }
      aiDirT=45;
    }
    want=aiDir;
  }
  let da=want-p2.angle;
  while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  let aimDa=direct-p2.angle;
  while(aimDa>Math.PI)aimDa-=Math.PI*2;while(aimDa<-Math.PI)aimDa+=Math.PI*2;
  // about to nose into a wall? reverse out
  const nx=p2.x+Math.cos(p2.angle)*3,ny=p2.y+Math.sin(p2.angle)*3;
  let blocked=false;
  for(let w of walls)if(nx>w.x-18&&nx<w.x+w.w+18&&ny>w.y-14&&ny<w.y+w.h+14)blocked=true;
  return{l:+(da<-0.06),r:+(da>0.06),
    u:+(!blocked&&(los?dist>140:true)),d:+blocked,
    f:+(los&&Math.abs(aimDa)<0.12&&dist<420&&Math.random()<0.5)};
}

function drawTank(t){
  X.save();X.translate(t.x,t.y);X.rotate(t.angle);
  X.fillStyle=t.color;
  X.fillRect(-18,-14,36,28);
  X.fillStyle=t.color;X.fillRect(-4,-4,30,8);
  X.beginPath();X.arc(0,0,10,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();X.arc(-2,-2,5,0,Math.PI*2);X.fill();
  X.restore();
  X.fillStyle=PAL.line;X.fillRect(t.x-20,t.y-25,40,5);
  X.fillStyle=t.hp>2?PAL.good:PAL.hit;X.fillRect(t.x-20,t.y-25,40*(Math.max(0,t.hp)/MAX_HP),5);
}

function moveTank(t,fwd,back,left,right,m){
  let spd=0;
  if(fwd)spd=2.5*m;if(back)spd=-1.5*m;
  if(left)t.angle-=0.04*m;if(right)t.angle+=0.04*m;
  let nx=t.x+Math.cos(t.angle)*spd,ny=t.y+Math.sin(t.angle)*spd;
  let blocked=false;
  for(let w of walls){if(nx>w.x-18&&nx<w.x+w.w+18&&ny>w.y-14&&ny<w.y+w.h+14)blocked=true}
  if(nx<20||nx>GW-20||ny<20||ny>GH-20)blocked=true;
  if(!blocked){t.x=nx;t.y=ny}
  if(t.cooldown>0)t.cooldown-=m;
}

function shoot(t,firing){
  if(firing&&t.cooldown<=0){
    t.cooldown=20;
    bullets.push({x:t.x+Math.cos(t.angle)*25,y:t.y+Math.sin(t.angle)*25,
      vx:Math.cos(t.angle)*6,vy:Math.sin(t.angle)*6,owner:t,life:80,bounces:1});
  }
}

function addParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*15,color});
  }
}

function resetRoundNow(){
  p1.x=100;p1.y=275;p1.angle=0;p1.hp=5;p1.cooldown=0;
  p2.x=800;p2.y=275;p2.angle=Math.PI;p2.hp=5;p2.cooldown=0;
  bullets=[];particles=[];genWalls();resetPending=false;
  if(mode==='host')NET.send({t:'w',w:walls});
}

const lerpAngle=(a,b,f)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*f};

function loop(ts){
  requestAnimationFrame(loop);
  const m=lastT?Math.min(2.5,Math.max(0.4,(ts-lastT)/16.667)):1;lastT=ts;
  X.setTransform(C.width/GW,0,0,C.height/GH,0,0);
  X.fillStyle=PAL.bg;X.fillRect(0,0,GW,GH);
  X.strokeStyle=PAL.line;X.globalAlpha=0.35;X.lineWidth=1;
  for(let i=0;i<GW;i+=40){X.beginPath();X.moveTo(i,0);X.lineTo(i,GH);X.stroke()}
  for(let i=0;i<GH;i+=40){X.beginPath();X.moveTo(0,i);X.lineTo(GW,i);X.stroke()}
  X.globalAlpha=1;

  if(running&&!paused){
    if(mode==='guest'){
      if(guestState){
        const a=guestState.a,b=guestState.b;
        p1.x+=(a.x-p1.x)*0.4;p1.y+=(a.y-p1.y)*0.4;p1.angle=lerpAngle(p1.angle,a.an,0.4);p1.hp=a.hp;p1.score=a.sc;
        p2.x+=(b.x-p2.x)*0.4;p2.y+=(b.y-p2.y)*0.4;p2.angle=lerpAngle(p2.angle,b.an,0.4);p2.hp=b.hp;p2.score=b.sc;
        bullets=guestState.bl.map(q=>({x:q[0],y:q[1],vx:0,vy:0,life:1,bounces:0,owner:null}));
      }
      if(++netFrame%5===0)sendKeys();
    }else{
      if(mode==='local'){
        moveTank(p1,keys['w']||keys['W'],keys['s']||keys['S'],keys['a']||keys['A'],keys['d']||keys['D'],m);
        moveTank(p2,keys['ArrowUp'],keys['ArrowDown'],keys['ArrowLeft'],keys['ArrowRight'],m);
        shoot(p1,keys[' ']);shoot(p2,keys['Enter']);
      }else{
        moveTank(p1,meU(),meD(),meL(),meR(),m);
        shoot(p1,meF());
        const k=mode==='ai'?aiKeys():remoteKeys;
        moveTank(p2,k.u,k.d,k.l,k.r,m);
        shoot(p2,k.f);
      }
      // bullets
      for(let i=bullets.length-1;i>=0;i--){
        let b=bullets[i];b.x+=b.vx*m;b.y+=b.vy*m;b.life-=m;
        let dead=false;
        for(let w of walls){
          if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){
            if(b.bounces>0){b.bounces--;b.vx*=-1;b.vy*=-1;addParticles(b.x,b.y,PAL.text,5)}
            else{dead=true;addParticles(b.x,b.y,PAL.text,8)}
          }
        }
        if(b.x<0||b.x>GW){if(b.bounces>0){b.bounces--;b.vx*=-1}else dead=true}
        if(b.y<0||b.y>GH){if(b.bounces>0){b.bounces--;b.vy*=-1}else dead=true}
        if(b.life<=0)dead=true;
        if(!dead&&!resetPending){
          let target=b.owner===p1?p2:p1;
          if(Math.hypot(b.x-target.x,b.y-target.y)<20){
            target.hp--;addParticles(b.x,b.y,target.color,15);dead=true;
            if(target.hp<=0){b.owner.score++;addParticles(target.x,target.y,target.color,40);
              if(mode==='ai'&&b.owner===p1){window.score=Math.max(window.score||0,p1.score);Arcade.gameOver(window.score)}
              resetPending=true;setTimeout(resetRoundNow,1000)}
          }
        }
        if(dead)bullets.splice(i,1);
      }
      if(mode==='host'&&++netFrame%5===0)
        NET.send({t:'s',a:{x:Math.round(p1.x),y:Math.round(p1.y),an:+p1.angle.toFixed(2),hp:p1.hp,sc:p1.score},
                        b:{x:Math.round(p2.x),y:Math.round(p2.y),an:+p2.angle.toFixed(2),hp:p2.hp,sc:p2.score},
                        bl:bullets.map(b=>[Math.round(b.x),Math.round(b.y)])});
    }
  }

  for(let w of walls){
    X.fillStyle=PAL.wall;X.fillRect(w.x,w.y,w.w,w.h);
    X.strokeStyle=PAL.line;X.lineWidth=1;X.strokeRect(w.x,w.y,w.w,w.h);
  }
  for(let b of bullets){
    X.fillStyle=PAL.text;
    X.beginPath();X.arc(b.x,b.y,4,0,Math.PI*2);X.fill();
  }
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];if(!paused){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--}
    if(p.life<=0){particles.splice(i,1);continue}
    X.globalAlpha=p.life/30;X.fillStyle=p.color;
    X.fillRect(p.x-2,p.y-2,4,4);X.globalAlpha=1;
  }
  drawTank(p1);drawTank(p2);
  syncHud();
}
let shown1=-1,shown2=-1;
function syncHud(){ // DOM scores, touched only when something changed
  if(p1.score!==shown1){shown1=p1.score;$('s1').textContent=shown1}
  if(p2.score!==shown2){shown2=p2.score;$('s2').textContent=shown2}
}
document.addEventListener('keydown',e=>{keys[e.key]=true;
  if(running&&(e.key==='m'||e.key==='M'))backToMenu();
  if(mode==='guest')sendKeys();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false;if(mode==='guest')sendKeys()});
requestAnimationFrame(loop);
</script>
</body>
</html>
