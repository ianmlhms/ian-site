<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tetris - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<style>
:root{--hud-h:54px;--pad:10px;--pad-b:10px}
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
.arcade-stage{padding:var(--hud-h) var(--pad) var(--pad-b)}
#c{border-radius:var(--radius);box-shadow:0 0 0 1px var(--border)}
.arcade-hud{inset:5px 14px auto;align-items:center}
.next{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 12px;border-radius:var(--radius)}
.arcade-btn.play{min-width:min(220px,100%);min-height:52px;font-size:17px}
#next{display:block;width:72px;height:36px}
@media (max-width:520px){.arcade-pill{padding:7px 9px;font-size:12px}.next{padding:4px 8px}.next .lbl{display:none}}
</style>
<script src="/pb/arcade-kit.js?v=4" data-arcade-id="tetris" data-arcade-title="Tetris"></script>
</head>
<body>
<main class="arcade-stage" id="stage">
  <canvas id="c" aria-label="Falling blocks board"></canvas>
  <div class="arcade-hud">
    <span class="arcade-pill">Score <b id="sc">0</b></span>
    <span class="arcade-pill">Lv <b id="lv">1</b> · <b id="ln">0</b> lines</span>
    <span class="arcade-pill next"><span class="lbl">Next</span> <canvas id="next" aria-label="Next piece"></canvas></span>
  </div>

  <div class="arcade-overlay show" id="startOv"><div class="arcade-panel">
    <h2>Tetris</h2>
    <p>Stack the pieces and clear full lines. Left / right move, up rotates, down drops softly, Space drops hard.</p>
    <p>On touch use the D-pad: up rotates, A drops hard.</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="playBtn" type="button">Play</button></div>
  </div></div>

  <div class="arcade-overlay" id="pauseOv"><div class="arcade-panel">
    <h2>Paused</h2><p>Your stack is waiting.</p>
    <div class="arcade-actions"><button class="arcade-btn" id="resumeBtn" type="button">Resume</button></div>
  </div></div>

  <div class="arcade-overlay" id="overOv"><div class="arcade-panel">
    <h2>Game over</h2>
    <span class="arcade-big" id="overBig">0</span>
    <p>Best <strong id="overBest">0</strong></p>
    <div class="arcade-actions"><button class="arcade-btn play" id="againBtn" type="button">Play again</button></div>
  </div></div>
</main>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),stage=document.getElementById('stage');
const NC=document.getElementById('next'),NX=NC.getContext('2d');
const COLS=10,ROWS=20,SZ=30,GW=COLS*SZ,GH=ROWS*SZ,DPR_CAP=2;
const NEXT_CELL=18,NEXT_W=72,NEXT_H=36,MAX_DT=100,BEST_KEY='pb_best_tetris';
const $=id=>document.getElementById(id);
const ROOT=getComputedStyle(document.documentElement),tok=n=>ROOT.getPropertyValue(n).trim();
const PAL={bg:tok('--bg2'),grid:tok('--border')};
const SHAPES=[
  {blocks:[[0,0],[1,0],[2,0],[3,0]],color:'#00e5ff'},
  {blocks:[[0,0],[1,0],[0,1],[1,1]],color:'#ffcc00'},
  {blocks:[[0,0],[1,0],[2,0],[1,1]],color:'#aa44ff'},
  {blocks:[[0,0],[1,0],[2,0],[2,1]],color:'#ff8800'},
  {blocks:[[0,0],[1,0],[2,0],[0,1]],color:'#4488ff'},
  {blocks:[[0,0],[1,0],[1,1],[2,1]],color:'#44ff44'},
  {blocks:[[1,0],[2,0],[0,1],[1,1]],color:'#ff4444'},
];
let grid,piece,next,score,lines,level,gameOver,dropTimer,dropInterval;
let state='idle',paused=false,best=loadBest();

function loadBest(){
  try{return Number(localStorage.getItem(BEST_KEY))||0}
  catch(error){console.warn('[Tetris] could not read best score',error);return 0}
}
function saveBest(value){
  try{localStorage.setItem(BEST_KEY,String(value))}
  catch(error){console.warn('[Tetris] could not save best score',error)}
}
function fit(){ // board fills the stage at device resolution; the next-piece canvas follows the same ratio
  const cs=getComputedStyle(stage);
  const aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const k=Math.max(0.1,Math.min(aw/GW,ah/GH));
  const dpr=Math.min(window.devicePixelRatio||1,DPR_CAP);
  C.style.width=Math.floor(GW*k)+'px';C.style.height=Math.floor(GH*k)+'px';
  C.width=Math.round(GW*k*dpr);C.height=Math.round(GH*k*dpr);
  NC.width=Math.round(NEXT_W*dpr);NC.height=Math.round(NEXT_H*dpr);
}
new ResizeObserver(fit).observe(stage);fit();

function newPiece(){
  piece={shape:next||SHAPES[Math.floor(Math.random()*7)],x:3,y:0,rot:0};
  next=SHAPES[Math.floor(Math.random()*7)];
  let blocks=getBlocks(piece);
  for(let b of blocks)if(!gameOver&&grid[b.y]&&grid[b.y][b.x]){gameOver=true;Arcade.gameOver(score)}
}
function getBlocks(p){
  let s=p.shape.blocks,r=p.rot%4,res=[];
  for(let b of s){
    let x=b[0],y=b[1];
    for(let i=0;i<r;i++){let t=x;x=-y+2;y=t}
    res.push({x:x+p.x,y:y+p.y});
  }return res;
}
function valid(p){
  let blocks=getBlocks(p);
  for(let b of blocks){if(b.x<0||b.x>=COLS||b.y>=ROWS)return false;if(b.y>=0&&grid[b.y][b.x])return false}
  return true;
}
function showStats(){
  $('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level;
}
function lock(){
  let blocks=getBlocks(piece);
  for(let b of blocks)if(b.y>=0)grid[b.y][b.x]=piece.shape.color;
  // Clear lines
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    if(grid[y].every(c=>c)){grid.splice(y,1);grid.unshift(Array(COLS).fill(0));cleared++;y++}
  }
  if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;Arcade.score(score);level=Math.floor(lines/10)+1;
    dropInterval=Math.max(50,500-level*40);
    showStats();
  }
  newPiece();
}
function drawCell(ctx,x,y,size,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(x+1,y+1,size-2,size-2,size>20?4:3);ctx.fill();
}
function draw(){
  X.setTransform(C.width/GW,0,0,C.height/GH,0,0);
  X.fillStyle=PAL.bg;X.fillRect(0,0,GW,GH);
  // Grid
  X.strokeStyle=PAL.grid;X.globalAlpha=0.45;X.lineWidth=1;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!grid[y][x])X.strokeRect(x*SZ+.5,y*SZ+.5,SZ,SZ);
  X.globalAlpha=1;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x])drawCell(X,x*SZ,y*SZ,SZ,grid[y][x]);
  // Current piece
  if(!gameOver&&piece){
    let blocks=getBlocks(piece);
    // Ghost
    let ghost={...piece};while(valid({...ghost,y:ghost.y+1}))ghost.y++;
    let gb=getBlocks(ghost);
    X.globalAlpha=0.2;X.fillStyle=piece.shape.color;
    for(let b of gb){X.fillRect(b.x*SZ+2,b.y*SZ+2,SZ-4,SZ-4)}
    X.globalAlpha=1;
    for(let b of blocks)if(b.y>=0)drawCell(X,b.x*SZ,b.y*SZ,SZ,piece.shape.color);
  }
  drawNext();
}
function drawNext(){
  NX.setTransform(NC.width/NEXT_W,0,0,NC.height/NEXT_H,0,0);
  NX.clearRect(0,0,NEXT_W,NEXT_H);
  if(!next)return;
  const cols=Math.max(...next.blocks.map(b=>b[0]))+1,rows=Math.max(...next.blocks.map(b=>b[1]))+1;
  const ox=(NEXT_W-cols*NEXT_CELL)/2,oy=(NEXT_H-rows*NEXT_CELL)/2;
  for(let b of next.blocks)drawCell(NX,ox+b[0]*NEXT_CELL,oy+b[1]*NEXT_CELL,NEXT_CELL,next.color);
}
function start(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=0;lines=0;level=1;gameOver=false;dropInterval=500;dropTimer=0;paused=false;
  next=SHAPES[Math.floor(Math.random()*7)];newPiece();
  showStats();
  state='playing';lastTime=performance.now();
  ['startOv','overOv','pauseOv'].forEach(id=>$(id).classList.remove('show'));
}
function finish(){
  state='over';
  if(score>best){best=score;saveBest(best)}
  $('overBig').textContent=score;$('overBest').textContent=best;
  $('overOv').classList.add('show');
}
function setPaused(v){
  if(v===paused||(v&&state!=='playing'))return;
  paused=v;lastTime=performance.now();$('pauseOv').classList.toggle('show',v);
}
let lastTime=0;
function loop(t){
  let dt=Math.min(MAX_DT,t-lastTime);lastTime=t;
  if(state==='playing'&&!paused){
    if(gameOver)finish();
    else{dropTimer+=dt;if(dropTimer>dropInterval){dropTimer=0;
      if(valid({...piece,y:piece.y+1}))piece.y++;else lock()}
      if(gameOver)finish()}
  }
  if(grid)draw();
  requestAnimationFrame(loop);
}
function handleKey(e){
  if(e.target.closest&&e.target.closest('button'))return;
  if(state!=='playing'){
    if(e.key===' '||e.key==='Enter'){start();e.preventDefault()}
    return;
  }
  if(paused)return;
  if(e.key==='ArrowLeft'&&valid({...piece,x:piece.x-1}))piece.x--;
  if(e.key==='ArrowRight'&&valid({...piece,x:piece.x+1}))piece.x++;
  if(e.key==='ArrowDown'&&valid({...piece,y:piece.y+1})){piece.y++;score++;Arcade.score(score);$('sc').textContent=score}
  if(e.key==='ArrowUp'){let t={...piece,rot:piece.rot+1};if(valid(t))piece.rot++}
  if(e.key===' '){while(valid({...piece,y:piece.y+1})){piece.y++;score+=2;Arcade.score(score)}$('sc').textContent=score;lock()}
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();
}
document.addEventListener('keydown',handleKey);
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
$('playBtn').onclick=start;$('againBtn').onclick=start;$('resumeBtn').onclick=()=>setPaused(false);
start();state='idle';$('startOv').classList.add('show');
requestAnimationFrame(loop);
</script>
</body>
</html>
