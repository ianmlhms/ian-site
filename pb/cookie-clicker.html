<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cookie Clicker - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<link rel="stylesheet" href="/pb/idle-extras.css?v=2">
<script src="/pb/idle-extras.js?v=2"></script>
<style>
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
/* idle game: no start or game-over panel, the save restores where you left off */
.arcade-stage.cc{display:flex;align-items:stretch;padding:0;overflow:hidden}
#left{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px}
#right{width:min(340px,42%);flex:none;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--card)}
#shop{flex:1;min-height:0;overflow-y:auto;padding:14px;overscroll-behavior:contain}
#count{font:800 clamp(28px,6vw,44px)/1.05 var(--font-display);letter-spacing:-.03em;color:var(--amber);font-variant-numeric:tabular-nums;text-align:center}
#persec{margin-bottom:14px;color:var(--muted);font:650 14px/1.3 var(--font);text-align:center}
#cookie{position:relative;width:min(260px,38vh,70vw);aspect-ratio:1;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:transform .18s var(--spring);touch-action:manipulation}
#cookie:hover{transform:scale(1.04)}
#cookie:active{transform:scale(.95)}
#cookie:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
#cookie canvas{width:100%;height:100%;border-radius:0;box-shadow:none;pointer-events:none}
.group-title{margin:18px 0 8px;color:var(--muted);font:800 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.group-title:first-child{margin-top:0}
.upgrade{display:block;width:100%;min-height:56px;margin-bottom:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card2);color:var(--text);text-align:left;font:inherit;cursor:pointer;
  transition:transform .18s var(--spring),border-color .18s ease,opacity .18s ease}
.upgrade:hover{border-color:var(--amber)}
.upgrade:active{transform:scale(.98)}
.upgrade:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.upgrade.locked{opacity:.45;cursor:not-allowed}
.upgrade .cost{float:right;margin-left:8px;color:var(--amber);font:800 14px/1.3 var(--font);font-variant-numeric:tabular-nums}
.upgrade .name{display:block;font:750 15px/1.3 var(--font)}
.upgrade .desc{display:block;margin-top:2px;color:var(--muted);font:600 12px/1.35 var(--font)}
.float-text{position:fixed;z-index:9;color:var(--amber);font:800 22px/1 var(--font);pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}
@media (max-width:700px){
  .arcade-stage.cc{flex-direction:column}
  #left{flex:none;height:min(48%,330px);padding:10px}
  #persec{margin-bottom:6px}
  #cookie{width:min(190px,24vh,60vw)}
  #right{width:auto;flex:1;min-height:0;border-left:0;border-top:1px solid var(--border)}
}
@media (prefers-reduced-motion:reduce){
  #cookie,.upgrade{transition:none}#cookie:hover,#cookie:active,.upgrade:active{transform:none}
  .float-text{animation:floatFade 1s linear forwards}
  @keyframes floatFade{0%{opacity:1}100%{opacity:0}}
}
</style>
<script src="/pb/arcade-kit.js?v=17" data-arcade-id="cookie-clicker" data-arcade-title="Cookie Clicker"></script>
</head>
<body>
<main class="arcade-stage cc" id="stage">
  <section id="left">
    <div id="count">0 cookies</div>
    <div id="persec">per second: 0</div>
    <button id="cookie" type="button" aria-label="Bake a cookie"><canvas id="cc"></canvas></button>
  </section>
  <aside id="right" aria-label="Upgrades"><div id="shop"><div id="upgrades"></div></div></aside>
</main>
<script>
const $=id=>document.getElementById(id);
const ROOT_STYLE=getComputedStyle(document.documentElement);
const cssVar=(name,fallback)=>ROOT_STYLE.getPropertyValue(name).trim()||fallback;
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const COOKIE_SIZE=250,COOKIE_R=95,MAX_DPR=3,FLOAT_MS=1000,TICK_MS=100,SAVE_EVERY_MS=5000,COST_GROWTH=1.15,SWAY=0.05;
const REBIRTH_THRESHOLD=1e12;
let cookies=0,cps=0,clickPower=1,totalClicks=0,totalBaked=0,roundBaked=0,stars=0,rebirthCount=0,giftDay='',loaded=false;
let rewards=null;
const upgrades=[
  {name:'Auto Clicker',desc:'Clicks once per second',baseCost:15,cps:0.1,count:0,icon:'👆'},
  {name:'Grandma',desc:'Bakes cookies slowly',baseCost:100,cps:1,count:0,icon:'👵'},
  {name:'Cookie Farm',desc:'Grows cookie plants',baseCost:500,cps:5,count:0,icon:'🌾'},
  {name:'Cookie Factory',desc:'Mass production!',baseCost:3000,cps:20,count:0,icon:'🏭'},
  {name:'Cookie Mine',desc:'Digs up ancient cookies',baseCost:10000,cps:50,count:0,icon:'⛏️'},
  {name:'Cookie Bank',desc:'Generates cookie interest',baseCost:50000,cps:150,count:0,icon:'🏦'},
  {name:'Cookie Temple',desc:'Prays for cookies',baseCost:200000,cps:500,count:0,icon:'🏛️'},
  {name:'Cookie Wizard',desc:'Conjures cookies magically',baseCost:1000000,cps:2000,count:0,icon:'🧙'},
  {name:'Cookie Portal',desc:'Opens dimensional cookie rifts',baseCost:5000000,cps:8000,count:0,icon:'🌀'},
  {name:'Cookie Planet',desc:'An entire planet of cookies',baseCost:50000000,cps:50000,count:0,icon:'🪐'},
  {name:'Cookie Galaxy',desc:'Billions of cookie stars',baseCost:500000000,cps:300000,count:0,icon:'🌌'},
  {name:'Time Machine',desc:'Brings back cookies from the past',baseCost:5000000000,cps:2000000,count:0,icon:'⏳'},
  {name:'Antimatter Oven',desc:'Turns antimatter into cookies',baseCost:75000000000,cps:15000000,count:0,icon:'⚛️'},
  {name:'Cookie Multiverse',desc:'Every universe bakes for you',baseCost:1000000000000,cps:120000000,count:0,icon:'🔮'},
  {name:'Cookie Singularity',desc:'Infinite cookie density',baseCost:20000000000000,cps:1000000000,count:0,icon:'🕳️'},
  {name:'Cookie God',desc:'The cookie is all',baseCost:500000000000000,cps:10000000000,count:0,icon:'👑'},
  {name:'Haunted Oven',desc:'🎃 Halloween only',baseCost:300e9,cps:40e6,count:0,icon:'👻',halloween:true},
];

const clickUpgrades=[
  {name:'Stronger Fingers',desc:'+1 click power',baseCost:50,power:1,count:0,icon:'💪'},
  {name:'Double Click',desc:'+5 click power',baseCost:500,power:5,count:0,icon:'✌️'},
  {name:'Golden Touch',desc:'+25 click power',baseCost:5000,power:25,count:0,icon:'✨'},
  {name:'Cookie Storm',desc:'+100 click power',baseCost:50000,power:100,count:0,icon:'⚡'},
  {name:'Cookie Quake',desc:'+1K click power',baseCost:1000000,power:1000,count:0,icon:'🌋'},
  {name:'Cosmic Finger',desc:'+20K click power',baseCost:50000000,power:20000,count:0,icon:'🌠'},
];

function getCost(u){return Math.floor(u.baseCost*Math.pow(COST_GROWTH,u.count))}

function format(n){
  if(n>=1e21)return(n/1e21).toFixed(1)+'Sx';
  if(n>=1e18)return(n/1e18).toFixed(1)+'Qi';
  if(n>=1e15)return(n/1e15).toFixed(1)+'Qa';
  if(n>=1e12)return(n/1e12).toFixed(1)+'T';
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n);
}

function clickCookie(e){
  earnCookies(clickPower);totalClicks++;
  window.score=Math.floor(totalBaked);Arcade.score(window.score);
  // a keyboard "click" has no pointer position: float from the cookie's centre instead
  const r=$('cookie').getBoundingClientRect();
  const x=e.detail===0?r.left+r.width/2:e.clientX,y=e.detail===0?r.top+r.height/2:e.clientY;
  let ft=document.createElement('div');ft.className='float-text';
  ft.textContent='+'+format(clickPower);
  ft.style.left=(x-30)+'px';ft.style.top=(y-20)+'px';
  document.body.appendChild(ft);
  setTimeout(()=>ft.remove(),FLOAT_MS);
  updateUI();
}
$('cookie').addEventListener('click',clickCookie);

function buyUpgrade(i,type){
  let u=type==='cps'?upgrades[i]:clickUpgrades[i];
  if(!u||(u.halloween&&!IdleExtras.halloween()))return;
  let cost=getCost(u);
  if(cookies>=cost){
    cookies-=cost;u.count++;
    recalculate();
    updateUI();pushSave();
  }
}

/* The shop DOM is built ONCE and then updated in place - rebuilding it on a
 * timer destroyed the element mid-click, which ate purchases. */
function buildUpgrades(){
  let h='<p class="group-title">Click power</p>';
  clickUpgrades.forEach((u,i)=>{
    h+=`<button type="button" class="upgrade" data-type="click" data-i="${i}">
      <span class="cost"></span><span class="name"></span><span class="desc">${u.desc}</span></button>`;
  });
  h+='<p class="group-title">Production</p>';
  upgrades.forEach((u,i)=>{
    h+=`<button type="button" class="upgrade" data-type="cps" data-i="${i}">
      <span class="cost"></span><span class="name"></span><span class="desc"></span></button>`;
  });
  const box=$('upgrades');
  box.innerHTML=h;
  box.addEventListener('click',(e)=>{
    const row=e.target.closest('.upgrade');
    if(row)buyUpgrade(+row.dataset.i,row.dataset.type);
  });
}

function refreshUpgrades(){
  document.querySelectorAll('#upgrades .upgrade').forEach(row=>{
    const u=row.dataset.type==='cps'?upgrades[+row.dataset.i]:clickUpgrades[+row.dataset.i];
    const cost=getCost(u);
    const eventLocked=u.halloween&&!IdleExtras.halloween();
    const locked=cookies<cost||eventLocked;
    row.classList.toggle('locked',locked);
    row.setAttribute('aria-disabled',String(locked));
    row.querySelector('.cost').textContent=format(cost)+' 🍪';
    row.querySelector('.name').textContent=`${u.icon} ${u.name} (${u.count})`;
    if(row.dataset.type==='cps')row.querySelector('.desc').textContent=`${u.halloween?(eventLocked?'🎃 Halloween only':'Limited Halloween building'):u.desc} [${format(u.cps*u.count*IdleExtras.multiplier(stars))}/s]`;
  });
}

function updateUI(){
  $('count').textContent=format(cookies)+' cookies';
  $('persec').textContent='per second: '+format(cps)+' | click power: '+format(clickPower);
  refreshUpgrades();
  rewards?.refresh();
}

// Draw cookie (backing store sized for the screen's pixel ratio, drawn in 250 x 250 units)
const cc=$('cc'),cx=cc.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,MAX_DPR);
cc.width=Math.round(COOKIE_SIZE*dpr);cc.height=Math.round(COOKIE_SIZE*dpr);
function drawCookie(){
  cx.setTransform(cc.width/COOKIE_SIZE,0,0,cc.height/COOKIE_SIZE,0,0);
  cx.clearRect(0,0,COOKIE_SIZE,COOKIE_SIZE);
  let t=REDUCED?0:Date.now()/2000;
  cx.save();cx.translate(COOKIE_SIZE/2,COOKIE_SIZE/2);cx.rotate(Math.sin(t)*SWAY);
  cx.beginPath();cx.arc(3,3,COOKIE_R,0,Math.PI*2);cx.fillStyle='rgba(0,0,0,0.3)';cx.fill();
  let g=cx.createRadialGradient(0,0,20,0,0,COOKIE_R);
  g.addColorStop(0,'#d4a04a');g.addColorStop(0.7,'#c48a30');g.addColorStop(1,'#a06820');
  cx.beginPath();cx.arc(0,0,COOKIE_R,0,Math.PI*2);cx.fillStyle=g;cx.fill();
  cx.fillStyle='#5a3010';
  let chips=[[20,-30],[-40,20],[10,40],[-20,-50],[45,10],[-10,15],[30,-60],[-50,-20],[25,55],[-35,45]];
  for(let[cx2,cy2]of chips){cx.beginPath();cx.ellipse(cx2,cy2,8,6,cx2,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=0.15;cx.fillStyle='#fff';
  cx.beginPath();cx.ellipse(-20,-25,40,25,-0.5,0,Math.PI*2);cx.fill();
  cx.globalAlpha=1;
  cx.restore();
  requestAnimationFrame(drawCookie);
}
drawCookie();

/* ---------- persistence: local save injected by PixelBreak, cloud save arrives
 * via postMessage; whichever has more total cookies baked wins ---------- */
function snapshot(){
  return {v:1,c:Math.floor(cookies),tb:Math.floor(totalBaked),tc:totalClicks,
    rb:roundBaked,st:stars,rbc:rebirthCount,gd:giftDay,savedAt:Date.now(),
    u:upgrades.map(u=>u.count),cu:clickUpgrades.map(u=>u.count)};
}
function safeNumber(value,fallback=0){return typeof value==='number'&&Number.isFinite(value)&&value>=0?value:fallback}
function recalculate(){
  cps=upgrades.reduce((sum,u)=>sum+u.cps*u.count,0)*IdleExtras.multiplier(stars);
  clickPower=1+clickUpgrades.reduce((sum,u)=>sum+u.power*u.count,0);
}
function earnCookies(amount){cookies+=amount;totalBaked+=amount;roundBaked+=amount}
function rebirth(){
  const earned=Math.floor(Math.sqrt(roundBaked/REBIRTH_THRESHOLD));
  if(earned<1)return;
  cookies=0;roundBaked=0;totalClicks=0;stars+=earned;rebirthCount++;
  upgrades.forEach(u=>{if(!u.halloween)u.count=0});
  clickUpgrades.forEach(u=>{u.count=0});
  recalculate();updateUI();
}
function applySave(sv){
  if(!sv||sv.v!==1||!Number.isFinite(sv.tb)||sv.tb<0)return;
  const incomingRebirth=Math.floor(safeNumber(sv.rbc));
  if(incomingRebirth<rebirthCount){
    if(sv.tb>totalBaked){totalBaked=sv.tb;window.score=Math.floor(totalBaked);Arcade.score(window.score);pushSave()}
    return;
  }
  if(incomingRebirth===rebirthCount&&(sv.tb<totalBaked||(loaded&&sv.tb===totalBaked)))return;
  loaded=true;
  cookies=safeNumber(sv.c);totalBaked=Math.max(totalBaked,sv.tb);totalClicks=safeNumber(sv.tc);
  roundBaked=safeNumber(sv.rb,sv.tb);stars=Math.max(stars,Math.floor(safeNumber(sv.st)));rebirthCount=incomingRebirth;
  if(typeof sv.gd==='string'&&sv.gd>giftDay)giftDay=sv.gd;
  upgrades.forEach((u,i)=>{u.count=Math.floor(safeNumber(sv.u?.[i]))});
  clickUpgrades.forEach((u,i)=>{u.count=Math.floor(safeNumber(sv.cu?.[i]))});
  recalculate();
  const result=IdleExtras.offline(stars,sv.savedAt,cps);
  earnCookies(result.credited);rewards?.notice(result);
  window.score=Math.floor(totalBaked);Arcade.score(window.score);
  updateUI();
  pushSave();
}
function pushSave(){try{parent.postMessage({__pbSave:1,data:snapshot()},'*')}catch(error){console.warn('[Cookie Clicker] Save failed',error)}}
window.addEventListener('message',(e)=>{const d=e.data;if(e.source===parent&&d&&d.__pbLoadSave===1)applySave(d.data)});

// Game loop
setInterval(()=>{earnCookies(cps/10);window.score=Math.floor(totalBaked);Arcade.score(window.score);updateUI()},TICK_MS);
buildUpgrades();
rewards=IdleExtras.mount({host:$('shop'),threshold:REBIRTH_THRESHOLD,read:()=>({rb:roundBaked,st:stars,gd:giftDay}),format,
  resets:'cookies, all buildings (including gifted Time Machines) except Haunted Ovens, click upgrades and round clicks.',
  keeps:'Haunted Ovens if owned.',production:()=>cps,currency:'🍪',rebirth,save:pushSave,earn:earnCookies,
  gift:(day,amount)=>{giftDay=day;earnCookies(amount);updateUI()}});
applySave(window.__pbSave);                       // local save (injected before load)
try{parent.postMessage({__pbWantSave:1},'*')}catch(e){}  // ask for the cloud save
setInterval(pushSave,SAVE_EVERY_MS);
window.addEventListener('pagehide',pushSave);
updateUI();
</script>
</body>
</html>
