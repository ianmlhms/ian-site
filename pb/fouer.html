<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2430">
<meta name="robots" content="noindex">
<title>Schueberfouer Tycoon · Arcade</title>
<link rel="icon" href="data:,">
<style>
/* critical styles only (the loading screen): everything else is in ui.css */
:root { color-scheme: dark; --ink: #fff7e0; --muted: #a9b9bd; --panel: #0f2430e8; --line: #ffffff26; --gold: #ffcf5c; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f2430; }
body { display: flex; flex-direction: column; font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
#shell { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; isolation: isolate; }
#fouerCanvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1c4254, #0b1a24); z-index: 60; transition: opacity .6s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { text-align: center; width: min(340px, 80%); }
#loading .sheep { font-size: 56px; margin-bottom: 6px; animation: bob 1.4s ease-in-out infinite; }
#loading b { font-size: 26px; letter-spacing: -.5px; }
#bar { height: 7px; border-radius: 4px; background: #ffffff22; margin-top: 18px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffcf5c, #ff9d3c); transition: width .25s; }
#loading small { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
@keyframes bob { 50% { transform: translateY(-6px); } }
</style>
<link rel="stylesheet" href="/pb/idle-extras.css?v=5">
<link rel="stylesheet" href="/pb/fouer/ui.css?v=4">
<script src="/pb/idle-extras.js?v=8"></script>
<script src="/pb/arcade-kit.js?v=34" data-arcade-id="park" data-arcade-title="Schueberfouer Tycoon"></script>
</head>
<body>
<main id="shell">
  <canvas id="fouerCanvas" tabindex="0" role="img" aria-label="The Schueberfouer fair ground on the Glacis in Luxembourg. Drag to move, pinch to zoom."></canvas>
  <div id="title"><span>Glacis · Lëtzebuerg</span><b>Schueberfouer Tycoon</b></div>
  <div class="fabs" id="fabs">
    <button class="fab" id="walkBtn" type="button" data-tut="walk" hidden>👣</button>
    <button class="fab" id="envBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Weather and time of day">☀️</button>
    <button class="fab" id="frameBtn" type="button" aria-label="Frame the whole fair ground">⤢</button>
    <button class="fab" id="menuBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Menu">☰</button>
  </div>
  <div class="popover" id="envPop" role="dialog" aria-label="Weather and time" hidden></div>
  <div class="popover" id="menu" role="dialog" aria-label="Menu" hidden></div>
  <div id="ui" aria-live="polite"></div>
  <div id="loading" role="status"><div class="box"><div class="sheep">🐑</div><b>Schueberfouer</b><div id="bar"><i></i></div><small id="loadMsg">…</small></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
window.addEventListener("error",function(event){document.documentElement.dataset.bootError=event.message||"script-error"});
if(!window.THREE){
  document.documentElement.dataset.bootError="three-missing";
  document.getElementById("loadMsg").textContent="three.js r160 failed to load";
  throw new Error("three.js r160 failed to load");
}
</script>
<!-- the Luxtram ground and facade renderers are reused as they are (same URLs as pb/train-sim.html: one browser cache entry) -->
<script src="/pb/train-sim/luxtram-facades.js?v=3"></script>
<script src="/pb/train-sim/luxtram-ground.js?v=14"></script>
<script type="module">
  // ?models=1 -> the W3 model preview (turntable grid / single model / full fair); ?stage=1 -> W2's empty Glacis stage; otherwise the game.
  // Imports are absolute: inside the arcade this page runs as a srcdoc iframe.
  const q = new URLSearchParams(location.search);
  const entry = q.get("models") === "1" ? "/pb/fouer/models/preview.js?v=1" : q.get("stage") === "1" ? "/pb/fouer/world/stage.js?v=1" : "/pb/fouer/main.js?v=6";
  import(entry);
</script>
</body>
</html>
