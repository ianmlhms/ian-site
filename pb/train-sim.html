<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Zuchsimulator Lëtzebuerg 🚆 – Arcade</title>
<link rel="stylesheet" href="/pb/train-sim.css?v=7">
<script src="/pb/train-sim/lock.js?v=1"></script><!-- career lock (rail | tram) before arcade-kit: it may retitle the page, and arcade-kit reads the title -->
<script src="/pb/arcade-kit.js?v=35" data-arcade-id="train-sim"></script>
<script src="/pb/game-data.js?v=1" defer></script>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="3D"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="glass nextbox">
        <span class="lbl" id="nextLbl">Nächsten Arrêt</span>
        <b id="nextName">–</b>
        <div class="row"><span id="nextDist">–</span><span id="nextSide" class="chip"></span></div>
        <div class="sched" id="sched" hidden>
          <span id="schedArr" class="pill"><small id="schedArrLbl">Ukunft</small><b id="schedArrT">--:--</b></span>
          <span id="schedDep" class="pill"><small id="schedDepLbl">Ofaart</small><b id="schedDepT">--:--</b></span>
        </div>
        <div id="depBadge" class="depbadge" hidden></div>
      </div>
      <div class="glass strip" id="strip" aria-hidden="true"><div class="line"></div><div id="stripDots"></div><i id="stripTrain"></i></div>
      <div class="glass statsbox">
        <div class="clockrow"><b id="clock">08:00</b><small id="clockSec">:00</small><span id="delay" class="delay">+0:00</span></div>
        <small id="delayWord" class="delayword"></small>
        <div class="statline"><span class="pax" title="Passagéier">&#128101; <b id="onboard">0</b></span><span class="eur">&euro; <b id="cashHud">0</b></span></div>
        <small id="svcLabel"></small>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="glass speedbox">
        <div class="speed"><b id="speedNum">0</b><small>km/h</small></div>
        <div class="limits"><span id="limitSign" class="limit-sign">80</span><span id="nextLimit" class="nextlimit"></span></div>
      </div>
      <div class="glass centerbox" id="centerBox">
        <span id="revLamp" class="parklamp revlamp" hidden>◀ R</span>
        <div id="xchg" class="xchg" hidden>
          <span id="xchgOut" class="out"></span><span id="xchgIn" class="in"></span><span id="xchgOn" class="on"></span>
        </div>
        <div class="lever-row"><b id="leverLabel">0</b><div id="leverBar" aria-hidden="true"></div><span id="parkLamp" class="parklamp" hidden></span><span id="doorState" class="doorstate"></span></div>
        <div id="guide" class="guide" hidden></div>
        <div id="hint" class="hint"></div>
      </div>
      <div class="glass signalbox">
        <span class="sig" id="sigLight" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></span>
        <span id="sigText" class="sigtext"></span>
      </div>
    </div>
    <div id="aheadLoad" class="glass aheadload" role="status" hidden></div>
    <div id="camHint" class="glass camhint" hidden></div>
    <div id="walkPad" class="walkpad" hidden aria-hidden="true"><i id="walkKnob"></i></div>
    <button id="btnMenu" class="glass chipbtn" type="button" data-test="btn-menu"></button>
    <div id="touchLever" class="tpad tlever" role="group" aria-labelledby="tlTitle">
      <span id="tlTitle" hidden data-t="touchLever"></span>
      <div id="tlRail" class="glass tl-rail" role="slider" aria-orientation="vertical" aria-labelledby="tlTitle" aria-valuemin="-7" aria-valuemax="5" aria-valuenow="0" data-test="touch-lever"><div id="tlTicks" class="tl-ticks"></div><i id="tlThumb" class="tl-thumb neutral"><b id="tlLabel">0</b></i></div>
      <button id="tbEb" class="glass tbtn tb-eb" type="button" tabindex="-1" data-test="touch-eb"><span class="ic">EB</span><span class="lb" data-t="touchEb"></span></button>
    </div>
    <div id="touchBtns" class="tpad tbtns">
      <button id="tbDoors" class="glass tbtn tb-main" type="button" tabindex="-1" data-test="touch-doors"><span class="ic" aria-hidden="true">&#128682;</span><span class="lb" data-t="touchDoors"></span></button>
      <button id="tbHorn" class="glass tbtn tb-main" type="button" tabindex="-1" data-test="touch-horn"><span class="ic" aria-hidden="true">&#128239;</span><span class="lb" data-t="touchHorn"></span></button>
      <button id="tbLights" class="glass tbtn" type="button" tabindex="-1" data-test="touch-lights"><span class="ic" aria-hidden="true">&#128161;</span><span class="lb" data-t="touchLights"></span></button>
      <button id="tbPark" class="glass tbtn" type="button" tabindex="-1" data-test="touch-park"><span class="ic" aria-hidden="true">P</span><span class="lb" data-t="touchPark"></span></button>
      <button id="tbTimetable" class="glass tbtn" type="button" tabindex="-1" data-test="touch-timetable"><span class="ic" aria-hidden="true">&#128339;</span><span class="lb" data-t="touchTimetable"></span></button>
      <button id="tbAnnounce" class="glass tbtn" type="button" tabindex="-1" data-test="touch-announce"><span class="ic" aria-hidden="true">&#128276;</span><span class="lb" data-t="touchAnnounce"></span></button>
    </div>
    <div class="hud-util">
      <span id="camName" class="glass chipbtn"></span>
      <button id="btnInside" class="glass chipbtn" type="button" hidden data-test="btn-inside">5</button>
      <button id="btnQuality" class="glass chipbtn" type="button"></button>
      <button id="btnRev" class="glass chipbtn" type="button" aria-pressed="false">R</button>
      <button id="btnWx" class="glass chipbtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="wxPop" data-test="btn-wx">☀️</button>
      <button id="btnFast" class="glass chipbtn" type="button" aria-pressed="false">2×</button>
      <button id="btnPause" class="glass chipbtn" type="button">P</button>
      <button id="btnHelp" class="glass chipbtn" type="button">?</button>
      <div id="wxPop" class="glass wxpop" role="dialog" aria-label="Wieder / Dageszäit" hidden></div>
    </div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="banner" hidden></div>
  <div id="fade"></div>
  <div id="menu" class="overlay">
    <div class="menu-scroll"><div id="menuHost"></div><p id="bootStatus" role="status"></p></div>
  </div>
  <div id="loading" class="overlay center" hidden><div class="loadcard"><div class="spinner"></div><b id="loadingTitle"></b><div class="loadbar" id="loadBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loadFill"></i></div><small id="loadingSub"></small></div></div>
  <div id="pauseScreen" class="overlay center" hidden><section class="card"><h2 data-t="paused">Paus</h2><p data-t="pausedDesc"></p><div class="btns"><button id="resume" class="primary" data-t="resume"></button><button id="pauseQuality" type="button"></button><button id="quit" data-t="quit"></button></div></section></div>
  <div id="helpScreen" class="overlay center" hidden><section class="card wide"><h2 data-t="helpTitle">Steierung</h2><div id="helpBody"></div><p class="muted" data-t="helpHint"></p><button id="helpClose" class="primary" data-t="backBtn"></button></section></div>
  <div id="ttScreen" class="overlay center" hidden><section class="card wide"><h2 data-t="timetable">Fuerplang</h2><div id="ttBody"></div><p class="muted">T</p><button id="ttClose" class="primary" data-t="backBtn"></button></section></div>
  <div id="summary" class="overlay center" hidden><section class="card wide"><span class="stamp" id="sumStamp">&#128646; ZUCHSIMULATOR L&Euml;TZEBUERG</span><h2 id="sumTitle"></h2><p id="sumRoute" class="muted"></p><div id="sumGrade" class="grade"></div><table id="sumRows"></table><div class="sumtotal"><span id="sumCash"></span><b id="sumPoints"></b></div><p id="sumNote" class="muted"></p><div class="btns"><button id="sumAgain" class="primary"></button><button id="sumMenu"></button></div></section></div>
  <div id="phoneBlock" class="overlay center" hidden><section class="card"><div class="bigemoji">&#128646;</div><h2 id="phoneTitle"></h2><p id="phoneText"></p><p id="phoneHint" class="muted"></p></section></div>
  <div id="errorScreen" class="overlay center" hidden><section class="card"><h2>&#9888;</h2><p id="errorText"></p></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="/pb/train-sim/config.js?v=8"></script>
<script src="/pb/train-sim/copy.js?v=11"></script>
<script src="/pb/train-sim/crossing-roads.js?v=9"></script>
<script src="/pb/train-sim/station-surround.js?v=9"></script>
<script src="/pb/train-sim/station-roads.js?v=1"></script>
<script src="/pb/train-sim/station-surround-mesh.js?v=10"></script>
<script src="/pb/train-sim/station-building.js?v=10"></script>
<script src="/pb/train-sim/station-yard.js?v=7"></script>
<script src="/pb/train-sim/station-yard-props.js?v=3"></script>
<script src="/pb/train-sim/station-yard-trains.js?v=1"></script>
<script src="/pb/train-sim/real-line.js?v=6"></script>
<script src="/pb/train-sim/patch-crossings.js?v=3"></script>
<script src="/pb/train-sim/track.js?v=16"></script>
<script src="/pb/train-sim/real-mosel.js?v=2"></script>
<script src="/pb/train-sim/real-west.js?v=1"></script><!-- W2c: real single-line routes (build_real_route.py) -->
<script src="/pb/train-sim/real-south.js?v=1"></script>
<script src="/pb/train-sim/real-north.js?v=1"></script>
<script src="/pb/train-sim/real-metz.js?v=1"></script><!-- W3: abroad routes -->
<script src="/pb/train-sim/real-brussels.js?v=1"></script>
<script src="/pb/train-sim/real-paris.js?v=1"></script>
<script src="/pb/train-sim/real-landmarks.js?v=1"></script>
<script src="/pb/train-sim/routes.js?v=11"></script>
<script src="/pb/train-sim/infra.js?v=21"></script>
<script src="/pb/train-sim/stations-real.js?v=1"></script>
<script src="/pb/train-sim/stations-lu-a.js?v=7"></script>
<script src="/pb/train-sim/stations-lu-b.js?v=6"></script>
<script src="/pb/train-sim/munsbach-platform.js?v=1"></script>
<script src="/pb/train-sim/stations-lu-c.js?v=2"></script>
<script src="/pb/train-sim/stations-styles-lu.js?v=8"></script>
<script src="/pb/train-sim/stations-lu-d.js?v=2"></script>
<script src="/pb/train-sim/stations-lu-e.js?v=4"></script>
<script src="/pb/train-sim/stations-styles-de-b.js?v=2"></script>
<script src="/pb/train-sim/stations-de-b.js?v=3"></script>
<script src="/pb/train-sim/stations-styles-de.js?v=2"></script>
<script src="/pb/train-sim/stations-de-a.js?v=3"></script>
<script src="/pb/train-sim/stations-osm.js?v=1"></script><!-- W2c: OSM platform layouts of the stations of north / south / west without a photo model -->
<script src="/pb/train-sim/stations-abroad.js?v=7"></script>
<script src="/pb/train-sim/stations-luxtram.js?v=5"></script>
<script src="/pb/train-sim/crossing-roads-mesh.js?v=2"></script>
<script src="/pb/train-sim/real-scenery.js?v=2"></script>
<script src="/pb/train-sim/real-industry.js?v=1"></script>
<script src="/pb/train-sim/crossing-traffic.js?v=3"></script>
<script src="/pb/train-sim/tree-kit.js?v=1"></script>
<script src="/pb/train-sim/tree-field.js?v=1"></script>
<script src="/pb/train-sim/landscape.js?v=11"></script>
<script src="/pb/train-sim/luxtram-landmarks.js?v=8"></script><!-- LUXTRAM: hand-built landmarks (photo-checked) -->
<script src="/pb/train-sim/luxtram-traffic.js?v=14"></script><!-- LUXTRAM: road traffic + oncoming trams -->
<script src="/pb/train-sim/luxtram-facades.js?v=3"></script><!-- LUXTRAM: building facades + roofs (typology atlas) -->
<script src="/pb/train-sim/luxtram-ground.js?v=14"></script><!-- LUXTRAM: painted ground (splat shader, roads, sidewalks, markings) -->
<script src="/pb/train-sim/luxtram-pits.js?v=3"></script><!-- LUXTRAM: road pits (ramp into a cutting) -->
<script src="/pb/train-sim/luxtram-world.js?v=23"></script><!-- LUXTRAM: real Luxtram T1 routes (new files, see luxtram.js) -->
<script src="/pb/train-sim/luxtram.js?v=8"></script><!-- LUXTRAM -->
<script src="/pb/train-sim/trains.js?v=8"></script>
<script src="/pb/train-sim/cab.js?v=8"></script>
<script src="/pb/train-sim/passengers.js?v=5"></script>
<script src="/pb/train-sim/audio.js?v=3"></script>
<script src="/pb/train-sim/sim.js?v=9"></script>
<script src="/pb/train-sim/career.js?v=8"></script>
<script src="/pb/train-sim/resume.js?v=2"></script>
<script src="/pb/train-sim/menu.js?v=10"></script>
<script src="/pb/train-sim/fallback.js?v=3"></script>
<script src="/pb/train-sim.js?v=20"></script>
</body>
</html>
