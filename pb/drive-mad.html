<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Road Rage 3D - PixelBreak</title>
<style>
:root{color-scheme:dark;--mint:#4dffd2;--ink:#07121d;--glass:rgba(7,18,29,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#101e35;font-family:Inter,"Segoe UI",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:8;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:10px;pointer-events:none;white-space:nowrap}
.pill{min-width:92px;padding:7px 12px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:var(--glass);box-shadow:0 5px 20px rgba(0,0,0,.2);text-align:center;color:#d9e7f4;font-size:11px;text-transform:uppercase;letter-spacing:.08em;backdrop-filter:blur(8px)}
.pill b{display:block;color:#fff;font-size:16px;letter-spacing:0;text-transform:none}.pill:first-child b{color:var(--mint)}
#hint{position:fixed;z-index:8;top:max(73px,calc(env(safe-area-inset-top) + 63px));left:15%;right:15%;color:#fff;text-align:center;font-size:13px;text-shadow:0 2px 6px #000;pointer-events:none}
#restart{position:fixed;z-index:12;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:46px;height:46px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:var(--glass);color:#fff;font-size:22px;cursor:pointer}
#touch{position:fixed;z-index:12;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left));pointer-events:none}
.pedal{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;width:clamp(74px,18vw,116px);height:clamp(74px,18vw,116px);border-radius:28px;border:2px solid rgba(255,255,255,.33);color:#fff;font-weight:900;font-size:16px;letter-spacing:.08em;box-shadow:0 8px 24px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.pedal small{display:block;font-size:23px;line-height:1}.pedal:active,.pedal.on{transform:translateY(3px);filter:brightness(1.25)}
#brake{background:rgba(255,64,72,.72)}#gas{background:rgba(0,210,158,.72)}
#overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 35%,rgba(20,56,86,.87),rgba(3,10,18,.96));overflow:auto}
.card{width:min(680px,100%);text-align:center;color:#fff}.card h1{font-size:clamp(38px,9vw,68px);line-height:.95;color:var(--mint);text-shadow:0 5px 26px rgba(77,255,210,.28)}
.card h2{margin-top:8px;font-size:clamp(17px,4vw,26px);letter-spacing:.22em}.card p{margin:15px auto;max-width:570px;color:#c7d7e5;line-height:1.55}
#levels{display:grid;grid-template-columns:repeat(8,minmax(38px,58px));gap:8px;justify-content:center;margin:18px auto}
#levels button{height:48px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
#levels button.done{border-color:var(--mint);background:rgba(77,255,210,.2);color:var(--mint)}#levels button:disabled{opacity:.24;cursor:not-allowed}
#play{padding:14px 44px;border:0;border-radius:14px;background:var(--mint);color:var(--ink);font-size:20px;font-weight:950;cursor:pointer;box-shadow:0 8px 25px rgba(77,255,210,.25)}
.hidden{display:none!important}
@media(max-width:620px){#hud{gap:5px}.pill{min-width:73px;padding:6px 7px;font-size:9px}.pill b{font-size:14px}#hint{left:8%;right:8%;top:66px}#levels{grid-template-columns:repeat(4,50px)}.card p{font-size:14px}.pedal{border-radius:24px}}
@media(pointer:fine){.pedal{opacity:.55}}
</style>
</head>
<body>
<div id="hud" class="hidden"><div class="pill">Stage<b id="levelText">1 / 16</b></div><div class="pill">Time<b id="timeText">0.0s</b></div><div class="pill">Best<b id="bestText">—</b></div></div>
<div id="hint"></div>
<button id="restart" class="hidden" aria-label="Restart level" title="Restart level">↻</button>
<div id="touch" class="hidden"><button id="brake" class="pedal" aria-label="Brake and reverse"><small>▼</small>BRAKE</button><button id="gas" class="pedal" aria-label="Accelerate"><small>▲</small>GAS</button></div>
<div id="overlay"><div class="card"><h1>ROAD RAGE</h1><h2>3D STUNT TRIALS</h2><p id="message">Balance the throttle, work the suspension, and survive sixteen short obstacle courses.<br>WASD / arrows to drive and tilt. Touch pedals work anywhere on iPad.</p><div id="levels"></div><button id="play">DRIVE</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="/pb/drive-mad/core.js"></script>
<script src="/pb/drive-mad/game.js"></script>
</body>
</html>
