<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Unscramble - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<style>
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
.arcade-stage{display:block;overflow-y:auto;padding:64px 14px 20px}
.arcade-hud{inset:5px 14px auto;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.game{width:min(520px,100%);margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center}
#hint{color:var(--muted);font:650 15px/1.3 var(--font)}
#scrambled{font:800 clamp(36px,11vw,58px)/1.1 var(--font-display);letter-spacing:.16em;padding-left:.16em;color:var(--cyan);word-break:break-all}
#guess{width:100%;min-height:52px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card2);color:var(--text);
  font:750 24px/1 var(--font);text-align:center;letter-spacing:.12em;text-transform:uppercase;outline:none}
#guess::placeholder{letter-spacing:0;text-transform:none;font-size:17px;font-weight:650;color:var(--muted)}
#guess:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(77,232,255,.25)}
#timer-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden}
#timer-fill{height:100%;width:100%;border-radius:inherit;background:var(--good);transition:width .1s linear,background .2s ease}
#feedback{min-height:30px;font:750 20px/1.3 var(--font)}
.ok{color:var(--good)}.bad{color:var(--danger)}.reveal{color:var(--amber)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.arcade-btn:focus-visible{outline-offset:3px}
.arcade-seg button{min-height:44px}
.arcade-btn.play{min-width:min(220px,100%);min-height:52px;font-size:17px}
@media (prefers-reduced-motion:reduce){#timer-fill{transition:none}}
</style>
<script src="/pb/arcade-kit.js?v=10" data-arcade-id="word-scramble" data-arcade-title="Word Unscramble"></script>
</head>
<body>
<main class="arcade-stage" id="stage">
  <div class="arcade-hud" role="group" aria-label="Score, streak and level">
    <span class="arcade-pill">Score <b id="sc">0</b></span>
    <span class="arcade-pill">Streak <b id="st">0</b></span>
    <span class="arcade-pill">Level <b id="lv">1</b></span>
  </div>
  <div class="game">
    <div id="hint"></div>
    <div id="scrambled" aria-live="polite"></div>
    <input id="guess" placeholder="Type your answer..." aria-label="Your answer" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
    <div id="timer-bar" aria-hidden="true"><div id="timer-fill"></div></div>
    <div id="feedback" role="status"></div>
    <div class="row">
      <div class="arcade-seg" role="group" aria-label="Language">
        <button type="button" id="langEn" aria-pressed="true">EN</button>
        <button type="button" id="langLb" aria-pressed="false">LB</button>
      </div>
      <button class="arcade-btn secondary" id="skipBtn" type="button">Skip (−5 pts)</button>
    </div>
  </div>

  <div class="arcade-overlay show" id="startOv" role="dialog" aria-modal="true" aria-labelledby="startOvT"><div class="arcade-panel">
    <h2 id="startOvT">Word Unscramble</h2>
    <p>Put the scrambled letters in the right order before the bar runs out. Streaks earn bonus points and speed things up. Type on a keyboard; on touch the on-screen keyboard opens when you press Play.</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="playBtn" type="button">Play</button></div>
  </div></div>

  <div class="arcade-overlay" id="pauseOv" role="dialog" aria-modal="true" aria-labelledby="pauseOvT"><div class="arcade-panel">
    <h2 id="pauseOvT">Paused</h2><p>The timer is stopped.</p>
    <div class="arcade-actions"><button class="arcade-btn play" id="resumeBtn" type="button">Resume</button></div>
  </div></div>
</main>
<script>
const WORDS_LB=[
  {w:'MOIEN',h:'Begréissung'},
  {w:'MERCI',h:'Héiflechkeet'},
  {w:'SCHOUL',h:'Léieren'},
  {w:'KICHEN',h:'Doheem'},
  {w:'GAART',h:'Planzen'},
  {w:'BLUMM',h:'Planz'},
  {w:'PÄERD',h:'Déier'},
  {w:'FËSCH',h:'Déier'},
  {w:'KAFFI',h:'Gedrénks'},
  {w:'BROUT',h:'Iessen'},
  {w:'DËSCH',h:'Miwwel'},
  {w:'MUSEK',h:'Lauschteren'},
  {w:'FEIER',h:'Waarm'},
  {w:'BËSCH',h:'Natur'},
  {w:'HIMMEL',h:'Uewen'},
  {w:'WIEDER',h:'Reen a Sonn'},
  {w:'FRËNN',h:'Leit'},
  {w:'PÄIPERLEK',h:'Insekt'},
  {w:'KACHEN',h:'Kichen'},
  {w:'SPILLEN',h:'Fräizäit'},
  {w:'LIESEN',h:'Bicher'},
  {w:'DANZEN',h:'Musek'},
  {w:'ZOCKER',h:'Séiss'},
  {w:'SCHLASS',h:'Buerg'},
  {w:'KIRMES',h:'Fest'},
  {w:'BRÉCK',h:'Struktur'},
];
const WORDS=[
  {w:'PLANET',h:'Space'},
  {w:'GUITAR',h:'Music'},
  {w:'CASTLE',h:'Medieval'},
  {w:'DRAGON',h:'Fantasy'},
  {w:'ROCKET',h:'Space'},
  {w:'JUNGLE',h:'Nature'},
  {w:'BRIDGE',h:'Structure'},
  {w:'PIRATE',h:'Sea'},
  {w:'FROZEN',h:'Cold'},
  {w:'SHADOW',h:'Dark'},
  {w:'PUZZLE',h:'Game'},
  {w:'ISLAND',h:'Geography'},
  {w:'KNIGHT',h:'Medieval'},
  {w:'TROPHY',h:'Winner'},
  {w:'ZOMBIE',h:'Horror'},
  {w:'MUSEUM',h:'Culture'},
  {w:'VOLCANO',h:'Nature'},
  {w:'DOLPHIN',h:'Ocean'},
  {w:'RAINBOW',h:'Weather'},
  {w:'COMPASS',h:'Navigation'},
  {w:'PENGUIN',h:'Animal'},
  {w:'DIAMOND',h:'Gem'},
  {w:'THUNDER',h:'Weather'},
  {w:'TORNADO',h:'Weather'},
  {w:'CRYSTAL',h:'Mineral'},
  {w:'POPCORN',h:'Snack'},
  {w:'BLANKET',h:'Cozy'},
  {w:'GIRAFFE',h:'Animal'},
  {w:'CHICKEN',h:'Animal'},
  {w:'OCTOPUS',h:'Ocean'},
];
const TIMER_TICK_MS=100,TIMER_FULL=100,TIMER_BASE_DRAIN=0.8,TIMER_LEVEL_DRAIN=0.2,LOW_TIME=25,SKIP_PENALTY=5;
const CORRECT_DELAY_MS=600,SKIP_DELAY_MS=1000,TIMEOUT_DELAY_MS=1200,BASE_POINTS=10,STREAK_BONUS=3,STREAK_PER_LEVEL=3;
const $=id=>document.getElementById(id);
function focusDialog(id){const p=$(id).firstElementChild;p.tabIndex=-1;p.style.outline='none';p.focus({preventScroll:true})}
let score=0,streak=0,level=1,current,timeLeft=TIMER_FULL,used=new Set(),nextTimer=0;
let state='idle',paused=false;
let lang=storageGet('pb_ws_lang')||'en';
const list=()=>lang==='lb'?WORDS_LB:WORDS;

function storageGet(key){
  try{return localStorage.getItem(key)}
  catch(error){console.warn('[Word Unscramble] could not read '+key,error);return null}
}
function storageSet(key,value){
  try{localStorage.setItem(key,value)}
  catch(error){console.warn('[Word Unscramble] could not save '+key,error)}
}
function focusGuess(){try{$('guess').focus({preventScroll:true})}catch(error){console.warn('[Word Unscramble] focus failed',error)}}
function paintLang(){
  $('langEn').setAttribute('aria-pressed',String(lang!=='lb'));
  $('langLb').setAttribute('aria-pressed',String(lang==='lb'));
}
function setLang(nextLang){
  lang=nextLang;
  storageSet('pb_ws_lang',lang);
  used.clear();paintLang();next();
  if(state==='playing')focusGuess();
}
function showFeedback(text,cls){
  const el=$('feedback');el.textContent=text;el.className=cls||'';
}
function scheduleNext(delay){
  clearTimeout(nextTimer);
  nextTimer=setTimeout(next,delay);
}
function scramble(w){
  let a=w.split('');
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a.join('')===w?scramble(w):a.join('');
}
function next(){
  let available=list().filter(w=>!used.has(w.w));
  if(!available.length){used.clear();available=list()}
  current=available[Math.floor(Math.random()*available.length)];
  used.add(current.w);
  $('scrambled').textContent=scramble(current.w);
  $('hint').textContent=(lang==='lb'?'Tipp: ':'Hint: ')+current.h+' ('+current.w.length+(lang==='lb'?' Buschtawen)':' letters)');
  $('guess').value='';
  showFeedback('');
  timeLeft=TIMER_FULL;
  drawTimer();
}
function showStats(){$('sc').textContent=score;$('st').textContent=streak;$('lv').textContent=level}
function skip(){
  if(state!=='playing'||paused)return;
  score=Math.max(0,score-SKIP_PENALTY);Arcade.score(score);streak=0;
  showFeedback('It was: '+current.w,'reveal');
  showStats();
  scheduleNext(SKIP_DELAY_MS);
}
function drawTimer(){
  $('timer-fill').style.width=Math.max(0,timeLeft)+'%';
  $('timer-fill').style.background=timeLeft>LOW_TIME?'var(--good)':'var(--danger)';
}
function begin(){
  state='playing';paused=false;
  ['startOv','pauseOv'].forEach(id=>$(id).classList.remove('show'));
  next();focusGuess();
}
function setPaused(v){
  if(v===paused||(v&&state!=='playing'))return;
  paused=v;$('pauseOv').classList.toggle('show',v);
  if(v)focusDialog('pauseOv');else focusGuess();
}
$('guess').addEventListener('input',e=>{
  if(state!=='playing'||paused){e.target.value='';return}
  let v=e.target.value.toUpperCase();
  if(v===current.w){
    score+=BASE_POINTS+streak*STREAK_BONUS;Arcade.score(score);streak++;level=Math.floor(streak/STREAK_PER_LEVEL)+1;
    showFeedback('Correct!','ok');
    showStats();
    timeLeft=TIMER_FULL;
    scheduleNext(CORRECT_DELAY_MS);
  }
});
setInterval(()=>{
  if(state!=='playing'||paused)return;
  timeLeft-=TIMER_BASE_DRAIN+level*TIMER_LEVEL_DRAIN;
  if(timeLeft<=0){streak=0;$('st').textContent=0;
    showFeedback('Time! It was '+current.w,'bad');
    scheduleNext(TIMEOUT_DELAY_MS);timeLeft=TIMER_FULL}
  drawTimer();
},TIMER_TICK_MS);
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  if(e.key==='Enter'&&state!=='playing'){e.preventDefault();begin()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
$('playBtn').onclick=begin;$('resumeBtn').onclick=()=>setPaused(false);$('skipBtn').onclick=skip;
$('langEn').onclick=()=>setLang('en');$('langLb').onclick=()=>setLang('lb');
paintLang();next();focusDialog('startOv');
</script>
</body>
</html>
