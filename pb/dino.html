<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Run</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}body{display:grid;place-items:center}.wrap{position:relative;width:100%;height:min(100%,520px);color:#535353}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.title{position:absolute;left:20px;top:18px;font-weight:700;letter-spacing:.04em;font-size:18px}.score{position:absolute;right:22px;top:18px;font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}.hint{position:absolute;left:50%;top:33%;transform:translateX(-50%);text-align:center;white-space:nowrap;color:#666;font-size:14px}.hint b{display:block;font-size:22px;margin-bottom:7px;color:#535353}.over{position:absolute;inset:0;display:none;place-items:center;background:#ffffffbb}.card{text-align:center}.card h1{font-size:24px;letter-spacing:.12em;margin:0 0 7px}.card p{margin:0 0 18px;color:#777}.card button{border:2px solid #535353;background:#fff;color:#535353;border-radius:3px;padding:9px 18px;font:700 14px inherit;cursor:pointer}@media(prefers-reduced-motion:reduce){.hint{animation:none}}
</style></head><body><main class="wrap" id="wrap"><canvas id="c"></canvas><div class="title">Dino Run</div><div class="score"><span id="hi"></span><span id="sc">00000</span></div><div class="hint" id="hint"><b>Press space or tap</b>Jump over the cacti</div><div class="over" id="over"><div class="card"><h1>GAME OVER</h1><p id="final">00000</p><button id="again">Play again</button></div></div></main><script src="/pb/arcade-kit.js?v=6" data-arcade-id="dino" data-arcade-title="Dino Run"></script><script>
var score=0;
(()=>{'use strict';const wrap=document.querySelector('#wrap'),canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#sc'),hiEl=document.querySelector('#hi'),hint=document.querySelector('#hint'),over=document.querySelector('#over');let W=800,H=360,ground=280,dino={},obs=[],clouds=[],dust=[],playing=false,dead=false,last=0,dist=0,speed=6,spawn=0,raf=0,muted=false,audio=null,best=0,flash=0,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;try{best=+(localStorage.getItem('g-dino-best')||0)}catch(e){}hiEl.textContent=best?'HI '+String(best).padStart(5,'0')+' ':'';
function report(end){try{window.Arcade&&window.Arcade.score(score);if(end)window.Arcade&&window.Arcade.gameOver(score)}catch(e){console.warn(e)}}function tone(f,d=.07){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){let r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;ground=Math.min(H*.77,H-72);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(dino.y===undefined)dino={x:Math.max(35,W*.09),y:ground-48,w:44,h:48,vy:0,duck:false,on:true,frame:0};draw()}addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(wrap);
function reset(){dino={x:Math.max(35,W*.09),y:ground-48,w:44,h:48,vy:0,duck:false,on:true,frame:0};obs=[];clouds=Array.from({length:4},(_,i)=>({x:W*(.3+i*.28),y:55+Math.random()*90,s:20+Math.random()*16}));dust=[];dist=score=0;speed=6;spawn=90;dead=false;playing=true;last=performance.now();hint.style.display='none';over.style.display='none';report(false);cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function startJump(){if(!playing){reset();tone(420);return}if(dino.on&&!dino.duck){dino.vy=-13.4;dino.on=false;tone(520,.06)}}function duck(on){dino.duck=on;if(on&&!dino.on)dino.vy+=1.8}
function addObstacle(){if(score>250&&Math.random()<.27){const alt=Math.random();obs.push({type:'bird',x:W+30,y:alt<.33?ground-45:alt<.67?ground-72:ground-102,w:46,h:30,frame:0})}else{let count=Math.random()<.35?2+(Math.random()<.35?1:0):1,x=W+30;for(let i=0;i<count;i++){let tall=Math.random()<.52;obs.push({type:'cactus',x:x+i*(tall?27:21),y:ground-(tall?49:34),w:tall?24:18,h:tall?49:34,tall})}}spawn=52+Math.random()*55-Math.min(25,speed*1.3)}
function update(dt){speed=Math.min(13,6+dist/2300);dist+=speed*dt*.1;let n=Math.floor(dist/10);if(n!==score){score=n;scoreEl.textContent=String(score).padStart(5,'0');report(false);if(score&&score%100===0){flash=16;tone(760,.14)}}dino.vy+=.72*dt;dino.y+=dino.vy*dt;if(dino.y>=ground-dino.h){dino.y=ground-dino.h;dino.vy=0;dino.on=true}dino.frame+=dt*speed*.13;spawn-=dt;if(spawn<=0)addObstacle();obs.forEach(o=>{o.x-=speed*dt;o.frame+=dt*.14});obs=obs.filter(o=>o.x+o.w>-30);clouds.forEach(c=>{c.x-=speed*.08*dt;if(c.x+c.s*2<0){c.x=W+Math.random()*180;c.y=50+Math.random()*110}});if(dino.on&&Math.random()<.28)dust.push({x:dino.x+5,y:ground-3,a:1});dust.forEach(p=>{p.x-=speed*.6*dt;p.a-=.04*dt});dust=dust.filter(p=>p.a>0);const dh=dino.duck&&dino.on?28:dino.h,dy=dino.duck&&dino.on?ground-28:dino.y,box={x:dino.x+7,y:dy+5,w:dino.duck?48:31,h:dh-9};for(const o of obs){let b={x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-6};if(box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y){gameOver();break}}if(flash>0)flash-=dt}
function gameOver(){if(dead)return;dead=true;playing=false;tone(95,.35);if(score>best){best=score;try{localStorage.setItem('g-dino-best',best)}catch(e){}hiEl.textContent='HI '+String(best).padStart(5,'0')+' '}report(true);document.querySelector('#final').textContent='Score '+String(score).padStart(5,'0');setTimeout(()=>over.style.display='grid',reduced?0:400)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function dinoDraw(c){let y=dino.duck&&dino.on?ground-28:dino.y;if(dino.duck&&dino.on){rect(dino.x,y+7,42,21,c);rect(dino.x+34,y,30,19,c);rect(dino.x+57,y+7,7,7,'#fff');rect(dino.x-8,y+13,12,7,c);let f=Math.floor(dino.frame)%2;rect(dino.x+10+(f?18:0),y+25,8,6,c);rect(dino.x+30-(f?18:0),y+25,8,6,c)}else{rect(dino.x+13,y+14,25,27,c);rect(dino.x+26,y,31,24,c);rect(dino.x+50,y+7,7,7,'#fff');rect(dino.x+48,y+19,14,6,c);rect(dino.x+5,y+24,13,9,c);rect(dino.x,y+20,9,6,c);rect(dino.x+8,y+34,9,7,c);let f=dead?0:Math.floor(dino.frame)%2;rect(dino.x+14+(f?14:0),y+39,8,10,c);rect(dino.x+29-(f?14:0),y+39,8,10,c)}}
function cactus(o,c){rect(o.x+o.w*.35,o.y,o.w*.35,o.h,c);rect(o.x,o.y+o.h*.35,o.w*.36,7,c);rect(o.x,o.y+o.h*.18,6,o.h*.27,c);rect(o.x+o.w*.68,o.y+o.h*.48,o.w*.32,7,c);rect(o.x+o.w-6,o.y+o.h*.3,6,o.h*.26,c)}function bird(o,c){let flap=Math.floor(o.frame)%2;rect(o.x+8,o.y+9,31,14,c);rect(o.x+34,o.y+4,12,12,c);rect(o.x+41,o.y+6,5,4,'#fff');rect(o.x,o.y+13,12,6,c);if(flap)rect(o.x+14,o.y,22,9,c);else rect(o.x+15,o.y+20,20,9,c)}
function draw(){const night=Math.floor(score/700)%2===1,bg=night?'#202124':'#fff',fg=night?'#f1f3f4':'#535353';ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);clouds.forEach(c=>{ctx.fillStyle=night?'#5f6368':'#ddd';ctx.beginPath();ctx.arc(c.x,c.y,c.s*.35,0,7);ctx.arc(c.x+c.s*.42,c.y-c.s*.12,c.s*.48,0,7);ctx.arc(c.x+c.s*.85,c.y,c.s*.32,0,7);ctx.fill()});rect(0,ground,W,2,fg);for(let x=-(dist*2)%(W/6);x<W;x+=W/6)rect(x,ground+8+(x%3),18,2,fg);dust.forEach(p=>rect(p.x,p.y,5,2,night?`rgba(241,243,244,${p.a})`:`rgba(83,83,83,${p.a})`));obs.forEach(o=>o.type==='cactus'?cactus(o,fg):bird(o,fg));dinoDraw(fg);document.body.style.background=bg;wrap.style.color=fg;scoreEl.parentElement.style.color=fg;if(flash>0&&Math.floor(flash/2)%2)scoreEl.style.visibility='hidden';else scoreEl.style.visibility='visible'}
function loop(t){if(!playing){draw();return}let dt=Math.min(2.3,(t-last)/16.667||1);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){startJump();e.preventDefault()}if(['ArrowDown','s','S'].includes(e.key)){duck(true);e.preventDefault()}});document.addEventListener('keyup',e=>{if(['ArrowDown','s','S'].includes(e.key))duck(false)});wrap.addEventListener('pointerdown',startJump);document.querySelector('#again').onclick=reset;addEventListener('message',e=>{if(e.data&&typeof e.data.__pbSndMute==='boolean')muted=e.data.__pbSndMute});resize();})();
</script></body></html>
