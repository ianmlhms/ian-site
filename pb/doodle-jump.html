<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Platform Jumper - Arcade</title>
<link rel="stylesheet" href="/pb/arcade-ui.css?v=1">
<style>
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
/* top padding keeps the board clear of the HUD pills */
.arcade-stage{padding:52px 10px 12px}
canvas{border-radius:var(--radius);box-shadow:0 0 0 1px var(--border),0 18px 48px rgba(0,0,0,.35)}
.arcade-hud b{text-transform:none}
.arcade-panel p:empty{display:none}
#panelExtra:not(:empty){margin:14px 0 2px}
</style>
<script src="/pb/arcade-kit.js?v=6" data-arcade-id="doodle-jump" data-arcade-title="Platform Jumper"></script>
</head>
<body>
<main class="arcade-stage" id="stage">
  <canvas id="c" role="img" aria-label="Platform Jumper arcade game"></canvas>
  <div class="arcade-hud">
    <span class="arcade-pill">Score <b id="score">0</b></span>
    <span class="arcade-pill">Best <b id="bestHud">0</b></span>
  </div>
  <div class="arcade-overlay show" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="arcade-panel">
      <h2 id="panelTitle"></h2>
      <span class="arcade-big" id="panelBig" hidden></span>
      <p id="panelBest" hidden></p>
      <p id="panelBody" hidden></p>
      <div id="panelExtra"></div>
      <div class="arcade-actions">
        <button class="arcade-btn" id="primary" type="button">Play</button>
        <button class="arcade-btn secondary" id="secondary" type="button" hidden>Menu</button>
      </div>
    </div>
  </div>
</main>
<script>
const GAME_ID='doodle-jump',BEST_LOWER=false;
/* ---------- arcade shell: shared palette, best score, start / pause / game-over panel ---------- */
const $=id=>document.getElementById(id);
const ROOT_STYLE=getComputedStyle(document.documentElement);
const cssVar=(name,fallback)=>ROOT_STYLE.getPropertyValue(name).trim()||fallback;
const FONT=cssVar('--font','system-ui,sans-serif');
const COLOR={bg:cssVar('--bg','#0d0d1a'),bg2:cssVar('--bg2','#11111f'),card:cssVar('--card','#161625'),card2:cssVar('--card2','#1e1e35'),
  border:cssVar('--border','#2a2a4a'),text:cssVar('--text','#e8e8f0'),muted:cssVar('--muted','#8888aa'),accent:cssVar('--accent','#6ea8fe'),
  cyan:cssVar('--cyan','#4de8ff'),amber:cssVar('--amber','#f5b942'),danger:cssVar('--danger','#ff6685'),good:cssVar('--good','#4ade80'),
  violet:cssVar('--violet','#b48cff')};
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const OVERLAY_INPUT_DELAY_MS=500;   // ignores the tap / held key that was still going when the panel appeared
const BEST_KEY='arcade_best_'+GAME_ID;
function readBest(){try{const v=parseFloat(localStorage.getItem(BEST_KEY));return Number.isFinite(v)?v:null}catch(err){console.warn('[Arcade] best score unavailable',err);return null}}
function writeBest(v){try{localStorage.setItem(BEST_KEY,String(v))}catch(err){console.warn('[Arcade] best score not saved',err)}}
let best=readBest();
/** Stores `score` when it beats the best; returns true for a new best. */
function recordBest(score){
  // a first-ever score of 0 is not worth celebrating
  const better=best===null?(BEST_LOWER||score>0):(BEST_LOWER?score<best:score>best);
  if(better){best=score;writeBest(score)}
  return better;
}
const bestText=()=>best===null?'-':String(best);
const overlay=$('overlay'),panelTitle=$('panelTitle'),panelBody=$('panelBody'),panelBig=$('panelBig'),panelBest=$('panelBest'),
  panelExtra=$('panelExtra'),primary=$('primary'),secondary=$('secondary');
let panelAction=null,panelAction2=null,overlayAt=0;
function showPanel({title,body='',big=null,bestLine='',extra=null,label='Play',action=null,label2='',action2=null}){
  panelTitle.textContent=title;
  panelBody.textContent=body;panelBody.hidden=!body;
  panelBig.textContent=big===null?'':String(big);panelBig.hidden=big===null;
  panelBest.textContent=bestLine;panelBest.hidden=!bestLine;
  panelExtra.replaceChildren(...(extra?[extra]:[]));
  primary.textContent=label;primary.hidden=!action;panelAction=action;
  secondary.textContent=label2;secondary.hidden=!action2;panelAction2=action2;
  overlayAt=performance.now();
  overlay.classList.add('show');
}
function hidePanel(){
  overlay.classList.remove('show');panelAction=null;panelAction2=null;
  if(overlay.contains(document.activeElement))document.activeElement.blur();
}
const panelReady=()=>overlay.classList.contains('show')&&performance.now()-overlayAt>=OVERLAY_INPUT_DELAY_MS;
function runPanel(which){
  if(!panelReady())return;
  const run=which===2?panelAction2:panelAction;
  if(!run)return;
  hidePanel();run();
}
primary.addEventListener('click',()=>runPanel(1));
secondary.addEventListener('click',()=>runPanel(2));
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter')&&!e.repeat&&panelAction&&panelReady()){e.preventDefault();runPanel(1)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&typeof pauseGame==='function')pauseGame()});

const stage=$('stage'),C=$('c'),X=C.getContext('2d');
const W=400,H=600;
/* ---------- canvas: fit the logical W x H board into the stage, crisp on retina ---------- */
const MAX_DPR=3,MIN_SCALE=.1;
const fitArea=$('fitArea')||stage;
function fitCanvas(){
  const cs=getComputedStyle(fitArea);
  const availW=fitArea.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=fitArea.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const scale=Math.max(MIN_SCALE,Math.min(availW/W,availH/H));
  const cssW=Math.floor(W*scale),cssH=Math.floor(H*scale),dpr=Math.min(window.devicePixelRatio||1,MAX_DPR);
  C.style.width=cssW+'px';C.style.height=cssH+'px';
  C.width=Math.round(cssW*dpr);C.height=Math.round(cssH*dpr);
  X.setTransform(C.width/W,0,0,C.height/H,0,0);
  if(typeof onResize==='function')onResize();
}
function toBoard(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
new ResizeObserver(fitCanvas).observe(fitArea);
window.addEventListener('resize',fitCanvas);

/* ---------- fixed 60 Hz stepping: same speed on 60 / 120 / 144 Hz displays ---------- */
const FRAME_MS=1000/60,FRAME_SLACK_MS=2,MAX_CATCHUP_MS=FRAME_MS*2;
let frameAcc=FRAME_MS,lastTs=0;
function tick(ts){
  requestAnimationFrame(tick);
  frameAcc=Math.min(frameAcc+(lastTs?ts-lastTs:FRAME_MS),MAX_CATCHUP_MS);lastTs=ts;
  if(frameAcc<FRAME_MS-FRAME_SLACK_MS)return;
  frameAcc-=FRAME_MS;
  runFrame();
}


const GRAVITY=0.35,MOVE_SPEED=5,JUMP_V=-10,SPRING_V=-15,PLATFORM_W=70,PLATFORM_H=12,PLATFORM_GAP=35;
const PLATFORM_COLORS={normal:COLOR.good,moving:COLOR.accent,breaking:'#ff9a5c',spring:COLOR.amber};
let player,platforms=[],score=0,maxY=0,camY=0,state='ready',keys={},touchDir=0;

function updateHud(){
  $('score').textContent=score;
  $('bestHud').textContent=best===null?0:best;
}
class Player{
  constructor(){this.x=200;this.y=500;this.vx=0;this.vy=0;this.w=30;this.h=30;this.dir=1}
  update(){
    const left=keys['ArrowLeft']||keys['a']||touchDir<0,right=keys['ArrowRight']||keys['d']||touchDir>0;
    if(left){this.vx=-MOVE_SPEED;this.dir=-1}
    else if(right){this.vx=MOVE_SPEED;this.dir=1}
    else this.vx*=0.85;
    this.vy+=GRAVITY;
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<-this.w)this.x=W;
    if(this.x>W)this.x=-this.w;
  }
  draw(offy){
    let dy=this.y+offy;
    X.save();X.translate(this.x+this.w/2,dy+this.h/2);
    if(this.dir<0)X.scale(-1,1);
    X.fillStyle=COLOR.good;
    X.beginPath();X.ellipse(0,0,this.w/2,this.h/2,0,0,Math.PI*2);X.fill();
    X.fillStyle=COLOR.text;
    X.beginPath();X.arc(4,-6,6,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(14,-6,6,0,Math.PI*2);X.fill();
    X.fillStyle=COLOR.bg;
    X.beginPath();X.arc(6,-6,3,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(16,-6,3,0,Math.PI*2);X.fill();
    X.strokeStyle=COLOR.bg;X.lineWidth=2;
    X.beginPath();X.arc(10,2,6,0,Math.PI);X.stroke();
    X.fillStyle='#2fa866';
    if(this.vy>0){X.fillRect(-12,12,10,5);X.fillRect(5,12,10,5)}
    else{X.fillRect(-12,14,10,3);X.fillRect(5,14,10,3)}
    X.restore();
  }
}

function genPlatform(y){
  let type='normal';
  let r=Math.random();
  if(score>500&&r<0.1)type='breaking';
  else if(score>200&&r<0.2)type='moving';
  else if(r<0.08)type='spring';
  return{x:Math.random()*(W-PLATFORM_W),y,w:PLATFORM_W,type,mx:type==='moving'?1:0,broken:false,springUsed:false};
}
function generatePlatforms(){
  platforms=[];
  for(let i=0;i<20;i++)platforms.push(genPlatform(600-i*PLATFORM_GAP));
  platforms.push({x:165,y:545,w:PLATFORM_W,type:'normal',mx:0,broken:false,springUsed:false});  // guaranteed landing under the spawn
}
function startGame(){
  hidePanel();
  player=new Player();score=0;maxY=player.y;camY=0;keys={};
  generatePlatforms();
  state='playing';
  updateHud();Arcade.score(score);
}
function endGame(){
  state='over';Arcade.gameOver(score);
  const isBest=recordBest(score);updateHud();
  showPanel({title:'Game over',big:score,bestLine:isBest?'New best!':'Best '+bestText(),label:'Play again',action:startGame});
}
function pauseGame(){
  if(state!=='playing')return;
  state='paused';keys={};touchDir=0;
  showPanel({title:'Paused',label:'Resume',action:()=>{state='playing'}});
}

function update(){
  if(state!=='playing')return;
  player.update();
  if(player.y<maxY){
    maxY=player.y;
    score=Math.floor((600-maxY)/5);
    window.score=score;Arcade.score(score);updateHud();
  }
  camY=Math.min(camY,maxY-300);
  if(player.vy>0){
    const feet=player.y+player.h, prevFeet=feet-player.vy;
    for(let p of platforms){
      if(p.broken)continue;
      if(player.x+player.w>p.x&&player.x<p.x+p.w&&feet>=p.y-2&&prevFeet<=p.y+12){
        if(p.type==='breaking'){p.broken=true;continue}
        player.vy=p.type==='spring'?SPRING_V:JUMP_V;
        if(p.type==='spring')p.springUsed=true;
        break;
      }
    }
  }
  for(let p of platforms){
    if(p.type==='moving'){p.x+=p.mx*2;if(p.x<0||p.x>W-p.w)p.mx*=-1}
  }
  platforms=platforms.filter(p=>p.y<camY+H+80&&!p.broken);
  let topP=platforms.length?Math.min(...platforms.map(p=>p.y)):camY+H;
  while(topP>camY-60){
    topP-=PLATFORM_GAP+Math.random()*25;
    platforms.unshift(genPlatform(topP));
  }
  if(player.y-camY>H+60)endGame();
}

function draw(){
  const bg=X.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,COLOR.bg2);bg.addColorStop(1,COLOR.card);
  X.fillStyle=bg;X.fillRect(0,0,W,H);
  if(!player)return;
  for(let p of platforms){
    let py=p.y-camY;
    if(py<-20||py>H+20||p.broken)continue;
    X.fillStyle=PLATFORM_COLORS[p.type];
    X.beginPath();X.roundRect(p.x,py,p.w,PLATFORM_H,6);X.fill();
    if(p.type==='spring'&&!p.springUsed){
      X.fillStyle='#ffdd44';X.fillRect(p.x+p.w/2-5,py-12,10,12);
      X.fillStyle='#ffee88';X.fillRect(p.x+p.w/2-7,py-14,14,5);
    }
    if(p.type==='normal'){
      X.fillStyle='rgba(255,255,255,0.28)';
      for(let gx=p.x+5;gx<p.x+p.w-5;gx+=8)X.fillRect(gx,py-3,2,4);
    }
  }
  player.draw(-camY);
}
function runFrame(){update();draw()}

const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ']);
document.addEventListener('keydown',e=>{keys[e.key]=true;if(GAME_KEYS.has(e.key))e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});
/* touch: hold the left or right half of the board to steer */
function steerFromPointer(e){touchDir=toBoard(e).x<W/2?-1:1}
C.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;C.setPointerCapture(e.pointerId);steerFromPointer(e)});
C.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&C.hasPointerCapture(e.pointerId))steerFromPointer(e)});
const stopSteer=e=>{if(e.pointerType!=='mouse')touchDir=0};
C.addEventListener('pointerup',stopSteer);
C.addEventListener('pointercancel',stopSteer);
Arcade.onRestart(startGame);
fitCanvas();
updateHud();
showPanel({title:'Platform Jumper',body:'Steer with ← → (or A D) and hop up the platforms. On touch, hold the left or right side of the board. Don\'t fall!',label:'Play',action:startGame});
requestAnimationFrame(tick);
</script>
</body>
</html>
