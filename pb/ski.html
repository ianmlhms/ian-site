/* Starts the first resort's files right away (they download while the code loads); resort-data.js takes them from window.__skiPre.

(function () {

  var mp = window.MPGate && window.MPGate.ctx;

  window.__skiLoad = {
    set: function (p, label) { if (done) return; value = Math.max(value, p); last = Date.now(); slow.hidden = true; setBar(value); if (label) msg.textContent = label; },
    done: function () { if (done) return; done = true; setBar(1); clearInterval(timer); document.getElementById("loading").classList.add("done"); },
    fail: function (text) { done = true; clearInterval(timer); if (text) msg.textContent = text; slow.hidden = false; }
  };
  document.getElementById("loadRetry").addEventListener("click", function () { location.reload(); });
  var timer = setInterval(function () { if (!done && Date.now() - last > STALL_MS) slow.hidden = false; }, 1000);
