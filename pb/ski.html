<!-- online races: the lobby context (lobby.html -> pixelbreak.html?g=ski&room=..&lb=..); a bare visit stays on the game (data-menu) -->
<script src="/mp-gate.js?v=10" data-game="ski" data-menu data-adopt="#mpLobbyBtn"></script>
<script>
/* Starts the first resort's files right away (they download while the code loads); resort-data.js takes them from window.__skiPre.
 * Only the resort of ?resort= or the one the player last skied (default: Espace Killy) is fetched (main.js ignores it if not ready); the height tiles stream later, nearest first. */
(function () {
  var resort = "killy", ok = /^[a-z0-9]{2,16}$/;
  try { var last = JSON.parse(localStorage.getItem("pb_ski_save") || "null"); if (last && last.last && ok.test(last.last.resort)) resort = last.last.resort; } catch (error) { /* private mode */ }
  try { var asked = new URLSearchParams(location.search).get("resort"); if (asked && ok.test(asked)) resort = asked; } catch (error) { /* old browser */ }
  // an online race: the lobby picked the resort (a random one is drawn in pb/ski/net/plan.js: nothing to preload then)
  var mp = window.MPGate && window.MPGate.ctx;
  if (mp && mp.game === "ski") { if (mp.cfg && ok.test(mp.cfg.resort) && mp.cfg.resort !== "random") resort = mp.cfg.resort; else return; }
  var pre = window.__skiPre = { resort: resort, files: {} };
  ("resort.json far.bin " + (typeof DecompressionStream === "function" ? "classes.z" : "classes.bin")).split(" ").forEach(function (name) {   // classes.z: see resort-data.js
    try {
      var p = fetch("/pb/ski/data/" + resort + "/" + name).then(function (res) { if (!res.ok) throw new Error(name + ": HTTP " + res.status); return res.arrayBuffer(); }).then(function (buf) { return new Uint8Array(buf); });
      p.catch(function () {});
      pre.files[name] = p;
    } catch (error) { /* the module loads it again */ }
  });
})();
</script>

<main id="shell">

  <div id="ui"></div>
  <button type="button" id="mpLobbyBtn" class="mp-lobby" hidden>‹ Lobby</button>
  <div id="loading" role="status"><div class="box"><div class="ico">⛷️</div><b>Ski Alpen</b><div id="bar"><i></i></div><small id="loadMsg">…</small><div class="slow" id="loadSlow" hidden><span>Dauert méi laang wéi gewinnt …</span><br><button type="button" id="loadRetry">Nei probéieren</button></div></div></div>
</main>
<script>
/* Loading screen: honest progress (main.js calls set(p, label) between its real steps) and a retry offer after 12 s without progress. */
(function () {
  var bar = document.querySelector("#bar i"), msg = document.getElementById("loadMsg"), slow = document.getElementById("loadSlow");
  var STALL_MS = 12000, last = Date.now(), value = 0, done = false;
  function setBar(p) { bar.style.transform = "scaleX(" + Math.max(0, Math.min(1, p)) + ")"; }
  window.__skiLoad = {
    set: function (p, label) { if (done) return; value = Math.max(value, p); last = Date.now(); slow.hidden = true; setBar(value); if (label) msg.textContent = label; },
    done: function () { if (done) return; done = true; setBar(1); clearInterval(timer); document.getElementById("loading").classList.add("done"); },
    fail: function (text) { done = true; clearInterval(timer); if (text) msg.textContent = text; slow.hidden = false; }
  };
  document.getElementById("loadRetry").addEventListener("click", function () { location.reload(); });
  var timer = setInterval(function () { if (!done && Date.now() - last > STALL_MS) slow.hidden = false; }, 1000);
  window.__skiLoad.set(0.03, "Code gëtt gelueden …");
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" integrity="sha384-qOkzR5Ke/XkQxuGVJ9hpFEpDlcoLtWwVYhnJf06cLIZa2vaIptSqaubivErzmD5O" crossorigin="anonymous"></script>
<script>
window.addEventListener("error", function (event) { document.documentElement.dataset.bootError = event.message || "script-error"; });
if (!window.THREE) {
  document.documentElement.dataset.bootError = "three-missing";
  if (window.__skiLoad) window.__skiLoad.fail("three.js r160 konnt net geluede ginn");
  throw new Error("three.js r160 failed to load");
}
</script>
