<style>
  :root{--bg:#0d0d1a;--card:#161625;--border:#2a2a4a;--text:#e8e8f0;--muted:#8888aa;--accent:#6ea8fe;--cyan:#4de8ff;--amber:#f5b942;--lv:#6ea8fe;--lv-bg0:#0d0d1a;--lv-bg1:#111126}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;overscroll-behavior:none}
  button{font:inherit;color:inherit}
  .bar{height:53px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:5}
  @media (max-width:760px){body .bar.arcade-bar{flex-wrap:nowrap;gap:4px;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}body .bar.arcade-bar .arcade-bar__title{min-width:0}}
  .game{position:relative;flex:1;min-height:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}

  /* In-game HUD */
  .hud{position:absolute;inset:12px 14px auto;pointer-events:none;text-shadow:0 1px 5px #000}
  .stats{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .stats__left{display:flex;align-items:center;gap:10px;min-width:0}
  .stats__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--lv)}
  .track{height:7px;margin-top:16px;border:1px solid color-mix(in srgb,var(--lv) 45%,transparent);border-radius:99px;background:rgba(13,13,26,.7);overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--lv),var(--cyan));box-shadow:0 0 12px var(--cyan)}
  .chip{pointer-events:auto;min-width:44px;min-height:44px;margin:-10px 0;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);border-radius:11px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;text-shadow:none;transition:transform .15s cubic-bezier(.2,.8,.2,1),background .15s}
  .chip:active{transform:scale(.94)}
  .chip:focus-visible,.arrow:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .practice-bar{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;z-index:2}
  .practice-bar .chip{margin:0}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--amber);color:#1a1205;font-size:11px;font-weight:900;letter-spacing:.08em;text-shadow:none}
  .hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);max-width:calc(100% - 28px);color:var(--muted);font-size:12px;font-weight:700;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;transition:opacity .4s}

  /* Completion / overlay panel */
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,8,18,.5);backdrop-filter:blur(3px);text-align:center;z-index:3}
  .overlay.show{display:flex}
  .panel{min-width:min(360px,90vw);padding:26px;border:1px solid color-mix(in srgb,var(--lv) 45%,transparent);border-radius:16px;background:rgba(22,22,37,.94);box-shadow:0 0 40px color-mix(in srgb,var(--lv) 18%,transparent)}
  .panel h2{margin:0 0 8px;color:var(--lv);font-size:28px}.panel p{margin:5px 0;color:var(--muted)}
  .panel strong{color:var(--text)}
  .panel__actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

  /* Buttons */
  .btn{min-height:44px;padding:0 20px;border:1px solid var(--border);border-radius:13px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--text);font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s cubic-bezier(.2,.8,.2,1),background .15s,border-color .15s,opacity .15s}
  .btn:hover{background:var(--card)}.btn:active{transform:scale(.96)}
  .btn--primary{border-color:transparent;background:var(--lv);color:#0b0b14}
  .btn--primary:hover{background:var(--lv);filter:brightness(1.08)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}.btn[disabled]:active{transform:none}
  .btn[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 18%,var(--card));color:var(--amber)}

  /* Level select */
  .select{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;background:color-mix(in srgb,var(--lv-bg0) 62%,transparent);backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%);touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .select__stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab}
  .select__stage.dragging{cursor:grabbing}
  .card{position:absolute;left:50%;top:50%;width:min(340px,76vw);height:min(420px,calc(100% - 28px));margin:0;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border-radius:24px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(165deg,var(--c0),var(--c1));box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 34px color-mix(in srgb,var(--c) 22%,transparent);will-change:transform,opacity;overflow:hidden}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);pointer-events:none}
  .card__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card__num{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
  .card__done{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-size:12px;font-weight:900}
  .card__name{margin:2px 0 0;font-size:clamp(24px,4.4vw,32px);line-height:1.05;font-weight:900;letter-spacing:-.02em}
  .card__diff{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:var(--c)}
  .card__face{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent))}
  .card__tip{margin:0;color:rgba(232,232,240,.74);font-size:13px;line-height:1.35}
  .card__map{display:block;width:100%;height:30px;margin-top:auto;border-radius:8px;background:rgba(0,0,0,.28)}
  .card__meta{display:flex;justify-content:space-between;color:rgba(232,232,240,.62);font-size:12px;font-weight:700}
  .card__best{display:grid;gap:5px}
  .card__bestrow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:rgba(232,232,240,.75)}
  .card__bestrow b{color:var(--text);font-size:16px;letter-spacing:0}
  .card__bar{height:9px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}
  .card__bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 12px var(--c)}
  .card__lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;background:rgba(8,8,18,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);font-size:14px;font-weight:700;color:rgba(232,232,240,.85)}
  .card__lock span{font-size:40px;line-height:1}
  .arrow{position:absolute;top:50%;z-index:3;width:48px;height:48px;margin-top:-24px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:26px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s cubic-bezier(.2,.8,.2,1),opacity .15s}
  .arrow:active{transform:scale(.92)}.arrow[disabled]{opacity:.28;cursor:default}
  .arrow--prev{left:max(10px,env(safe-area-inset-left))}.arrow--next{right:max(10px,env(safe-area-inset-right))}
  .select__foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 14px max(14px,env(safe-area-inset-bottom))}
  .dots{display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(232,232,240,.28);transition:background .2s,transform .2s}
  .dots i.on{background:var(--lv);transform:scale(1.4)}.dots i.locked{opacity:.45}
  .select__actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .select__actions .btn--primary{min-width:140px}
  .select__keys{margin:0;color:var(--muted);font-size:11px;font-weight:700}
  .fallback{display:grid;place-items:center;height:100%;padding:24px;color:var(--muted);text-align:center}
  @media (max-width:520px){.hud{inset:9px 10px auto}.hint{bottom:9px}.arrow{width:44px;height:44px;margin-top:-22px;font-size:22px}.select__keys{display:none}}
  @media (max-height:470px){.card__map,.card__meta,.card__tip{display:none}.card{gap:6px;padding:14px 16px}.select__keys{display:none}.select__foot{flex-direction:row;padding-top:4px}.dots{display:none}}
  @media (prefers-reduced-motion:reduce){.chip,.btn,.arrow,.dots i,.hint{transition:none}.chip:active,.btn:active,.arrow:active{transform:none}}
  @media (prefers-reduced-transparency:reduce){.select,.chip,.arrow,.overlay,.card__lock{backdrop-filter:none;-webkit-backdrop-filter:none}.select{background:var(--lv-bg0)}}
  @media (prefers-contrast:more){.card{border-width:2px}.btn,.chip,.arrow{border-color:currentColor}}
</style>

<body>
<header class="bar">

</header>
<main class="game" id="game">

  <div class="hud" id="hud" hidden>
    <div class="stats">
      <span class="stats__left"><button class="chip" id="menuBtn" type="button" aria-label="Level select (Esc)">☰ Levels</button><span class="stats__name" id="levelName"></span><span id="attempts">Attempt 1</span></span>
      <span id="progress">0% · Best 0%</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="practice-bar" id="practiceBar" hidden>
    <button class="chip" id="cpAdd" type="button">◆ Checkpoint (C)</button>

  <section class="select" id="select" aria-label="Level select">

    <div class="panel__actions">
      <button class="btn btn--primary" id="nextBtn" type="button">Next level</button>
      <button class="btn" id="replayBtn" type="button">Replay</button>
      <button class="btn" id="levelsBtn" type="button">Levels</button>
    </div>

<script>
"use strict";

/* ==== CORE:BEGIN — pure game rules, no DOM. The solvability check evaluates exactly this block. ==== */

/* Physics and world constants (world units are px; y grows downward, the floor is y = 0). */
const GRAVITY=2300, JUMP_V=830, SPEED=280, TILE=48, CUBE=40, STEP=1/120, START_X=180;
const PAD_V=1000, ORB_V=830, PAD_H=14, ORB_R=22, PRESS_BUFFER=.1;
const CEIL_TILES=6, CEIL_H=CEIL_TILES*TILE;
const SHIP_UP=2700, SHIP_DOWN=2100, SHIP_VMAX=380, SHIP_INSET=8;
const SPEED_SLOW=.75, SPEED_NORMAL=1, SPEED_FAST=1.3;
const FALL_LIMIT=260, FLY_LIMIT=900, MOVER_REACH=3, LAND_SLOP=4, FLOOR_SLOP=5;
const SPIKE_PAD_X=7, SPIKE_PAD_TOP=10, SPIKE_PAD_BASE=2;
const FIRST_X=1000, END_PAD=700, COMPLETION_SCORE_BASE=1000, COMPLETION_SCORE_CAP=999;

/* Level 1: the original hand-authored course, unchanged — spacious opener, rhythm section, two staircases, final sprint. */
const LEVEL_ONE_END=20500;
const LEVEL_ONE=[
  {type:"spike",x:1050},{type:"spike",x:1580},{type:"gap",x:2110,w:92},
  {type:"block",x:2670,w:58,h:1},{type:"spike",x:3190},{type:"spike",x:3240},
  {type:"gap",x:3770,w:108},{type:"spike",x:4210},{type:"block",x:4680,w:62,h:1},
  {type:"spike",x:5150},{type:"gap",x:5520,w:112},{type:"spike",x:5930},{type:"spike",x:5980},
  {type:"block",x:6410,w:66,h:1},{type:"spike",x:6760},{type:"gap",x:7100,w:118},
  {type:"spike",x:7510},{type:"spike",x:7558},{type:"spike",x:7606},
  {type:"block",x:8020,w:58,h:1},{type:"gap",x:8370,w:106},{type:"spike",x:8700},

  {type:"block",x:9140,w:76,h:1},{type:"block",x:9216,w:76,h:2},
  {type:"block",x:9292,w:76,h:1},{type:"spike",x:9710},{type:"spike",x:9758},
  {type:"gap",x:10120,w:126},{type:"block",x:10520,w:62,h:1},
  {type:"spike",x:10860},{type:"gap",x:11180,w:116},{type:"spike",x:11520},
  {type:"spike",x:11568},{type:"block",x:11940,w:66,h:1},{type:"spike",x:12280},
  {type:"gap",x:12620,w:128},{type:"spike",x:12980},{type:"spike",x:13028},{type:"spike",x:13076},
  {type:"block",x:13470,w:62,h:1},{type:"block",x:13810,w:62,h:1},
  {type:"gap",x:14170,w:120},{type:"spike",x:14520},{type:"spike",x:14568},

  {type:"block",x:15000,w:72,h:1},{type:"block",x:15072,w:72,h:2},
  {type:"block",x:15144,w:72,h:1},{type:"gap",x:15540,w:130},
  {type:"spike",x:15910},{type:"block",x:16230,w:64,h:1},{type:"spike",x:16560},
  {type:"spike",x:16608},{type:"gap",x:16940,w:132},{type:"spike",x:17290},
  {type:"block",x:17610,w:60,h:1},{type:"spike",x:17920},{type:"spike",x:17968},
  {type:"spike",x:18016},{type:"gap",x:18380,w:128},{type:"block",x:18740,w:62,h:1},
  {type:"spike",x:19060},{type:"gap",x:19370,w:116},{type:"spike",x:19710},
  {type:"spike",x:19758},{type:"spike",x:19806}
];

/* ---- Level builder -------------------------------------------------------------------------
 * New levels are written as short programs. A cursor walks along the course; "rest" distances are
 * measured in BEATS at the current speed, so every hazard lands on the level's beat grid.
 *   rest b            skip b beats
 *   spike n [e]       n adjacent floor spikes (e = tiles of elevation, e.g. on top of a block)
 *   hspike n          n adjacent ceiling spikes (corridors only)
 *   gap w             floor hole, w px wide
 *   block w h [b] [o] block w px wide, h tiles tall, base b tiles above the floor, options o
 *   stairs w [h…]     contiguous blocks, each w px wide
 *   pillar w h        floor pillar (ship corridors)     hpillar w h   ceiling pillar
 *   pad [e]           yellow jump pad on the floor (e = tiles of elevation)     hpad   ceiling pad
 *   orb y             yellow jump orb, centre y tiles above the floor
 *   speed m           speed portal (SPEED_SLOW / SPEED_NORMAL / SPEED_FAST)
 *   grav g            gravity portal: 1 = floor, -1 = ceiling
 *   mode m            "ship" or "cube" portal
 *   corStart/corEnd   the ceiling exists between these two markers
 *   raw dx o          drop an arbitrary object dx px from the cursor without moving it
 *   skip px           move the cursor px forward
 * A level's optional `tight` (< 1) shrinks every rest, packing the hazards closer together.
 */
function buildObjects(bpm,program,tight=1){
  const objects=[], corridors=[];
  let x=FIRST_X, mul=SPEED_NORMAL, corridorStart=null;
  const beat=()=>SPEED*mul*60/bpm;
  const put=(o)=>{objects.push(Object.freeze(o));};
  for(const [cmd,...a] of program){
    switch(cmd){
      case "rest": x+=a[0]*beat()*tight; break;
      case "skip": x+=a[0]; break;
      case "spike": for(let i=0;i<a[0];i++)put({type:"spike",x:x+i*TILE,y:a[1]||0}); x+=a[0]*TILE; break;
      case "hspike": for(let i=0;i<a[0];i++)put({type:"spike",x:x+i*TILE,y:a[1]||0,hang:true}); x+=a[0]*TILE; break;
      case "gap": put({type:"gap",x,w:a[0]}); x+=a[0]; break;
      case "block": put({type:"block",x,w:a[0],h:a[1],b:a[2]||0,...(a[3]||{})}); x+=a[0]; break;
      case "stairs": for(const h of a[1]){put({type:"block",x,w:a[0],h,b:0}); x+=a[0];} break;
      case "pillar": put({type:"block",x,w:a[0],h:a[1],b:0,deco:"hazard"}); x+=a[0]; break;
      case "hpillar": put({type:"block",x,w:a[0],h:a[1],b:CEIL_TILES-a[1],deco:"hazard"}); x+=a[0]; break;
      case "pad": put({type:"pad",x,y:a[0]||0}); x+=TILE; break;
      case "hpad": put({type:"pad",x,y:0,hang:true}); x+=TILE; break;
      case "orb": put({type:"orb",x,y:a[0]}); x+=TILE; break;
      case "speed": put({type:"speed",x,m:a[0]}); mul=a[0]; break;
      case "grav": put({type:"grav",x,g:a[0]}); break;
      case "mode": put({type:"mode",x,mode:a[0]}); break;
      case "corStart": corridorStart=x; break;
      case "corEnd": corridors.push(Object.freeze({x0:corridorStart,x1:x})); corridorStart=null; break;
      case "raw": put({...a[1],x:x+a[0]}); break;
      default: throw new Error("Unknown level command: "+cmd);
    }
  }
  return {objects,corridors,end:x+END_PAD};
}

function finishLevel(meta,objects,corridors,end){
  const sorted=[...objects].sort((p,q)=>p.x-q.x);
  const maxW=Math.max(TILE,...sorted.map((o)=>o.w||TILE));
  return Object.freeze({...meta,end,corridors:Object.freeze(corridors),objects:Object.freeze(sorted),maxW});
}
function programLevel(meta,program){
  const built=buildObjects(meta.bpm,program,meta.tight||1);
  return finishLevel(meta,built.objects,built.corridors,built.end);
}

/* ---- Level programs: macros (each returns a list of builder commands) ---- */
const rep=(n,part)=>Array.from({length:n},()=>part).flat();
const padTower=(h)=>[["pad"],["raw",72,{type:"block",w:96,h,b:0,deco:"circuit"}],["skip",168]];
const padGap=(w)=>[["pad"],["gap",w]];
const padSpikes=(n)=>[["pad"],["spike",n]];
const orbRow=(n,dx,y)=>[["raw",dx,{type:"orb",y}],["spike",n]];
const orbGap=(w,dx,y)=>[["raw",dx,{type:"orb",y}],["gap",w]];
const stair=(w,heights)=>[["stairs",w,heights]];
const padChain=(n)=>Array.from({length:n},(_,i)=>i===0?[["pad"]]:[["skip",192],["pad"]]).flat();
const beats=(n)=>[["rest",n]];

const P_BOUNCE=[
  ["spike",1],["rest",4],["spike",1],["rest",4],["spike",2],["rest",4],["gap",96],["rest",4],
  ["block",64,1],["rest",4],["spike",2],["rest",4],
  /* first yellow pad: nothing to hit, just enjoy the bounce */
  ["pad"],["rest",8],["pad"],["rest",8],
  ...padGap(150),["rest",6],
  ...padTower(4),["rest",5],["spike",2],["rest",4],
  ...padSpikes(3),["rest",5],
  ...stair(72,[1,2,1]),["rest",4],["spike",2],["rest",4],
  ...padChain(3),["rest",6],

/* ---- Rules ---------------------------------------------------------------------------------- */
const overlaps=(a0,a1,b0,b1)=>a1>b0&&a0<b1;
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const worldTop=(u,g)=>g>0?u:-CEIL_H-u-CUBE;            // cube top in world y for frame position u
const frameTop=(top,height,g)=>g>0?top:-CEIL_H-top-height; // world interval -> gravity frame (floor at 0)

function lowerBound(objects,x){
  let lo=0,hi=objects.length;
  while(lo<hi){const mid=(lo+hi)>>1; if(objects[mid].x<x)lo=mid+1; else hi=mid;}
  return lo;
}
function eachNear(level,x0,x1,visit){
  const objects=level.objects;
  for(let i=lowerBound(objects,x0-level.maxW);i<objects.length&&objects[i].x<=x1;i++){
    if(visit(objects[i],i)===true)return;
  }
}
function gapAt(level,x){
  let inside=false;
  eachNear(level,x,x,(o)=>{if(o.type==="gap"&&x>o.x&&x<o.x+o.w){inside=true;return true;}return false;});
  return inside;
}
function capAt(level,x){
  for(const c of level.corridors)if(overlaps(x,x+CUBE,c.x0,c.x1))return -CEIL_H;
  return -Infinity;
}
function moverOffset(item,x){return item.amp?Math.sin((x-item.x)/item.period*Math.PI*2)*item.amp*TILE:0;}
function blockSpan(item,x){ // world-y interval of a block when the cube is at x
  const base=item.b||0, height=item.h*TILE, top=-(base+item.h)*TILE-moverOffset(item,x);
  return {top,height};
}
function spikeZone(o){ // hit zone (world y) of a spike
  const lift=(o.y||0)*TILE;
  if(o.hang){const top=-CEIL_H+lift; return {top:top+SPIKE_PAD_BASE,bottom:top+TILE-SPIKE_PAD_TOP};}
  return {top:-lift-TILE+SPIKE_PAD_TOP,bottom:-lift-SPIKE_PAD_BASE};
}
function padZone(o){
  if(o.hang)return {top:-CEIL_H,bottom:-CEIL_H+PAD_H};
  const lift=(o.y||0)*TILE; return {top:-lift-PAD_H,bottom:-lift};
}
function orbCenterY(o){return -o.y*TILE;}

function newRun(){
  return Object.freeze({x:START_X,u:-CUBE,vu:0,g:1,mode:"cube",mul:SPEED_NORMAL,onGround:true,
    held:false,buffer:0,used:Object.freeze([]),t:0,dead:false,won:false});
}

function hitsSpike(level,s){
  const ship=s.mode==="ship";
  const wy=worldTop(s.u,s.g);
  const lo=ship?SHIP_INSET:(s.g>0?5:3), hi=ship?SHIP_INSET:(s.g>0?3:5);
  let hit=false;
  eachNear(level,s.x-TILE,s.x+CUBE,(o)=>{
    if(o.type!=="spike"||!overlaps(s.x+4,s.x+CUBE-4,o.x+SPIKE_PAD_X,o.x+TILE-SPIKE_PAD_X))return false;
    const zone=spikeZone(o);
    if(overlaps(wy+lo,wy+CUBE-hi,zone.top,zone.bottom)){hit=true;return true;}
    return false;
  });
  return hit;
}

function applyGates(level,prev,n){
  const c0=prev.x+CUBE/2, c1=n.x+CUBE/2;
  eachNear(level,prev.x,n.x+CUBE,(o)=>{
    if(o.x<=c0||o.x>c1)return false;
    if(o.type==="speed")n.mul=o.m;
    else if(o.type==="mode"&&o.mode!==n.mode){
      n.mode=o.mode; n.onGround=false;
      if(n.mode==="ship")n.vu=clamp(n.vu,-SHIP_VMAX,SHIP_VMAX);
    }else if(o.type==="grav"&&o.g!==n.g){
      const top=worldTop(n.u,n.g); n.g=o.g; n.u=frameTop(top,CUBE,n.g); n.vu=0; n.onGround=false;
    }
    return false;
  });
}

function findOrb(level,n){
  let found=-1;
  const left=n.x+4, right=n.x+CUBE-4, wy=worldTop(n.u,n.g);
  eachNear(level,n.x-TILE,n.x+CUBE,(o,i)=>{
    if(o.type!=="orb"||n.used.includes(i))return false;
    const cx=o.x+TILE/2, cy=orbCenterY(o);
    if(overlaps(left,right,cx-ORB_R,cx+ORB_R)&&overlaps(wy+4,wy+CUBE-4,cy-ORB_R,cy+ORB_R)){found=i;return true;}
    return false;
  });
  return found;
}
function findPad(level,n){
  let found=-1;
  const left=n.x+4, right=n.x+CUBE-4, wy=worldTop(n.u,n.g);
  eachNear(level,n.x-TILE,n.x+CUBE,(o,i)=>{
    if(o.type!=="pad"||n.used.includes(i))return false;
    const zone=padZone(o);
    if(overlaps(left,right,o.x+2,o.x+TILE-2)&&overlaps(wy,wy+CUBE,zone.top,zone.bottom)){found=i;return true;}
    return false;
  });
  return found;
}

function stepCube(level,s,n,held){
  if(s.onGround&&held){n.vu=-JUMP_V;n.onGround=false;}
  else if(n.buffer>0){
    const orb=findOrb(level,n);
    if(orb>=0){n.vu=-ORB_V;n.buffer=0;n.used=[...n.used,orb];n.onGround=false;}
  }
  const prevBottom=s.u+CUBE;
  n.vu+=GRAVITY*STEP; n.u+=n.vu*STEP; n.onGround=false;
  let landing=Infinity;
  eachNear(level,n.x-level.maxW,n.x+CUBE,(o)=>{
    if(o.type!=="block"||!overlaps(n.x,n.x+CUBE,o.x,o.x+o.w))return false;
    const now=blockSpan(o,n.x), before=blockSpan(o,s.x);
    const top=frameTop(now.top,now.height,n.g), prevTop=frameTop(before.top,before.height,n.g);
    const reach=o.amp?MOVER_REACH:0;
    if(n.vu>=0&&prevBottom<=prevTop+LAND_SLOP&&n.u+CUBE>=top-reach)landing=Math.min(landing,top-CUBE);
    else if(overlaps(n.u,n.u+CUBE,top,top+now.height)){n.dead=true;return true;}
    return false;
  });
  if(n.dead)return;
  if(landing<Infinity){n.u=landing;n.vu=0;n.onGround=true;}
  else if(n.u+CUBE>=0&&prevBottom<=FLOOR_SLOP&&!(n.g>0&&gapAt(level,n.x+CUBE*.55))){n.u=-CUBE;n.vu=0;n.onGround=true;}
  const cap=capAt(level,n.x);
  if(n.u<cap){n.u=cap;if(n.vu<0)n.vu=0;}
  const pad=findPad(level,n);
  if(pad>=0){
    const hang=level.objects[pad].hang;
    n.vu=n.g*(hang?PAD_V:-PAD_V); n.used=[...n.used,pad]; n.onGround=false;
  }
  if(n.onGround&&held){n.vu=-JUMP_V;n.onGround=false;} // holding through a landing jumps again at once
}

function stepShip(level,s,n,held){
  n.vu=clamp(s.vu+(held?-SHIP_UP:SHIP_DOWN)*STEP,-SHIP_VMAX,SHIP_VMAX);
  n.u=s.u+n.vu*STEP; n.onGround=false;
  const cap=capAt(level,n.x);
  if(n.u<cap){n.u=cap;n.vu=0;}
  if(n.u+CUBE>0){n.u=-CUBE;n.vu=0;}
  eachNear(level,n.x-level.maxW,n.x+CUBE,(o)=>{
    if(o.type!=="block"||!overlaps(n.x,n.x+CUBE,o.x,o.x+o.w))return false;
    const span=blockSpan(o,n.x);
    if(overlaps(n.u+SHIP_INSET,n.u+CUBE-SHIP_INSET,span.top,span.top+span.height)){n.dead=true;return true;}
    return false;
  });
}

/* One fixed physics step. Pure: returns a new state, never mutates the old one. */
function step(level,s,held){
  if(s.dead||s.won)return s;
  const pressed=held&&!s.held;
  const n={...s,held,t:s.t+STEP,buffer:pressed?PRESS_BUFFER:Math.max(0,s.buffer-STEP)};
  n.x=s.x+SPEED*s.mul*STEP;
  applyGates(level,s,n);
  if(n.mode==="ship")stepShip(level,s,n,held); else stepCube(level,s,n,held);
  if(!n.dead&&hitsSpike(level,n))n.dead=true;
  if(!n.dead&&(n.u>FALL_LIMIT||n.u<-FLY_LIMIT))n.dead=true;
  if(!n.dead&&n.x>=level.end)n.won=true;
  return Object.freeze(n);
}

function levelSeconds(level){ // running time at the speeds the level's portals set
  const gates=level.objects.filter((o)=>o.type==="speed");
  let x=START_X, mul=SPEED_NORMAL, seconds=0;
  for(const gate of gates){seconds+=(gate.x-x)/(SPEED*mul); x=gate.x; mul=gate.m;}
  return seconds+(level.end-x)/(SPEED*mul);
}
/* Leaderboard score: best % while unfinished; finished runs always outrank it, fewer attempts rank higher. */
function scoreFor(percent,finished,attempts){
  if(!finished)return Math.floor(clamp(percent,0,100));
  return COMPLETION_SCORE_BASE+Math.max(0,COMPLETION_SCORE_CAP-attempts);
}

/* ==== CORE:END ==== */


/* ================================ Game layer (DOM, input, drawing, audio) ================================ */
const MAX_FRAME=.1, DEATH_DELAY=.72, TRAIL_LIFE=.32, TRAIL_SPACING=13, TRAIL_MAX=18;

const canvas=document.getElementById("canvas"), game=document.getElementById("game");

if(!ctx){
  console.error("[geometrydash] Canvas 2D is unavailable.");
  game.innerHTML='<div class="fallback">This browser cannot run the canvas game.</div>';
}else{
  /* ---- State ---- */
  let W=1,H=1,DPR=1,groundY=0,scale=1,camX=CAM_X,accumulator=0,lastTime=0,paused=false;
  let held=false,muted=false;
  let view="menu", selected=0, practice=false;
  let level=LEVELS[0], sim=newRun(), phase="playing", attempt=1, deathTimer=0, completeLock=0, hintTimer=0;
  let checkpoints=[], trail=[], particles=[], shake=0, angle=0, menuX=0;
  let progress=readProgress();
  const reduceMotion=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};

  /* ---- Storage ---- */
  function readStore(key,fallback){
    try{return localStorage.getItem(key)??fallback;}catch(error){console.warn("[geometrydash] Storage read failed: "+key,error);return fallback;}
  }
  function writeStore(key,value){
    try{localStorage.setItem(key,String(value));}catch(error){console.warn("[geometrydash] Storage write failed: "+key,error);}
  }
  function cleanEntry(raw){
    const entry=raw&&typeof raw==="object"?raw:{};
    const run=Number(entry.bestRun);
    return Object.freeze({
      best:clamp(Number(entry.best)||0,0,100),done:entry.done===true,
      attempts:Math.max(0,Math.floor(Number(entry.attempts)||0)),bestRun:Number.isFinite(run)&&run>=1?Math.floor(run):null
    });
  }
  function readProgress(){
    let parsed={};
    try{parsed=JSON.parse(readStore(PROGRESS_KEY,"{}"))||{};}
    catch(error){console.warn("[geometrydash] Progress data was unreadable, starting fresh",error);}
    const clean={};
    for(const lvl of LEVELS)if(parsed[lvl.id])clean[lvl.id]=cleanEntry(parsed[lvl.id]);
    const legacy=clamp(Number(readStore(LEGACY_BEST_KEY,"0"))||0,0,100); // bests from before there were levels
    if(!clean[LEVELS[0].id]&&legacy>0)clean[LEVELS[0].id]=cleanEntry({best:legacy,done:legacy>=100});
    return Object.freeze(clean);
  }
  const entryOf=(lvl)=>progress[lvl.id]||cleanEntry(null);
  function patchEntry(lvl,patch){
    progress=Object.freeze({...progress,[lvl.id]:cleanEntry({...entryOf(lvl),...patch})});
    writeStore(PROGRESS_KEY,JSON.stringify(progress));
  }
  const isUnlocked=(index)=>index===0||entryOf(LEVELS[index-1]).done;

  /* ---- Leaderboard board ---- */
  const levelNumber=(index)=>index+1;
  function boardFor(index){
    const lvl=LEVELS[index];
    return {id:lvl.id,name:`Geometry Dash · ${levelNumber(index)} ${lvl.name}`,format:"gd"};
  }
  function announceBoard(index){

  }
  const percentOf=(state)=>clamp((state.x-START_X)/(level.end-START_X)*100,0,100);

  /* ---- Layout ---- */

  const worldToScreenX=(wx)=>camX+(wx-sim.x)*scale;

  /* ---- Level flow ---- */

  function showView(next){

  }
  function startLevel(index){
    if(!isUnlocked(index))return;
    level=LEVELS[index];selected=index;applyTheme(level);announceBoard(index);
    attempt=1;checkpoints=[];trail=[];particles=[];angle=0;shake=0;held=false;completeLock=0;
    sim=newRun();phase="playing";
    if(!practice)patchEntry(level,{attempts:entryOf(level).attempts+1});

    ui.hint.textContent=level.tip;hintTimer=HINT_SECONDS;ui.hint.style.opacity="1";
    ui.complete.classList.remove("show");

  }
  function restartLevel(){if(view==="play")startLevel(selected);}
  function openMenu(){
    flushProgress();held=false;showView("menu");
    selected=clamp(selected,0,LEVELS.length-1);applyTheme(LEVELS[selected]);announceBoard(selected);
    renderCards();snapCarousel(selected);refreshSelection();
  }
  function beginAttempt(){
    attempt+=1;phase="playing";trail=[];held=false;
    const checkpoint=checkpoints.at(-1);
    if(practice&&checkpoint)sim=Object.freeze({...checkpoint,held:false,buffer:0});
    else{sim=newRun();resetMusic();}
    if(!practice)patchEntry(level,{attempts:entryOf(level).attempts+1});
    updateHud();
  }
  function flushProgress(){writeStore(PROGRESS_KEY,JSON.stringify(progress));}

  function die(){
    phase="dead";deathTimer=DEATH_DELAY;shake=reduceMotion.matches?0:10;held=false;
    const pct=percentOf(sim);burst();playDeath();
    if(practice)return;
    const entry=entryOf(level);
    if(pct>entry.best)patchEntry(level,{best:Math.floor(pct*100)/100});
    const score=scoreFor(pct,false,attempt);
    if(score>0)Arcade.gameOver(score);
  }
  function completeLevel(){
    phase="complete";completeLock=COMPLETE_INPUT_LOCK;held=false;playComplete();
    const hasNext=selected<LEVELS.length-1;
    ui.nextBtn.hidden=!hasNext||practice;
    ui.completeTitle.textContent=practice?"Practice complete":"Level Complete!";
    ui.completeText.innerHTML=practice?"Practice runs are not saved.":`Finished in <strong>${attempt} attempt${attempt===1?"":"s"}</strong>`;
    if(!practice){
      const entry=entryOf(level);
      const improved=entry.bestRun===null||attempt<entry.bestRun;
      patchEntry(level,{best:100,done:true,bestRun:improved?attempt:entry.bestRun});
      Arcade.gameOver(scoreFor(100,true,attempt));
      ui.completeResult.textContent=(improved?"New best run · ":"")+formatScore(scoreFor(100,true,attempt))+(hasNext?" · next level unlocked":"");
    }else ui.completeResult.textContent="";
    updateHud();ui.complete.classList.add("show");
    (hasNext&&!practice?ui.nextBtn:ui.replayBtn).focus?.();
  }
  function formatScore(score){
    if(score<COMPLETION_SCORE_BASE)return `${score} %`;
    const attempts=COMPLETION_SCORE_BASE+COMPLETION_SCORE_CAP-score;
    return `100 % · ${score===COMPLETION_SCORE_BASE?COMPLETION_SCORE_CAP+"+":attempts} attempt${attempts===1?"":"s"}`;
  }
  function updateHud(){
    const pct=phase==="complete"?100:percentOf(sim), floorPct=Math.floor(pct);
    const best=practice?0:Math.max(Math.floor(entryOf(level).best),floorPct);
    ui.attempts.innerHTML=practice?'<span class="badge">Practice</span>':`Attempt ${attempt}`;
    ui.progress.textContent=practice?`${floorPct}%`:`${floorPct}% · Best ${best}%`;
    ui.fill.style.width=`${pct}%`;
    if(!practice&&floorPct>=1&&phase==="playing")Arcade.score(scoreFor(pct,false,attempt));
  }
  function dropCheckpoint(){
    if(!practice||view!=="play"||phase!=="playing")return;
    checkpoints=[...checkpoints,sim];
  }
  function removeCheckpoint(){if(practice&&checkpoints.length)checkpoints=checkpoints.slice(0,-1);}

  /* ---- Input ---- */
  function beginInput(){
    if(view!=="play"||phase==="complete")return;
    held=true;startAudio();
  }
  function endInput(){held=false;}
  window.addEventListener("keydown",(event)=>{
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const onButton=event.target instanceof HTMLElement&&event.target.closest("button,a");
    if(view==="menu"){
      if(event.key==="ArrowLeft"||event.key==="a"||event.key==="A"){event.preventDefault();stepSelection(-1);}
      else if(event.key==="ArrowRight"||event.key==="d"||event.key==="D"){event.preventDefault();stepSelection(1);}
      else if((event.key==="Enter"||event.code==="Space")&&!onButton){event.preventDefault();if(!event.repeat)playSelected();}
      else if(event.key==="p"||event.key==="P")togglePractice();

    }
    if(event.code==="Space"||event.code==="ArrowUp"){
      if(onButton&&event.code==="Space")return;
      event.preventDefault();beginInput();
    }else if(event.key==="Escape"){event.preventDefault();openMenu();}
    else if((event.key==="c"||event.key==="C")&&!event.repeat)dropCheckpoint();
    else if((event.key==="x"||event.key==="X")&&!event.repeat)removeCheckpoint();
  });
  window.addEventListener("keyup",(event)=>{if(event.code==="Space"||event.code==="ArrowUp")endInput();});
  canvas.addEventListener("pointerdown",(event)=>{event.preventDefault();canvas.setPointerCapture?.(event.pointerId);beginInput();});
  canvas.addEventListener("pointerup",endInput);canvas.addEventListener("pointercancel",endInput);
  ui.menuBtn.addEventListener("click",openMenu);
  ui.cpAdd.addEventListener("click",dropCheckpoint);ui.cpRemove.addEventListener("click",removeCheckpoint);
  ui.replayBtn.addEventListener("click",()=>{if(completeLock<=0)startLevel(selected);});
  ui.levelsBtn.addEventListener("click",openMenu);
  ui.nextBtn.addEventListener("click",()=>{if(completeLock<=0&&selected<LEVELS.length-1)startLevel(selected+1);});

  /* ---- Simulation ---- */
  function update(){
    updateEffects(STEP);
    if(view==="menu"){if(!reduceMotion.matches)menuX+=MENU_SCROLL_SPEED*STEP;return;}
    if(completeLock>0)completeLock-=STEP;
    if(hintTimer>0){hintTimer-=STEP;if(hintTimer<=0)ui.hint.style.opacity="0";}
    if(phase==="dead"){deathTimer-=STEP;if(deathTimer<=0)beginAttempt();return;}
    if(phase!=="playing")return;
    const next=step(level,sim,held);
    advanceAngle(sim,next);
    sim=next;
    if(sim.dead){die();return;}
    if(sim.won){completeLevel();return;}
    addTrail();updateHud();
  }
  function advanceAngle(before,after){
    if(after.mode!=="cube"){angle=0;return;}
    if(!after.onGround)angle+=after.g*SPIN_RATE*STEP;
    else if(!before.onGround)angle=Math.round(angle/(Math.PI/2))*(Math.PI/2);
  }
  const cubeWorldTop=(state)=>worldTop(state.u,state.g);
  function addTrail(){

    if(trail.length>TRAIL_MAX)trail.shift();
  }
  function burst(){
    const cx=sim.x+CUBE/2, cy=cubeWorldTop(sim)+CUBE/2;
    for(let i=0;i<20;i++){
      const a=Math.PI*2*i/20+Math.random()*.25, speed=90+Math.random()*220;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:.55+Math.random()*.25,size:3+Math.random()*5});
    }
  }
  function updateEffects(dt){
    shake=Math.max(0,shake-24*dt);
    trail=trail.map((t)=>({...t,life:t.life-dt})).filter((t)=>t.life>0);
    particles=particles.map((p)=>({...p,x:p.x+p.vx*dt,y:p.y+p.vy*dt,vy:p.vy+GRAVITY*.35*dt,life:p.life-dt})).filter((p)=>p.life>0);
  }
  const shipTilt=(state)=>Math.atan2(state.vu,SPEED*state.mul);

  /* ---- Rendering ---- */
  const beatPulse=()=>{
    if(reduceMotion.matches||view!=="play")return 0;
    const phaseInBeat=((sim.t*level.bpm/60)%1+1)%1;
    return Math.pow(1-phaseInBeat,3);
  };
  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
    const lvl=view==="menu"?LEVELS[selected]:level;
    const pulse=beatPulse();
    const scrollX=view==="menu"?menuX:sim.x;
    const shakeX=shake?(Math.random()-.5)*shake:0, shakeY=shake?(Math.random()-.5)*shake:0;
    ctx.save();ctx.translate(shakeX,shakeY);
    drawBackground(lvl,scrollX,pulse);
    if(view==="menu"){drawMenuGround(lvl);ctx.restore();return;}
    ctx.save();
    ctx.translate(camX-sim.x*scale,groundY);ctx.scale(scale,scale);
    const viewL=sim.x-camX/scale-TILE, viewR=sim.x+(W-camX)/scale+TILE;
    drawGround(lvl,viewL,viewR,pulse);drawCorridors(lvl,viewL,viewR,pulse);drawObjects(lvl,viewL,viewR,pulse);
    drawCheckpoints();drawTrail();drawPlayer();drawParticles();
    ctx.restore();ctx.restore();
    if(paused)drawPaused();
  }
  function drawBackground(lvl,scrollX,pulse){
    const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,lvl.theme.bg0);gradient.addColorStop(1,lvl.theme.bg1);
    ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
    const grid=64, offset=-((scrollX*.16)%grid);
    ctx.strokeStyle=lvl.theme.line;ctx.globalAlpha=.075+.07*pulse;ctx.lineWidth=1;ctx.beginPath();
    for(let x=offset;x<W;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,groundY);}
    for(let y=groundY%grid;y<groundY;y+=grid){ctx.moveTo(0,y);ctx.lineTo(W,y);}
    ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle="rgba(77,232,255,.06)";
    for(let i=0;i<7;i++){const x=((i*271-scrollX*.045)%(W+100)+W+100)%(W+100)-50;ctx.fillRect(x,70+(i*83)%Math.max(100,groundY-120),2,2);}
  }
  function drawMenuGround(lvl){
    ctx.fillStyle=lvl.theme.ground;ctx.fillRect(0,groundY,W,H-groundY);
    ctx.shadowColor=lvl.theme.line;ctx.shadowBlur=12;ctx.strokeStyle=lvl.theme.line;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();ctx.shadowBlur=0;
  }
  function drawGround(lvl,viewL,viewR,pulse){
    const tile=TILE, reach=2000;
    ctx.fillStyle=lvl.theme.ground;ctx.fillRect(viewL,0,viewR-viewL,reach);
    ctx.strokeStyle=lvl.theme.line;ctx.globalAlpha=.09;ctx.lineWidth=1;
    for(let x=Math.floor(viewL/tile)*tile;x<viewR;x+=tile){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-tile,reach);ctx.stroke();}
    ctx.globalAlpha=1;
    const gaps=lvl.objects.filter((o)=>o.type==="gap"&&o.x<viewR&&o.x+o.w>viewL);
    for(const gap of gaps){
      const abyss=ctx.createLinearGradient(0,-2,0,200);abyss.addColorStop(0,"#080812");abyss.addColorStop(1,"#030308");
      ctx.fillStyle=abyss;ctx.fillRect(gap.x,-2,gap.w,reach);
    }
    ctx.shadowColor=lvl.theme.line;ctx.shadowBlur=12+10*pulse;ctx.strokeStyle=lvl.theme.line;ctx.lineWidth=3;ctx.beginPath();
    let from=viewL;
    for(const gap of gaps){ctx.moveTo(from,0);ctx.lineTo(Math.max(from,gap.x),0);from=gap.x+gap.w;}
    ctx.moveTo(from,0);ctx.lineTo(Math.max(from,viewR),0);ctx.stroke();ctx.shadowBlur=0;
  }
  function drawCorridors(lvl,viewL,viewR,pulse){
    for(const c of lvl.corridors){
      if(c.x1<viewL||c.x0>viewR)continue;
      const x0=Math.max(c.x0,viewL-4), x1=Math.min(c.x1,viewR+4);
      ctx.fillStyle=lvl.theme.ground;ctx.fillRect(x0,-CEIL_H-900,x1-x0,900);
      ctx.strokeStyle=lvl.theme.line;ctx.globalAlpha=.09;ctx.lineWidth=1;
      for(let x=Math.floor(x0/TILE)*TILE;x<x1;x+=TILE){ctx.beginPath();ctx.moveTo(x,-CEIL_H);ctx.lineTo(x-TILE,-CEIL_H-400);ctx.stroke();}
      ctx.globalAlpha=1;

  /* ---- WebAudio: kick, hats and a per-level bass riff on the level's BPM ---- */
  let audioCtx=null, master=null, beatTimer=0, nextBeat=0, eighth=0, audioStarted=false;

    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=music.wave;osc.frequency.value=music.root*Math.pow(2,semitone/12)*(high?2:1);
    gain.gain.setValueAtTime(high?.05:.09,time);gain.gain.exponentialRampToValueAtTime(.001,time+length*.9);
    osc.connect(gain).connect(master);osc.start(time);osc.stop(time+length);
  }
  function tone(frequency,duration,volume){
    if(!audioCtx||muted||!master)return;
    const now=audioCtx.currentTime, osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type="square";osc.frequency.value=frequency;gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
    osc.connect(gain).connect(master);osc.start(now);osc.stop(now+duration);
  }
  function playDeath(){tone(90,.22,.35);}
  function playComplete(){tone(660,.2,.25);window.setTimeout(()=>tone(880,.3,.25),170);}
  function stopAudioTimer(){if(beatTimer){clearInterval(beatTimer);beatTimer=0;}}
  function updateMute(){if(master)master.gain.value=muted?0:.16;}

  /* ---- Fixed-timestep loop and clean visibility pause ---- */
  function frame(now){
    if(!lastTime)lastTime=now;
    const elapsed=Math.min((now-lastTime)/1000,MAX_FRAME);lastTime=now;
    if(!paused){accumulator+=elapsed;while(accumulator>=STEP){update();accumulator-=STEP;}}
    render();requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange",()=>{
    paused=document.hidden;accumulator=0;lastTime=performance.now();
    if(audioCtx){
      if(paused)audioCtx.suspend().catch((error)=>console.warn("[geometrydash] Audio suspend failed",error));
      else if(audioStarted&&!muted){nextBeat=audioCtx.currentTime+.05;audioCtx.resume().catch((error)=>console.warn("[geometrydash] Audio resume failed",error));}
    }
  });
  window.addEventListener("blur",()=>{paused=true;held=false;});
  window.addEventListener("focus",()=>{if(!document.hidden){paused=false;accumulator=0;lastTime=performance.now();}});
  window.addEventListener("resize",resize);
  window.addEventListener("pagehide",()=>{flushProgress();stopAudioTimer();});

  Arcade.onRestart(restartLevel);
  let muteSeen=false; // the first call only reports the saved state; starting audio needs a real gesture
  Arcade.onMute((nextMuted)=>{muted=nextMuted;updateMute();if(!muted&&muteSeen)startAudio();muteSeen=true;});

  /* ---- Boot ---- */
  const remembered=Math.floor(Number(readStore(LAST_KEY,"0"))||0);
  selected=isUnlocked(clamp(remembered,0,LEVELS.length-1))?clamp(remembered,0,LEVELS.length-1):0;
  level=LEVELS[selected];
  resize();updateMute();openMenu();requestAnimationFrame(frame);
}
</script>
