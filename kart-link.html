<style>
  .gt-page{max-width:860px}
  body.gt{--best:#1f7a4d;--hr:#a32121;--map-slow:#cfcfc8;--map-fast:#1f7a4d;--map-edge:#d8d8d2}
  .gt .kp{padding:20px;gap:14px;justify-content:flex-start}
  .gt-nav{padding:2px 20px!important}
  .gt .ui-card{border:1px solid var(--ink);padding:18px 20px}
  .gate-ico,.hero-ico,.empty-ico{display:grid;place-items:center;flex:none;width:56px;height:56px;border:1px solid var(--ink);background:var(--tint);font-size:28px}
  .state,.loading{padding:clamp(26px,5vw,44px) 22px;text-align:center;color:var(--muted)}
  .state .gate-ico{margin:0 auto 16px}
  .state p{font:800 clamp(18px,2.6vw,22px)/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink)}
  .state .ui-btn{margin-top:18px}
  .state.is-err .gate-ico{border-color:var(--danger)}
  .msg{min-height:20px;color:var(--muted);font-size:13.5px;line-height:1.45}.msg.ok{color:var(--green);font-weight:600}.msg.err{color:var(--danger);font-weight:600}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font:500 12px/1.2 "Geist Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
  .ui-btn:disabled{opacity:.5;cursor:default}
  a{color:var(--green)}
  @media(max-width:700px){.gt .kp{padding:14px}.gt-page{padding-top:12px}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  .hero{text-align:center;padding:clamp(26px,5vw,44px) 22px}
  .hero-ico{margin:0 auto 16px}
  .hero h1{font:800 clamp(22px,4vw,28px)/1.15 "Geist",system-ui,sans-serif;letter-spacing:-.03em}.hero p{max-width:520px;margin:8px auto 0;color:var(--muted);line-height:1.5}
  .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
  .form{display:flex;flex-direction:column;gap:14px;max-width:480px;margin:0 auto}.field{text-align:left}
  .success-link{margin-top:18px}
  @media(max-width:640px){.actions .ui-btn{width:100%}}
</style>
