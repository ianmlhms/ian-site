<html lang="lb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:title" content="Country Comparison — ian.lu">
  <meta property="og:description" content="Compare 195 countries side by side across population, area, density, GDP and more.">
  <meta property="og:url" content="https://ian.lu/countries.html">
  <meta property="og:image" content="https://ian.lu/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#f6f6f3">
  <link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="gitter.css?v=9">
  <script src="theme.js?v=32"></script>
  <script src="i18n-dict.js?v=54"></script>
  <script src="i18n.js?v=5"></script>
  <link rel="stylesheet" href="countries.css?v=5">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebApplication","name":"Country Comparison","url":"https://ian.lu/countries.html","applicationCategory":"EducationalApplication","operatingSystem":"Any","description":"Compare 195 countries across population, area, density, GDP, capitals, languages and other metrics."}
  </script>
  <script data-goatcounter="https://ianm.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="gt">
<main class="gt-page">
  <div class="gt-grid">
    <header class="c full gt-nav">
      <div class="gt-nav-l"><a class="gt-back" href="index.html" data-i18n="nav.home">‹ Heem</a><h1 class="gt-page-title" data-i18n="countries.title">Länner-Verglach</h1></div>
      <div class="gt-navr"><button type="button" class="gt-acct" id="gtAcct">Umellen</button></div>
    </header>

    <div id="loading" class="c full loading" aria-live="polite">
      <div class="spinner" role="status" data-i18n-attr="aria-label:countries.loadingAria" aria-label="Lueden"></div>
      <p data-i18n="countries.loading">Daten gi gelueden…</p>
    </div>

    <div id="error-banner" class="c full banner banner-error hidden" role="alert" aria-live="assertive">
      <h2 data-i18n="countries.errorTitle">D'Donnéeë konnten net gelueden ginn</h2>
      <p data-i18n="countries.errorBody">D'Länner-Donnéeë sinn net ukomm. Probéier w.e.g. spéider nach eng Kéier.</p>
    </div>

    <div id="app-content" class="gt-contents hidden">
      <div class="c full gt-lbl"><span data-i18n="countries.countryHeading">Länner</span></div>
      <section class="c full top card-body">
        <div class="country-search-row">
          <div class="search-wrap">
            <input id="country-input" class="gt-input" type="text" list="country-options" autocomplete="off"
              placeholder="Land sichen…"
              aria-label="Land sichen"
              data-i18n-attr="placeholder:countries.searchPlaceholder|aria-label:countries.searchLabel">
            <datalist id="country-options"></datalist>
          </div>
          <button id="add-country-btn" type="button" aria-label="Land bäisetzen"
            data-i18n-attr="aria-label:countries.addLabel">
            <span aria-hidden="true">+</span>
            <span data-i18n="countries.add">Bäisetzen</span>
          </button>
        </div>

        <div class="bulk-actions-row">
          <span class="bulk-label" data-i18n="countries.continentLabel">Kontinent:</span>
          <div id="continent-buttons" role="group" aria-label="Kontinent wielen"
            data-i18n-attr="aria-label:countries.continentGroupLabel"></div>
          <span class="bulk-divider" aria-hidden="true"></span>
          <button id="select-all-btn" class="bulk-btn" type="button" title="All Länner wielen"
            data-i18n-attr="title:countries.selectAllTitle">
            <span data-i18n="countries.selectAll">All Länner</span>
          </button>
          <button id="clear-selection-btn" class="bulk-btn" type="button" title="Auswiel eidel maachen"
            data-i18n-attr="title:countries.clearTitle">
            <span data-i18n="countries.clear">Auswiel eidel maachen</span>
          </button>
        </div>

        <div id="country-chips" role="list" aria-label="Gewielte Länner"
          data-i18n-attr="aria-label:countries.selectedLabel"></div>
      </section>

      <div class="c full gt-lbl"><span data-i18n="countries.metricsHeading">Kennzuelen</span></div>
      <section class="c full top card-body">
        <div id="metrics-toggles" class="metrics-grid" role="group" aria-label="Kennzuele wielen"
          data-i18n-attr="aria-label:countries.metricsGroupLabel"></div>
      </section>

      <div class="c full gt-lbl"><span data-i18n="countries.tableHeading">Verglachstabell</span></div>
      <section class="c full top table-card-body">
        <div id="table-container"></div>
      </section>

      <div class="c full gt-lbl"><span data-i18n="countries.chartsHeading">Diagrammer</span></div>
      <section class="c full top card-body">
        <div id="charts-container"></div>
      </section>
    </div>
  </div>
</main>

  <script src="countries.js?v=3"></script>
  <script src="pixelbreak-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
  <script type="module" src="gitter-acct.js?v=1"></script>
</body>
</html>
