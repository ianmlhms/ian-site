<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Messenger</title>
<meta name="robots" content="noindex">
<script src="theme.js?v=30"></script>
<script src="i18n-dict.js?v=50"></script>
<script src="i18n.js?v=4"></script>
<style>
  :root{--bg:#0d0d1a;--card:#161625;--card2:#1e1e35;--border:#2a2a4a;--text:#e8e8f0;--muted:#8888aa;--accent:#ffcc00;--accent2:#4de8ff;--dm:#ff6b9d}
  *{box-sizing:border-box}
  body{margin:0;height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent2-text);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);flex:none}
  header .home{color:var(--muted);font-weight:700}
  header h1{font-size:18px;margin:0}
  header h1 .b{color:var(--accent-text)}
  header .spacer{flex:1}
  #msg{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
  .auth-go{background:var(--dm);color:#000;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;margin-top:14px}
  #panel{flex:1;display:none;min-height:0}
  .side{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
  .side-h{padding:12px 14px;border-bottom:1px solid var(--border)}
  .side-h input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 4px;font-size:13px;font-weight:700;cursor:pointer}
  .tab.active{background:var(--card2);color:var(--text);border-color:var(--accent2-text)}
  .uinfo{display:flex;flex-direction:column;gap:6px;font-size:13.5px;margin-top:10px}
  .uinfo .k{color:var(--muted);font-size:12px}
  .uact{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
  .uact h4{margin:0 0 8px;font-size:13px}
  .pwrow{display:flex;gap:8px}
  .pwrow input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font-size:14px;font-family:ui-monospace,monospace}
  .pwrow button{background:var(--accent2);color:var(--accent2-foreground);border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  .pwgen{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 11px;cursor:pointer}
  .pwresult{margin-top:10px;font-size:13.5px;color:var(--posted,#3fb950)}
  .pwresult code{background:var(--card2);padding:2px 8px;border-radius:6px;color:#ffcc00;font-size:15px;user-select:all}
  .hint{color:var(--muted);font-size:12px;margin-top:4px}
  .glist{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
  .grow{padding:10px 12px;border-radius:10px;cursor:pointer}
  .grow:hover{background:var(--card)}
  .grow.active{background:var(--card2)}
  .grow .n{font-weight:700;font-size:14px}
  .grow .tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--dm);color:#000;margin-left:6px;vertical-align:middle}
  .grow .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .detail{flex:1;display:flex;flex-direction:column;min-width:0}
  .detail-h{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px}
  .dh-top{display:flex;align-items:center;gap:10px}
  .tag.dm{background:var(--dm);color:#000;padding:1px 6px;border-radius:6px;font-size:10px}
  .danger{margin-left:auto;background:#3a1620;border:1px solid #ff6b6b;color:#ff8888;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
  .danger:hover{background:#ff6b6b;color:#000}
  .members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px}
  .chip-x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:0 2px}
  .chip-x:hover{color:#ff6b6b}
  .muted{color:var(--muted);font-size:12.5px}
  .addmem{display:flex;gap:8px;margin-top:10px}
  .addmem input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:13px}
  .addmem button{background:var(--accent2);color:var(--accent2-foreground);border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer}
  .mlist{flex:1;overflow-y:auto;padding:14px 18px}
  .am{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;display:flex;gap:10px;align-items:flex-start}
  .am .who{color:var(--accent2-text);font-weight:700;flex:none}
  .am .txt{flex:1;min-width:0}
  .am .filechip{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600}
  .am .filechip:hover{border-color:var(--accent2-text)}
  .am audio.media{width:220px;max-width:100%;height:36px;margin-top:4px}
  .msg-del{background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;flex:none}
  .msg-del:hover{opacity:1}
  .am .when{color:var(--muted);font-size:11px;flex:none}
  .am .media{display:block;max-width:200px;max-height:200px;border-radius:8px;margin-top:4px}
  .am img.media:not([src]){min-width:120px;min-height:90px;background:rgba(128,128,128,.18)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  #panel.online-mode .side{width:100%;border-right:0}
  #panel.online-mode .detail,#panel.online-mode .side-h>.uact{display:none}
  #panel.online-mode .glist{padding:14px 18px 24px}
  .online-section{width:min(760px,100%);margin:0 auto 18px}
  .online-section h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
  .online-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:11px}
  .online-list{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .online-row{display:grid;grid-template-columns:10px 42px minmax(0,1fr);align-items:center;gap:11px;padding:11px 13px}
  .online-row+.online-row{border-top:1px solid var(--border)}
  .presence-dot{width:9px;height:9px;border-radius:50%;background:#3fb950;box-shadow:0 0 0 3px color-mix(in srgb,#3fb950 18%,transparent)}
  .presence-dot.recent{visibility:hidden}
  .online-avatar{display:flex;width:42px;height:42px;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:var(--card2);font-size:24px}
  .online-avatar img{width:100%;height:100%;object-fit:cover}
  .online-person{min-width:0}
  .online-name{font-size:14px;font-weight:750;overflow-wrap:anywhere}
  .kart-tag{display:inline-block;margin-inline-start:5px;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent);color:var(--accent-text);font-size:10px;font-weight:800;line-height:1.7;letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
  .online-meta{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:4px;color:var(--muted);font-size:12px}
  .online-page{color:var(--text);overflow-wrap:anywhere}
  .online-empty{color:var(--muted);padding:22px 14px;text-align:center;font-size:13px}
  .online-actions,.command-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .online-actions button,.command-toolbar button{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer;max-width:100%;white-space:normal}
  .online-actions button:disabled,.command-toolbar button:disabled{opacity:.6;cursor:wait}
  #commandStatus{width:100%;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .command-toolbar{display:none}
  #panel.online-mode .command-toolbar{display:flex}
  .tabs{flex-wrap:wrap}
  .tab{flex:1 1 72px}
  :root{--bad:#ff8a8a;--good:#5fd479;--warn:#ffcc66}
  :root[data-theme="light"]{--bad:#b3261e;--good:#1a7f37;--warn:#8a5a00}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #panel.wide-mode .side{width:100%;border-right:0}
  #panel.wide-mode .detail,#panel.wide-mode .side-h>.uact,#panel.wide-mode #search,#panel.wide-mode .glist{display:none}
  .wide-host{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px 18px 28px}
  #panel.wide-mode .wide-host{display:block}
  .wide-section{width:min(980px,100%);margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .wide-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .wide-bar h2{margin:0;font-size:16px;flex:1}
  .wide-btn{padding:8px 12px;min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font:inherit;font-size:13px;font-weight:650;cursor:pointer}
  .wide-btn.primary{background:var(--accent2);color:var(--accent2-foreground);border-color:transparent}
  .wide-btn.ghost{background:none;color:var(--muted)}
  .wide-btn:disabled{opacity:.6;cursor:wait}
  .wide-btn[hidden]{display:none}
  .wide-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .wide-field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
  .wide-field.stretch{flex:1 1 220px}
  .wide-field input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font:inherit;font-size:14px;min-height:40px;min-width:0}
  .wide-note{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--muted);font-size:13px}
  .wide-note.bad{color:var(--bad);border-color:var(--bad)}
  .wide-note.good{color:var(--good);border-color:var(--good)}
  .wide-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:12px}
  .kt-list,.sv-results,.sv-history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .kt-race{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
  .kt-head{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto 18px;grid-template-areas:"time room track humans chev" "time mode mode mode chev";gap:2px 12px;align-items:center;width:100%;padding:11px 13px;background:none;border:0;color:var(--text);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
  .kt-time{grid-area:time;white-space:nowrap}
  .kt-room{grid-area:room;font-family:ui-monospace,monospace;font-size:12.5px}
  .kt-track{grid-area:track;font-weight:700;overflow-wrap:anywhere}
  .kt-mode{grid-area:mode;font-size:12px}
  .kt-humans{grid-area:humans;white-space:nowrap;font-size:12.5px}
  .kt-chevron{grid-area:chev;color:var(--muted)}
  .kt-players{border-top:1px solid var(--border);padding:8px 10px 10px}
  .kt-scroll{overflow-x:auto}
  .kt-players table{width:100%;border-collapse:collapse;font-size:13px}
  .kt-players th{color:var(--muted);font-size:11.5px;font-weight:650;text-align:left;padding:4px 8px;white-space:nowrap}
  .kt-players td{padding:6px 8px;border-top:1px solid var(--border);white-space:nowrap}
  .kt-players td.num,.kt-players th.num{text-align:right;font-variant-numeric:tabular-nums}
  .kt-players tr.match td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .kt-pname{white-space:normal;overflow-wrap:anywhere}
  .kt-user{background:none;border:0;padding:0;color:var(--accent2-text,var(--accent2));font:inherit;font-weight:650;text-decoration:underline;cursor:pointer}
  .kt-badge{display:inline-block;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:800;line-height:1.7;vertical-align:middle;background:var(--card2);box-shadow:inset 0 0 0 1px var(--border);color:var(--muted)}
  .kt-badge.guest{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
  .kt-badge.warn{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
  .kt-bad{color:var(--bad);font-weight:700}
  .kt-warn{color:var(--warn)}
  .kt-empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:12px}
  .sv-result{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer}
  .sv-avatar{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;background:var(--card2);overflow:hidden}
  .sv-user{display:flex;flex-direction:column;gap:12px}
  .sv-user-h{display:flex;align-items:center;gap:8px;font-size:15px}
  .sv-user-h .spacer{flex:1}
  .sv-games{display:flex;flex-wrap:wrap;gap:6px}
  .sv-game{padding:8px 12px;min-height:40px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
  .sv-game.active{background:var(--card2);border-color:var(--accent2-text,var(--accent2));font-weight:700}
  .sv-card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .sv-card h3{margin:0;font-size:14px}
  .sv-metrics{display:flex;flex-wrap:wrap;gap:4px 8px}
  .sv-metric{padding:2px 8px;border-radius:8px;background:var(--card2);font-size:12.5px;color:var(--muted)}
  .sv-metric b{color:var(--text)}
  .sv-presence{font-size:13px}
  .sv-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--card2)}
  .sv-row-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
  .sv-reason{padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;line-height:1.7;background:var(--card);box-shadow:inset 0 0 0 1px var(--border)}
  .sv-reason.r-drop{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
  .sv-reason.r-before-restore,.sv-reason.r-before-gift,.sv-reason.r-live{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
  .sv-gifts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .sv-gift-row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
  .sv-reason.r-g-pending,.sv-reason.r-g-claimed{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
  .sv-reason.r-g-applied{color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
  .sv-reason.r-g-cancelled,.sv-reason.r-g-expired{color:var(--muted)}
  .sv-diff{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
  .sv-diff-line.lower{color:var(--bad)}
  .sv-diff-line.higher{color:var(--good)}
  .sv-row-a{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
  .sv-row-a details{font-size:12px;color:var(--muted);flex:1 1 200px;min-width:0}
  .sv-row-a pre{margin:6px 0 0;padding:8px;max-height:220px;overflow:auto;background:var(--card);border-radius:8px;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere}
  .sv-hint{color:var(--muted);font-size:12px}
  .sv-gift-err{color:var(--bad);font-size:12.5px;min-height:1em}
  .sv-dialog{border:1px solid var(--border);border-radius:14px;background:var(--card-opaque,var(--card));color:var(--text);padding:0;width:min(520px,calc(100vw - 32px))}
  .sv-dialog::backdrop{background:rgba(0,0,0,.6)}
  .sv-dialog-body{padding:18px;display:flex;flex-direction:column;gap:12px}
  .sv-dialog h3{margin:0;font-size:16px}
  .sv-dialog p{margin:0;font-size:13.5px;line-height:1.45}
  .sv-caveat{padding:10px 12px;border-radius:10px;border:1px solid var(--warn);color:var(--warn)}
  .sv-progress:empty{display:none}
  .sv-progress{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--card2)}
  .sv-progress.good{color:var(--good)}
  .sv-progress.bad{color:var(--bad)}
  .sv-progress progress{width:100%;height:10px}
  .sv-dialog-a{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .wide-host button:focus-visible,.wide-host input:focus-visible,.wide-host summary:focus-visible,.sv-dialog button:focus-visible{outline:3px solid var(--accent2-text,var(--accent2));outline-offset:2px}
  @media(max-width:620px){.kt-head{grid-template-columns:minmax(0,1fr) auto 18px;grid-template-areas:"time room chev" "track track chev" "mode mode mode" "humans humans humans"}}
  a:focus-visible,button:focus-visible,input:focus-visible,.grow:focus-visible{outline:3px solid var(--accent2-text,var(--accent2));outline-offset:2px}
  button{touch-action:manipulation}
  .chip-x{min-width:32px;min-height:32px}
#detailBack{display:none}
#viewFeedback{min-height:0;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
@media(max-width:760px){#panel .side{width:100%;border-right:0}#panel .detail{display:none}#panel.detail-open .side{display:none}#panel.detail-open .detail{display:flex}#detailBack{display:block;align-self:flex-start;min-height:44px;padding:8px 14px;margin:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;cursor:pointer}}
@media(max-width:460px){#panel.online-mode .glist{padding:12px}.tabs{gap:4px}.tab{padding-inline:2px;font-size:11.5px}.online-row{grid-template-columns:9px 38px minmax(0,1fr);gap:9px;padding:10px}.online-avatar{width:38px;height:38px;font-size:22px}.online-meta{flex-direction:column;gap:2px}}
</style>

  <meta name="theme-color" content="#0d0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header>
  <a class="home" href="index.html">‹ Home</a>
  <h1><span aria-hidden="true">🛡</span> <span class="b">Admin</span> · Messenger</h1>
  <div class="spacer"></div>
  <a class="home-link" href="messenger.html" style="margin-right:14px;color:var(--muted)">Messenger</a>
  <span id="acctHost"></span>
</header>

<div id="msg" role="status" aria-live="polite">Loading…</div>

<div id="panel">
  <aside class="side" aria-label="Lëscht">
    <div class="side-h">
      <div class="tabs"><button type="button" id="tabGroups" class="tab active">Groups</button><button type="button" id="tabUsers" class="tab">Users</button><button type="button" id="tabFeedback" class="tab">Feedback</button><button type="button" id="tabOnline" class="tab">🟢 Online</button><button type="button" id="tabKart" class="tab">🏎️ Kart</button><button type="button" id="tabSaves" class="tab">💾 Saves</button></div>
      <input id="search" name="search" type="search" aria-label="Search" placeholder="Search…" autocomplete="off">
      <div class="command-toolbar"><button type="button" id="reloadAll" data-i18n="commands.reloadAll">🔄 Alles nei lueden</button><span id="commandStatus" role="status" aria-live="polite"></span></div>
      <div class="uact">
        <h4>PIN zerécksetzen</h4>
        <div class="pwrow">
          <input id="pinResetUser" name="username" aria-label="Benotzernumm" placeholder="Benotzernumm" autocomplete="off" autocapitalize="none" spellcheck="false">
          <button type="button" id="pinResetBtn">Zerécksetzen</button>
        </div>
        <div class="hint">
          Erstellt e sécheren eemolege Link fir de Benotzer.
        </div>
        <div class="pwresult" id="pinResetResult" role="status" aria-live="polite"></div>
      </div>
    </div>
    <ul class="glist" id="glist"></ul>
    <div class="wide-host"><div id="wideKart" hidden></div><div id="wideSaves" hidden></div></div>
  </aside>
  <section class="detail">
    <button type="button" id="detailBack">‹ Back</button>
    <div class="detail-h" id="detailH">Select a group to inspect</div>
    <div class="mlist" id="mlist"></div>
  </section>
</div>

<script type="module" src="admin.js?v=46"></script>
<script type="module">
import { client } from "./auth.js?v=35";

const username = document.getElementById("pinResetUser");
const reset = document.getElementById("pinResetBtn");
const output = document.getElementById("pinResetResult");

function showMessage(message) {
  output.replaceChildren();
  output.textContent = message;
}

function showRecoveryLink(name, url) {
  showMessage(`PIN fir ${name} geläscht. Deelt dëse Link:`);
  const row = document.createElement("div");
  row.className = "pwrow";
  const field = document.createElement("input");
  field.value = url;
  field.readOnly = true;
  field.setAttribute("aria-label", "Recovery-Link");
  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = "Kopéieren";
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(url);
      copy.textContent = "Kopéiert ✓";
    } catch {
      field.select();
      document.execCommand("copy");
    }
  });
  row.append(field, copy);
  output.appendChild(row);
}

async function resetPin() {
  const name = username.value.trim();
  if (!name) {
    showMessage("Gëff e Benotzernumm an.");
    return;
  }
  reset.disabled = true;
  showMessage("Reset leeft…");
  try {
    const sb = await client();
    const { data, error } = await sb.functions.invoke(
      "auth-pin",
      { body: { action: "admin-reset", username: name } },
    );
    if (error || !data?.recovery_url) {
      throw new Error(data?.error || "reset failed");
    }
    showRecoveryLink(data.username || name, data.recovery_url);
  } catch (error) {
    console.warn("PIN admin reset failed", error);
    showMessage("De PIN konnt net zeréckgesat ginn.");
  } finally {
    reset.disabled = false;
  }
}

reset.addEventListener("click", resetPin);
username.addEventListener("keydown", (event) => {
  if (event.key === "Enter") resetPin();
});
</script>
